<html lang="fr">
<head>
<meta charset="UTF-8">

<title>Approvisionnement — Veraluz OS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.topbar{background:#1e293b;border-bottom:1px solid #334155;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.topbar-title{font-weight:700;font-size:15px;color:#f1f5f9;}
.add-btn{background:#10b981;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;}
.add-btn:hover{background:#059669;}
.tabbar{background:#1e293b;border-bottom:1px solid #334155;padding:0 8px;display:flex;gap:1px;overflow-x:auto;flex-shrink:0;}
.tabbar::-webkit-scrollbar{height:3px;}.tabbar::-webkit-scrollbar-thumb{background:#334155;}
.tb{background:none;border:none;border-bottom:2px solid transparent;color:#94a3b8;font-size:12px;font-weight:500;padding:8px 10px;cursor:pointer;white-space:nowrap;transition:all .15s;}
.tb:hover{color:#e2e8f0;}.tb.on{color:#10b981;border-bottom-color:#10b981;}
.content{flex:1;overflow-y:auto;padding:14px;}
.content::-webkit-scrollbar{width:4px;}.content::-webkit-scrollbar-thumb{background:#334155;}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
.kpi{background:#1e293b;border-radius:12px;padding:14px;border:1px solid #334155;}
.kpi-val{font-size:22px;font-weight:800;color:#f1f5f9;margin-bottom:3px;}
.kpi-lbl{font-size:11px;color:#64748b;font-weight:500;}
.kpi-icon{font-size:22px;margin-bottom:6px;}
.kpi.alert .kpi-val{color:#ef4444;}.kpi.warn .kpi-val{color:#f59e0b;}.kpi.ok .kpi-val{color:#10b981;}
.sec-title{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px;}
.item-card{background:#1e293b;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid #334155;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .12s;}
.item-card:hover{background:#273348;}
.ic-icon{width:40px;height:40px;border-radius:10px;background:#0f172a;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.ic-body{flex:1;min-width:0;}
.ic-name{font-size:13px;font-weight:600;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ic-sub{font-size:11px;color:#64748b;margin-top:2px;}
.ic-right{text-align:right;flex-shrink:0;}
.stock-badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.stock-ok{background:#064e3b;color:#34d399;}.stock-low{background:#78350f;color:#fbbf24;}.stock-crit{background:#7f1d1d;color:#fca5a5;}
.status-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;}
.s-pending{background:#1e3a5f;color:#60a5fa;}.s-approved{background:#064e3b;color:#34d399;}
.s-rejected{background:#7f1d1d;color:#fca5a5;}.s-ordered{background:#2d1b69;color:#a78bfa;}
.s-received{background:#064e3b;color:#34d399;}.s-draft{background:#1e293b;color:#94a3b8;}
.btn{border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s;}
.btn-primary{background:#10b981;color:#fff;}.btn-primary:hover{background:#059669;}
.btn-secondary{background:#1e293b;color:#e2e8f0;border:1px solid #334155;}.btn-secondary:hover{background:#334155;}
.btn-danger{background:#7f1d1d;color:#fca5a5;border:1px solid #991b1b;}.btn-danger:hover{background:#991b1b;}
.btn-sm{padding:5px 11px;font-size:12px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:#1e293b;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:20px;}
.modal-title{font-size:16px;font-weight:700;color:#f1f5f9;margin-bottom:16px;}
.modal input,.modal textarea,.modal select{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;padding:9px 12px;font-size:13px;margin-bottom:10px;outline:none;font-family:inherit;}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:#10b981;}
.modal label{font-size:11px;color:#64748b;font-weight:600;display:block;margin-bottom:4px;}
.modal-row{display:flex;gap:8px;}.modal-row>div{flex:1;}
.modal-footer{display:flex;gap:8px;margin-top:4px;justify-content:flex-end;}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
.fbtn{background:#1e293b;border:1px solid #334155;color:#94a3b8;border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;}
.fbtn.on{background:#064e3b;border-color:#10b981;color:#34d399;}
.search-box{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:0 10px;display:flex;align-items:center;gap:6px;flex:1;min-width:150px;}
.search-box input{background:none;border:none;outline:none;color:#e2e8f0;font-size:13px;padding:7px 0;width:100%;}
.prog-wrap{background:#0f172a;border-radius:4px;height:6px;margin-top:5px;}
.prog-bar{height:6px;border-radius:4px;transition:width .3s;}
.mv-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;margin-bottom:6px;background:#1e293b;border:1px solid #334155;}
.mv-type{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.mv-in{background:#064e3b;}.mv-out{background:#7f1d1d;}.mv-adj{background:#1e3a5f;}.mv-loss{background:#451a03;}
.chart-wrap{background:#1e293b;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #334155;}
.chart-title{font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:10px;}
.upload-zone{border:2px dashed #334155;border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:border .2s;margin-bottom:10px;}
.upload-zone:hover{border-color:#10b981;}
.uz-icon{font-size:28px;margin-bottom:6px;}.uz-text{font-size:13px;color:#64748b;}
.empty{text-align:center;padding:40px 20px;color:#475569;}
.empty-icon{font-size:38px;margin-bottom:10px;opacity:.5;}
.urg-high{color:#ef4444;font-weight:700;}.urg-med{color:#f59e0b;}.urg-low{color:#94a3b8;}
.detail-panel{background:#1e293b;border-radius:12px;padding:16px;margin-top:10px;border:1px solid #334155;}
.dp-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1e293b;font-size:13px;}
.dp-lbl{color:#64748b;}.dp-val{color:#f1f5f9;font-weight:500;text-align:right;}
@media(min-width:600px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
</style>
</head>

<script>
var SB='https://dfdmasejsoibxrvubegu.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmZG1hc2Vqc29pYnhydnViZWd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDgzOTMsImV4cCI6MjA5MjI4NDM5M30.dEsafV84HFmFqU6Yi4xKydIbUlkIVE7QMRMpFt8kqXY';

var currentTab='dashboard';
var allItems=[],allRequests=[],allOrders=[],allReceptions=[],allSuppliers=[],allMovements=[];
var filterStatus='all',filterCat='all',searchQ='';

var TABS=[
  {id:'dashboard',label:'Dashboard',icon:'D'},
  {id:'inventaire',label:'Inventaire',icon:'I'},
  {id:'demandes',label:'Demandes',icon:'R'},
  {id:'bons',label:'Bons cmde',icon:'B'},
  {id:'receptions',label:'Receptions',icon:'V'},
  {id:'fournisseurs',label:'Fournisseurs',icon:'F'},

  {id:'rapports',label:'Rapports',icon:'S'}
];
var TAB_ICONS={dashboard:'📊',inventaire:'📦',demandes:'📋',bons:'🧾',receptions:'✅',fournisseurs:'🏭',mouvements:'🔄',rapports:'📈'};
var CATS=['Housekeeping','Maintenance','Reception','Chambres','Nettoyage','Equipements','Fournitures'];
var UNITS=['pcs','kg','L','m','boite','carton','sac','rouleau','lot'];
var STATUS_LABELS={pending:'En attente',approved:'Approuvee',rejected:'Refusee',ordered:'Commandee',received:'Recue',draft:'Brouillon'};
var URGENCY_LABELS={high:'Urgent',med:'Normal',low:'Faible'};

var MOCK_ITEMS=[
  {id:1,name:'Serviettes blanches',category:'Housekeeping',quantity:24,min_quantity:10,unit:'pcs',location:'Buanderie',notes:''},
  {id:2,name:'Gel douche 250ml',category:'Housekeeping',quantity:6,min_quantity:20,unit:'pcs',location:'Reserve RDC',notes:'Rupture imminente'},
  {id:3,name:'Papier hygienique',category:'Chambres',quantity:48,min_quantity:30,unit:'rouleaux',location:'Reserve RDC',notes:''},
  {id:4,name:'Ampoules LED E27',category:'Maintenance',quantity:3,min_quantity:10,unit:'pcs',location:'Local technique',notes:'Stock critique'},
  {id:5,name:'Produit WC',category:'Nettoyage',quantity:8,min_quantity:5,unit:'L',location:'Buanderie',notes:''},
  {id:6,name:'Savon main 500ml',category:'Reception',quantity:12,min_quantity:6,unit:'pcs',location:'Reception',notes:''},
  {id:7,name:'Draps 2 places',category:'Housekeeping',quantity:18,min_quantity:10,unit:'pcs',location:'Buanderie',notes:''},
  {id:8,name:'Piles AA',category:'Maintenance',quantity:4,min_quantity:12,unit:'pcs',location:'Local technique',notes:'Faible'}
];
var MOCK_REQUESTS=[
  {id:1,item_name:'Gel douche 250ml',quantity:30,justification:'Rupture de stock imminente',urgency:'high',status:'pending',requested_by:'Fatima H.',created_at:'2026-05-17T09:00:00'},
  {id:2,item_name:'Ampoules LED E27',quantity:20,justification:'Plusieurs chambres sans lumiere',urgency:'high',status:'approved',requested_by:'Jean-Paul M.',created_at:'2026-05-16T14:30:00'},
  {id:3,item_name:'Piles AA',quantity:24,justification:'Telecommandes climatiseurs',urgency:'med',status:'ordered',requested_by:'Marie N.',created_at:'2026-05-15T10:00:00'},
  {id:4,item_name:'Nattes de sol',quantity:5,justification:'Entree glissante saison pluies',urgency:'low',status:'pending',requested_by:'Claude B.',created_at:'2026-05-14T16:00:00'}
];
var MOCK_ORDERS=[
  {id:1,po_number:'PO-2026-001',supplier:'Marche Central Kribi',items:'Ampoules LED E27 x20',total_amount:15000,status:'draft',created_at:'2026-05-16T15:00:00'},
  {id:2,po_number:'PO-2026-002',supplier:'Huileries du Cameroun',items:'Piles AA x24',total_amount:8500,status:'ordered',created_at:'2026-05-15T11:00:00'}
];
var MOCK_SUPPLIERS=[
  {id:1,name:'Marche Central Kribi',phone:'+237 699 001 001',email:'',category:'Consommables',notes:'Livraison mardi et jeudi'},
  {id:2,name:'Huileries du Cameroun',phone:'+237 677 002 002',email:'contact@huileries-cmr.com',category:'Produits menagers',notes:''},
  {id:3,name:'BRECAM Electricite',phone:'+237 655 003 003',email:'',category:'Maintenance',notes:'Urgences 24h/24'}
];
var MOCK_MOVEMENTS=[
  {id:1,item_name:'Serviettes blanches',type:'out',quantity:6,user_name:'Fatima H.',note:'Housekeeping ch. 3,4,5',created_at:'2026-05-18T07:30:00'},
  {id:2,item_name:'Gel douche 250ml',type:'out',quantity:3,user_name:'Fatima H.',note:'Housekeeping recharge',created_at:'2026-05-18T07:32:00'},
  {id:3,item_name:'Piles AA',type:'in',quantity:24,user_name:'Jean-Paul M.',note:'Reception commande PO-2026-002',created_at:'2026-05-17T14:00:00'},
  {id:4,item_name:'Savon main 500ml',type:'out',quantity:2,user_name:'Marie N.',note:'Reception bureau',created_at:'2026-05-17T10:15:00'},
  {id:5,item_name:'Ampoules LED E27',type:'adj',quantity:-1,user_name:'Claude B.',note:'Cassee lors installation',created_at:'2026-05-16T16:00:00'}
];

window.addEventListener('load',function(){ buildTabs(); loadAll(); goTab('dashboard'); });

function buildTabs(){
  var bar=document.getElementById('tabbar');
  bar.innerHTML=TABS.map(function(t){
    return '<button class="tb" id="tab_'+t.id+'" data-id="'+t.id+'" onclick="goTab(this.dataset.id)">'+TAB_ICONS[t.id]+' '+t.label+'</button>';
  }).join('');
}

function goTab(id){
  currentTab=id; filterStatus='all'; searchQ='';
  TABS.forEach(function(t){
    var el=document.getElementById('tab_'+t.id);
    if(el) el.className='tb'+(t.id===id?' on':'');
  });
  render();
}

async function loadAll(){
  try{ var it=await sbGet('vz_inventory_items?order=name.asc'); if(Array.isArray(it)&&it.length) allItems=it; else allItems=MOCK_ITEMS; }catch(e){ allItems=MOCK_ITEMS; }
  try{ var rq=await sbGet('vz_purchase_requests?order=created_at.desc'); if(Array.isArray(rq)&&rq.length) allRequests=rq; else allRequests=MOCK_REQUESTS; }catch(e){ allRequests=MOCK_REQUESTS; }
  try{ var od=await sbGet('vz_purchase_orders?order=created_at.desc'); if(Array.isArray(od)&&od.length) allOrders=od; else allOrders=MOCK_ORDERS; }catch(e){ allOrders=MOCK_ORDERS; }
  try{ var sp=await sbGet('vz_appro_suppliers?order=name.asc'); if(Array.isArray(sp)&&sp.length) allSuppliers=sp; else allSuppliers=MOCK_SUPPLIERS; }catch(e){ allSuppliers=MOCK_SUPPLIERS; }
  try{ var mv=await sbGet('vz_inventory_movements?order=created_at.desc&limit=100'); if(Array.isArray(mv)&&mv.length) allMovements=mv; else allMovements=MOCK_MOVEMENTS; }catch(e){ allMovements=MOCK_MOVEMENTS; }
  render();
}

function render(){
  if(currentTab==='dashboard') renderDashboard();
  else if(currentTab==='inventaire') renderInventaire();
  else if(currentTab==='demandes') renderDemandes();
  else if(currentTab==='bons') renderBons();
  else if(currentTab==='receptions') renderReceptions();
  else if(currentTab==='fournisseurs') renderFournisseurs();
  else if(currentTab==='mouvements') renderMouvements();
  else if(currentTab==='rapports') renderRapports();
}

/* ── UTILS ── */
function setContent(h){ document.getElementById('content').innerHTML=h; }
function showModal(h){ document.getElementById('modals').innerHTML=h; }
function closeModal(){ document.getElementById('modals').innerHTML=''; }
function kpiCard(icon,val,lbl,cls){ return '<div class="kpi'+(cls?' '+cls:'')+'"><div class="kpi-icon">'+icon+'</div><div class="kpi-val">'+val+'</div><div class="kpi-lbl">'+lbl+'</div></div>'; }
function dpRow(lbl,val){ return '<div class="dp-row"><span class="dp-lbl">'+lbl+'</span><span class="dp-val">'+val+'</span></div>'; }
function catIcon(c){ var m={Housekeeping:'🛏️',Maintenance:'🔧',Reception:'🛎️',Chambres:'🚪',Nettoyage:'🧴',Equipements:'⚙️',Fournitures:'📁'}; return m[c]||'📦'; }
function fmtXAF(n){ return Number(n||0).toLocaleString('fr-FR')+' FCFA'; }
function fmtDate(s){ if(!s) return '—'; try{ return new Date(s).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return s; } }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function stockLvl(i){ return i.quantity===0?'crit':i.quantity<=i.min_quantity?'low':'ok'; }
// Filter helpers — no string args in onclick needed
function setFilter(el){ filterStatus=el.dataset.fs||'all'; render(); }
function setFilterMvt(el){ filterStatus=el.dataset.fs||'all'; renderMouvements(); }

/* ── DASHBOARD ── */
function renderDashboard(){
  var low=allItems.filter(function(i){return i.quantity<=i.min_quantity;});
  var crit=allItems.filter(function(i){return i.quantity===0;});
  var pending=allRequests.filter(function(r){return r.status==='pending';});
  var ordered=allOrders.filter(function(o){return o.status==='ordered';});
  var totalSpend=allOrders.reduce(function(a,o){return a+(o.total_amount||0);},0);

  var h='<div class="kpi-grid">';
  h+=kpiCard('🔴',''+crit.length,'Ruptures','alert');
  h+=kpiCard('🟡',''+low.length,'Stock faible','warn');
  h+=kpiCard('📋',''+pending.length,'Demandes en attente','');
  h+=kpiCard('💰',fmtXAF(totalSpend),'Total commandes','ok');
  h+='</div>';

  if(low.length){
    h+='<div class="sec-title">Alertes stock</div>';
    low.forEach(function(i){
      var lvl=stockLvl(i);
      h+='<div class="item-card" data-tab="inventaire" onclick="goTab(this.dataset.tab)">';
      h+='<div class="ic-icon">'+catIcon(i.category)+'</div>';
      h+='<div class="ic-body"><div class="ic-name">'+esc(i.name)+'</div>';
      h+='<div class="ic-sub">'+esc(i.category)+'</div></div>';
      h+='<div class="ic-right"><span class="stock-badge stock-'+lvl+'">'+i.quantity+' '+esc(i.unit)+'</span></div></div>';
    });
  }

  if(pending.length){
    h+='<div class="sec-title">Demandes en attente</div>';
    pending.slice(0,3).forEach(function(r){
      h+='<div class="item-card" data-tab="demandes" onclick="goTab(this.dataset.tab)">';
      h+='<div class="ic-icon">📋</div>';
      h+='<div class="ic-body"><div class="ic-name">'+esc(r.item_name)+'</div>';
      h+='<div class="ic-sub">'+esc(r.requested_by||'')+'</div></div>';
      h+='<div class="ic-right"><span class="urg-'+r.urgency+'">'+URGENCY_LABELS[r.urgency]+'</span></div></div>';
    });
  }

  if(ordered.length){
    h+='<div class="sec-title">Commandes en cours</div>';
    ordered.forEach(function(o){
      h+='<div class="item-card" data-tab="bons" onclick="goTab(this.dataset.tab)">';
      h+='<div class="ic-icon">🧾</div>';
      h+='<div class="ic-body"><div class="ic-name">'+esc(o.po_number||'PO-'+o.id)+'</div>';
      h+='<div class="ic-sub">'+esc(o.supplier||'')+'</div></div>';
      h+='<div class="ic-right" style="font-size:12px;color:#10b981;font-weight:700;">'+fmtXAF(o.total_amount)+'</div></div>';
    });
  }

  h+='<div class="sec-title">Derniers mouvements</div>';
  allMovements.slice(0,5).forEach(function(m){
    var cls=m.type==='in'?'mv-in':m.type==='out'?'mv-out':m.type==='adj'?'mv-adj':'mv-loss';
    var ic=m.type==='in'?'↑':m.type==='out'?'↓':m.type==='adj'?'≈':'!';
    h+='<div class="mv-row"><div class="mv-type '+cls+'">'+ic+'</div>';
    h+='<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;color:#f1f5f9">'+esc(m.item_name)+'</div>';
    h+='<div style="font-size:11px;color:#64748b">'+esc(m.user_name||'')+'</div></div>';
    h+='<div style="font-size:12px;color:#94a3b8;text-align:right">'+m.quantity+' · '+fmtDate(m.created_at)+'</div></div>';
  });
  setContent(h);
}

/* ── INVENTAIRE ── */
function renderInventaire(){
  var filtered=allItems.filter(function(i){
    var lvl=stockLvl(i);
    return (filterStatus==='all'||(filterStatus==='low'&&i.quantity<=i.min_quantity)||(filterStatus==='ok'&&i.quantity>i.min_quantity))
      && (!searchQ||i.name.toLowerCase().indexOf(searchQ.toLowerCase())>=0);
  });
  var h='<div class="filter-bar">';
  h+='<div class="search-box"><span>🔍</span><input placeholder="Rechercher..." oninput="searchQ=this.value;renderInventaire()" value="'+esc(searchQ)+'"></div>';
  h+='</div><div class="filter-bar">';
  [{fs:'all',lbl:'Tous'},{fs:'low',lbl:'Faible'},{fs:'ok',lbl:'OK'}].forEach(function(f){
    h+='<button class="fbtn'+(filterStatus===f.fs?' on':'')+'" data-fs="'+f.fs+'" onclick="setFilter(this)">'+f.lbl+'</button>';
  });
  h+='<button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="openItemModal(0)">+ Article</button>';
  h+='</div>';

  if(!filtered.length){ h+='<div class="empty"><div class="empty-icon">📦</div><div>Aucun article</div></div>'; }
  else {
    filtered.forEach(function(i){
      var lvl=stockLvl(i);
      var pct=i.min_quantity>0?Math.min(100,Math.round(i.quantity/i.min_quantity*100)):100;

/* ── RAPPORTS ── */
function renderRapports(){
  var totalSpend=allOrders.reduce(function(a,o){return a+(o.total_amount||0);},0);
  var low=allItems.filter(function(i){return i.quantity<=i.min_quantity;}).length;
  var outMov=allMovements.filter(function(m){return m.type==='out';}).length;

  var h='<div class="kpi-grid">';
  h+=kpiCard('💰',fmtXAF(totalSpend),'Total commandes','ok');
  h+=kpiCard('📦',''+allItems.length,'Articles','');
  h+=kpiCard('⚠️',''+low,'Stock faible','warn');
  h+=kpiCard('🔄',''+outMov,'Sorties','');
  h+='</div>';

  var catMap={};
  allItems.forEach(function(i){ catMap[i.category]=(catMap[i.category]||0)+1; });
  var cats=Object.keys(catMap).sort(function(a,b){return catMap[b]-catMap[a];});

  h+='<div class="chart-wrap"><div class="chart-title">Articles par categorie</div>';
  cats.forEach(function(c){
    var pct=allItems.length>0?Math.round(catMap[c]/allItems.length*100):0;
    h+='<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;color:#94a3b8;margin-bottom:3px">';
    h+='<span>'+catIcon(c)+' '+c+'</span><span>'+catMap[c]+'  ('+pct+'%)</span></div>';
    h+='<div class="prog-wrap"><div class="prog-bar" style="width:'+pct+'%;background:#10b981"></div></div></div>';
  });
  h+='</div>';

  var cMap={};
  allMovements.filter(function(m){return m.type==='out';}).forEach(function(m){ cMap[m.item_name]=(cMap[m.item_name]||0)+Math.abs(m.quantity||1); });
  var top=Object.keys(cMap).sort(function(a,b){return cMap[b]-cMap[a];}).slice(0,5);
  h+='<div class="chart-wrap"><div class="chart-title">Top consommations</div>';
  if(top.length){
    var mx=cMap[top[0]]||1;
    top.forEach(function(n){
      var p=Math.round(cMap[n]/mx*100);
      h+='<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;color:#94a3b8;margin-bottom:3px">';
      h+='<span>'+esc(n)+'</span><span>'+cMap[n]+' u.</span></div>';
      h+='<div class="prog-wrap"><div class="prog-bar" style="width:'+p+'%;background:#6366f1"></div></div></div>';
    });
  } else { h+='<div style="color:#475569;font-size:13px">Aucun mouvement</div>'; }
  h+='</div>';
  setContent(h);
}

async function saveItem(id){
  var body={name:document.getElementById('m_name').value,category:document.getElementById('m_cat').value,
    unit:document.getElementById('m_unit').value,quantity:parseInt(document.getElementById('m_qty').value)||0,
    min_quantity:parseInt(document.getElementById('m_min').value)||0,
    location:document.getElementById('m_loc').value,notes:document.getElementById('m_notes').value};
  if(!body.name){alert('Nom requis');return;}
  if(id&&id!=0){
    await sbPatch('vz_inventory_items',id,body);
    var idx=allItems.findIndex(function(x){return x.id==id;});
    if(idx>=0) allItems[idx]=Object.assign(allItems[idx],body);
  } else {
    body.id=Date.now();
    var res=await sbPost('vz_inventory_items',body);
    allItems.push(res&&res[0]?res[0]:body);
  }
  closeModal(); render();
}

  var i=allItems.find(function(x){return x.id==itemId;});
  if(!i) return;
  var lbl=type==='in'?'Entree stock':'Sortie stock';
  var h='<div class="overlay" onclick="if(event.target===this)closeModal()">';
  h+='<div class="modal"><div class="modal-title">'+lbl+' — '+esc(i.name)+'</div>';
  h+='<label>Quantite</label><input type="number" id="mv_qty" value="1" min="1" style="font-size:24px;text-align:center;padding:14px">';
  h+='<label>Note</label><input id="mv_note" placeholder="Raison, destination...">';
  h+='<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Annuler</button>';
  h+='<button class="btn btn-primary" data-iid="'+i.id+'" data-type="'+type+'" onclick="saveMvt(this.dataset.iid,this.dataset.type)">Confirmer</button></div>';
  h+='</div></div>';
  showModal(h);
}

async function saveMvt(itemId,type){
  var qty=parseInt(document.getElementById('mv_qty').value)||1;
  var note=document.getElementById('mv_note').value;
  var i=allItems.find(function(x){return x.id==itemId;});
  if(!i) return;
  var mvt={id:Date.now(),item_id:itemId,item_name:i.name,type:type,quantity:type==='out'?-qty:qty,note:note,user_name:'Utilisateur',created_at:new Date().toISOString()};
  allMovements.unshift(mvt);
  if(type==='in') i.quantity+=qty;
  else i.quantity=Math.max(0,i.quantity-qty);
  await sbPost('vz_inventory_movements',mvt);
  await sbPatch('vz_inventory_items',itemId,{quantity:i.quantity});
  closeModal(); render();
}

  h+='<label>Article</label><input id="d_item" placeholder="Nom de l&#39;article a commander">';
  h+='<div class="modal-row"><div><label>Quantite</label><input type="number" id="d_qty" value="1" min="1"></div>';
  h+='<div><label>Urgence</label><select id="d_urg"><option value="low">Faible</option><option value="med" selected>Normal</option><option value="high">Urgent</option></select></div></div>';
  h+='<label>Justification</label><textarea id="d_just" rows="3" placeholder="Pourquoi cet achat est necessaire..."></textarea>';
  h+='<label>Demande par</label><input id="d_by" placeholder="Votre nom">';
  h+='<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Annuler</button>';
  h+='<button class="btn btn-primary" onclick="saveDemande()">Envoyer</button></div>';
  h+='</div></div>';
  showModal(h);
}

async function saveDemande(){
  var item=document.getElementById('d_item').value;
  var qty=parseInt(document.getElementById('d_qty').value)||1;
  var urg=document.getElementById('d_urg').value;
  var just=document.getElementById('d_just').value;
  var by=document.getElementById('d_by').value||'Inconnu';
  if(!item){alert('Article requis');return;}
  var req={id:Date.now(),item_name:item,quantity:qty,urgency:urg,justification:just,requested_by:by,status:'pending',created_at:new Date().toISOString()};
  allRequests.unshift(req);
  await sbPost('vz_purchase_requests',req);
  window.parent.postMessage({veraluzEvent:true,source:MID,type:'notification',data:{title:'Nouvelle demande achat',message:item+' x'+qty,level:urg==='high'?'alert':'info'}},'*');
  closeModal(); goTab('demandes');
}

function openBonModal(reqId){
  var req=reqId&&reqId!=0?allRequests.find(function(x){return x.id==reqId;}):null;
  var h='<div class="overlay" onclick="if(event.target===this)closeModal()">';
  h+='<div class="modal"><div class="modal-title">Nouveau bon de commande</div>';
  h+='<label>Fournisseur</label><select id="b_sup"><option value="">-- Choisir --</option>';
  allSuppliers.forEach(function(s){ h+='<option value="'+esc(s.name)+'">'+esc(s.name)+'</option>'; });
  h+='</select>';
  h+='<label>Articles</label><textarea id="b_items" rows="3" placeholder="Ex: Ampoules LED x20...">'+(req?esc(req.item_name)+' x'+req.quantity:'')+'</textarea>';
  h+='<label>Montant estime (FCFA)</label><input type="number" id="b_amt" placeholder="0" min="0">';
  h+='<label>Notes</label><input id="b_notes" placeholder="Instructions livraison...">';
  h+='<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Annuler</button>';
  h+='<button class="btn btn-primary" data-rid="'+(req?req.id:0)+'" onclick="saveBon(this.dataset.rid)">Creer bon</button></div>';
  h+='</div></div>';
  showModal(h);
}

async function saveBon(reqId){
  var sup=document.getElementById('b_sup').value;
  var items=document.getElementById('b_items').value;
  var amt=parseInt(document.getElementById('b_amt').value)||0;
  var notes=document.getElementById('b_notes').value;
  if(!items){alert('Articles requis');return;}
  var poNum='PO-'+new Date().getFullYear()+'-'+String(allOrders.length+1).padStart(3,'0');
  var bon={id:Date.now(),po_number:poNum,supplier:sup,items:items,total_amount:amt,notes:notes,status:'draft',created_at:new Date().toISOString()};
  allOrders.unshift(bon);
  await sbPost('vz_purchase_orders',bon);
  if(reqId&&reqId!=0) await sbPatch('vz_purchase_requests',reqId,{status:'ordered'});
  closeModal(); goTab('bons');
}

function openReceptionModal(){
  var h='<div class="overlay" onclick="if(event.target===this)closeModal()">';
  h+='<div class="modal"><div class="modal-title">Enregistrer une reception</div>';
  h+='<label>Articles recus</label><textarea id="r_items" rows="2" placeholder="Ex: Ampoules LED x20..."></textarea>';
  h+='<label>Fournisseur</label><select id="r_sup"><option value="">-- Choisir --</option>';
  allSuppliers.forEach(function(s){ h+='<option value="'+esc(s.name)+'">'+esc(s.name)+'</option>'; });
  h+='</select>';
  h+='<label>Montant paye (FCFA)</label><input type="number" id="r_amt" placeholder="0" min="0">';
  h+='<label>Photo recu / Facture</label>';
  h+='<div class="upload-zone" onclick="document.getElementById(&apos;r_file&apos;).click()">';
  h+='<input type="file" id="r_file" accept="image/*" style="display:none" onchange="previewReceipt(this)">';
  h+='<div class="uz-icon">📷</div><div class="uz-text">Appuyer pour photo ou fichier</div>';
  h+='<div id="r_preview"></div></div>';
  h+='<label>Recu par</label><input id="r_by" placeholder="Votre nom">';
  h+='<label>Notes</label><input id="r_notes" placeholder="Commentaires...">';
  h+='<div style="font-size:11px;color:#475569;padding:8px;background:#0f172a;border-radius:6px;margin-bottom:10px">OCR automatique prevu dans une prochaine version.</div>';
  h+='<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Annuler</button>';
  h+='<button class="btn btn-primary" onclick="saveReception()">Enregistrer</button></div>';
  h+='</div></div>';
  showModal(h);
}

function previewReceipt(input){
  if(!input.files||!input.files[0]) return;
  var reader=new FileReader();
  reader.onload=function(e){ document.getElementById('r_preview').innerHTML='<img src="'+e.target.result+'" style="max-width:100%;max-height:150px;border-radius:8px;margin-top:8px">'; };
  reader.readAsDataURL(input.files[0]);
}

async function saveReception(){
  var items=document.getElementById('r_items').value;
  var sup=document.getElementById('r_sup').value;
  var amt=parseInt(document.getElementById('r_amt').value)||0;
  var by=document.getElementById('r_by').value||'Inconnu';
  var notes=document.getElementById('r_notes').value;
  if(!items){alert('Articles requis');return;}
  var rec={id:Date.now(),items:items,supplier_name:sup,total_amount:amt,received_by:by,notes:notes,received_at:new Date().toISOString()};
  allReceptions.unshift(rec);
  await sbPost('vz_receptions',rec);
  window.parent.postMessage({veraluzEvent:true,source:MID,type:'expense-created',data:{label:'Approvisionnement: '+items,amount:amt,date:new Date().toISOString()}},'*');
  closeModal(); goTab('receptions');
}

function openSupplierModal(id){
  var s=id&&id!=0?allSuppliers.find(function(x){return x.id==id;}):null;
  var h='<div class="overlay" onclick="if(event.target===this)closeModal()">';
  h+='<div class="modal"><div class="modal-title">'+(s?'Modifier fournisseur':'Nouveau fournisseur')+'</div>';
  h+='<label>Nom</label><input id="s_name" value="'+(s?esc(s.name):'')+'" placeholder="Nom du fournisseur">';
  h+='<div class="modal-row"><div><label>Telephone</label><input id="s_phone" value="'+(s?esc(s.phone||''):'')+'" placeholder="+237..."></div>';
  h+='<div><label>Email</label><input id="s_email" value="'+(s?esc(s.email||''):'')+'" placeholder="email@..."></div></div>';
  h+='<label>Categorie</label><input id="s_cat" value="'+(s?esc(s.category||''):'')+'" placeholder="Ex: Consommables...">';
  h+='<label>Notes</label><textarea id="s_notes" rows="2">'+(s?esc(s.notes||''):'')+'</textarea>';
  h+='<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Annuler</button>';
  h+='<button class="btn btn-primary" data-sid="'+(s?s.id:0)+'" onclick="saveSupplier(this.dataset.sid)">Enregistrer</button></div>';
  h+='</div></div>';
  showModal(h);
}

async function saveSupplier(id){
  var body={name:document.getElementById('s_name').value,phone:document.getElementById('s_phone').value,
    email:document.getElementById('s_email').value,category:document.getElementById('s_cat').value,
    notes:document.getElementById('s_notes').value};
  if(!body.name){alert('Nom requis');return;}
  if(id&&id!=0){
    await sbPatch('vz_appro_suppliers',id,body);
    var idx=allSuppliers.findIndex(function(x){return x.id==id;});
    if(idx>=0) allSuppliers[idx]=Object.assign(allSuppliers[idx],body);
  } else {
    body.id=Date.now();
    var res=await sbPost('vz_appro_suppliers',body);
    allSuppliers.push(res&&res[0]?res[0]:body);
  }
  closeModal(); render();
}
</script>
</body>
