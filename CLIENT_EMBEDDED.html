<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Clients — Résidence Veraluz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg1:#0f1117;--bg2:#161b27;--bg3:#1e2535;--bg4:#252d40;
  --acc:#22d3a5;--acc2:#f59e0b;--acc3:#ef4444;
  --text1:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --border:#2a3347;--radius:10px;
  --vip:#f59e0b;--new:#22d3a5;--regular:#6366f1;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg1);color:var(--text1);min-height:100vh;overflow-x:hidden;}
/* ── Layout ── */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.topbar h1{font-size:15px;font-weight:700;color:var(--text1);}
.topbar .sub{font-size:11px;color:var(--text3);}
.content-area{flex:1;overflow-y:auto;padding:12px 14px 80px;}
/* ── Stats ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
@media(max-width:600px){.stats-row{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}
.stat-val{font-size:22px;font-weight:800;color:var(--acc);line-height:1;}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.3px;}
.stat-sub{font-size:11px;color:var(--text2);margin-top:2px;}
/* ── Search & filters ── */
.search-bar{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:0 14px;display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.search-bar input{background:none;border:none;outline:none;color:var(--text1);font-size:13px;padding:11px 0;flex:1;}
.search-bar input::placeholder{color:var(--text3);}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.flt-btn{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:11px;color:var(--text2);cursor:pointer;transition:.15s;}
.flt-btn.active{background:var(--acc);color:#0f1117;border-color:var(--acc);font-weight:700;}
/* ── Client cards ── */
.client-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;cursor:pointer;transition:.15s;}
.client-card:hover{border-color:var(--acc);background:var(--bg3);}
.client-card-top{display:flex;align-items:center;gap:12px;}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex-shrink:0;}
.avatar.vip{background:rgba(245,158,11,.2);color:var(--vip);}
.avatar.loyal{background:rgba(99,102,241,.2);color:var(--regular);}
.avatar.new{background:rgba(34,211,165,.15);color:var(--new);}
.client-info{flex:1;min-width:0;}
.client-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.client-contact{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.client-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.bdg{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;}
.bdg.vip{background:rgba(245,158,11,.2);color:var(--vip);}
.bdg.loyal{background:rgba(99,102,241,.2);color:var(--regular);}
.bdg.new{background:rgba(34,211,165,.15);color:var(--new);}
.bdg.inactive{background:rgba(100,116,139,.15);color:var(--text3);}
.client-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.cs-val{font-size:13px;font-weight:700;color:var(--text1);}
.cs-lbl{font-size:10px;color:var(--text3);}
.client-actions{display:flex;gap:6px;margin-top:10px;}
/* ── Buttons ── */
.btn{border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;}
.btn-p{background:var(--acc);color:#0f1117;}
.btn-p:hover{opacity:.85;}
.btn-s{background:var(--bg3);color:var(--text1);border:1px solid var(--border);}
.btn-s:hover{border-color:var(--acc);color:var(--acc);}
.btn-sm{padding:6px 10px;font-size:11px;}
.btn-email{background:rgba(34,211,165,.12);color:var(--acc);border:1px solid rgba(34,211,165,.3);}
/* ── Modal fiche client ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-sheet{background:var(--bg2);border-radius:16px 16px 0 0;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;padding:20px 16px 32px;}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
.modal-close{float:right;background:var(--bg3);border:none;border-radius:50%;width:28px;height:28px;color:var(--text2);cursor:pointer;font-size:14px;}
.modal-title{font-size:18px;font-weight:800;margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--text3);margin-bottom:14px;}
/* ── Section ── */
.section-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;}
/* ── Timeline séjours ── */
.stay-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.stay-item:last-child{border-bottom:none;}
.stay-dot{width:8px;height:8px;border-radius:50%;background:var(--acc);margin-top:5px;flex-shrink:0;}
.stay-body{flex:1;}
.stay-unit{font-size:13px;font-weight:600;}
.stay-dates{font-size:11px;color:var(--text3);margin-top:2px;}
.stay-amount{font-size:13px;font-weight:700;color:var(--acc);white-space:nowrap;}
/* ── Email modal ── */
.email-form{background:var(--bg3);border-radius:10px;padding:14px;margin-top:10px;}
.field-lbl{font-size:11px;color:var(--text3);margin-bottom:4px;}
.field-inp{width:100%;background:var(--bg1);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--text1);outline:none;margin-bottom:10px;}
.field-inp:focus{border-color:var(--acc);}
textarea.field-inp{resize:vertical;min-height:80px;}
/* ── Notes ── */
.note-box{background:var(--bg3);border-radius:8px;padding:12px;}
.note-text{font-size:13px;color:var(--text2);line-height:1.5;}
/* ── Empty / Loading ── */
.empty{text-align:center;padding:48px 16px;color:var(--text3);}
.empty-ico{font-size:36px;margin-bottom:8px;}
/* ── Toast ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--acc);color:var(--acc);padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;display:none;}
</style>
</head>
<body>
<div class="app">
  <!-- Topbar -->
  <div class="topbar">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="1.8" width="20" height="20"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <div>
      <div class="topbar h1" style="font-size:15px;font-weight:700;">Base Clients</div>
      <div class="sub" id="top-sub">Chargement…</div>
    </div>
  </div>

  <!-- Content -->
  <div class="content-area">
    <!-- Stats -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card"><div class="stat-val" id="s-total">—</div><div class="stat-lbl">Clients total</div></div>
      <div class="stat-card"><div class="stat-val" id="s-loyal" style="color:var(--acc2)">—</div><div class="stat-lbl">Clients fidèles</div><div class="stat-sub">2+ séjours</div></div>
      <div class="stat-card"><div class="stat-val" id="s-ca" style="color:var(--vip)">—</div><div class="stat-lbl">CA moyen/client</div></div>
      <div class="stat-card"><div class="stat-val" id="s-return" style="color:var(--regular)">—</div><div class="stat-lbl">Taux de retour</div></div>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2" width="15" height="15"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-inp" placeholder="Rechercher par nom, email, téléphone…" oninput="renderList()">
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="flt-btn active" onclick="setFilter('all',this)">Tous</button>
      <button class="flt-btn" onclick="setFilter('vip',this)">⭐ VIP</button>
      <button class="flt-btn" onclick="setFilter('loyal',this)">🔁 Fidèles</button>
      <button class="flt-btn" onclick="setFilter('new',this)">🆕 Nouveaux</button>
      <button class="flt-btn" onclick="setFilter('inactive',this)">💤 Inactifs</button>
    </div>

    <!-- Client list -->
    <div id="client-list"></div>
  </div>
</div>

<!-- Fiche client modal -->
<div class="modal-overlay" id="client-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- Email compose modal -->
<div class="modal-overlay" id="email-modal">
  <div class="modal-sheet" style="max-height:80vh;">
    <div class="modal-handle"></div>
    <button class="modal-close" onclick="document.getElementById('email-modal').classList.remove('open')">✕</button>
    <div id="email-modal-content"></div>
  </div>
</div>

<div class="toast" id="toastEl"></div>

<script>
var MODULE_ID = 'veraluz-clients';
var SB  = 'https://dfdmasejsoibxrvubegu.supabase.co';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmZG1hc2Vqc29pYnhydnViZWd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDgzOTMsImV4cCI6MjA5MjI4NDM5M30.dEsafV84HFmFqU6Yi4xKydIbUlkIVE7QMRMpFt8kqXY';

/* ── Utilitaires ── */
function esc(s){ return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtMoney(n){ return Number(n||0).toLocaleString('fr-FR')+' F'; }
function fmtDate(s){ if(!s)return '—'; try{return new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return s;} }
function toast(msg,ok){
  var el=document.getElementById('toastEl');
  if(!el)return;
  el.textContent=msg; el.className='toast'+(ok===false?' err':'');
  el.style.display='block'; clearTimeout(el._t);
  el._t=setTimeout(function(){el.style.display='none';},3000);
}
function emit(type,data){
  try{ window.parent.postMessage({veraluzEvent:true,source:MODULE_ID,type:type,data:data||{}},'*');}catch(e){}
}
function sbGet(path){
  return fetch(SB+'/rest/v1/'+path,{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}}).then(function(r){return r.json();});
}

/* ── State ── */
var CLIENTS = [];   // aggregated client profiles
var REZS    = [];   // raw reservations
var _filter = 'all';
var _curKey = null; // currently open client key
var CLIENT_NOTES = {};

function loadNotes(){
  try{ CLIENT_NOTES=JSON.parse(localStorage.getItem('vz_client_notes')||'{}'); }catch(e){ CLIENT_NOTES={}; }
}
function saveNotes(){
  try{ localStorage.setItem('vz_client_notes',JSON.stringify(CLIENT_NOTES)); }catch(e){}
}

/* ── Agrégation ── */
function aggregateClients(rezs){
  var map = {};
  rezs.forEach(function(r){
    var email = ((r.guest_email||r.client_email||'').trim()).toLowerCase();
    var name  = (r.guest_name||r.client_name||'').trim();
    var key   = email || name.toLowerCase() || r.id;
    if(!key) return;
    if(!map[key]){
      map[key]={
        key:key, name:name, email:email,
        phone:r.guest_phone||r.client_phone||'',
        reservations:[], totalSpent:0, totalNights:0,
        firstVisit:null, lastVisit:null, units:{}
      };
    }
    var c=map[key];
    if(name && !c.name) c.name=name;
    if(!c.phone && (r.guest_phone||r.client_phone)) c.phone=r.guest_phone||r.client_phone;
    c.reservations.push(r);
    c.totalSpent += (r.paid||0);
    var nights = diffDays(r.check_in,r.check_out)||1;
    c.totalNights += nights;
    var d = r.check_in||r.created_at||'';
    if(d && (!c.firstVisit||d<c.firstVisit)) c.firstVisit=d;
    if(d && (!c.lastVisit||d>c.lastVisit)) c.lastVisit=d;
    if(r.unit_name) c.units[r.unit_name]=(c.units[r.unit_name]||0)+1;
  });
  // classify
  var today = new Date(); today.setHours(0,0,0,0);
  var ninetyAgo = new Date(today); ninetyAgo.setDate(ninetyAgo.getDate()-90);
  var result = Object.values(map).sort(function(a,b){
    return (b.lastVisit||'') > (a.lastVisit||'') ? 1 : -1;
  });
  result.forEach(function(c){
    var stays = c.reservations.length;
    var last = c.lastVisit ? new Date(c.lastVisit+'T12:00:00') : null;
    c.stayCount = stays;
    c.isVIP    = stays>=4 || c.totalSpent>=500000;
    c.isLoyal  = stays>=2 && !c.isVIP;
    c.isNew    = stays===1 && last && last >= ninetyAgo;
    c.isInactive = last && last < ninetyAgo && stays < 2;
    c.prefUnit = Object.keys(c.units).sort(function(a,b){return c.units[b]-c.units[a];})[0]||'';
  });
  return result;
}
function diffDays(a,b){
  if(!a||!b)return 0;
  return Math.max(0,Math.round((new Date(b)-new Date(a))/86400000));
}
function initials(name){
  if(!name||name==='—')return '?';
  var parts=name.trim().split(/\s+/);
  return (parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase();
}
function avatarClass(c){ return c.isVIP?'vip':c.isLoyal?'loyal':'new'; }

/* ── Stats ── */
function renderStats(){
  var total=CLIENTS.length;
  var loyal=CLIENTS.filter(function(c){return c.isLoyal||c.isVIP;}).length;
  var caTotal=CLIENTS.reduce(function(s,c){return s+c.totalSpent;},0);
  var caAvg=total?Math.round(caTotal/total):0;
  var returnRate=total?Math.round((loyal/total)*100):0;
  document.getElementById('s-total').textContent=total;
  document.getElementById('s-loyal').textContent=loyal;
  document.getElementById('s-ca').textContent=fmtMoney(caAvg);
  document.getElementById('s-return').textContent=returnRate+'%';
  document.getElementById('top-sub').textContent=total+' clients · '+REZS.filter(function(r){return r.status!=='cancelled';}).length+' séjours';
}

/* ── Filter ── */
function setFilter(f,btn){
  _filter=f;
  document.querySelectorAll('.flt-btn').forEach(function(b){b.classList.remove('active');});
  if(btn) btn.classList.add('active');
  renderList();
}

/* ── List ── */
function renderList(){
  var q=(document.getElementById('search-inp').value||'').toLowerCase().trim();
  var list=CLIENTS.filter(function(c){
    if(q && !(c.name+c.email+c.phone).toLowerCase().includes(q)) return false;
    if(_filter==='vip')      return c.isVIP;
    if(_filter==='loyal')    return c.isLoyal;
    if(_filter==='new')      return c.isNew;
    if(_filter==='inactive') return c.isInactive;
    return true;
  });
  var el=document.getElementById('client-list');
  if(!list.length){
    el.innerHTML='<div class="empty"><div class="empty-ico">👥</div>Aucun client trouvé</div>';
    return;
  }
  el.innerHTML=list.map(function(c){
    var ac=avatarClass(c);
    var note=CLIENT_NOTES[c.key];
    var badges='';
    if(c.isVIP)      badges+='<span class="bdg vip">⭐ VIP</span>';
    if(c.isLoyal&&!c.isVIP) badges+='<span class="bdg loyal">🔁 Fidèle</span>';
    if(c.isNew)      badges+='<span class="bdg new">🆕 Nouveau</span>';
    if(c.isInactive) badges+='<span class="bdg inactive">💤 Inactif</span>';
    return '<div class="client-card" data-key="'+esc(c.key)+'" onclick="openClient(\''+esc(c.key)+'\',event)">'
      +'<div class="client-card-top">'
      +'<div class="avatar '+ac+'">'+initials(c.name)+'</div>'
      +'<div class="client-info">'
      +'<div class="client-name">'+esc(c.name||'Client anonyme')+'</div>'
      +'<div class="client-contact">'+(c.email||c.phone||'Pas de contact')+'</div>'
      +(badges?'<div class="client-badges">'+badges+'</div>':'')
      +'</div>'
      +'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">'
      +(c.email?'<button class="btn btn-sm btn-email" onclick="event.stopPropagation();openEmailFor(\''+esc(c.key)+'\')">✉ Email</button>':'')
      +'</div>'
      +'</div>'
      +'<div class="client-stats">'
      +'<div><div class="cs-val">'+c.stayCount+'</div><div class="cs-lbl">Séjour'+(c.stayCount>1?'s':'')+'</div></div>'
      +'<div><div class="cs-val">'+c.totalNights+'</div><div class="cs-lbl">Nuit'+(c.totalNights>1?'s':'')+' total</div></div>'
      +'<div><div class="cs-val" style="color:var(--acc)">'+fmtMoney(c.totalSpent)+'</div><div class="cs-lbl">Total payé</div></div>'
      +'</div>'
      +(note?'<div style="font-size:11px;color:var(--text3);margin-top:8px;font-style:italic;">📝 '+esc(note)+'</div>':'')
      +'</div>';
  }).join('');
}

/* ── Fiche client ── */
function openClient(key,evt){
  if(evt && evt.target.tagName==='BUTTON') return;
  _curKey=key;
  var c=CLIENTS.find(function(x){return x.key===key;});
  if(!c)return;
  var ac=avatarClass(c);
  var badges='';
  if(c.isVIP)  badges+='<span class="bdg vip">⭐ VIP</span>';
  if(c.isLoyal&&!c.isVIP) badges+='<span class="bdg loyal">🔁 Fidèle</span>';
  if(c.isNew)  badges+='<span class="bdg new">🆕 Nouveau</span>';
  var note=CLIENT_NOTES[key]||'';
  // best unit
  var prefUnit=c.prefUnit?(' · Préfère: '+esc(c.prefUnit)):'';
  // stays list
  var staysList=c.reservations.slice().sort(function(a,b){
    return (b.check_in||b.created_at||'')>(a.check_in||a.created_at||'')?1:-1;
  }).map(function(r){
    var nights=diffDays(r.check_in,r.check_out)||1;
    var stMap={confirmed:'Confirmée',checkedin:'En cours',checked_in:'En cours',checkedout:'Terminée',checked_out:'Terminée',cancelled:'Annulée',pending:'En attente'};
    var stColors={confirmed:'var(--acc)',checkedin:'var(--acc2)',checked_in:'var(--acc2)',checkedout:'var(--text3)',checked_out:'var(--text3)',cancelled:'var(--acc3)',pending:'var(--text2)'};
    return '<div class="stay-item">'
      +'<div class="stay-dot" style="background:'+(stColors[r.status]||'var(--acc)')+'"></div>'
      +'<div class="stay-body">'
      +'<div class="stay-unit">'+esc(r.unit_name||r.unit_id||'—')+'</div>'
      +'<div class="stay-dates">'+fmtDate(r.check_in)+' → '+fmtDate(r.check_out)+' · '+nights+' nuit'+(nights>1?'s':'')
      +' · <span style="color:'+(stColors[r.status]||'var(--acc)')+'">'+esc(stMap[r.status]||r.status||'—')+'</span></div>'
      +'</div>'
      +'<div class="stay-amount">'+fmtMoney(r.paid||0)+'</div>'
      +'</div>';
  }).join('');

  document.getElementById('modal-content').innerHTML=
    '<div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">'
    +'<div class="avatar '+ac+'" style="width:56px;height:56px;font-size:20px;">'+initials(c.name)+'</div>'
    +'<div><div class="modal-title">'+esc(c.name||'Client anonyme')+'</div>'
    +(c.email?'<div class="modal-sub">✉ '+esc(c.email)+'</div>':'')
    +(c.phone?'<div class="modal-sub">📞 '+esc(c.phone)+'</div>':'')
    +(badges?'<div style="display:flex;gap:4px;margin-top:6px;">'+badges+'</div>':'')
    +'</div></div>'

    // KPIs
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;">'
    +'<div class="stat-card"><div class="stat-val">'+c.stayCount+'</div><div class="stat-lbl">Séjours</div></div>'
    +'<div class="stat-card"><div class="stat-val">'+c.totalNights+'</div><div class="stat-lbl">Nuits total</div></div>'
    +'<div class="stat-card"><div class="stat-val" style="color:var(--acc)">'+fmtMoney(c.totalSpent)+'</div><div class="stat-lbl">Payé total</div></div>'
    +'</div>'

    // Infos
    +'<div style="font-size:11px;color:var(--text3);margin-bottom:14px;">'
    +'Première visite : '+fmtDate(c.firstVisit)+' · Dernière : '+fmtDate(c.lastVisit)+prefUnit
    +'</div>'

    // Actions
    +(c.email?'<div style="display:flex;gap:8px;margin-bottom:14px;">'
    +'<button class="btn btn-p btn-sm" onclick="openEmailFor(\''+esc(key)+'\')">✉ Envoyer un email</button>'
    +'<button class="btn btn-s btn-sm" onclick="toggleVIP(\''+esc(key)+'\')">⭐ '+(c.isVIP?'Retirer VIP':'Marquer VIP')+'</button>'
    +'</div>':'<div style="color:var(--text3);font-size:11px;margin-bottom:14px;">Aucun email — contact direct uniquement</div>')

    // Note
    +'<div class="section-title">Note privée</div>'
    +'<div class="note-box">'
    +'<textarea class="field-inp" id="note-inp" rows="3" placeholder="Notes, préférences, allergies…" style="margin-bottom:8px;">'+esc(note)+'</textarea>'
    +'<button class="btn btn-s btn-sm" onclick="saveNote(\''+esc(key)+'\')">💾 Sauvegarder la note</button>'
    +'</div>'

    // Historique
    +'<div class="section-title">Historique des séjours</div>'
    +(staysList||'<div style="color:var(--text3);font-size:12px;">Aucun séjour enregistré</div>');

  document.getElementById('client-modal').classList.add('open');
}
function closeModal(){
  document.getElementById('client-modal').classList.remove('open');
}
function saveNote(key){
  var val=(document.getElementById('note-inp').value||'').trim();
  if(val) CLIENT_NOTES[key]=val; else delete CLIENT_NOTES[key];
  saveNotes();
  toast('Note sauvegardée 💾');
  renderList();
}
function toggleVIP(key){
  var c=CLIENTS.find(function(x){return x.key===key;});
  if(!c)return;
  c.isVIP=!c.isVIP;
  if(c.isVIP){ c.isLoyal=false; c.isNew=false; }
  try{
    var vips=JSON.parse(localStorage.getItem('vz_client_vips')||'[]');
    if(c.isVIP && !vips.includes(key)) vips.push(key);
    if(!c.isVIP) vips=vips.filter(function(k){return k!==key;});
    localStorage.setItem('vz_client_vips',JSON.stringify(vips));
  }catch(e){}
  toast(c.isVIP?'Client marqué VIP ⭐':'Statut VIP retiré');
  openClient(key,null);
  renderList();
}

/* ── Email ── */
var _emailTarget=null;
function openEmailFor(key){
  _emailTarget=key;
  var c=CLIENTS.find(function(x){return x.key===key;});
  if(!c||!c.email){toast('Pas d\'email pour ce client',false);return;}
  var hotel={}; try{hotel=JSON.parse(localStorage.getItem('vz_hotel_info')||'{}');}catch(e){}
  var hotelName=hotel.name||'Résidence Veraluz';
  document.getElementById('email-modal-content').innerHTML=
    '<div class="modal-title" style="font-size:15px;margin-bottom:14px;">✉ Email à '+esc(c.name)+'</div>'
    +'<div class="field-lbl">Destinataire</div>'
    +'<input class="field-inp" value="'+esc(c.email)+'" disabled>'
    +'<div class="field-lbl">Sujet</div>'
    +'<input class="field-inp" id="em-subject" value="Résidence Veraluz — Message de notre équipe">'
    +'<div class="field-lbl">Modèle</div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">'
    +'<button class="btn btn-s btn-sm" onclick="fillTemplate(\'welcome\')">🙏 Bienvenue retour</button>'
    +'<button class="btn btn-s btn-sm" onclick="fillTemplate(\'offer\')">🎁 Offre spéciale</button>'
    +'<button class="btn btn-s btn-sm" onclick="fillTemplate(\'thanks\')">💚 Merci séjour</button>'
    +'</div>'
    +'<div class="field-lbl">Message</div>'
    +'<textarea class="field-inp" id="em-body" rows="5" placeholder="Votre message…"></textarea>'
    +'<div style="display:flex;gap:8px;margin-top:4px;">'
    +'<button class="btn btn-p" onclick="sendClientEmail()">📤 Envoyer</button>'
    +'<button class="btn btn-s" onclick="document.getElementById(\'email-modal\').classList.remove(\'open\')">Annuler</button>'
    +'</div>';
  document.getElementById('email-modal').classList.add('open');
}

var _emailTemplates={};
function fillTemplate(type){
  var c=CLIENTS.find(function(x){return x.key===_emailTarget;});
  var hotel={}; try{hotel=JSON.parse(localStorage.getItem('vz_hotel_info')||'{}');}catch(e){}
  var name=c?c.name.split(' ')[0]:'cher client';
  var hotelName=hotel.name||'Résidence Veraluz';
  var subjects={
    welcome:'Nous avons hâte de vous retrouver — '+hotelName,
    offer:'Offre exclusive pour vous — '+hotelName,
    thanks:'Merci pour votre séjour — '+hotelName
  };
  var bodies={
    welcome:'Bonjour '+name+',\n\nNous espérons que votre dernier séjour à la Résidence Veraluz vous a laissé de beaux souvenirs.\n\nNous serions ravis de vous accueillir à nouveau. N\'hésitez pas à nous contacter pour votre prochaine réservation.\n\nÀ bientôt,\nL\'équipe '+hotelName,
    offer:'Bonjour '+name+',\n\nEn tant que client fidèle, nous vous réservons une offre exclusive : [DÉCRIVEZ L\'OFFRE ICI]\n\nValable jusqu\'au [DATE]. Réservez dès maintenant en nous contactant directement.\n\nCordialement,\nL\'équipe '+hotelName,
    thanks:'Bonjour '+name+',\n\nMerci de nous avoir choisis pour votre séjour à la Résidence Veraluz. Nous espérons que vous avez apprécié votre séjour les pieds dans le sable à Kribi.\n\nVotre avis compte pour nous. N\'hésitez pas à partager votre expérience.\n\nÀ très bientôt,\nL\'équipe '+hotelName
  };
  document.getElementById('em-subject').value=subjects[type]||'';
  document.getElementById('em-body').value=bodies[type]||'';
}

function sendClientEmail(){
  var c=CLIENTS.find(function(x){return x.key===_emailTarget;});
  if(!c||!c.email){toast('Email introuvable',false);return;}
  var subj=(document.getElementById('em-subject').value||'').trim();
  var body=(document.getElementById('em-body').value||'').trim();
  if(!subj||!body){toast('Objet et message requis',false);return;}
  var hotel={}; try{hotel=JSON.parse(localStorage.getItem('vz_hotel_info')||'{}');}catch(e){}
  var hotelName=hotel.name||'Résidence Veraluz';
  var hotelAddr=hotel.city||'Kribi, Cameroun';
  // Build HTML body
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><style>'
    +'body{font-family:Arial,sans-serif;font-size:14px;color:#222;max-width:560px;margin:0 auto;padding:24px;}'
    +'.hdr{background:#0d7a5f;color:#fff;padding:18px 22px;border-radius:8px 8px 0 0;}'
    +'.hdr h2{margin:0;font-size:18px;} .hdr p{margin:4px 0 0;font-size:11px;opacity:.8;}'
    +'.body{background:#f9f9f9;padding:20px 22px;border:1px solid #e0e0e0;border-top:none;white-space:pre-line;line-height:1.7;}'
    +'.ftr{font-size:11px;color:#888;text-align:center;padding:14px;border-top:1px solid #ddd;}'
    +'</style></head><body>'
    +'<div class="hdr"><h2>'+escHtml(hotelName)+'</h2><p>'+escHtml(hotelAddr)+'</p></div>'
    +'<div class="body">'+escHtml(body)+'</div>'
    +'<div class="ftr">'+escHtml(hotelName)+' · '+escHtml(hotelAddr)+'</div>'
    +'</body></html>';
  window.parent.postMessage({veraluzEvent:true,source:MODULE_ID,type:'send-email',data:{
    to_email:c.email, to_name:c.name, subject:subj, body_html:html
  }},'*');
  toast('Email envoyé à '+c.email+' ✉');
  document.getElementById('email-modal').classList.remove('open');
}
function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── Load data ── */
function loadVIPOverrides(){
  try{
    var vips=JSON.parse(localStorage.getItem('vz_client_vips')||'[]');
    vips.forEach(function(k){
      var c=CLIENTS.find(function(x){return x.key===k;});
      if(c){c.isVIP=true;c.isLoyal=false;c.isNew=false;}
    });
  }catch(e){}
}

function loadData(){
  // 1. Try cache first
  try{
    var cache=JSON.parse(localStorage.getItem('vlz_cache_rez')||'[]');
    if(cache.length){
      REZS=cache.map(norm);
      CLIENTS=aggregateClients(REZS);
      loadVIPOverrides();
      renderStats(); renderList();
    }
  }catch(e){}
  // 2. Fetch from Supabase (fresh)
  sbGet('veraluz_reservations?select=*&order=created_at.desc&limit=500').then(function(data){
    if(!Array.isArray(data)||!data.length) return;
    REZS=data.map(norm);
    CLIENTS=aggregateClients(REZS);
    loadVIPOverrides();
    renderStats(); renderList();
    try{localStorage.setItem('vlz_cache_rez',JSON.stringify(data));}catch(e){}
  }).catch(function(){});
}

function norm(r){
  r.guest_name  = r.guest_name  || r.client_name  || '';
  r.guest_email = r.guest_email || r.client_email || '';
  r.guest_phone = r.guest_phone || r.client_phone || '';
  return r;
}

/* ── Init ── */
window.addEventListener('load',function(){
  loadNotes();
  loadData();
  // Notify Core
  try{ window.parent.postMessage({veraluzEvent:true,source:MODULE_ID,type:'module-ready',data:{module:'clients',version:'1.0'}},'*'); }catch(e){}
});

// Close modals on backdrop click
document.getElementById('client-modal').addEventListener('click',function(e){
  if(e.target===this) closeModal();
});
document.getElementById('email-modal').addEventListener('click',function(e){
  if(e.target===this) this.classList.remove('open');
});
</script>
</body>
</html>
