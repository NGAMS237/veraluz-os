<style>
/* ── Reset & Tokens ──────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --acc:#22d3a5;--acc2:#1ba87f;
  --bg:#0f1117;--bg2:#161b24;--bg3:#1e2535;--bg4:#252d3d;
  --text:#e8eaf0;--text2:#8b95a8;--text3:#5a6478;
  --red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;
  --purple:#8b5cf6;--green:#10b981;--orange:#f97316;
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;}

/* ── Layout ──────────────────────────────────────────────── */
#app{display:flex;height:100vh;height:100dvh;}

/* ── Sidebar nav (desktop) ───────────────────────────────── */
#sidenav{
  width:200px;flex-shrink:0;background:var(--bg2);
  border-right:1px solid var(--bg4);overflow-y:auto;
  display:flex;flex-direction:column;padding:12px 8px;gap:2px;
}
.nav-section{font-size:10px;color:var(--text3);padding:10px 10px 4px;
  text-transform:uppercase;letter-spacing:.6px;font-weight:600;}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;
  border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);
  transition:all .15s;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{background:var(--bg3);color:var(--text);}
.nav-item.active{background:var(--bg4);color:var(--acc);}
.nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;}
.save-all-btn{margin-top:auto;padding-top:12px;
  border-top:1px solid var(--bg4);}
.save-all-btn button{width:100%;padding:10px;border-radius:8px;border:none;
  background:var(--acc);color:#000;font-size:13px;font-weight:700;
  cursor:pointer;transition:all .15s;}
.save-all-btn button:hover{background:var(--acc2);}

/* ── Mobile bottom tabs ──────────────────────────────────── */
#mobile-tabs{
  display:none;overflow-x:auto;gap:0;
  background:var(--bg2);border-bottom:1px solid var(--bg4);
  scrollbar-width:none;flex-shrink:0;
}
#mobile-tabs::-webkit-scrollbar{display:none;}
.m-tab{flex-shrink:0;padding:10px 14px;border:none;background:transparent;
  color:var(--text2);font-size:11px;cursor:pointer;white-space:nowrap;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  border-bottom:2px solid transparent;transition:all .15s;}
.m-tab.active{color:var(--acc);border-bottom-color:var(--acc);}
.m-tab-icon{font-size:16px;}

/* ── Responsive breakpoint ───────────────────────────────── */
@media(max-width:680px){
  #sidenav{display:none;}
  #mobile-tabs{display:flex;}
  #app{flex-direction:column;}
  #main{flex:1;overflow:hidden;display:flex;flex-direction:column;}
}

/* ── Main content ────────────────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#content{flex:1;overflow-y:auto;padding:20px;
  padding-bottom:calc(20px + var(--safe-bot));}
@media(max-width:680px){#content{padding:14px;}}

/* ── Page header ─────────────────────────────────────────── */
.page-header{margin-bottom:20px;}
.page-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px;}
.page-sub{font-size:12px;color:var(--text2);margin-top:4px;}

/* ── Settings Card ───────────────────────────────────────── */
.card{background:var(--bg2);border:1px solid var(--bg4);border-radius:12px;
  padding:18px;margin-bottom:14px;}
.card-title{font-size:13px;font-weight:600;color:var(--text2);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;}
.card-title span{color:var(--text);}

/* ── Form elements ───────────────────────────────────────── */
.form-row{margin-bottom:14px;}
.form-row:last-child{margin-bottom:0;}
.form-label{font-size:12px;font-weight:500;color:var(--text2);
  margin-bottom:6px;display:block;}
.form-label span{color:var(--red);margin-left:2px;}
.form-input,.form-select,.form-textarea{
  width:100%;padding:9px 12px;border-radius:8px;
  border:1px solid var(--bg4);background:var(--bg3);
  color:var(--text);font-size:13px;transition:border-color .15s;
  font-family:inherit;}
.form-input:focus,.form-select:focus,.form-textarea:focus{
  outline:none;border-color:var(--acc);}
.form-textarea{resize:vertical;min-height:80px;line-height:1.5;}
.form-hint{font-size:11px;color:var(--text3);margin-top:4px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:480px){.form-grid{grid-template-columns:1fr;}}
.form-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:480px){.form-grid-3{grid-template-columns:1fr 1fr;}}

/* ── Toggle switch ───────────────────────────────────────── */
.toggle-row{display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--bg3);}
.toggle-row:last-child{border-bottom:none;padding-bottom:0;}
.toggle-info{flex:1;}
.toggle-label{font-size:13px;font-weight:500;}
.toggle-desc{font-size:11px;color:var(--text2);margin-top:2px;}
.toggle{position:relative;width:42px;height:24px;flex-shrink:0;cursor:pointer;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:var(--bg4);
  border-radius:24px;transition:.3s;}
.toggle-slider:before{content:'';position:absolute;width:18px;height:18px;
  left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
.toggle input:checked + .toggle-slider{background:var(--acc);}
.toggle input:checked + .toggle-slider:before{transform:translateX(18px);}

/* ── Color picker row ────────────────────────────────────── */
.color-row{display:flex;align-items:center;gap:10px;}
.color-swatch{width:36px;height:36px;border-radius:8px;border:none;
  cursor:pointer;padding:0;flex-shrink:0;}
.color-val{font-family:monospace;font-size:12px;color:var(--acc);}

/* ── Room type card ──────────────────────────────────────── */
.room-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:600px){.room-grid{grid-template-columns:repeat(3,1fr);}}
.room-card{background:var(--bg3);border:1px solid var(--bg4);border-radius:10px;
  padding:12px;position:relative;}
.room-card.active-room{border-color:var(--acc);}
.room-name{font-size:13px;font-weight:600;margin-bottom:4px;}
.room-count{font-size:11px;color:var(--text2);}
.room-price{font-size:12px;color:var(--acc);margin-top:6px;font-weight:600;}
.room-edit{position:absolute;top:8px;right:8px;background:var(--bg4);
  border:none;border-radius:6px;padding:3px 8px;color:var(--text2);
  font-size:11px;cursor:pointer;}
.room-edit:hover{color:var(--acc);}

/* ── Tax row ─────────────────────────────────────────────── */
.tax-row{display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--bg3);}
.tax-row:last-child{border-bottom:none;}
.tax-name{flex:1;font-size:13px;}
.tax-rate{width:80px;text-align:right;}
.tax-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;}
.tax-on{background:rgba(16,185,129,.15);color:var(--green);}
.tax-off{background:rgba(91,99,120,.15);color:var(--text3);}

/* ── Intégration card ────────────────────────────────────── */
.int-card{background:var(--bg3);border:1px solid var(--bg4);border-radius:10px;
  padding:14px;display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;}
.int-icon{font-size:28px;flex-shrink:0;}
.int-info{flex:1;}
.int-name{font-size:13px;font-weight:600;margin-bottom:3px;}
.int-desc{font-size:11px;color:var(--text2);margin-bottom:8px;}
.int-status{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;display:inline-block;}
.int-connected{background:rgba(16,185,129,.15);color:var(--green);}
.int-pending{background:rgba(245,158,11,.15);color:var(--amber);}
.int-soon{background:rgba(91,99,120,.15);color:var(--text3);}
.int-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}

/* ── Permission table ────────────────────────────────────── */
.perm-table{width:100%;border-collapse:collapse;font-size:12px;}
.perm-table th{padding:8px 6px;text-align:center;color:var(--text2);
  border-bottom:1px solid var(--bg4);font-weight:500;font-size:10px;}
.perm-table th:first-child{text-align:left;}
.perm-table td{padding:8px 6px;border-bottom:1px solid var(--bg3);text-align:center;}
.perm-table td:first-child{text-align:left;color:var(--text);font-weight:500;}
.perm-table tr:last-child td{border-bottom:none;}
.perm-check{width:16px;height:16px;accent-color:var(--acc);cursor:pointer;}

/* ── Buttons ─────────────────────────────────────────────── */
.btn{padding:9px 18px;border-radius:8px;border:none;font-size:13px;
  font-weight:600;cursor:pointer;transition:all .15s;}
.btn-primary{background:var(--acc);color:#000;}
.btn-primary:hover{background:var(--acc2);}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--bg4);}
.btn-secondary:hover{background:var(--bg4);}
.btn-danger{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);}
.btn-danger:hover{background:rgba(239,68,68,.25);}
.btn-sm{padding:5px 12px;font-size:11px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}

/* ── Badge ───────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;
  border-radius:20px;font-size:10px;font-weight:600;}
.badge-acc{background:rgba(34,211,165,.15);color:var(--acc);}
.badge-blue{background:rgba(59,130,246,.15);color:var(--blue);}
.badge-red{background:rgba(239,68,68,.15);color:var(--red);}

/* ── Unsaved indicator ───────────────────────────────────── */
.unsaved-bar{
  background:rgba(245,158,11,.1);border-bottom:1px solid rgba(245,158,11,.3);
  padding:8px 20px;display:none;align-items:center;justify-content:space-between;
  flex-shrink:0;font-size:12px;color:var(--amber);}
.unsaved-bar.show{display:flex;}

/* ── Toast ───────────────────────────────────────────────── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--bg3);border:1px solid var(--acc);color:var(--acc);
  padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;white-space:nowrap;}
#toast.show{opacity:1;}

/* ── Confirm modal ───────────────────────────────────────── */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:900;align-items:center;justify-content:center;padding:20px;}
#modal-overlay.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--bg4);border-radius:14px;
  padding:24px;max-width:380px;width:100%;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:8px;}
.modal-body{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.5;}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;}

/* ── System info ─────────────────────────────────────────── */
.sys-row{display:flex;justify-content:space-between;padding:8px 0;
  border-bottom:1px solid var(--bg3);font-size:12px;}
.sys-row:last-child{border-bottom:none;}
.sys-key{color:var(--text2);}
.sys-val{font-weight:600;font-family:monospace;font-size:11px;color:var(--acc);}
</style>

/* ── Settings store ──────────────────────────────────────── */
var S = {};
function loadSettings() {
  try {
    var saved = localStorage.getItem(LS_KEY);
    S = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULTS));
  } catch(e) { S = JSON.parse(JSON.stringify(DEFAULTS)); }
  /* fill missing keys */
  Object.keys(DEFAULTS).forEach(function(k){
    if (!S[k]) S[k] = JSON.parse(JSON.stringify(DEFAULTS[k]));
  });
}

/* ── Event Bus ───────────────────────────────────────────── */
function emit(type, data) {
  try {
    window.parent.postMessage({
      veraluzEvent: true,
      source: MODULE_ID,
      type: type,
      data: data || {}
    }, '*');
  } catch(e) {}
}
window.addEventListener('message', function(ev) {
  if (!ev.data || ev.data.source !== 'veraluz-core') return;
  var msg = ev.data;
  if (msg.type === 'auth-context') {
    var d = msg.data || {};
    /* Mettre à jour affichage utilisateur */
    if (d.name) {
      var uname = document.getElementById('st-user-name');
      var urole = document.getElementById('st-user-role');
      if (uname) uname.textContent = d.name;
      if (urole) urole.textContent = d.roleLabel || d.role || '';
    }
    /* Restreindre accès Settings aux admins/gérants uniquement */
    var adminRoles = ['admin','gerant','manager','super_admin'];
    if (d.role && !adminRoles.includes(d.role)) {
      var restricted = document.getElementById('content');
      if (restricted) restricted.innerHTML = '<div style="padding:40px;text-align:center;color:#ef4444;">⛔ Accès réservé aux administrateurs</div>';
    }
    return;
  }
  if (msg.type === 'refresh') { loadSettings(); renderSection(currentSection); }
  if (msg.type === 'navigate-tab' && msg.data && msg.data.tab) goSection(msg.data.tab);
});
window.addEventListener('load', function() {
  loadSettings();
  goSection('hotel');
  emit('module-ready', { module:'settings', version:'1.0' });
});

/* ── Helpers ─────────────────────────────────────────────── */
function toast(msg, ok) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = ok === false ? 'var(--red)' : 'var(--acc)';
  el.style.color       = ok === false ? 'var(--red)' : 'var(--acc)';
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2800);
}
function markDirty() {
  _dirty = true;
  document.getElementById('unsaved-bar').classList.add('show');
}
function markClean() {
  _dirty = false;
  document.getElementById('unsaved-bar').classList.remove('show');
}
function showModal(title, body, btns) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML    = body;
  document.getElementById('modal-btns').innerHTML    = btns;
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

/* ── Navigation ──────────────────────────────────────────── */
function goSection(id) {
  currentSection = id;
  /* desktop nav */
  document.querySelectorAll('.nav-item').forEach(function(b){ b.classList.remove('active'); });
  var n = document.getElementById('nav-' + id);
  if (n) n.classList.add('active');
  /* mobile tabs */
  document.querySelectorAll('.m-tab').forEach(function(b){ b.classList.remove('active'); });
  var mt = document.getElementById('mtab-' + id);
  if (mt) {
    mt.classList.add('active');
    mt.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
  }
  renderSection(id);
  document.getElementById('content').scrollTop = 0;
}

/* ── Save / Discard ──────────────────────────────────────── */
function saveAll() {
  collectCurrentForm();
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(S));
    markClean();
    toast('✅ Paramètres enregistrés');
    emit('settings-updated', { section: currentSection, ts: new Date().toISOString() });
    /* Émettre les permissions au Core pour mise à jour des droits d'accès */
    if (S.permissions) {
      emit('permissions-updated', { permissions: S.permissions, ts: new Date().toISOString() });
    }
  } catch(e) {
    toast('❌ Erreur sauvegarde', false);
  }
}
function discardChanges() {
  loadSettings();
  renderSection(currentSection);
  markClean();
  toast('↩️ Modifications annulées');
}

/* Collect values from current visible form */
function collectCurrentForm() {
  var inputs = document.querySelectorAll('[data-key]');
  inputs.forEach(function(el) {
    var key  = el.dataset.key;
    var sect = el.dataset.sect;
    if (!key || !sect || !S[sect]) return;
    var val = el.type === 'checkbox' ? el.checked : el.value;
    /* nested key support: "tax_tva.rate" */
    if (key.includes('.')) {
      var parts = key.split('.');
      if (S[sect][parts[0]]) S[sect][parts[0]][parts[1]] = el.type === 'checkbox' ? el.checked : (isNaN(val) ? val : parseFloat(val));
    } else {
      S[sect][key] = el.type === 'checkbox' ? val : (el.type === 'number' ? parseFloat(val) : val);
    }
  });
}

/* ── Toggle helper ───────────────────────────────────────── */
function toggleRow(label, desc, sect, key, val) {
  var id = 'tog_' + sect + '_' + key.replace('.','_');
  return '<div class="toggle-row">'
    + '<div class="toggle-info">'
    + '<div class="toggle-label">' + label + '</div>'
    + (desc ? '<div class="toggle-desc">' + desc + '</div>' : '')
    + '</div>'
    + '<label class="toggle"><input type="checkbox" id="' + id + '" data-sect="' + sect + '" data-key="' + key + '" '
    + (val ? 'checked' : '') + ' onchange="markDirty()">'
    + '<span class="toggle-slider"></span></label>'
    + '</div>';
}
function inputRow(label, hint, type, sect, key, val, placeholder) {
  var id = 'inp_' + sect + '_' + key.replace('.','_');
  return '<div class="form-row">'
    + '<label class="form-label" for="' + id + '">' + label + '</label>'
    + '<input class="form-input" id="' + id + '" type="' + (type||'text') + '"'
    + ' data-sect="' + sect + '" data-key="' + key + '" value="' + (val||'') + '"'
    + (placeholder ? ' placeholder="' + placeholder + '"' : '') + ' oninput="markDirty()">'
    + (hint ? '<div class="form-hint">' + hint + '</div>' : '')
    + '</div>';
}
function selectRow(label, sect, key, val, options) {
  var id = 'sel_' + sect + '_' + key;
  return '<div class="form-row">'
    + '<label class="form-label" for="' + id + '">' + label + '</label>'
    + '<select class="form-select" id="' + id + '" data-sect="' + sect + '" data-key="' + key + '" onchange="markDirty()">'
    + options.map(function(o){
        return '<option value="' + o.v + '"' + (o.v === val ? ' selected' : '') + '>' + o.l + '</option>';
      }).join('')
    + '</select></div>';
}

function sPermissions() {
  var p = S.permissions;
  var roles   = Object.keys(p);
  var modules = ['reservations','paiements','housekeeping','restaurant','finance','rh','settings','audit'];
  var mIcons  = {reservations:'🛏️',paiements:'💳',housekeeping:'🧹',restaurant:'🍽️',finance:'📊',rh:'👥',settings:'⚙️',audit:'🔍'};

  var table = '<div style="overflow-x:auto"><table class="perm-table"><thead><tr>'
    + '<th>Rôle</th>'
    + modules.map(function(m){ return '<th>' + mIcons[m] + '</th>'; }).join('')
    + '</tr></thead><tbody>'
    + roles.map(function(role){
        return '<tr><td>' + role.charAt(0).toUpperCase() + role.slice(1) + '</td>'
          + modules.map(function(mod){
              var checked = p[role][mod];
              return '<td><input type="checkbox" class="perm-check"'
                + ' data-role="' + role + '" data-mod="' + mod + '"'
                + (checked ? ' checked' : '')
                + ' onchange="onPermChange(this)">'
                + '</td>';
            }).join('')
          + '</tr>';
      }).join('')
    + '</tbody></table></div>';

  return page('🔐','Permissions & Accès','Contrôle d\'accès par rôle et module',
    '<div class="card"><div class="card-title">📋 <span>Matrice des permissions</span></div>'
    + '<div class="form-hint" style="margin-bottom:12px">Les changements sont appliqués immédiatement après enregistrement.</div>'
    + table + '</div>'
    + '<div class="card"><div class="card-title">👥 <span>Rôles disponibles</span></div>'
    + roles.map(function(r){
        var cnt = Object.values(p[r]).filter(Boolean).length;
        return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bg3);font-size:12px">'
          + '<span style="font-weight:600">' + r.charAt(0).toUpperCase() + r.slice(1) + '</span>'
          + '<span class="badge badge-acc">' + cnt + ' module(s)</span>'
          + '</div>';
      }).join('')
    + '</div>'
    + saveBtnRow()
  );
}
function onPermChange(el) {
  var role = el.dataset.role;
  var mod  = el.dataset.mod;
  if (S.permissions[role]) {
    S.permissions[role][mod] = el.checked;
    markDirty();
  }
}

/* ── Intégrations ────────────────────────────────────────── */
function sIntegrations() {
  var ints = [
    { id:'supabase',  icon:'🗄️',  name:'Supabase',          desc:'Base de données cloud — tables, auth, realtime',           status:'connected' },
    { id:'cinetpay',  icon:'📱',  name:'CinetPay',           desc:'Paiements mobiles — Orange Money, MTN MoMo',               status:'pending'   },
    { id:'whatsapp',  icon:'💬',  name:'WhatsApp Business',  desc:'Notifications et confirmations via WhatsApp',               status:'soon'      },
    { id:'smtp_email',icon:'📧',  name:'Email SMTP',         desc:'Envoi d\'emails transactionnels',                           status:'soon'      },
    { id:'booking',   icon:'🌐',  name:'Booking.com',        desc:'Synchronisation disponibilités et réservations',           status:'soon'      },
    { id:'airbnb',    icon:'🏠',  name:'Airbnb',             desc:'Synchronisation calendrier et tarifs',                     status:'soon'      },
  ];
  var statusLabel = { connected:'Connecté', pending:'En cours', soon:'Bientôt' };
  var statusClass = { connected:'int-connected', pending:'int-pending', soon:'int-soon' };

  return page('🔌','Intégrations API','Connexions aux services tiers et passerelles',
    ints.map(function(it){
      var st = S.integrations[it.id] ? S.integrations[it.id].status : 'soon';
      return '<div class="int-card">'
        + '<div class="int-icon">' + it.icon + '</div>'
        + '<div class="int-info">'
        + '<div class="int-name">' + it.name + '</div>'
        + '<div class="int-desc">' + it.desc + '</div>'
        + '<span class="int-status ' + statusClass[st] + '">' + statusLabel[st] + '</span>'
        + '<div class="int-actions">'
        + (st === 'connected'
          ? '<button class="btn btn-sm btn-secondary">⚙️ Configurer</button>'
          + '<button class="btn btn-sm btn-danger">🔌 Déconnecter</button>'
          : st === 'pending'
          ? '<button class="btn btn-sm btn-primary" onclick="toast(\'ℹ️ Vérifiez votre tableau de bord CinetPay\')">🔄 Finaliser</button>'
          : '<button class="btn btn-sm btn-secondary" onclick="toast(\'ℹ️ Disponible prochainement\')">🔔 M\'avertir</button>')
        + '</div></div></div>';
    }).join('')
  );
}

/* ── Système ─────────────────────────────────────────────── */

  return page('⚙️','Paramètres Système','Maintenance, sauvegardes et informations techniques',

    + '<div class="sys-row"><span class="sys-key">Version Veraluz OS</span><span class="sys-val">v2.0.0-beta</span></div>'
    + '<div class="sys-row"><span class="sys-key">Modules actifs</span><span class="sys-val">9 / 9</span></div>'
    + '<div class="sys-row"><span class="sys-key">Supabase Project</span><span class="sys-val">dfdmasejso…</span></div>'
    + '<div class="sys-row"><span class="sys-key">GitHub repo</span><span class="sys-val">ngams237/veraluz-os</span></div>'
    + '<div class="sys-row"><span class="sys-key">Dernière mise à jour</span><span class="sys-val">' + new Date().toLocaleDateString('fr-FR') + '</span></div>'
    + '<div class="sys-row"><span class="sys-key">Storage utilisé</span><span class="sys-val" id="storage-size">—</span></div>'
    + '</div>'
    + '<div class="card"><div class="card-title">💾 <span>Sauvegarde</span></div>'
    + '<div class="form-hint" style="margin-bottom:12px">Les paramètres sont sauvegardés localement. Exportez une copie pour les conserver en cas de réinitialisation.</div>'
    + '<div class="btn-row">'
    + '<button class="btn btn-primary" onclick="exportSettings()">📤 Exporter paramètres</button>'
    + '<button class="btn btn-secondary" onclick="importSettings()">📥 Importer</button>'
    + '</div></div>'
    + '<div class="card" style="border-color:rgba(239,68,68,.3)">'
    + '<div class="card-title" style="color:var(--red)">⚠️ <span>Zone dangereuse</span></div>'
    + '<div class="form-hint" style="margin-bottom:12px">Ces actions sont irréversibles. Procédez avec prudence.</div>'
    + '<div class="btn-row">'
    + '<button class="btn btn-danger" onclick="confirmReset()">🔄 Réinitialiser les paramètres</button>'
    + '<button class="btn btn-danger" onclick="confirmClearLogs()">🗑️ Vider les logs locaux</button>'
    + '</div></div>'
  );
}

/* ── Helpers ─────────────────────────────────────────────── */
function page(icon, title, sub, body) {
  return '<div class="page-header"><div class="page-title">' + icon + ' ' + title + '</div>'
    + '<div class="page-sub">' + sub + '</div></div>' + body;
}
function saveBtnRow() {
  return '<div class="btn-row"><button class="btn btn-primary" onclick="saveAll()">💾 Enregistrer</button>'
    + '<button class="btn btn-secondary" onclick="discardChanges()">↩️ Annuler</button></div>';
}

/* ── System actions ──────────────────────────────────────── */
function exportSettings() {
  var json = JSON.stringify(S, null, 2);
  var blob = new Blob([json],{type:'application/json'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = 'veraluz_settings_' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(url);
  toast('✅ Paramètres exportés');
}
function importSettings() {
  toast('ℹ️ Glissez votre fichier JSON ici (bientôt)');
}
function confirmReset() {
  showModal('⚠️ Réinitialiser les paramètres',
    'Cette action va effacer TOUS les paramètres personnalisés et revenir aux valeurs par défaut. Cette action est irréversible.',
    '<button class="btn btn-secondary" onclick="closeModal()">Annuler</button>'
    + '<button class="btn btn-danger" onclick="doReset()">Réinitialiser</button>'
  );
}
function doReset() {
  S = JSON.parse(JSON.stringify(DEFAULTS));
  localStorage.removeItem(LS_KEY);
  closeModal();
  renderSection(currentSection);
  markClean();
  toast('🔄 Paramètres réinitialisés');
  emit('settings-reset', {});
}
function confirmClearLogs() {
  showModal('🗑️ Vider les logs locaux',
    'Les logs stockés localement seront supprimés. Les données Supabase ne sont pas affectées.',
    '<button class="btn btn-secondary" onclick="closeModal()">Annuler</button>'
    + '<button class="btn btn-danger" onclick="doClearLogs()">Vider</button>'
  );
}
function doClearLogs() {
  var keys = Object.keys(localStorage).filter(function(k){ return k.startsWith('veraluz_'); });
  keys.forEach(function(k){ if (k !== LS_KEY) localStorage.removeItem(k); });
  closeModal();
  toast('🗑️ Logs locaux vidés (' + keys.length + ' entrées)');
  emit('logs-cleared', { count: keys.length });
}

/* ── Storage size display ────────────────────────────────── */
function updateStorageInfo() {
  try {
    var total = 0;
    Object.keys(localStorage).forEach(function(k){
      if (k.startsWith('veraluz_')) total += localStorage.getItem(k).length;
    });
    var el = document.getElementById('storage-size');
    if (el) el.textContent = (total / 1024).toFixed(1) + ' KB';
  } catch(e) {}
}

/* ── Main render ─────────────────────────────────────────── */
function renderSection(id) {
  var c = document.getElementById('content');
  var html = '';
  if      (id==='hotel')        html = sHotel();
  else if (id==='branding')     html = sBranding();
  else if (id==='chambres')     html = sChambres();
  else if (id==='tarifs')       html = sTarifs();
  else if (id==='devises')      html = sDevises();
  else if (id==='restaurant')   html = sRestaurant();
  else if (id==='notifs')       html = sNotifs();
  else if (id==='permissions')  html = sPermissions();
  else if (id==='integrations') html = sIntegrations();
  else if (id==='systeme')      html = sSysteme();
  c.innerHTML = html;
  if (id==='systeme') setTimeout(updateStorageInfo, 50);
}
</script>
