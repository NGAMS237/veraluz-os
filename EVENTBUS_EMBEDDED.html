<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Event Bus — Veraluz</title>
<style>
/* ── Reset & Tokens ──────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --acc:#22d3a5;--acc2:#1ba87f;
  --bg:#0f1117;--bg2:#161b24;--bg3:#1e2535;--bg4:#252d3d;
  --text:#e8eaf0;--text2:#8b95a8;--text3:#5a6478;
  --red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;
  --purple:#8b5cf6;--green:#10b981;--orange:#f97316;
  --pink:#ec4899;
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;}

/* ── Layout ──────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* ── Tab Bar ─────────────────────────────────────────────── */
#tabbar{display:flex;overflow-x:auto;gap:4px;padding:10px 12px 0;
  background:var(--bg2);border-bottom:1px solid var(--bg4);
  scrollbar-width:none;flex-shrink:0;}
#tabbar::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:7px 14px;border-radius:8px 8px 0 0;border:none;
  background:transparent;color:var(--text2);font-size:12px;font-weight:500;
  cursor:pointer;transition:all .15s;white-space:nowrap;}
.tab.active{background:var(--bg);color:var(--acc);border-bottom:2px solid var(--acc);}
.tab:hover:not(.active){background:var(--bg3);color:var(--text);}

/* ── Status bar ──────────────────────────────────────────── */
#statusbar{display:flex;align-items:center;gap:12px;padding:7px 14px;
  background:var(--bg2);border-bottom:1px solid var(--bg4);flex-shrink:0;
  font-size:11px;overflow-x:auto;scrollbar-width:none;}
#statusbar::-webkit-scrollbar{display:none;}
.sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap;color:var(--text2);}
.sb-val{font-weight:700;color:var(--text);}
.sb-live{display:flex;align-items:center;gap:5px;margin-left:auto;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);
  animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ── Content ─────────────────────────────────────────────── */
#content{flex:1;overflow-y:auto;padding:12px;
  padding-bottom:calc(12px + var(--safe-bot));}

/* ── Cards ───────────────────────────────────────────────── */
.card{background:var(--bg2);border:1px solid var(--bg4);border-radius:12px;
  padding:14px;margin-bottom:12px;}
.card-title{font-size:12px;font-weight:600;color:var(--text2);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;}
.card-title span{color:var(--text);}

/* ── KPI row ─────────────────────────────────────────────── */
.kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px;}
@media(min-width:480px){.kpi-row{grid-template-columns:repeat(4,1fr);}}
@media(min-width:768px){.kpi-row{grid-template-columns:repeat(6,1fr);}}
.kpi{background:var(--bg2);border:1px solid var(--bg4);border-radius:10px;
  padding:12px;position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c,var(--acc));}
.kpi-val{font-size:20px;font-weight:700;}
.kpi-lbl{font-size:10px;color:var(--text2);margin-top:3px;}

/* ── Event stream ────────────────────────────────────────── */
#stream-list{display:flex;flex-direction:column;gap:5px;max-height:420px;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--bg4) transparent;}
.ev-entry{background:var(--bg3);border:1px solid var(--bg4);border-radius:9px;
  padding:10px 12px;display:flex;align-items:flex-start;gap:10px;
  border-left:3px solid var(--c,var(--acc));animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.ev-icon{font-size:14px;flex-shrink:0;margin-top:1px;}
.ev-body{flex:1;min-width:0;}
.ev-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ev-source{font-size:11px;font-weight:700;color:var(--text);}
.ev-type{font-size:11px;font-family:monospace;color:var(--acc);background:rgba(34,211,165,.1);
  padding:1px 6px;border-radius:4px;}
.ev-time{font-size:10px;color:var(--text3);margin-left:auto;white-space:nowrap;}
.ev-payload{font-size:10px;color:var(--text2);margin-top:4px;font-family:monospace;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.ev-route{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap;}
.ev-target{font-size:9px;padding:1px 6px;border-radius:4px;
  background:rgba(59,130,246,.15);color:var(--blue);}

/* ── Pipe diagram ────────────────────────────────────────── */
.pipe-grid{display:grid;grid-template-columns:1fr 40px 1fr;gap:0;align-items:center;
  margin-bottom:10px;}
.pipe-left{background:var(--bg3);border:1px solid var(--bg4);border-radius:9px 0 0 9px;
  padding:10px 12px;}
.pipe-arrow{display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--acc);background:var(--bg4);}
.pipe-right{background:var(--bg3);border:1px solid var(--bg4);border-radius:0 9px 9px 0;
  padding:10px 12px;border-left:none;}
.pipe-name{font-size:11px;font-weight:600;color:var(--text);}
.pipe-desc{font-size:10px;color:var(--text2);margin-top:2px;}
.pipe-active{border-color:var(--acc)!important;background:rgba(34,211,165,.06)!important;}
.pipe-badge{display:inline-block;font-size:9px;padding:1px 6px;border-radius:10px;
  background:rgba(34,211,165,.15);color:var(--acc);margin-top:4px;font-weight:600;}

/* ── Subscription table ──────────────────────────────────── */
.sub-table{width:100%;border-collapse:collapse;font-size:12px;}
.sub-table th{padding:8px 10px;text-align:left;color:var(--text2);
  border-bottom:1px solid var(--bg4);font-size:10px;font-weight:600;text-transform:uppercase;}
.sub-table td{padding:8px 10px;border-bottom:1px solid var(--bg3);}
.sub-table tr:last-child td{border-bottom:none;}
.sub-table tr:hover td{background:var(--bg3);}
.mono{font-family:monospace;font-size:11px;color:var(--acc);}

/* ── Simulator ───────────────────────────────────────────── */
.sim-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
@media(min-width:600px){.sim-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.sim-grid{grid-template-columns:repeat(4,1fr);}}
.sim-btn{background:var(--bg3);border:1px solid var(--bg4);border-radius:9px;
  padding:12px;cursor:pointer;transition:all .15s;text-align:center;}
.sim-btn:hover{border-color:var(--acc);background:var(--bg4);}
.sim-btn:active{transform:scale(.97);}
.sim-icon{font-size:22px;margin-bottom:5px;}
.sim-name{font-size:11px;font-weight:600;color:var(--text);}
.sim-event{font-size:9px;color:var(--acc);font-family:monospace;margin-top:3px;}

/* ── Code block ──────────────────────────────────────────── */
.code-block{background:var(--bg);border:1px solid var(--bg4);border-radius:8px;
  padding:12px;font-family:monospace;font-size:11px;color:var(--acc);
  overflow-x:auto;white-space:pre;line-height:1.6;margin-bottom:10px;}
.code-comment{color:var(--text3);}
.code-key{color:var(--blue);}
.code-str{color:var(--orange);}

/* ── Doc section ─────────────────────────────────────────── */
.doc-module{display:flex;align-items:center;gap:8px;padding:8px 0;
  border-bottom:1px solid var(--bg3);font-size:12px;}
.doc-module:last-child{border-bottom:none;}
.doc-icon{font-size:16px;}
.doc-id{font-family:monospace;color:var(--acc);font-size:11px;}
.doc-events{font-size:10px;color:var(--text2);margin-top:2px;}

/* ── Toast ───────────────────────────────────────────────── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--bg3);border:1px solid var(--acc);color:var(--acc);
  padding:9px 18px;border-radius:10px;font-size:12px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;white-space:nowrap;}
#toast.show{opacity:1;}

/* ── Form elements ───────────────────────────────────────── */
.form-row{margin-bottom:10px;}
.form-label{font-size:11px;font-weight:500;color:var(--text2);margin-bottom:5px;display:block;}
.form-input,.form-select{width:100%;padding:8px 10px;border-radius:7px;
  border:1px solid var(--bg4);background:var(--bg3);color:var(--text);font-size:12px;}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--acc);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{padding:8px 18px;border-radius:7px;border:none;font-size:12px;
  font-weight:600;cursor:pointer;transition:all .15s;}
.btn-primary{background:var(--acc);color:#000;}
.btn-primary:hover{background:var(--acc2);}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--bg4);}
.btn-secondary:hover{background:var(--bg4);}

/* ── Two col ─────────────────────────────────────────────── */
@media(min-width:768px){
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .two-col .full{grid-column:1/-1;}
}
</style>
</head>
<body>
<div id="app">

  <!-- Tab Bar -->
  <div id="tabbar">
    <button class="tab active" onclick="goTab('stream')"     id="tab-stream">⚡ Flux live</button>
    <button class="tab"        onclick="goTab('routing')"    id="tab-routing">🔀 Routage</button>
    <button class="tab"        onclick="goTab('subs')"       id="tab-subs">📋 Subscriptions</button>
    <button class="tab"        onclick="goTab('simulator')"  id="tab-simulator">🧪 Simulateur</button>
    <button class="tab"        onclick="goTab('custom')"     id="tab-custom">⚙️ Règles custom</button>
    <button class="tab"        onclick="goTab('docs')"       id="tab-docs">📖 Docs API</button>
    <button class="tab"        onclick="goTab('durables')"   id="tab-durables">🗄️ Durables DB</button>
  </div>

  <!-- Status bar -->
  <div id="statusbar">
    <div class="sb-item">⚡ <span class="sb-val" id="sb-total">0</span> événements</div>
    <div class="sb-item">🔀 <span class="sb-val" id="sb-routes">0</span> routés</div>
    <div class="sb-item">❌ <span class="sb-val" id="sb-errors">0</span> erreurs</div>
    <div class="sb-item">📡 <span class="sb-val" id="sb-subs">0</span> subscriptions</div>
    <div class="sb-live"><div class="live-dot"></div> Bus actif</div>
  </div>

  <!-- Content -->
  <div id="content"></div>
</div>
<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   VERALUZ — EVENT BUS DASHBOARD v1.0
   Pub/Sub monitoring | Simulator | Routing rules | API Docs
   ═════════════════════════════════════════════════════════ */

var MODULE_ID = 'veraluz-eventbus';
var LS_KEY    = 'veraluz_event_log';
var currentTab = 'stream';
var _errorCount = 0;

/* ── Event Bus State ─────────────────────────────────────── */
var EVENTS = [];        /* live buffer (max 200) */
var CUSTOM_RULES = [];  /* user-defined routing rules */
var STATS = { total:0, routed:0, errors:0 };

/* ── Built-in Routing Rules ──────────────────────────────── */
var ROUTING_RULES = [
  {
    id:'R01', active:true,
    trigger:'reservation-created',
    from:'veraluz-reservations',
    targets:['veraluz-notifications','veraluz-audit','veraluz-finance'],
    desc:'Nouvelle réservation → Notification + Audit + Finance',
    icon:'🛏️', color:'var(--blue)'
  },
  {
    id:'R02', active:true,
    trigger:'checkout-completed',
    from:'veraluz-reservations',
    targets:['veraluz-housekeeping','veraluz-notifications','veraluz-audit'],
    desc:'Check-out → Housekeeping déclenché + Notification + Audit',
    icon:'🏠', color:'var(--orange)'
  },
  {
    id:'R03', active:true,
    trigger:'payment-validated',
    from:'veraluz-paiements',
    targets:['veraluz-finance','veraluz-notifications','veraluz-audit'],
    desc:'Paiement validé → Finance enregistrée + Notification + Audit',
    icon:'💳', color:'var(--green)'
  },
  {
    id:'R04', active:true,
    trigger:'employee-added',
    from:'veraluz-rh',
    targets:['veraluz-notifications','veraluz-audit'],
    desc:'Nouvel employé → Notification + Audit',
    icon:'👤', color:'var(--purple)'
  },
  {
    id:'R05', active:true,
    trigger:'cleaning-completed',
    from:'veraluz-housekeeping',
    targets:['veraluz-reservations','veraluz-notifications','veraluz-audit'],
    desc:'Chambre nettoyée → Réservations mises à jour + Notification + Audit',
    icon:'🧹', color:'var(--acc)'
  },
  {
    id:'R06', active:true,
    trigger:'order-placed',
    from:'veraluz-restaurant',
    targets:['veraluz-finance','veraluz-audit'],
    desc:'Commande restaurant → Finance + Audit',
    icon:'🍽️', color:'var(--orange)'
  },
  {
    id:'R07', active:true,
    trigger:'notification-count',
    from:'veraluz-notifications',
    targets:['veraluz-core'],
    desc:'Mise à jour badge topbar notifications',
    icon:'🔔', color:'var(--red)'
  },
  {
    id:'R08', active:true,
    trigger:'settings-updated',
    from:'veraluz-settings',
    targets:['veraluz-audit','veraluz-notifications'],
    desc:'Paramètres modifiés → Audit + Notification',
    icon:'⚙️', color:'var(--text2)'
  },
  {
    id:'R09', active:true,
    trigger:'module-ready',
    from:'*',
    targets:['veraluz-audit'],
    desc:'Tout module chargé → Audit enregistre le démarrage',
    icon:'🚀', color:'var(--green)'
  },
  {
    id:'R10', active:true,
    trigger:'*',
    from:'*',
    targets:['veraluz-eventbus'],
    desc:'Tous les événements → Dashboard Event Bus (monitoring)',
    icon:'⚡', color:'var(--acc)'
  },
];

/* ── Module registry ─────────────────────────────────────── */
var MODULES_REG = [
  { id:'veraluz-reservations', icon:'🛏️', label:'Réservations',
    emits:['reservation-created','checkin-completed','checkout-completed','reservation-cancelled'],
    listens:['notification-sent','payment-validated','cleaning-completed'] },
  { id:'veraluz-paiements', icon:'💳', label:'Paiements',
    emits:['payment-validated','payment-failed','refund-issued'],
    listens:['reservation-created','module-event'] },
  { id:'veraluz-housekeeping', icon:'🧹', label:'Housekeeping',
    emits:['cleaning-completed','maintenance-reported','room-ready'],
    listens:['checkout-completed','module-event'] },
  { id:'veraluz-restaurant', icon:'🍽️', label:'Restaurant',
    emits:['order-placed','order-completed','stock-alert'],
    listens:['module-event'] },
  { id:'veraluz-finance', icon:'📊', label:'Finance',
    emits:['report-generated','budget-alert'],
    listens:['payment-validated','order-placed','module-event'] },
  { id:'veraluz-rh', icon:'👥', label:'RH',
    emits:['employee-added','employee-updated','attendance-recorded','payroll-processed'],
    listens:['module-event'] },
  { id:'veraluz-notifications', icon:'🔔', label:'Notifications',
    emits:['notification-count','notification-sent'],
    listens:['module-event','reservation-created','payment-validated','checkout-completed'] },
  { id:'veraluz-analytics', icon:'📈', label:'Analytics',
    emits:['analytics-refreshed','analytics-export'],
    listens:['module-event'] },
  { id:'veraluz-audit', icon:'🔍', label:'Audit',
    emits:['audit-loaded','audit-export'],
    listens:['module-event','*'] },
  { id:'veraluz-settings', icon:'⚙️', label:'Settings',
    emits:['settings-updated','settings-reset'],
    listens:['module-event'] },
  { id:'veraluz-eventbus', icon:'⚡', label:'Event Bus',
    emits:['bus-stats','simulation-event'],
    listens:['*'] },
];

/* ── Event Bus ───────────────────────────────────────────── */
function emit(type, data) {
  try { window.parent.postMessage({ source: MODULE_ID, type: type, data: data || {} }, '*'); }
  catch(e) {}
}

window.addEventListener('message', function(ev) {
  if (!ev.data) return;
  var msg = ev.data;

  /* Receive events routed by Core */
  if (msg.source === 'veraluz-core') {
    if (msg.type === 'module-event' && msg.data) {
      ingestEvent({
        source: msg.data.originalSource || 'unknown',
        type:   msg.data.originalType   || 'event',
        data:   msg.data.payload        || {}
      });
    }
    if (msg.type === 'navigate-tab' && msg.data && msg.data.tab) goTab(msg.data.tab);
    if (msg.type === 'refresh') loadFromStorage();
    return;
  }

  /* Direct events (when EventBus is active module) */
  if (msg.source && msg.source !== 'veraluz-core') {
    ingestEvent({ source: msg.source, type: msg.type, data: msg.data || {} });
  }
});

window.addEventListener('load', function() {
  emit('module-ready', { module: 'eventbus', version: '1.0' });
  loadFromStorage();
  goTab('stream');
  setInterval(pollStorage, 2000);
});

/* ── Ingest & display event ──────────────────────────────── */
function ingestEvent(ev) {
  var entry = {
    id:     'ev_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    ts:     new Date().toISOString(),
    source: ev.source,
    type:   ev.type,
    data:   ev.data || {},
    routes: getTargets(ev.source, ev.type)
  };
  EVENTS.unshift(entry);
  if (EVENTS.length > 200) EVENTS.pop();
  STATS.total++;
  STATS.routed += entry.routes.length;

  /* Persist to localStorage */
  try {
    var stored = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    stored.unshift(entry);
    localStorage.setItem(LS_KEY, JSON.stringify(stored.slice(0, 300)));
  } catch(e) { _errorCount++; STATS.errors++; }

  updateStatusBar();
  if (currentTab === 'stream') prependToStream(entry);
}

function getTargets(source, type) {
  var targets = [];
  var allRules = ROUTING_RULES.concat(CUSTOM_RULES);
  allRules.forEach(function(r) {
    if (!r.active) return;
    var srcMatch  = r.from   === '*' || r.from   === source;
    var typeMatch = r.trigger === '*' || r.trigger === type;
    if (srcMatch && typeMatch) {
      r.targets.forEach(function(t) {
        if (targets.indexOf(t) === -1) targets.push(t);
      });
    }
  });
  return targets;
}

function loadFromStorage() {
  try {
    var stored = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    EVENTS = stored;
    STATS.total = stored.length;
    updateStatusBar();
  } catch(e) {}
}

var _lastStorageLen = 0;
function pollStorage() {
  try {
    var stored = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    if (stored.length !== _lastStorageLen) {
      _lastStorageLen = stored.length;
      EVENTS = stored;
      STATS.total = stored.length;
      updateStatusBar();
      if (currentTab === 'stream') renderStream();
    }
  } catch(e) {}
}

/* ── Status bar ──────────────────────────────────────────── */
function updateStatusBar() {
  var activeSubs = ROUTING_RULES.filter(function(r){ return r.active; }).length + CUSTOM_RULES.length;
  document.getElementById('sb-total').textContent  = STATS.total;
  document.getElementById('sb-routes').textContent = STATS.routed;
  document.getElementById('sb-errors').textContent = STATS.errors;
  document.getElementById('sb-subs').textContent   = activeSubs;
}

/* ── Tab nav ─────────────────────────────────────────────── */
function goTab(id) {
  currentTab = id;
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  var b = document.getElementById('tab-' + id);
  if (b) b.classList.add('active');
  renderTab(id);
}

/* ── Helpers ─────────────────────────────────────────────── */
function fmtTs(iso) {
  var d = new Date(iso), now = new Date();
  var diff = Math.floor((now - d) / 1000);
  if (diff < 60)   return diff + 's';
  if (diff < 3600) return Math.floor(diff/60) + 'min';
  return d.toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'});
}
function colorForSource(src) {
  var m = MODULES_REG.find(function(x){ return x.id === src; });
  var colors = {
    'veraluz-reservations':'var(--blue)','veraluz-paiements':'var(--green)',
    'veraluz-housekeeping':'var(--acc)', 'veraluz-restaurant':'var(--orange)',
    'veraluz-finance':'var(--purple)',   'veraluz-rh':'var(--pink)',
    'veraluz-notifications':'var(--red)','veraluz-analytics':'var(--blue)',
    'veraluz-audit':'var(--amber)',      'veraluz-settings':'var(--text2)',
    'veraluz-eventbus':'var(--acc)',     'veraluz-core':'var(--text3)'
  };
  return colors[src] || 'var(--acc)';
}
function iconForSource(src) {
  var m = MODULES_REG.find(function(x){ return x.id === src; });
  return m ? m.icon : '⚡';
}
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2500);
}

/* ══════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════ */

function entryHTML(e) {
  var c = colorForSource(e.source);
  var icon = iconForSource(e.source);
  var payload = '';
  try { payload = JSON.stringify(e.data).slice(0, 80); } catch(x) {}
  var routes = (e.routes || []).map(function(t){
    return '<span class="ev-target">' + t.replace('veraluz-','') + '</span>';
  }).join('');
  return '<div class="ev-entry" style="--c:' + c + '">'
    + '<div class="ev-icon">' + icon + '</div>'
    + '<div class="ev-body">'

function fireCustomEvent() {
  var source  = document.getElementById('custom-source').value;
  var type    = document.getElementById('custom-type').value.trim() || 'test-event';
  var payload = {};
  try { payload = JSON.parse(document.getElementById('custom-payload').value); } catch(e) {}
  ingestEvent({ source: source, type: type, data: payload });
  emit(type, Object.assign({ _simulated:true }, payload));
  toast('⚡ Événement custom déclenché');
  if (currentTab !== 'stream') goTab('stream');
}

  SIM_EVENTS.forEach(function(ev, i) {

/* ══════════════════════════════════════════════════════════════
   INFRA-OPS-1 — Onglet Durables DB (observabilité events/jobs)
   Appelle infra-health via le broker CORE (gérant uniquement).
   Aucune donnée sensible — read-only.
══════════════════════════════════════════════════════════════ */
function renderDurablesLoading() {
  return '<div style="padding:24px;text-align:center;color:var(--text2)">⏳ Chargement des données durables…</div>';
}

function loadDurables() {
  if (typeof window.parent.veraluzSecureRequest !== 'function') {
    var c = document.getElementById('content');
    if (c) c.innerHTML = '<div style="padding:24px;color:var(--red)">⚠️ Broker CORE non disponible (hors contexte iframe ?)</div>';
    return;
  }
  window.parent.veraluzSecureRequest('infra-health', {})
    .then(function(res) {
      var data = res && (res.body || res);
      var c = document.getElementById('content');
      if (!c || currentTab !== 'durables') return;
      if (!data || !data.ok) {
        if (data && data.error === 'access_denied') {
          c.innerHTML = '<div style="padding:24px;color:var(--amber)">🔒 Accès réservé aux gérants.</div>';
        } else {
          c.innerHTML = '<div style="padding:24px;color:var(--red)">⚠️ Erreur : ' + escH((data && data.error) || 'inconnue') + '</div>';
        }
        return;
      }
      c.innerHTML = renderDurables(data);
    })
    .catch(function(err) {
      var c = document.getElementById('content');
      if (c && currentTab === 'durables')
        c.innerHTML = '<div style="padding:24px;color:var(--red)">⚠️ Impossible de contacter infra-health : ' + escH(String(err)) + '</div>';
    });
}

function escH(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderDurables(data) {
  var jobs    = data.jobs   || {};
  var events  = data.events || {};
  var comms   = data.comms  || {};           // INFRA-COMMS-1A
  var counts  = jobs.counts || {};
  var commCounts = comms.counts || {};       // INFRA-COMMS-1A
  var recent  = jobs.recent || [];
  var dead    = jobs.dead   || [];
  var byType  = events.by_type || {};
  var recEvts = events.recent  || [];
  var checkedAt = data.checked_at ? new Date(data.checked_at).toLocaleTimeString('fr-FR') : '—';

  var hasDead = dead.length > 0;
  var STATUS_COLORS = {
    pending:'var(--amber)',processing:'var(--blue)',
    completed:'var(--green)',failed:'var(--orange)',dead:'var(--red)'
  };

  // KPI cards jobs
  var jobKpis = ['pending','processing','completed','failed','dead'].map(function(st) {
    var n = counts[st] || 0;
    var color = STATUS_COLORS[st] || 'var(--text)';
    return '<div class="kpi-card"><div style="font-size:12px;color:var(--text2);margin-bottom:2px;">' + st + '</div>'
      + '<div style="font-size:24px;font-weight:700;color:' + color + '">' + n + '</div></div>';
  }).join('');

  // Events by type
  var evTypeRows = Object.keys(byType).map(function(t) {
    return '<tr><td style="padding:6px 10px;font-size:12px;font-family:monospace;color:var(--acc)">' + escH(t)
      + '</td><td style="padding:6px 10px;font-size:13px;font-weight:700">' + byType[t] + '</td></tr>';
  }).join('') || '<tr><td colspan="2" style="padding:12px;text-align:center;color:var(--text3)">Aucun événement dans les 24h</td></tr>';

  // Dead jobs alert
  var deadAlert = hasDead
    ? '<div style="background:rgba(239,68,68,.12);border:1px solid var(--red);border-radius:8px;padding:12px 14px;margin-bottom:14px">'
      + '<div style="color:var(--red);font-weight:700;margin-bottom:6px">🚨 ' + dead.length + ' job(s) DEAD — intervention requise</div>'
      + dead.map(function(j) {
          return '<div style="font-size:11px;color:var(--text2);margin-bottom:3px">'
            + '• handler: <span style="color:var(--text);font-family:monospace">' + escH(j.handler) + '</span>'
            + ' | attempts: ' + escH(String(j.attempt))
            + ' | erreur: ' + escH(j.last_error || '—')
            + '</div>';
        }).join('')
      + '</div>'
    : '';

  // Recent jobs table (last 20)
  var jobRows = recent.slice(0, 20).map(function(j) {
    var color = STATUS_COLORS[j.status] || 'var(--text)';
    return '<tr>'
      + '<td style="padding:5px 8px;font-size:10px;font-family:monospace;color:var(--text2)">' + escH(String(j.id||'').slice(-8)) + '</td>'
      + '<td style="padding:5px 8px;font-size:11px;font-family:monospace">' + escH(j.handler||'') + '</td>'
      + '<td style="padding:5px 8px"><span style="background:rgba(255,255,255,.07);color:' + color + ';padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600">' + escH(j.status||'') + '</span></td>'
      + '<td style="padding:5px 8px;font-size:10px;color:var(--text2)">' + escH(String(j.attempt||0)) + '/' + 4 + '</td>'
      + '<td style="padding:5px 8px;font-size:10px;color:var(--text3)">' + (j.created_at ? fmtTs(j.created_at) : '—') + '</td>'
      + '</tr>';
  }).join('') || '<tr><td colspan="5" style="padding:16px;text-align:center;color:var(--text3)">Aucun job</td></tr>';

  // Recent events table (last 15) — colonnes canoniques : source + created_at
  var evRows = recEvts.slice(0, 15).map(function(e) {
    return '<tr>'
      + '<td style="padding:5px 8px;font-size:11px;font-family:monospace;color:var(--acc)">' + escH(e.event_type||'') + '</td>'
      + '<td style="padding:5px 8px;font-size:10px;color:var(--text2)">' + escH(e.source||'—') + '</td>'
      + '<td style="padding:5px 8px;font-size:10px;color:var(--text3)">' + (e.created_at ? fmtTs(e.created_at) : '—') + '</td>'
      + '</tr>';
  }).join('') || '<tr><td colspan="3" style="padding:16px;text-align:center;color:var(--text3)">Aucun événement récent</td></tr>';

  // INFRA-COMMS-1A — Comm jobs KPI (email_not_configured retiré)
  var commKpis = ['pending','processing','completed','failed','dead'].map(function(st) {
    var n = commCounts[st] || 0;
    var colorMap = { pending:'var(--amber)', processing:'var(--blue)', completed:'var(--green)', failed:'var(--orange)', dead:'var(--red)' };
    var color = colorMap[st] || 'var(--text)';
    return '<div class="kpi-card"><div style="font-size:11px;color:var(--text2);margin-bottom:2px">' + escH(st) + '</div>'
      + '<div style="font-size:22px;font-weight:700;color:' + color + '">' + n + '</div></div>';
  }).join('');

  // ── INFRA-SCHED-1 — Scheduler section ───────────────────────
  var sched       = data.scheduler || {};
  var alertLevel  = data.alert_level || 'OK';
  var alertColors = { OK:'var(--green)', WARNING:'var(--amber)', CRITICAL:'var(--red)' };
  var alertIcons  = { OK:'✅', WARNING:'⚠️', CRITICAL:'🚨' };
  var alertColor  = alertColors[alertLevel] || 'var(--text)';
  var alertIcon   = alertIcons[alertLevel]  || '❓';

  var lastRunAt = sched.last_run_at
    ? new Date(sched.last_run_at).toLocaleString('fr-FR')
    : 'Aucune run enregistrée';
  var ageMin = sched.age_ms !== null && sched.age_ms !== undefined
    ? Math.round(sched.age_ms / 60000)
    : null;
  var schedStatusColor = (sched.stale || sched.last_run_status === 'failed') ? 'var(--red)'
    : sched.last_run_status === 'partial' ? 'var(--amber)'
    : 'var(--green)';

  var oldestEv   = data.jobs && data.jobs.oldest_pending_age_ms !== null && data.jobs.oldest_pending_age_ms !== undefined
    ? Math.round(data.jobs.oldest_pending_age_ms / 1000) + 's'
    : '—';
  var oldestComm = data.comms && data.comms.oldest_pending_age_ms !== null && data.comms.oldest_pending_age_ms !== undefined
    ? Math.round(data.comms.oldest_pending_age_ms / 1000) + 's'
    : '—';

  var schedSection = ''
    + '<div style="background:rgba(255,255,255,.04);border:1px solid var(--border);border-left:4px solid ' + alertColor + ';border-radius:8px;padding:14px 16px;margin-bottom:14px">'
    +   '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
    +     '<span style="font-weight:700;font-size:13px">' + alertIcon + ' Infrastructure — ' + escH(alertLevel) + '</span>'
    +     '<button id="btn-run-scheduler" class="btn btn-secondary" style="font-size:11px;padding:4px 12px" onclick="runSchedulerNow()">'
    +       '▶ Exécuter maintenant'
    +     '</button>'
    +   '</div>'
    +   '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">'
    +     '<div><div style="font-size:10px;color:var(--text2);margin-bottom:2px">Dernier passage</div>'
    +       '<div style="font-size:12px;font-weight:600">' + escH(lastRunAt) + (ageMin !== null ? ' <span style="color:var(--text3);font-weight:400">il y a ' + ageMin + ' min</span>' : '') + '</div></div>'
    +     '<div><div style="font-size:10px;color:var(--text2);margin-bottom:2px">Statut · Durée</div>'
    +       '<div style="font-size:12px;font-weight:600;color:' + schedStatusColor + '">'
    +         escH(sched.last_run_status || '—') + (sched.last_run_duration_ms ? ' · ' + sched.last_run_duration_ms + 'ms' : '')
    +       '</div></div>'
    +     '<div><div style="font-size:10px;color:var(--text2);margin-bottom:2px">Plus ancien pending</div>'
    +       '<div style="font-size:12px">Events: <b>' + escH(oldestEv) + '</b> · Comms: <b>' + escH(oldestComm) + '</b></div></div>'
    +   '</div>'
    + '</div>';

  return ''
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'
    +   '<span style="font-size:13px;font-weight:700">🗄️ Événements durables (DB)</span>'
    +   '<span style="font-size:11px;color:var(--text3)">Actualisé à ' + checkedAt + ' · '
    +     '<button class="btn btn-secondary" style="font-size:10px;padding:3px 8px" onclick="loadDurables()">🔄 Rafraîchir</button>'
    +   '</span>'
    + '</div>'

    // ── Scheduler + alert ─────────────────────────────────────
    + schedSection
    + deadAlert

    + '<div style="font-size:11px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px">Event jobs — statuts</div>'
    + '<div class="kpi-grid" style="margin-bottom:16px">' + jobKpis + '</div>'

    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">'
    +   '<div class="card">'
    +     '<div class="card-title">📊 Événements (24h) par type</div>'
    +     '<table style="width:100%;border-collapse:collapse">'
    +       '<tbody>' + evTypeRows + '</tbody>'
    +     '</table>'
    +   '</div>'
    +   '<div class="card">'
    +     '<div class="card-title">⚡ Événements récents</div>'
    +     '<table style="width:100%;border-collapse:collapse">'
    +       '<thead><tr>'
    +         '<th style="padding:5px 8px;text-align:left;font-size:10px;color:var(--text2)">Type</th>'
    +         '<th style="padding:5px 8px;text-align:left;font-size:10px;color:var(--text2)">Source</th>'
    +         '<th style="padding:5px 8px;text-align:left;font-size:10px;color:var(--text2)">Il y a</th>'
    +       '</tr></thead>'
    +       '<tbody>' + evRows + '</tbody>'
    +     '</table>'
    +   '</div>'
    + '</div>'

    + '<div class="card">'
    +   '<div class="card-title">🔧 Jobs récents (event-worker)</div>'
    +   '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:500px">'
    +     '<thead><tr>'
    +       '<th style="padding:5px 8px;text-align:left;font-size:10px;color:var(--text2)">ID (fin)</th>'
    +       '<th style="padding:5px 8px;text-align:left;font-size:10px;color:var(--text2)">Handler</th>'
    +       '<th style="padding:5px 8px;text-align:left;font-size:10px;color:var(--text2)">Statut</th>'
    +       '<th style="padding:5px 8px;text-align:left;font-size:10px;color:var(--text2)">Tentatives</th>'
    +       '<th style="padding:5px 8px;text-align:left;font-size:10px;color:var(--text2)">Créé</th>'
    +     '</tr></thead>'
    +     '<tbody>' + jobRows + '</tbody>'
    +   '</table></div>'
    + '</div>'

    // ── INFRA-COMMS-1B — Section communications ───────────────
    + '<div style="border-top:1px solid var(--border);margin:18px 0 14px"></div>'
    + '<div style="font-size:12px;font-weight:700;color:var(--acc);margin-bottom:10px;text-transform:uppercase;letter-spacing:.6px">📨 Communications (comms-worker)</div>'

    + '<div style="font-size:11px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px">Jobs communications par statut</div>'
    + (Object.keys(commCounts).length > 0
        ? '<div class="kpi-grid" style="margin-bottom:16px">' + commKpis + '</div>'
        : '<div style="padding:12px;color:var(--text3);font-size:12px;margin-bottom:16px">Aucune donnée — comms-worker non encore exécuté.</div>'
      )

    + '</div>';
}

/* ── INFRA-SCHED-1 — Exécution manuelle via broker CORE ────────────────────
   Appelle infra-scheduler via veraluzSecureRequest (broker).
   infra-scheduler exige X-Veraluz-Session + settings.manage (RBAC serveur).
   Jamais d'appel direct à event-worker / comms-worker depuis le frontend.
─────────────────────────────────────────────────────────────────────────── */
var _schedulerRunning = false;
function runSchedulerNow() {
  if (_schedulerRunning) return;
  if (typeof window.parent.veraluzSecureRequest !== 'function') {
    alert('Broker CORE non disponible.');
    return;
  }
  var btn = document.getElementById('btn-run-scheduler');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Exécution…'; }
  _schedulerRunning = true;

  window.parent.veraluzSecureRequest('infra-scheduler', {})
    .then(function(res) {
      _schedulerRunning = false;
      var d = res && (res.body || res);
      if (btn) { btn.disabled = false; btn.textContent = '▶ Exécuter maintenant'; }
      if (d && d.ok) {
        // Rafraîchir l'onglet pour voir les nouvelles données
        loadDurables();
      } else {
        var err = (d && d.error) || 'Erreur inconnue';
        if (btn) {
          btn.style.color = 'var(--red)';
          btn.textContent = '✗ ' + err;
          setTimeout(function() {
            btn.style.color = '';
            btn.textContent = '▶ Exécuter maintenant';
          }, 4000);
        }
      }
    })
    .catch(function(err) {
      _schedulerRunning = false;
      if (btn) { btn.disabled = false; btn.textContent = '▶ Exécuter maintenant'; }
      console.error('[EVENTBUS] runSchedulerNow error:', err);
    });
}
</script>
</body>
</html>
