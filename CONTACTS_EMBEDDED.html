<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacts — Veraluz OS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* Top bar */
.topbar{background:#1e293b;border-bottom:1px solid #334155;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.topbar-title{font-weight:700;font-size:15px;color:#f1f5f9;white-space:nowrap;}
.search-box{flex:1;display:flex;align-items:center;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:0 10px;gap:8px;}
.search-box input{background:none;border:none;outline:none;color:#e2e8f0;font-size:13px;padding:7px 0;width:100%;}
.search-box input::placeholder{color:#64748b;}
.add-btn{background:#6366f1;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.add-btn:hover{background:#4f46e5;}

/* Tab bar */
.tabbar{background:#1e293b;border-bottom:1px solid #334155;padding:0 14px;display:flex;gap:2px;overflow-x:auto;flex-shrink:0;}
.tabbar::-webkit-scrollbar{height:3px;}
.tabbar::-webkit-scrollbar-thumb{background:#334155;border-radius:3px;}
.tab-btn{background:none;border:none;border-bottom:2px solid transparent;color:#94a3b8;font-size:12px;font-weight:500;padding:9px 12px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:all .15s;}
.tab-btn:hover{color:#e2e8f0;}
.tab-btn.active{color:#818cf8;border-bottom-color:#818cf8;}
.tab-btn.crm-tab.active{color:#f59e0b;border-bottom-color:#f59e0b;}
.tab-count{background:#1e2940;border-radius:10px;padding:1px 6px;font-size:10px;color:#64748b;}
.tab-btn.active .tab-count{background:#312e81;color:#a5b4fc;}

/* Main split layout */
.main{display:flex;flex:1;overflow:hidden;}

/* Left panel */
.panel-list{width:310px;min-width:220px;border-right:1px solid #1e293b;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
.bulk-bar{background:#312e81;padding:8px 14px;display:none;align-items:center;gap:8px;font-size:12px;color:#a5b4fc;flex-shrink:0;}
.bulk-btn{background:#4f46e5;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;}
.bulk-btn:hover{background:#4338ca;}
.bulk-btn.secondary{background:#1e1b4b;color:#a5b4fc;}
.contact-list{flex:1;overflow-y:auto;padding:8px;}
.contact-list::-webkit-scrollbar{width:4px;}
.contact-list::-webkit-scrollbar-thumb{background:#334155;border-radius:4px;}
.contact-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;transition:background .12s;border:1px solid transparent;}
.contact-item:hover{background:#1e293b;}
.contact-item.selected{background:#1e293b;border-color:#4f46e5;}
.contact-chk{width:14px;height:14px;accent-color:#6366f1;cursor:pointer;flex-shrink:0;}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0;}
.contact-info{flex:1;min-width:0;}
.contact-name{font-size:13px;font-weight:600;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.contact-sub{font-size:11px;color:#64748b;display:flex;align-items:center;gap:5px;margin-top:2px;overflow:hidden;}
.list-preview{font-size:11px;color:#475569;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.empty-state{text-align:center;color:#475569;padding:30px 16px;font-size:13px;}
.empty-cta{display:inline-block;margin-top:12px;background:#6366f1;color:#fff;border:none;border-radius:8px;padding:7px 16px;font-size:12px;cursor:pointer;}

/* Type badge */
.type-badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600;color:#fff;white-space:nowrap;}
.type-badge.lg{font-size:12px;padding:2px 10px;}

/* Right panel */
.panel-detail{flex:1;overflow-y:auto;background:#0f172a;}
.panel-detail::-webkit-scrollbar{width:5px;}
.panel-detail::-webkit-scrollbar-thumb{background:#334155;border-radius:5px;}
.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#475569;text-align:center;padding:40px;}
.detail-empty-icon{font-size:48px;margin-bottom:16px;opacity:.5;}
.detail-header{display:flex;align-items:center;gap:16px;padding:20px 20px 14px;}
.detail-avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;flex-shrink:0;}
.detail-meta{flex:1;}
.detail-name{font-size:20px;font-weight:700;color:#f1f5f9;margin-bottom:5px;}
.detail-contact-info{padding:0 20px 12px;display:flex;flex-wrap:wrap;gap:10px;}
.detail-field{font-size:13px;color:#94a3b8;display:flex;align-items:center;gap:6px;}
.detail-field a{color:#818cf8;text-decoration:none;}
.detail-field a:hover{text-decoration:underline;}
.detail-stats{display:flex;flex-wrap:wrap;gap:10px;padding:0 20px 16px;}
.stat-box{background:#1e293b;border-radius:10px;padding:10px 16px;min-width:90px;}
.stat-val{font-size:15px;font-weight:700;color:#f1f5f9;}
.stat-lbl{font-size:11px;color:#64748b;margin-top:2px;}
.detail-actions{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 16px;}
.act-btn{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;font-weight:500;transition:all .12s;}
.act-btn:hover{background:#334155;}
.act-btn.primary{background:#6366f1;border-color:#6366f1;color:#fff;}
.act-btn.primary:hover{background:#4f46e5;}
.act-btn.danger{background:#7f1d1d;border-color:#991b1b;color:#fca5a5;}
.act-btn.danger:hover{background:#991b1b;}
.sep{border-top:1px solid #1e293b;margin:0 20px 16px;}
.thread-section{padding:0 20px 20px;}
.thread-title{font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}
.thread-empty{color:#475569;font-size:13px;font-style:italic;}
.thread-entry{background:#1e293b;border-radius:10px;padding:12px 14px;margin-bottom:10px;border-left:3px solid #334155;}
.thread-entry.type-sent{border-left-color:#6366f1;}
.thread-entry.type-received{border-left-color:#059669;}
.thread-entry.type-note{border-left-color:#d97706;}
.thread-entry.type-call{border-left-color:#0891b2;}
.thread-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.thread-header span:first-child{font-size:12px;font-weight:600;color:#94a3b8;}
.thread-date{font-size:11px;color:#475569;}
.thread-subject{font-size:13px;font-weight:600;color:#f1f5f9;margin-bottom:4px;}
.thread-content{font-size:13px;color:#94a3b8;white-space:pre-wrap;word-break:break-word;}

/* ── CRM view ── */
.crm-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.crm-topbar{background:#1e293b;border-bottom:1px solid #334155;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;}
.crm-stats{display:flex;gap:16px;padding:12px 16px;background:#0f172a;border-bottom:1px solid #1e293b;flex-shrink:0;overflow-x:auto;}
.crm-stat{text-align:center;white-space:nowrap;}
.crm-stat-val{font-size:18px;font-weight:800;color:#f1f5f9;}
.crm-stat-lbl{font-size:11px;color:#64748b;}
.filter-panel{background:#1a2540;border-bottom:1px solid #1e293b;padding:12px 16px;display:none;flex-wrap:wrap;gap:12px;flex-shrink:0;}
.filter-panel.open{display:flex;}
.filter-group{display:flex;flex-direction:column;gap:4px;min-width:130px;}
.filter-group label{font-size:11px;color:#64748b;font-weight:600;}
.filter-group input,.filter-group select{background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:12px;padding:5px 8px;outline:none;}
.crm-toolbar{display:flex;align-items:center;gap:8px;margin-left:auto;}
.view-btn{background:#0f172a;border:1px solid #334155;border-radius:6px;color:#94a3b8;padding:5px 10px;font-size:12px;cursor:pointer;}
.view-btn.active{background:#312e81;border-color:#6366f1;color:#a5b4fc;}
.crm-content{flex:1;overflow-y:auto;padding:14px;}
.crm-content::-webkit-scrollbar{width:5px;}
.crm-content::-webkit-scrollbar-thumb{background:#334155;border-radius:5px;}

/* CRM cards */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.client-card{background:#1e293b;border-radius:12px;padding:16px;cursor:pointer;transition:all .15s;border:1px solid transparent;position:relative;}
.client-card:hover{border-color:#4f46e5;background:#253352;}
.client-card.selected-card{border-color:#6366f1;background:#1e1b4b;}
.card-chk{position:absolute;top:10px;right:10px;width:15px;height:15px;accent-color:#6366f1;cursor:pointer;}
.card-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;margin-bottom:10px;}
.card-name{font-size:13px;font-weight:700;color:#f1f5f9;margin-bottom:3px;}
.card-email{font-size:11px;color:#64748b;margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.card-stat{background:#0f172a;border-radius:6px;padding:5px 8px;text-align:center;}
.card-stat-val{font-size:12px;font-weight:700;color:#e2e8f0;}
.card-stat-lbl{font-size:10px;color:#475569;}

/* CRM compact list */
.compact-list{display:flex;flex-direction:column;gap:4px;}
.compact-item{display:flex;align-items:center;gap:10px;background:#1e293b;border-radius:8px;padding:9px 12px;cursor:pointer;transition:background .12s;border:1px solid transparent;}
.compact-item:hover{background:#253352;}
.compact-item.selected-card{border-color:#6366f1;}
.compact-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff;flex-shrink:0;}
.compact-name{flex:2;font-size:13px;font-weight:600;color:#f1f5f9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.compact-email{flex:3;font-size:12px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.compact-stays{flex:1;font-size:12px;color:#818cf8;text-align:right;white-space:nowrap;}
.compact-total{flex:1;font-size:12px;color:#34d399;text-align:right;white-space:nowrap;}

/* CRM table */
.crm-table{width:100%;border-collapse:collapse;font-size:12px;}
.crm-table th{background:#1e293b;color:#64748b;font-weight:600;padding:9px 12px;text-align:left;border-bottom:1px solid #334155;position:sticky;top:0;}
.crm-table td{padding:9px 12px;border-bottom:1px solid #1a2540;color:#e2e8f0;vertical-align:middle;}
.crm-table tr:hover td{background:#1e293b;}
.crm-table tr.selected-row td{background:#1e1b4b;}

/* CRM bulk bar */
.crm-bulk-bar{background:#312e81;padding:8px 16px;display:none;align-items:center;gap:10px;font-size:12px;color:#a5b4fc;flex-shrink:0;}
.crm-bulk-bar.open{display:flex;}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center;padding:20px;}
.modal{background:#1e293b;border-radius:14px;padding:24px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border:1px solid #334155;}
.modal-title{font-size:16px;font-weight:700;color:#f1f5f9;margin-bottom:16px;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
.modal-cancel{background:#0f172a;color:#94a3b8;border:1px solid #334155;border-radius:8px;padding:8px 20px;font-size:13px;cursor:pointer;}
.modal-confirm{background:#6366f1;color:#fff;border:none;border-radius:8px;padding:8px 20px;font-size:13px;font-weight:600;cursor:pointer;}
.modal-confirm:hover{background:#4f46e5;}
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:5px;}
.form-row input,.form-row select,.form-row textarea{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:9px 12px;color:#e2e8f0;font-size:13px;outline:none;font-family:inherit;}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:#6366f1;}
.form-row textarea{resize:vertical;}
.compose-dest{font-size:12px;color:#94a3b8;background:#0f172a;border-radius:8px;padding:10px 12px;margin-bottom:14px;word-break:break-all;}
.compose-type{display:flex;gap:20px;margin-bottom:14px;}
.radio-lbl{display:flex;align-items:center;gap:7px;font-size:13px;color:#94a3b8;cursor:pointer;}
.radio-lbl input{accent-color:#6366f1;}
.warn-box{background:#7c2d12;border:1px solid #9a3412;color:#fdba74;border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:10px;}
.info-box{background:#0c2340;border:1px solid #1e4d80;color:#93c5fd;border-radius:8px;padding:10px 12px;font-size:12px;}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#f1f5f9;border:1px solid #334155;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:500;z-index:9999;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.ok{border-color:#059669;color:#6ee7b7;}
.toast.warn{border-color:#d97706;color:#fcd34d;}
.toast.err{border-color:#dc2626;color:#fca5a5;}
.loading{display:flex;align-items:center;justify-content:center;height:80px;color:#475569;gap:10px;font-size:13px;}
.spinner{width:16px;height:16px;border:2px solid #334155;border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:640px){
  .panel-list{width:100%;max-height:38vh;border-right:none;border-bottom:1px solid #1e293b;}
  .main{flex-direction:column;}
  .cards-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">👥 Contacts</div>
  <div class="search-box">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" placeholder="Rechercher..." oninput="setSearch(this.value)" id="search-input">
  </div>
  <button class="add-btn" onclick="showAddMenu()">+ Ajouter</button>
</div>

<div class="tabbar" id="tabs"></div>

<div class="main" id="main-area">

  <!-- Annuaire view (default) -->
  <div id="view-annuaire" style="display:flex;flex:1;overflow:hidden;">
    <div class="panel-list">
      <div class="bulk-bar" id="bulk-bar"></div>
      <div class="contact-list" id="list">
        <div class="loading"><div class="spinner"></div> Chargement...</div>
      </div>
    </div>
    <div class="panel-detail" id="detail">
      <div class="detail-empty">
        <div class="detail-empty-icon">👥</div>
        <p>Sélectionnez un contact pour voir son profil et ses échanges</p>
      </div>
    </div>
  </div>

  <!-- CRM view -->
  <div id="view-crm" style="display:none;flex:1;flex-direction:column;overflow:hidden;" class="crm-panel">
    <div class="crm-topbar">
      <button class="view-btn active" id="vbtn-cards" onclick="setCrmMode('cards')">▦ Cartes</button>
      <button class="view-btn" id="vbtn-list" onclick="setCrmMode('list')">☰ Liste</button>
      <button class="view-btn" id="vbtn-table" onclick="setCrmMode('table')">⊞ Tableau</button>
      <button class="view-btn" id="filter-toggle" onclick="toggleFilters()">⚙ Filtres</button>
      <div class="crm-toolbar">
        <button class="view-btn" onclick="exportCSV()">↓ CSV</button>
        <button class="view-btn" style="background:#312e81;border-color:#6366f1;color:#a5b4fc;" onclick="crmBulkSend()">✉ Envoyer</button>
      </div>
    </div>

    <div class="crm-stats" id="crm-stats"></div>

    <div class="filter-panel" id="filter-panel">
      <div class="filter-group">
        <label>Dépenses min (XAF)</label>
        <input type="number" id="f-min" placeholder="0" oninput="renderCrm()">
      </div>
      <div class="filter-group">
        <label>Dépenses max (XAF)</label>
        <input type="number" id="f-max" placeholder="illimité" oninput="renderCrm()">
      </div>
      <div class="filter-group">
        <label>Nb séjours min</label>
        <input type="number" id="f-stays" placeholder="1" min="1" oninput="renderCrm()">
      </div>
      <div class="filter-group">
        <label>Dernière visite</label>
        <select id="f-period" onchange="renderCrm()">
          <option value="">Toutes périodes</option>
          <option value="30">Moins de 30 jours</option>
          <option value="90">Moins de 90 jours</option>
          <option value="180">Moins de 6 mois</option>
          <option value="365">Moins d'un an</option>
          <option value="365+">Plus d'un an</option>
        </select>
      </div>
      <div class="filter-group">
        <label>A un email</label>
        <select id="f-email" onchange="renderCrm()">
          <option value="">Tous</option>
          <option value="yes">Avec email</option>
          <option value="no">Sans email</option>
        </select>
      </div>
    </div>

    <div class="crm-bulk-bar" id="crm-bulk-bar">
      <span id="crm-sel-count">0 sélectionné(s)</span>
      <button class="bulk-btn" onclick="crmBulkSend()">✉ Envoyer</button>
      <button class="bulk-btn secondary" onclick="crmClearSel()">✕ Désélectionner</button>
    </div>

    <div class="crm-content" id="crm-content"></div>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="closeModal()">Annuler</button>
      <button class="modal-confirm" id="modal-confirm-btn" onclick="confirmModal()">Confirmer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var MODULE_ID = 'contacts';
var SB = 'https://dfdmasejsoibxrvubegu.supabase.co';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmZG1hc2Vqc29pYnhydnViZWd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDgzOTMsImV4cCI6MjA5MjI4NDM5M30.dEsafV84HFmFqU6Yi4xKydIbUlkIVE7QMRMpFt8kqXY';

var contacts = [];
var currentId = null;
var selectedIds = new Set();
var activeTab = 'tous';
var searchQ = '';
var crmMode = 'cards';
var crmSelected = new Set();

var TABS = [
  {id:'tous',label:'Tous'},
  {id:'client',label:'Clients'},
  {id:'crm',label:'CRM Clients',crm:true},
  {id:'employee',label:'Employés'},
  {id:'prestataire',label:'Prestataires'},
  {id:'fournisseur',label:'Fournisseurs'},
  {id:'autre',label:'Autres'}
];

/* ── Thread helpers ── */
function threadKey(id){ return 'vz_thread_'+id; }
function getThread(id){try{return JSON.parse(localStorage.getItem(threadKey(id))||'[]');}catch(e){return[];}}
function saveThread(id,t){localStorage.setItem(threadKey(id),JSON.stringify(t));}
function addThreadEntry(id,entry){
  var t=getThread(id);
  entry.id='t'+Date.now()+Math.random().toString(36).slice(2,5);
  entry.date=entry.date||new Date().toISOString();
  t.push(entry); saveThread(id,t);
}

/* ── Data loading ── */
async function loadAll(){
  contacts=[];

  // 1. Clients from localStorage cache
  try{
    var cache=JSON.parse(localStorage.getItem('vlz_cache_rez')||'[]');
    var byEmail={};
    cache.forEach(function(r){
      var email=(r.guest_email||'').toLowerCase().trim();
      if(!email) return;
      if(!byEmail[email]) byEmail[email]={
        id:'client_'+email.replace(/[^a-z0-9]/g,'_'),
        type:'client',name:r.guest_name||email,email:email,
        phone:r.guest_phone||'',count:0,total:0,lastDate:''
      };
      var c=byEmail[email]; c.count++;
      c.total+=(parseFloat(r.total_price)||0);
      var d=r.check_in||r.created_at||'';
      if(d>c.lastDate){c.lastDate=d;if(r.guest_name)c.name=r.guest_name;}
    });
    contacts=contacts.concat(Object.values(byEmail));
  }catch(e){}

  // 2. Clients from Supabase (merge)
  try{
    var r1=await fetch(SB+'/rest/v1/veraluz_reservations?select=guest_name,guest_email,guest_phone,total_price,check_in&order=check_in.desc&limit=1000',
      {headers:{apikey:KEY,'Authorization':'Bearer '+KEY}});
    if(r1.ok){
      var rows=await r1.json();
      var idx={};
      contacts.filter(function(c){return c.type==='client';}).forEach(function(c){idx[c.email]=c;});
      rows.forEach(function(r){
        var email=(r.guest_email||'').toLowerCase().trim();
        if(!email)return;
        if(!idx[email]){
          var nc={id:'client_'+email.replace(/[^a-z0-9]/g,'_'),type:'client',
            name:r.guest_name||email,email:email,phone:r.guest_phone||'',
            count:1,total:parseFloat(r.total_price)||0,lastDate:r.check_in||''};
          idx[email]=nc; contacts.push(nc);
        } else {
          var ex=idx[email];
          if(!ex._sbm){ex.count=0;ex.total=0;ex._sbm=true;}
          ex.count++; ex.total+=(parseFloat(r.total_price)||0);
          var d=r.check_in||'';
          if(d>ex.lastDate){ex.lastDate=d;if(r.guest_name)ex.name=r.guest_name;}
        }
      });
    }
  }catch(e){}

  // 3. Employees — fixed columns (no department)
  try{
    var r2=await fetch(SB+'/rest/v1/veraluz_employees?select=id,full_name,email,phone,role,team_id,status,contract_type&order=full_name.asc',
      {headers:{apikey:KEY,'Authorization':'Bearer '+KEY}});
    if(r2.ok){
      var emps=await r2.json();
      emps.forEach(function(e){
        contacts.push({
          id:'emp_'+e.id,type:'employee',
          name:e.full_name||'Employé',email:e.email||'',phone:e.phone||'',
          role:e.role||'',team:e.team_id||'',status:e.status||'',contract:e.contract_type||''
        });
      });
    }
  }catch(err){console.warn('Employees load error:',err);}

  // 4. Manual contacts
  try{
    var manual=JSON.parse(localStorage.getItem('vz_contacts_manual')||'[]');
    contacts=contacts.concat(manual);
  }catch(e){}

  // 5. Seed threads from email log
  try{
    var log=JSON.parse(localStorage.getItem('vz_email_log')||'[]');
    log.forEach(function(entry){
      if(!entry.to_email)return;
      var email=entry.to_email.toLowerCase();
      var c=contacts.find(function(x){return (x.email||'').toLowerCase()===email;});
      if(!c)return;
      var t=getThread(c.id);
      if(!t.some(function(te){return te._lid===entry.id;})){
        addThreadEntry(c.id,{type:'sent',subject:entry.subject||'Email',
          content:entry.preview||entry.subject||'',_lid:entry.id,
          date:entry.date||entry.sent_at||new Date().toISOString()});
      }
    });
  }catch(e){}

  render();
}

/* ── Helpers ── */
function avatarColor(n){
  var c=['#6366f1','#0891b2','#059669','#d97706','#dc2626','#7c3aed','#db2777','#ea580c'];
  var i=0; for(var j=0;j<(n||'').length;j++)i+=(n||'').charCodeAt(j);
  return c[i%c.length];
}
function avatarInitials(n){
  var p=(n||'?').trim().split(/\s+/);
  return((p[0][0]||'')+(p[1]?p[1][0]:'')).toUpperCase()||'?';
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function formatDate(iso){
  if(!iso)return'';
  try{return new Date(iso).toLocaleDateString('fr-CA',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
  catch(e){return iso.slice(0,16).replace('T',' ');}
}
function typeLabel(t){return{client:'Client',employee:'Employé',prestataire:'Prestataire',fournisseur:'Fournisseur',autre:'Autre'}[t]||t;}
function typeBadgeColor(t){return{client:'#6366f1',employee:'#059669',prestataire:'#d97706',fournisseur:'#0891b2',autre:'#6b7280'}[t]||'#6b7280';}
function fmtXAF(v){try{return parseFloat(v||0).toLocaleString('fr-CA',{style:'currency',currency:'XAF',maximumFractionDigits:0});}catch(e){return v+'F';}}

/* ── Filtering ── */
function filteredContacts(){
  var list=contacts.slice();
  if(activeTab!=='tous'&&activeTab!=='crm') list=list.filter(function(c){return c.type===activeTab;});
  if(activeTab==='crm') list=list.filter(function(c){return c.type==='client';});
  if(searchQ){
    var q=searchQ.toLowerCase();
    list=list.filter(function(c){
      return(c.name||'').toLowerCase().includes(q)||(c.email||'').toLowerCase().includes(q)||(c.phone||'').includes(q)||(c.role||'').toLowerCase().includes(q);
    });
  }
  list.sort(function(a,b){return(a.name||'').localeCompare(b.name||'','fr');});
  return list;
}

function filteredCrm(){
  var list=filteredContacts();
  var minD=parseFloat(document.getElementById('f-min')&&document.getElementById('f-min').value||0)||0;
  var maxD=parseFloat(document.getElementById('f-max')&&document.getElementById('f-max').value||'')||Infinity;
  var minS=parseInt(document.getElementById('f-stays')&&document.getElementById('f-stays').value||1)||0;
  var period=(document.getElementById('f-period')||{}).value||'';
  var emailF=(document.getElementById('f-email')||{}).value||'';
  var now=Date.now();

  list=list.filter(function(c){
    if((c.total||0)<minD)return false;
    if((c.total||0)>maxD)return false;
    if((c.count||0)<minS)return false;
    if(emailF==='yes'&&!c.email)return false;
    if(emailF==='no'&&c.email)return false;
    if(period&&c.lastDate){
      var daysAgo=(now-new Date(c.lastDate).getTime())/86400000;
      if(period==='365+'&&daysAgo<=365)return false;
      if(period!=='365+'&&daysAgo>parseInt(period))return false;
    }
    return true;
  });
  return list;
}

/* ── Render ── */
function render(){
  renderTabs();
  if(activeTab==='crm'){
    document.getElementById('view-annuaire').style.display='none';
    document.getElementById('view-crm').style.display='flex';
    renderCrm();
  } else {
    document.getElementById('view-annuaire').style.display='flex';
    document.getElementById('view-crm').style.display='none';
    renderList();
    if(currentId){var c=contacts.find(function(x){return x.id===currentId;});if(c)renderDetail(c);else renderDetailEmpty();}
    else renderDetailEmpty();
  }
}

function renderTabs(){
  var counts={tous:contacts.length,crm:contacts.filter(function(c){return c.type==='client';}).length};
  TABS.slice(1).forEach(function(t){if(!t.crm)counts[t.id]=0;});
  contacts.forEach(function(c){if(counts[c.type]!==undefined)counts[c.type]++;else counts[c.type]=1;});
  document.getElementById('tabs').innerHTML=TABS.map(function(t){
    var active=activeTab===t.id?' active':'';
    var crmc=t.crm?' crm-tab':'';
    var badge=t.crm?'⭐ ':'';
    return'<button class="tab-btn'+active+crmc+'" onclick="setTab(\''+t.id+'\')">'+badge+t.label
      +'<span class="tab-count">'+(counts[t.id]||0)+'</span></button>';
  }).join('');
}

function renderList(){
  var list=filteredContacts();
  var el=document.getElementById('list');
  if(!list.length){
    var typeMsg={
      prestataire:'Aucun prestataire. Cliquez sur + Ajouter pour en créer un.',
      fournisseur:'Aucun fournisseur. Cliquez sur + Ajouter pour en créer un.',
      autre:'Aucun contact. Cliquez sur + Ajouter pour en créer un.',
      employee:'Aucun employé chargé.',
      client:'Aucun client trouvé.'
    };
    var msg=typeMsg[activeTab]||'Aucun contact trouvé.';
    var showBtn=(activeTab==='prestataire'||activeTab==='fournisseur'||activeTab==='autre');
    el.innerHTML='<div class="empty-state">'+msg+(showBtn?'<br><button class="empty-cta" onclick="showAddMenu()">+ Ajouter un '+typeLabel(activeTab)+'</button>':'')+'</div>';
    renderBulkBar(); return;
  }
  el.innerHTML=list.map(function(c){
    var active=currentId===c.id?' selected':'';
    var checked=selectedIds.has(c.id)?' checked':'';
    var color=avatarColor(c.name);
    var ini=avatarInitials(c.name);
    var thread=getThread(c.id);
    var last=thread.length?thread[thread.length-1]:null;
    var badge='<span class="type-badge" style="background:'+typeBadgeColor(c.type)+'">'+typeLabel(c.type)+'</span>';
    var preview=last?'<div class="list-preview">'+esc((last.content||last.subject||'').slice(0,52))+'</div>':'';
    return'<div class="contact-item'+active+'" onclick="selectContact(\''+esc(c.id)+'\')"><input type="checkbox" class="contact-chk"'+checked+' onclick="event.stopPropagation();toggleSelect(\''+esc(c.id)+'\')">'
      +'<div class="avatar" style="background:'+color+'">'+esc(ini)+'</div>'
      +'<div class="contact-info"><div class="contact-name">'+esc(c.name)+'</div>'
      +'<div class="contact-sub">'+badge+(c.email?' '+esc(c.email):'')+'</div>'+preview+'</div></div>';
  }).join('');
  renderBulkBar();
}

function renderBulkBar(){
  var bar=document.getElementById('bulk-bar');
  if(!selectedIds.size){bar.style.display='none';return;}
  bar.style.display='flex';
  bar.innerHTML='<span>'+selectedIds.size+' sélectionné(s)</span>'
    +'<button class="bulk-btn" onclick="openCompose(Array.from(selectedIds),contacts)">✉ Envoyer</button>'
    +'<button class="bulk-btn secondary" onclick="selectedIds.clear();renderList()">✕</button>';
}

function renderDetailEmpty(){
  document.getElementById('detail').innerHTML='<div class="detail-empty"><div class="detail-empty-icon">👥</div><p>Sélectionnez un contact pour voir son profil et ses échanges</p></div>';
}

function renderDetail(c){
  var color=avatarColor(c.name);
  var ini=avatarInitials(c.name);
  var thread=getThread(c.id);

  var statsHtml='';
  if(c.type==='client'){
    statsHtml='<div class="detail-stats">'
      +'<div class="stat-box"><div class="stat-val">'+(c.count||0)+'</div><div class="stat-lbl">Séjours</div></div>'
      +'<div class="stat-box"><div class="stat-val">'+fmtXAF(c.total)+'</div><div class="stat-lbl">Total dépensé</div></div>'
      +(c.lastDate?'<div class="stat-box"><div class="stat-val">'+(c.lastDate||'').slice(0,7)+'</div><div class="stat-lbl">Dernier séjour</div></div>':'')
      +'</div>';
  } else if(c.type==='employee'){
    statsHtml='<div class="detail-stats">'
      +(c.role?'<div class="stat-box"><div class="stat-val">'+esc(c.role.replace(/_/g,' '))+'</div><div class="stat-lbl">Rôle</div></div>':'')
      +(c.contract?'<div class="stat-box"><div class="stat-val">'+esc(c.contract)+'</div><div class="stat-lbl">Contrat</div></div>':'')
      +(c.status?'<div class="stat-box"><div class="stat-val">'+esc(c.status)+'</div><div class="stat-lbl">Statut</div></div>':'')
      +'</div>';
  }

  var icons={sent:'📤',received:'📥',note:'📝',call:'📞'};
  var labels={sent:'Envoyé',received:'Reçu',note:'Note',call:'Appel'};
  var threadHtml=thread.length
    ?thread.slice().reverse().map(function(e){
      return'<div class="thread-entry type-'+esc(e.type)+'">'
        +'<div class="thread-header"><span>'+(icons[e.type]||'💬')+' '+(labels[e.type]||e.type)+'</span><span class="thread-date">'+formatDate(e.date)+'</span></div>'
        +(e.subject?'<div class="thread-subject">'+esc(e.subject)+'</div>':'')
        +'<div class="thread-content">'+esc(e.content||'')+'</div></div>';
    }).join('')
    :'<div class="thread-empty">Aucun échange enregistré pour ce contact.</div>';

  var canDelete=c.type==='prestataire'||c.type==='fournisseur'||c.type==='autre';

  document.getElementById('detail').innerHTML=
    '<div class="detail-header"><div class="detail-avatar" style="background:'+color+'">'+esc(ini)+'</div>'
    +'<div class="detail-meta"><div class="detail-name">'+esc(c.name)+'</div>'
    +'<span class="type-badge lg" style="background:'+typeBadgeColor(c.type)+'">'+typeLabel(c.type)+'</span></div></div>'
    +'<div class="detail-contact-info">'
      +(c.email?'<div class="detail-field">✉ <a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a></div>':'')
      +(c.phone?'<div class="detail-field">📞 '+esc(c.phone)+'</div>':'')
      +(c.notes?'<div class="detail-field">📝 '+esc(c.notes)+'</div>':'')
    +'</div>'
    +statsHtml
    +'<div class="detail-actions">'
      +(c.email?'<button class="act-btn primary" onclick="openCompose([\''+esc(c.id)+'\'],contacts)">✉ Envoyer</button>':'')
      +'<button class="act-btn" onclick="openNote(\''+esc(c.id)+'\')">📝 Note</button>'
      +'<button class="act-btn" onclick="openCall(\''+esc(c.id)+'\')">📞 Appel</button>'
      +'<button class="act-btn" onclick="openReceived(\''+esc(c.id)+'\')">📥 Réponse reçue</button>'
      +(canDelete?'<button class="act-btn danger" onclick="deleteManual(\''+esc(c.id)+'\')">🗑</button>':'')
    +'</div>'
    +'<div class="sep"></div>'
    +'<div class="thread-section"><div class="thread-title">Échanges ('+thread.length+')</div>'
    +'<div>'+threadHtml+'</div></div>';
}
