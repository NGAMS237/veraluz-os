<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Analytics — Veraluz</title>
<style>
/* ── Reset & Tokens ──────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --acc:#22d3a5;--acc2:#1ba87f;--acc3:#16866a;
  --bg:#0f1117;--bg2:#161b24;--bg3:#1e2535;--bg4:#252d3d;
  --text:#e8eaf0;--text2:#8b95a8;--text3:#5a6478;
  --red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;--purple:#8b5cf6;
  --green:#10b981;--orange:#f97316;--pink:#ec4899;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;}

/* ── Module Layout ───────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* ── Tab Bar ─────────────────────────────────────────────── */
#tabbar{
  display:flex;overflow-x:auto;gap:4px;padding:10px 12px 0;
  background:var(--bg2);border-bottom:1px solid var(--bg4);
  scrollbar-width:none;flex-shrink:0;
}
#tabbar::-webkit-scrollbar{display:none;}
.tab{
  flex-shrink:0;padding:7px 14px;border-radius:8px 8px 0 0;border:none;
  background:transparent;color:var(--text2);font-size:12px;font-weight:500;
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.tab.active{background:var(--bg);color:var(--acc);border-bottom:2px solid var(--acc);}
.tab:hover:not(.active){background:var(--bg3);color:var(--text);}

/* ── Filter Bar ──────────────────────────────────────────── */
#filterbar{
  display:flex;gap:8px;padding:10px 14px;background:var(--bg2);
  border-bottom:1px solid var(--bg4);align-items:center;flex-shrink:0;
  overflow-x:auto;scrollbar-width:none;
}
#filterbar::-webkit-scrollbar{display:none;}
.flt-select{
  padding:5px 10px;border-radius:7px;border:1px solid var(--bg4);
  background:var(--bg3);color:var(--text);font-size:12px;cursor:pointer;
}
.flt-btn{
  padding:5px 12px;border-radius:7px;border:1px solid var(--bg4);
  background:var(--bg3);color:var(--text2);font-size:12px;cursor:pointer;
  white-space:nowrap;transition:all .15s;
}
.flt-btn:hover,.flt-btn.active{background:var(--acc);color:#000;border-color:var(--acc);}
.flt-spacer{margin-left:auto;}
.refresh-btn{
  padding:5px 10px;border-radius:7px;border:none;
  background:var(--acc);color:#000;font-size:13px;cursor:pointer;font-weight:600;
}

/* ── Content ─────────────────────────────────────────────── */
#content{flex:1;overflow-y:auto;padding:14px;padding-bottom:calc(14px + var(--safe-bot));}

/* ── KPI Cards ───────────────────────────────────────────── */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
@media(min-width:600px){.kpi-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
@media(min-width:1200px){.kpi-grid{grid-template-columns:repeat(6,1fr);}}
.kpi{background:var(--bg2);border:1px solid var(--bg4);border-radius:12px;padding:14px;position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c,var(--acc));}
.kpi-icon{font-size:20px;margin-bottom:6px;}
.kpi-val{font-size:22px;font-weight:700;color:var(--text);line-height:1;}
.kpi-label{font-size:11px;color:var(--text2);margin-top:4px;}
.kpi-delta{font-size:11px;margin-top:6px;display:flex;align-items:center;gap:3px;}
.delta-up{color:var(--green);}
.delta-dn{color:var(--red);}
.delta-neu{color:var(--text2);}

/* ── Section ─────────────────────────────────────────────── */
.section{background:var(--bg2);border:1px solid var(--bg4);border-radius:12px;padding:16px;margin-bottom:14px;}
.section-title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:8px;}
.section-title span{color:var(--text);}

/* ── SVG Chart ───────────────────────────────────────────── */
.chart-wrap{width:100%;overflow:hidden;}
.chart-wrap svg{width:100%;display:block;}
.chart-label{font-size:10px;fill:var(--text2);}
.chart-value{font-size:10px;fill:var(--text);font-weight:600;}
.chart-line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.chart-area{opacity:.15;}
.chart-dot{r:4;}

/* ── Bar Chart ───────────────────────────────────────────── */
.bar-chart{display:flex;gap:6px;align-items:flex-end;height:120px;margin-top:8px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.bar-val{font-size:9px;color:var(--text2);}
.bar{width:100%;border-radius:4px 4px 0 0;min-height:4px;transition:height .3s;}
.bar-lbl{font-size:9px;color:var(--text3);text-align:center;word-break:keep-all;}

/* ── Donut Chart ─────────────────────────────────────────── */
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.donut-legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:120px;}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.legend-val{margin-left:auto;font-weight:600;color:var(--text);}

/* ── Table ───────────────────────────────────────────────── */
.data-table{width:100%;border-collapse:collapse;font-size:12px;}
.data-table th{padding:8px 10px;text-align:left;color:var(--text2);border-bottom:1px solid var(--bg4);font-weight:500;font-size:11px;text-transform:uppercase;}
.data-table td{padding:8px 10px;border-bottom:1px solid var(--bg3);color:var(--text);}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:var(--bg3);}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;}
.badge-green{background:rgba(16,185,129,.15);color:var(--green);}
.badge-amber{background:rgba(245,158,11,.15);color:var(--amber);}
.badge-red{background:rgba(239,68,68,.15);color:var(--red);}
.badge-blue{background:rgba(59,130,246,.15);color:var(--blue);}

/* ── Progress bar ────────────────────────────────────────── */
.prog-wrap{margin-bottom:12px;}
.prog-head{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px;}
.prog-bar{height:8px;background:var(--bg4);border-radius:4px;overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;transition:width .5s;}

/* ── Metric Row ──────────────────────────────────────────── */
.metric-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bg3);}
.metric-row:last-child{border-bottom:none;}
.metric-lbl{font-size:12px;color:var(--text2);}
.metric-val{font-size:13px;font-weight:600;}

/* ── Export ──────────────────────────────────────────────── */
.export-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:600px){.export-grid{grid-template-columns:repeat(3,1fr);}}
.export-card{background:var(--bg3);border:1px solid var(--bg4);border-radius:10px;padding:16px;cursor:pointer;transition:all .15s;text-align:center;}
.export-card:hover{border-color:var(--acc);background:var(--bg4);}
.export-icon{font-size:28px;margin-bottom:8px;}
.export-name{font-size:12px;font-weight:600;color:var(--text);}
.export-desc{font-size:10px;color:var(--text2);margin-top:4px;}
.export-btn-row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
.btn-primary{padding:10px 24px;border-radius:8px;border:none;background:var(--acc);color:#000;font-weight:600;font-size:13px;cursor:pointer;transition:all .15s;}
.btn-primary:hover{background:var(--acc2);}
.btn-secondary{padding:10px 24px;border-radius:8px;border:1px solid var(--bg4);background:var(--bg3);color:var(--text);font-size:13px;cursor:pointer;transition:all .15s;}
.btn-secondary:hover{background:var(--bg4);}

/* ── Toast ───────────────────────────────────────────────── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--bg3);border:1px solid var(--bg4);color:var(--text);
  padding:10px 20px;border-radius:10px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;}
#toast.show{opacity:1;}

/* ── Two-col layout for big screens ─────────────────────── */
@media(min-width:768px){
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .two-col .full{grid-column:1/-1;}
}

/* ── Loading ─────────────────────────────────────────────── */
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--text2);font-size:13px;gap:10px;}
.spin{width:18px;height:18px;border:2px solid var(--bg4);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app">

  <!-- Tab Bar -->
  <div id="tabbar">
    <button class="tab active" onclick="goTab('dashboard')" id="tab-dashboard">📊 Dashboard</button>
    <button class="tab" onclick="goTab('occupation')" id="tab-occupation">🏨 Occupation</button>
    <button class="tab" onclick="goTab('revenus')"    id="tab-revenus">💰 Revenus</button>
    <button class="tab" onclick="goTab('restaurant')" id="tab-restaurant">🍽️ Restaurant</button>
    <button class="tab" onclick="goTab('depenses')"   id="tab-depenses">💸 Dépenses</button>
    <button class="tab" onclick="goTab('cashflow')"   id="tab-cashflow">📈 Cashflow</button>
    <button class="tab" onclick="goTab('employes')"   id="tab-employes">👥 Employés</button>
    <button class="tab" onclick="goTab('export')"     id="tab-export">📤 Export</button>
  </div>

  <!-- Filter Bar -->
  <div id="filterbar">
    <select class="flt-select" id="period-select" onchange="onPeriodChange()">
      <option value="7">7 jours</option>
      <option value="30" selected>30 jours</option>
      <option value="90">3 mois</option>
      <option value="180">6 mois</option>
      <option value="365">1 an</option>
    </select>
    <button class="flt-btn active" onclick="setCompar(this,'month')" data-c="month">Ce mois</button>
    <button class="flt-btn" onclick="setCompar(this,'lastmonth')" data-c="lastmonth">Mois préc.</button>
    <button class="flt-btn" onclick="setCompar(this,'year')" data-c="year">Cette année</button>
    <span class="flt-spacer"></span>
    <button class="refresh-btn" onclick="loadAll()">↻</button>
  </div>

  <!-- Content -->
  <div id="content">
    <div class="loading"><div class="spin"></div> Chargement analytics...</div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   VERALUZ — ANALYTICS MODULE v2.0
   READ-ONLY | Mobile-First | Event Bus Compatible
   ═════════════════════════════════════════════════════════ */

var MODULE_ID = 'veraluz-analytics';
var SUPA_URL  = 'https://dfdmasejsoibxrvubegu.supabase.co';
var SUPA_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmZG1hc2Vqc29pYnhydnViZWd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDgzOTMsImV4cCI6MjA5MjI4NDM5M30.dEsafV84HFmFqU6Yi4xKydIbUlkIVE7QMRMpFt8kqXY';

var currentTab  = 'dashboard';
var currentDays = 30;
var DATA = {};

/* ── Event Bus ───────────────────────────────────────────── */
function emit(type, data) {
  try { window.parent.postMessage({ source: MODULE_ID, type: type, data: data || {} }, '*'); }
  catch(e) {}
}
window.addEventListener('message', function(ev) {
  if (!ev.data || ev.data.source !== 'veraluz-core') return;
  var msg = ev.data;
  if (msg.type === 'refresh') loadAll();
  if (msg.type === 'navigate-tab' && msg.data && msg.data.tab) goTab(msg.data.tab);
});
window.addEventListener('load', function() {
  emit('module-ready', { module: 'analytics', version: '2.0' });
  loadAll();
});

/* ── Helpers ─────────────────────────────────────────────── */
function fmt(n) {
  if (n === null || n === undefined) return '—';
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000)    return (n/1000).toFixed(0)    + 'k';
  return String(Math.round(n));
}
function fmtXAF(n) {
  if (!n) return '0 XAF';
  if (n >= 1000000) return (n/1000000).toFixed(2) + 'M XAF';
  if (n >= 1000)    return (n/1000).toFixed(0) + 'k XAF';
  return n + ' XAF';
}
function pct(v, t) { return t ? Math.round(v/t*100) : 0; }
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2500);
}
function delta(cur, prev) {
  if (!prev) return { pct: 0, cls: 'delta-neu', arrow: '' };
  var p = Math.round((cur - prev) / prev * 100);
  if (p > 0) return { pct: p, cls: 'delta-up', arrow: '▲' };
  if (p < 0) return { pct: Math.abs(p), cls: 'delta-dn', arrow: '▼' };
  return { pct: 0, cls: 'delta-neu', arrow: '►' };
}

/* ── Supabase Fetch ──────────────────────────────────────── */
function supa(endpoint) {
  return fetch(SUPA_URL + '/rest/v1/' + endpoint, {
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + SUPA_KEY,
      'Content-Type': 'application/json'
    }
  }).then(function(r) { return r.json(); }).catch(function() { return null; });
}

/* ── Generate Demo Data ──────────────────────────────────── */
function genDemo(days) {
  var seed = 12345;
  function rnd(min, max) {
    seed = (seed * 1664525 + 1013904223) & 0xffffffff;
    var u = (seed >>> 0) / 0xffffffff;
    return Math.round(min + u * (max - min));
  }

  var totalUnits = 12;
  var daily = [];
  for (var i = days - 1; i >= 0; i--) {
    var d = new Date(); d.setDate(d.getDate() - i);
    var occ    = rnd(4, 11);
    var res    = occ * rnd(25000, 45000);
    var rest   = rnd(80000, 250000);
    var dep    = rnd(50000, 120000);
    daily.push({
      date: d.toISOString().slice(0,10),
      occupied: occ,
      total: totalUnits,
      reservations_rev: res,
      restaurant_rev: rest,
      depenses: dep,
      reservations_count: rnd(2, 8),
      checkins: rnd(1, 5),
      checkouts: rnd(1, 4)
    });
  }

  // Aggregate
  var totRes  = daily.reduce(function(a,d){ return a+d.reservations_rev; }, 0);
  var totRest = daily.reduce(function(a,d){ return a+d.restaurant_rev; }, 0);
  var totDep  = daily.reduce(function(a,d){ return a+d.depenses; }, 0);
  var totOcc  = daily.reduce(function(a,d){ return a+d.occupied; }, 0);
  var avgOcc  = pct(totOcc, daily.length * totalUnits);
  var totRev  = totRes + totRest;
  var profit  = totRev - totDep;

  // Monthly comparison (same period, -30 days earlier)
  var prevRes  = totRes  * rnd(80,105) / 100;
  var prevRest = totRest * rnd(80,110) / 100;
  var prevDep  = totDep  * rnd(85,100) / 100;
  var prevOcc  = avgOcc  * rnd(80,105) / 100;

  // Top rooms
  var rooms = ['101','102','103','201','202','203','301','302','303','401','402','403'];
  var topRooms = rooms.map(function(r){ return { room: r, nights: rnd(days*0.3, days*0.9), rev: rnd(200000,800000) }; })
    .sort(function(a,b){ return b.rev - a.rev; }).slice(0,5);

  // Employees perf
  var empNames = ['Moise K.','Beatrice N.','Jean-Paul T.','Awa S.','Eric M.','Sonia B.'];
  var employees = empNames.map(function(n){ return {
    name: n,
    dept: ['Réception','Housekeeping','Restaurant','Sécurité','Cuisine','Réception'][empNames.indexOf(n)],
    presence: rnd(70,100),
    tasks: rnd(15,50),
    score: rnd(65,100)
  }; });

  // Depenses breakdown
  var depBreakdown = [
    { cat: 'Salaires',       pct: 45, color: '#3b82f6' },
    { cat: 'Nourriture',     pct: 18, color: '#f59e0b' },
    { cat: 'Entretien',      pct: 12, color: '#8b5cf6' },
    { cat: 'Énergie',        pct: 10, color: '#ef4444' },
    { cat: 'Fournitures',    pct: 8,  color: '#10b981' },
    { cat: 'Autres',         pct: 7,  color: '#6b7280' },
  ];

  // ReservationStats
  var resSources = [
    { src: 'Direct',       pct: 38, color: '#22d3a5' },
    { src: 'Booking.com',  pct: 28, color: '#3b82f6' },
    { src: 'Airbnb',       pct: 20, color: '#f97316' },
    { src: 'Agences',      pct: 14, color: '#8b5cf6' },
  ];

  return {
    daily: daily,
    kpi: {
      taux_occupation: avgOcc,
      rev_hotel: totRes,
      rev_restaurant: totRest,
      total_revenus: totRev,
      depenses: totDep,
      profit: profit,
      nb_reservations: daily.reduce(function(a,d){ return a+d.reservations_count; }, 0),
      adr: Math.round(totRes / Math.max(totOcc, 1)),
      revpar: Math.round(totRes / (daily.length * totalUnits)),
      prev: { taux_occupation: prevOcc, rev_hotel: prevRes, rev_restaurant: prevRest, depenses: prevDep }
    },
    topRooms: topRooms,
    employees: employees,
    depBreakdown: depBreakdown,
    resSources: resSources,
    totalUnits: totalUnits
  };
}

/* ── Load All ────────────────────────────────────────────── */
function loadAll() {
  var days = parseInt(document.getElementById('period-select').value) || 30;
  currentDays = days;
  DATA = genDemo(days);
  renderTab(currentTab);
  emit('analytics-refreshed', { period: days });
}

/* ── Tab Navigation ──────────────────────────────────────── */
function goTab(id) {
  currentTab = id;
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  var btn = document.getElementById('tab-' + id);
  if (btn) btn.classList.add('active');
  renderTab(id);
}
function onPeriodChange() { loadAll(); }
function setCompar(btn, val) {
  document.querySelectorAll('.flt-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}

/* ── SVG Line Chart ──────────────────────────────────────── */
function buildLineChart(daily, key, color, w, h) {
  w = w || 600; h = h || 140;
  var vals = daily.map(function(d){ return d[key] || 0; });
  var max  = Math.max.apply(null, vals) || 1;
  var padL = 10, padR = 10, padT = 10, padB = 30;
  var cw = w - padL - padR, ch = h - padT - padB;

  var pts = vals.map(function(v, i) {
    var x = padL + (i / (vals.length - 1)) * cw;
    var y = padT + ch - (v / max) * ch;
    return { x: x.toFixed(1), y: y.toFixed(1) };
  });

  var linePath = 'M ' + pts.map(function(p){ return p.x + ',' + p.y; }).join(' L ');
  var areaPath = linePath + ' L ' + pts[pts.length-1].x + ',' + (padT+ch) + ' L ' + pts[0].x + ',' + (padT+ch) + ' Z';

  // Labels (show ~6)
  var step = Math.floor(daily.length / 5) || 1;
  var labels = '';
  for (var i = 0; i < daily.length; i += step) {
    var x = padL + (i / (vals.length - 1)) * cw;
    var d = daily[i].date.slice(5); // MM-DD
    labels += '<text class="chart-label" x="' + x.toFixed(1) + '" y="' + (h-6) + '" text-anchor="middle">' + d + '</text>';
  }

  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">'
    + '<defs><linearGradient id="grad_' + key + '" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.6"/>'
    + '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/>'
    + '</linearGradient></defs>'
    + '<path d="' + areaPath + '" fill="url(#grad_' + key + ')"/>'
    + '<path d="' + linePath + '" class="chart-line" stroke="' + color + '"/>'
    + labels
    + '</svg>';
}

/* ── Bar Chart HTML ──────────────────────────────────────── */
function buildBarChart(data, color) {
  var max = Math.max.apply(null, data.map(function(d){ return d.val; })) || 1;
  return '<div class="bar-chart">' +
    data.map(function(d) {
      var h = Math.max(4, Math.round(d.val / max * 110));
      return '<div class="bar-col">'
        + '<div class="bar-val">' + (d.val >= 1000 ? Math.round(d.val/1000)+'k' : d.val) + '</div>'
        + '<div class="bar" style="height:' + h + 'px;background:' + (d.color || color || 'var(--acc)') + '"></div>'
        + '<div class="bar-lbl">' + d.label + '</div>'
        + '</div>';
    }).join('')
    + '</div>';
}

/* ── Donut SVG ───────────────────────────────────────────── */
function buildDonut(slices, size) {
  size = size || 100;
  var cx = size/2, cy = size/2, r = size*0.38, stroke = size*0.18;
  var total = slices.reduce(function(a,s){ return a + s.pct; }, 0);
  var paths = '';
  var angle = -90;
  slices.forEach(function(s) {
    var deg   = (s.pct / total) * 360;
    var start = angle * Math.PI / 180;
    var end   = (angle + deg) * Math.PI / 180;
    var x1 = (cx + r * Math.cos(start)).toFixed(2);
    var y1 = (cy + r * Math.sin(start)).toFixed(2);
    var x2 = (cx + r * Math.cos(end)).toFixed(2);
    var y2 = (cy + r * Math.sin(end)).toFixed(2);
    var large = deg > 180 ? 1 : 0;
    paths += '<path d="M ' + cx + ' ' + cy + ' L ' + x1 + ' ' + y1
           + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x2 + ' ' + y2 + ' Z"'
           + ' fill="' + s.color + '" opacity="0.85"/>';
    angle += deg;
  });
  // Center hole
  paths += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r - stroke) + '" fill="var(--bg2)"/>';
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '">' + paths + '</svg>';
}

  emps.forEach(function(e) { depts[e.dept] = (depts[e.dept] || 0) + 1; });
  var colors = ['#22d3a5','#3b82f6','#f97316','#8b5cf6','#10b981','#f59e0b'];
  var deptSlices = Object.keys(depts).map(function(k, i) {
    return { src: k, pct: Math.round(depts[k]/emps.length*100), color: colors[i % colors.length] };
  });
  html += '<div class="section"><div class="section-title">🏢 <span>Répartition par département</span></div>'
    + '<div class="donut-wrap">' + buildDonut(deptSlices, 100)
    + '<div class="donut-legend">'
    + deptSlices.map(function(s){
        return '<div class="legend-item"><div class="legend-dot" style="background:' + s.color + '"></div>'
          + '<span>' + s.src + '</span><span class="legend-val">' + s.pct + '%</span></div>';
      }).join('')
    + '</div></div></div>';

  return html;
}

/* ── Export ──────────────────────────────────────────────── */
function renderExport() {
  var html = '<div class="section"><div class="section-title">📤 <span>Exporter les rapports</span></div>'
    + '<div class="export-grid">'
    + exportCard('📊','Rapport mensuel','Dashboard complet KPIs + graphiques','exportCSV("monthly")')
    + exportCard('🏨','Rapport occupation','Taux occupation par chambre et période','exportCSV("occupation")')
    + exportCard('💰','Rapport revenus','Revenus hôtel + restaurant détaillés','exportCSV("revenus")')
    + exportCard('💸','Rapport dépenses','Dépenses par catégorie','exportCSV("depenses")')
    + exportCard('👥','Rapport RH','Performance et présence employés','exportCSV("rh")')
    + exportCard('📈','Rapport cashflow','Profit / perte journalier','exportCSV("cashflow")')
    + '</div>'
    + '<div class="export-btn-row">'
    + '<button class="btn-primary" onclick="exportAllCSV()">⬇️ Tout exporter (CSV)</button>'
    + '<button class="btn-secondary" onclick="printReport()">🖨️ Imprimer le rapport</button>'
    + '</div>'
    + '</div>'
    + '<div class="section"><div class="section-title">📅 <span>Période analysée</span></div>'
    + '<div class="metric-row"><span class="metric-lbl">Période</span><span class="metric-val">' + currentDays + ' derniers jours</span></div>'
    + '<div class="metric-row"><span class="metric-lbl">Date de fin</span><span class="metric-val">' + new Date().toLocaleDateString('fr-FR') + '</span></div>'
    + '<div class="metric-row"><span class="metric-lbl">Date de début</span><span class="metric-val">' + new Date(Date.now() - currentDays*86400000).toLocaleDateString('fr-FR') + '</span></div>'
    + '<div class="metric-row"><span class="metric-lbl">Données</span><span class="metric-val"><span class="badge badge-green">Veraluz OS</span></span></div>'
    + '</div>';
  return html;
}

function exportCard(icon, name, desc, fn) {
  return '<div class="export-card" onclick="' + fn + '">'
    + '<div class="export-icon">' + icon + '</div>'
    + '<div class="export-name">' + name + '</div>'
    + '<div class="export-desc">' + desc + '</div>'
    + '</div>';
}

/* ── Export Functions ────────────────────────────────────── */
function exportCSV(type) {
  var k = DATA.kpi; var d = DATA.daily;
  var lines = [];
  if (type === 'monthly' || type === 'revenus') {
    lines = ['Date,Revenus Hôtel (XAF),Revenus Restaurant (XAF),Total (XAF)'];
    d.forEach(function(day) {
      lines.push(day.date + ',' + day.reservations_rev + ',' + day.restaurant_rev + ',' + (day.reservations_rev + day.restaurant_rev));
    });
  } else if (type === 'occupation') {
    lines = ['Date,Chambres occupées,Total chambres,Taux (%)'];
    d.forEach(function(day) {
      lines.push(day.date + ',' + day.occupied + ',' + day.total + ',' + pct(day.occupied, day.total));
    });
  } else if (type === 'depenses') {
    lines = ['Date,Dépenses (XAF)'];
    d.forEach(function(day) { lines.push(day.date + ',' + day.depenses); });
  } else if (type === 'cashflow') {
    lines = ['Date,Revenus (XAF),Dépenses (XAF),Cashflow (XAF)'];
    d.forEach(function(day) {
      var cf = (day.reservations_rev + day.restaurant_rev) - day.depenses;
      lines.push(day.date + ',' + (day.reservations_rev + day.restaurant_rev) + ',' + day.depenses + ',' + cf);
    });
  } else if (type === 'rh') {
    lines = ['Employé,Département,Présence (%),Tâches,Score'];
    DATA.employees.forEach(function(e) {
      lines.push(e.name + ',' + e.dept + ',' + e.presence + ',' + e.tasks + ',' + e.score);
    });
  }

  var csv = lines.join('\n');
  var blob = new Blob([csv], { type: 'text/csv' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = 'veraluz_' + type + '_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(url);
  toast('✅ Export ' + type + ' téléchargé');
  emit('analytics-export', { type: type });
}

function exportAllCSV() {
  ['monthly','occupation','depenses','cashflow','rh'].forEach(function(t, i) {
    setTimeout(function() { exportCSV(t); }, i * 300);
  });
}

function printReport() {
  toast('🖨️ Préparation impression...');
  setTimeout(function() { window.print(); }, 500);
}

/* ── Main Render ─────────────────────────────────────────── */
function renderTab(id) {
  var content = document.getElementById('content');
  var html = '';
  if      (id === 'dashboard')  html = renderDashboard();
  else if (id === 'occupation') html = renderOccupation();
  else if (id === 'revenus')    html = renderRevenus();
  else if (id === 'restaurant') html = renderRestaurant();
  else if (id === 'depenses')   html = renderDepenses();
  else if (id === 'cashflow')   html = renderCashflow();
  else if (id === 'employes')   html = renderEmployes();
  else if (id === 'export')     html = renderExport();
  content.innerHTML = html;
  content.scrollTop = 0;
}
