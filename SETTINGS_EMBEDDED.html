<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veraluz OS — Paramètres</title>
<script>if(localStorage.getItem('vl_theme')==='dark')document.documentElement.classList.add('vl-dark');</script>
<style>
:root{
  --acc:#22d3a5;--acc2:#1ba87f;
  --bg:#0f1117;--bg2:#161b24;--bg3:#1e2535;--bg4:#252d3d;
  --text:#e8eaf0;--text2:#8b95a8;--text3:#5a6478;
  --red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;
  --green:#10b981;--orange:#f97316;--purple:#8b5cf6;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;}

/* ── App shell ── */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}

/* ── Tab bar ── */
#tabbar{
  display:flex;overflow-x:auto;background:var(--bg2);
  border-bottom:2px solid var(--bg4);flex-shrink:0;scrollbar-width:none;
}
#tabbar::-webkit-scrollbar{display:none;}
.tab-btn{
  flex-shrink:0;border:none;background:none;color:var(--text3);
  padding:0 14px;height:48px;cursor:pointer;font-size:12px;font-weight:500;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border-bottom:2px solid transparent;transition:.15s;white-space:nowrap;
}
.tab-btn:hover{color:var(--text2);background:var(--bg3);}
.tab-btn.active{color:var(--acc);border-bottom-color:var(--acc);background:rgba(34,211,165,.05);}
.tab-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.tab-label{font-size:10px;line-height:1;}

/* ── Unsaved bar ── */
#unsaved-bar{
  display:none;background:rgba(245,158,11,.12);border-bottom:1px solid rgba(245,158,11,.3);
  padding:8px 16px;flex-shrink:0;align-items:center;gap:10px;font-size:12px;color:var(--amber);
}
#unsaved-bar.show{display:flex;}
#unsaved-bar button{padding:5px 14px;border-radius:6px;border:none;font-size:12px;
  font-weight:600;cursor:pointer;}
.btn-save{background:var(--acc);color:#000;}
.btn-discard{background:var(--bg4);color:var(--text2);}

/* ── Content ── */
#content{flex:1;overflow-y:auto;padding:16px;display:none;}
#content.active{display:block;}
#section-wrap{flex:1;overflow-y:auto;padding:16px;}

/* ── Page header ── */
.ph{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding-bottom:14px;
  border-bottom:1px solid var(--bg4);}
.ph svg{width:22px;height:22px;stroke:var(--acc);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.ph-text h2{font-size:15px;font-weight:700;}
.ph-text p{font-size:11px;color:var(--text2);margin-top:2px;}

/* ── Card ── */
.card{background:var(--bg2);border:1px solid var(--bg4);border-radius:12px;
  padding:16px;margin-bottom:12px;}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:var(--text3);margin-bottom:12px;display:flex;align-items:center;gap:7px;}
.card-title svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;}

/* ── Form rows ── */
.row{margin-bottom:12px;}
.row label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:500;}
.row input,.row select,.row textarea{
  width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--bg4);
  border-radius:8px;color:var(--text);font-size:13px;outline:none;transition:.15s;}
.row input:focus,.row select:focus,.row textarea:focus{border-color:var(--acc);}
.row textarea{resize:vertical;min-height:70px;}
.row-hint{font-size:10px;color:var(--text3);margin-top:4px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:480px){.row2{grid-template-columns:1fr;}}

/* ── Toggle row ── */
.toggle-row{display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--bg4);}
.toggle-row:last-child{border-bottom:none;}
.toggle-info{flex:1;}
.toggle-label{font-size:13px;font-weight:500;}
.toggle-desc{font-size:11px;color:var(--text2);margin-top:2px;}
.toggle{position:relative;width:42px;height:24px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-track{position:absolute;inset:0;background:var(--bg4);border-radius:12px;
  cursor:pointer;transition:.2s;}
.toggle input:checked + .toggle-track{background:var(--acc);}
.toggle-track::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;
  background:#fff;border-radius:50%;transition:.2s;}
.toggle input:checked + .toggle-track::after{transform:translateX(18px);}

/* ── Logo preview ── */
#logo-preview{
  width:80px;height:80px;border-radius:12px;background:var(--bg3);
  border:2px dashed var(--bg4);display:flex;align-items:center;justify-content:center;
  overflow:hidden;margin-bottom:10px;cursor:pointer;transition:.15s;}
#logo-preview:hover{border-color:var(--acc);}
#logo-preview img{width:100%;height:100%;object-fit:contain;}
#logo-preview .lp-placeholder{font-size:11px;color:var(--text3);text-align:center;padding:8px;}

/* ── Color swatch ── */
.color-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.color-row label{font-size:12px;color:var(--text2);flex:1;}
.color-row input[type=color]{width:40px;height:32px;border:none;border-radius:6px;
  cursor:pointer;background:none;padding:0;}
.color-val{font-size:11px;color:var(--text3);width:60px;font-family:monospace;}

/* ── Table ── */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.tbl th{text-align:left;padding:7px 10px;font-size:10px;color:var(--text3);
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bg4);}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--bg3);}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--bg3);}

/* ── Badges ── */
.bdg{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;
  font-size:10px;font-weight:600;}
.bdg-g{background:rgba(16,185,129,.1);color:var(--green);border:1px solid rgba(16,185,129,.2);}
.bdg-r{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.bdg-a{background:rgba(245,158,11,.1);color:var(--amber);border:1px solid rgba(245,158,11,.2);}
.bdg-b{background:rgba(59,130,246,.1);color:var(--blue);border:1px solid rgba(59,130,246,.2);}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;
  border:none;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;}
.btn-p{background:var(--acc);color:#000;}
.btn-p:hover{background:var(--acc2);}
.btn-o{background:var(--bg3);color:var(--text2);border:1px solid var(--bg4);}
.btn-o:hover{background:var(--bg4);color:var(--text);}
.btn-r{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

/* ── Permission grid ── */
.perm-table{width:100%;border-collapse:collapse;font-size:11px;}
.perm-table th,.perm-table td{padding:7px 6px;text-align:center;border:1px solid var(--bg4);}
.perm-table th:first-child,.perm-table td:first-child{text-align:left;font-weight:600;
  white-space:nowrap;padding-left:10px;}
.perm-table thead th{background:var(--bg3);font-size:10px;color:var(--text2);}
.perm-table input[type=checkbox]{width:15px;height:15px;accent-color:var(--acc);cursor:pointer;}

/* ── Integration card ── */
.integ-card{display:flex;align-items:flex-start;gap:12px;padding:12px;
  background:var(--bg3);border-radius:10px;margin-bottom:8px;}
.integ-icon{width:36px;height:36px;border-radius:8px;background:var(--bg4);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.integ-icon svg{width:18px;height:18px;stroke:var(--acc);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
.integ-body{flex:1;}
.integ-name{font-size:13px;font-weight:600;}
.integ-desc{font-size:11px;color:var(--text2);margin-top:2px;}
.integ-status{margin-top:6px;}

/* ── Toast ── */
#toast{position:fixed;bottom:16px;right:16px;background:var(--bg3);border:1px solid var(--bg4);
  border-radius:10px;padding:10px 16px;font-size:12.5px;z-index:9999;
  display:none;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.4);}
#toast.show{display:flex;}

/* ── Modal ── */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;
  display:none;align-items:center;justify-content:center;padding:16px;}
#modal-overlay.show{display:flex;}
#modal{background:var(--bg2);border:1px solid var(--bg4);border-radius:14px;
  width:100%;max-width:420px;overflow:hidden;}
.modal-hd{padding:16px 20px;border-bottom:1px solid var(--bg4);font-size:14px;font-weight:700;}
.modal-bd{padding:20px;}
.modal-ft{padding:12px 20px;border-top:1px solid var(--bg4);display:flex;gap:8px;justify-content:flex-end;}

::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px;}
</style>
<style id="veraluz-theme">
/* ═══ VERALUZ THEME PROMPT 036F ═══════════════════════════════════════════
   Light : bg #e8ecf0 · surfaces #fff · neumorphic shadows
   Dark  : bg #131722 · surfaces #1e2538
   Toggle: html.vl-dark / localStorage('vl_theme')
═══════════════════════════════════════════════════════════════════════════ */

/* ── Variables universelles (couvre tous les modules) ─────────────────── */
:root{
  --bg:#e8ecf0;--bg1:#e8ecf0;--bg2:#fff;--bg3:#eef1f5;--bg4:#e0e4e8;--bg5:#d8dce0;
  --text:#1e293b;--text2:#475569;--text3:#94a3b8;
  --tx:#1e293b;--tx2:#475569;--tx3:#94a3b8;
  --border:rgba(0,0,0,.07);--border2:rgba(0,0,0,.10);--border3:rgba(0,0,0,.05);
  --vl-sh:4px 4px 12px #c8cdd4,-2px -2px 8px #fff;
  --vl-sh-in:inset 2px 2px 6px #c8cdd4,inset -1px -1px 4px #fff;
  --vl-r:3px;
}
html,body{background:var(--bg)!important;color:var(--text)!important;}

/* ── Dark mode ────────────────────────────────────────────────────────── */
html.vl-dark{
  --bg:#131722;--bg1:#131722;--bg2:#1a1f2e;--bg3:#1e2538;--bg4:#252d42;--bg5:#2d3654;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --tx:#e2e8f0;--tx2:#94a3b8;--tx3:#64748b;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.10);--border3:rgba(255,255,255,.05);
  --vl-sh:4px 4px 12px #0d1118,-2px -2px 8px #242b3e;
  --vl-sh-in:inset 2px 2px 6px #0d1118,inset -1px -1px 4px #242b3e;
}
html.vl-dark body{background:var(--bg)!important;color:var(--text)!important;}

/* ── Topbar / Header ──────────────────────────────────────────────────── */
.topbar,.header,.mod-header,.page-header{background:var(--bg2)!important;border-bottom:1px solid var(--border)!important;box-shadow:0 1px 6px rgba(0,0,0,.05)!important;}
html.vl-dark .topbar,html.vl-dark .header,html.vl-dark .mod-header{background:var(--bg2)!important;border-bottom:1px solid var(--border)!important;}

/* ── Tabs / Tabbar ────────────────────────────────────────────────────── */
.tabbar,.tab-bar,.tabs,.nav-tabs{background:var(--bg3)!important;border-bottom:1px solid var(--border)!important;}
html.vl-dark .tabbar,html.vl-dark .tab-bar,html.vl-dark .tabs,html.vl-dark .nav-tabs{background:var(--bg2)!important;}
.tab-btn.active,.tab.active,.nav-link.active{color:#0891b2!important;border-bottom-color:#0891b2!important;}
html.vl-dark .tab-btn.active,html.vl-dark .tab.active{color:#22d3ee!important;border-bottom-color:#22d3ee!important;}

/* ── Cards / Panels ───────────────────────────────────────────────────── */
.card,.panel,.pane,.item,.contact-item,.msg-item,.doc-item,.audit-item,.appro-item,
.list-item,.entry,.result-card,.ai-card,.agent-card,.chloe-card,.section-card,
.setting-card,.setting-group,.auth-card,.approval-card{
  background:var(--bg2)!important;border:1px solid var(--border)!important;
  box-shadow:var(--vl-sh)!important;}
html.vl-dark .card,html.vl-dark .panel,html.vl-dark .pane,html.vl-dark .item,
html.vl-dark .contact-item,html.vl-dark .msg-item,html.vl-dark .doc-item,
html.vl-dark .audit-item,html.vl-dark .appro-item,html.vl-dark .list-item,
html.vl-dark .entry,html.vl-dark .result-card,html.vl-dark .ai-card,
html.vl-dark .agent-card,html.vl-dark .chloe-card,html.vl-dark .section-card,
html.vl-dark .setting-card,html.vl-dark .setting-group,html.vl-dark .auth-card,
html.vl-dark .approval-card{background:var(--bg3)!important;border:1px solid var(--border)!important;}

/* ── Sidebars / Panels latéraux ───────────────────────────────────────── */
.sidebar,.side-panel,.left-panel,.right-panel,.detail-panel{background:var(--bg2)!important;border-right:1px solid var(--border)!important;}
html.vl-dark .sidebar,html.vl-dark .side-panel,html.vl-dark .left-panel,html.vl-dark .right-panel{background:var(--bg2)!important;}

/* ── Content zones (APPRO/CONTACTS hardcoded bg) ─────────────────────── */
.content,.content-area,.main-content,.list-area,.contact-list,.msg-list,.results,
.search-results,.appro-list,.contacts-body,.body-area{background:var(--bg)!important;}
html.vl-dark .content,html.vl-dark .content-area,html.vl-dark .main-content,
html.vl-dark .list-area,html.vl-dark .contact-list,html.vl-dark .msg-list,
html.vl-dark .results,html.vl-dark .appro-list,html.vl-dark .contacts-body{background:var(--bg)!important;}

/* ── Search boxes ─────────────────────────────────────────────────────── */
.sbox,.search-box,.search-wrap{background:var(--bg3)!important;border-color:var(--border2)!important;}
html.vl-dark .sbox,html.vl-dark .search-box{background:var(--bg3)!important;}

/* ── Inputs ───────────────────────────────────────────────────────────── */
input:not([type=checkbox]):not([type=radio]),select,textarea{
  background:var(--bg3)!important;border:1px solid var(--border2)!important;
  border-radius:var(--vl-r)!important;color:var(--text)!important;}
input:not([type=checkbox]):not([type=radio]):focus,select:focus,textarea:focus{
  border-color:#0891b2!important;box-shadow:0 0 0 2px rgba(8,145,178,.12)!important;outline:none!important;}
html.vl-dark input:not([type=checkbox]):not([type=radio]),html.vl-dark select,html.vl-dark textarea{
  background:var(--bg4)!important;border-color:var(--border2)!important;}

/* ── Icônes monochromes ───────────────────────────────────────────────── */
.icon,.icon-wrap,.action-icon,.stat-icon,.feature-icon,.btn-icon,.tag-icon,
.avatar-placeholder,.initials-avatar{
  background:rgba(8,145,178,.10)!important;color:#0891b2!important;border-radius:var(--vl-r)!important;}
html.vl-dark .icon,html.vl-dark .icon-wrap,html.vl-dark .action-icon,
html.vl-dark .stat-icon,html.vl-dark .feature-icon,html.vl-dark .btn-icon{
  background:rgba(8,145,178,.18)!important;color:#22d3ee!important;}

/* ── Boutons secondaires ──────────────────────────────────────────────── */
.btn-sec,.btn-outline,.btn-ghost{border-radius:var(--vl-r)!important;background:var(--bg3)!important;border:1px solid var(--border2)!important;color:var(--text)!important;}
html.vl-dark .btn-sec,html.vl-dark .btn-outline{background:var(--bg4)!important;}

/* ── Modals ───────────────────────────────────────────────────────────── */
.modal,.modal-content,.modal-box,.dialog{background:var(--bg2)!important;border:1px solid var(--border)!important;box-shadow:0 20px 60px rgba(0,0,0,.15)!important;}
html.vl-dark .modal,html.vl-dark .modal-content,html.vl-dark .modal-box{background:var(--bg3)!important;}

/* ── Scrollbar ────────────────────────────────────────────────────────── */
::-webkit-scrollbar{width:4px!important;height:4px!important;}
::-webkit-scrollbar-track{background:var(--bg)!important;}
::-webkit-scrollbar-thumb{background:#c8cdd4!important;border-radius:2px!important;}
html.vl-dark ::-webkit-scrollbar-thumb{background:#2d3654!important;}

/* ── Toggle FAB ───────────────────────────────────────────────────────── */
#vl-tm-btn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);right:14px;z-index:9990;width:36px;height:36px;border-radius:3px;border:none;background:#fff;color:#475569;cursor:pointer;font-size:15px;box-shadow:4px 4px 12px #c8cdd4,-2px -2px 8px #fff;display:flex;align-items:center;justify-content:center;transition:box-shadow .2s,transform .15s;}
#vl-tm-btn:hover{transform:scale(1.05);}
html.vl-dark #vl-tm-btn{background:#1e2538;color:#94a3b8;box-shadow:4px 4px 12px #0d1118,-2px -2px 8px #242b3e;}
</style>
</head>
<body>
<button id="vl-tm-btn" onclick="toggleVlTheme()" title="Thème">🌙</button>
<div id="app">

<!-- ── Tab Bar ── -->
<div id="tabbar">
  <button class="tab-btn active" onclick="goSection('hotel')" id="tab-hotel">

  <button class="tab-btn" onclick="goSection('notifs')" id="tab-notifs">

    <span class="tab-label">Notifications</span>
  </button>
  <button class="tab-btn" onclick="goSection('permissions')" id="tab-permissions">
    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    <span class="tab-label">Permissions</span>
  </button>
  <button class="tab-btn" onclick="goSection('integrations')" id="tab-integrations">
    <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
    <span class="tab-label">Intégrations</span>
  </button>
  <button class="tab-btn" onclick="goSection('email')" id="tab-email">
    <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    <span class="tab-label">Email</span>

      }
      _dbSett.branding.legacy_logo_url = _legacyLogo;

function saveCanonical(key, obj, onDone){
  /* Fix 3 — SETTINGS-SSOT-1A: refus si DB canonical non chargée (évite écrasement DB par fallback) */
  if(_dbSettError){
    toast('❌ DB indisponible — sauvegarde impossible', false); return;
  }
  if(!window.parent || typeof window.parent.veraluzSecureRequest !== 'function'){
    toast('❌ Session requise pour sauvegarder', false); return;
  }
  window.parent.veraluzSecureRequest('settings-secure', {action:'update_settings', key:key, value:obj})
  .then(function(r){
    var d = r && r.body ? r.body : r;
    if(d && d.ok){
      Object.assign(_dbSett[key] = _dbSett[key] || {}, obj);
      toast('✓ Enregistré (DB)');
      if(onDone) onDone();
    } else { toast('❌ '+(d&&d.error||'Erreur sauvegarde'), false); }
  })
  .catch(function(){ toast('❌ Erreur réseau', false); });
}

/* ── SETTINGS-SSOT-1A — Upload logo via EF sécurisée ───────────────────
   Interdit : base64/dataURL, localStorage, blob local, anon Storage write.
   Flux : fichier → window.parent.veraluzLogoUpload (broker CORE)
          → logo-upload-secure EF (X-Veraluz-Session + service_role)
          → Storage upload + branding.logo_url persisté en DB
          → URL publique retournée au frontend.
   Le frontend ne touche jamais Storage directement.
─────────────────────────────────────────────────────────────────────── */
var _pendingLogoFile = null;

function onLogoFileSelect(input){
  var file = input && input.files && input.files[0];
  if(!file){ _pendingLogoFile = null; return; }
  /* Validation type + taille (double check — EF revalide côté serveur) */
  var allowed = ['image/png','image/jpeg','image/webp'];
  if(allowed.indexOf(file.type) === -1){
    toast('❌ Type non supporté — PNG, JPG ou WebP uniquement', false);
    input.value = ''; _pendingLogoFile = null; return;
  }
  if(file.size > 2 * 1024 * 1024){
    toast('❌ Fichier trop grand — maximum 2 Mo', false);
    input.value = ''; _pendingLogoFile = null; return;
  }
  _pendingLogoFile = file;
  var nameEl = document.getElementById('branding-logo-filename');
  if(nameEl) nameEl.textContent = file.name + ' (' + Math.round(file.size/1024) + ' Ko)';
  var btnEl = document.getElementById('branding-logo-upload-btn');
  if(btnEl) btnEl.style.display = '';
  var statusEl = document.getElementById('branding-logo-upload-status');
  if(statusEl) statusEl.textContent = '✓ Fichier prêt — cliquer "Uploader vers Storage"';
}

function handleLogoUpload(){
  if(!_pendingLogoFile){
    toast('❌ Aucun fichier sélectionné', false); return;
  }
  /* Broker sécurisé CORE — jamais appel Storage direct depuis Settings */
  if(!window.parent || typeof window.parent.veraluzLogoUpload !== 'function'){
    toast('❌ Broker logo indisponible — vérifier que Settings est chargé dans CORE', false); return;
  }
  var btnEl    = document.getElementById('branding-logo-upload-btn');
  var statusEl = document.getElementById('branding-logo-upload-status');
  if(btnEl){ btnEl.disabled = true; btnEl.textContent = '⏳ Upload…'; }
  if(statusEl) statusEl.textContent = '⏳ Upload en cours via EF sécurisée…';
  window.parent.veraluzLogoUpload(_pendingLogoFile)
    .then(function(result){
      if(btnEl){ btnEl.disabled = false; btnEl.textContent = '⬆ Uploader vers Storage'; }
      if(!result.ok){
        toast('❌ Upload échoué : ' + result.error, false);
        if(statusEl) statusEl.textContent = '❌ ' + result.error;
        return;
      }
      /* Succès — URL déjà persistée en DB par l'EF ; mettre à jour le champ URL */
      var urlInput = document.getElementById('branding-logo-url');
      if(urlInput){ urlInput.value = result.url; }
      previewLogoDb(result.url);
      /* Recharger le canonical DB pour afficher la nouvelle valeur */
      if(typeof loadDbCanonical === 'function') loadDbCanonical();
      _pendingLogoFile = null;
      if(statusEl) statusEl.textContent = '✓ Logo uploadé et enregistré (DB) : ' + result.url;
      emit('logo-updated', {logo_url: result.url, ts: new Date().toISOString()});
      toast('✓ Logo uploadé et branding.logo_url enregistré en DB', true);
    })
    .catch(function(e){
      if(btnEl){ btnEl.disabled = false; btnEl.textContent = '⬆ Uploader vers Storage'; }
      toast('❌ Erreur upload : ' + String(e), false);
    });
}

function saveBranding(){
  var logoUrl   = (document.getElementById('branding-logo-url')||{}).value||'';
  var showLogo  = !!(document.getElementById('__branding_show_logo_cb')||document.querySelector('[data-field="__branding_show_logo"]')||{checked:true}).checked;
  var primary   = (document.getElementById('branding-primary')||{}).value||'#22d3a5';
  var secondary = (document.getElementById('branding-secondary')||{}).value||'#1ba87f';
  var bgColor   = (document.getElementById('branding-bg')||{}).value||'#0f1117';

  /* Refuser base64 côté frontend avant même l'envoi */
  if(logoUrl && logoUrl.startsWith('data:')){
    toast('❌ Logo : URL Storage uniquement — pas de base64', false); return;
  }

  var showEl = document.querySelector('[data-field="__branding_show_logo"]');
  var showLogoVal = showEl ? !!showEl.checked : true;

  var obj = {
    logo_url:        logoUrl,
    show_logo:       showLogoVal,
    primary_color:   primary,
    secondary_color: secondary,
    bg_color:        bgColor,
    font:            (_dbSett.branding||{}).font || 'Inter'
  };
  saveCanonical('branding', obj, function(){
    emit('logo-updated', {logo_url:logoUrl, ts:new Date().toISOString()});
    emit('branding-updated', {branding:obj, ts:new Date().toISOString()});
    markClean();
  });
}

function saveFiscalCanonical(){
  /* SETTINGS-FISCAL-1: collecte depuis DOM, validation client, write via saveCanonical */
  function gv(id){ var el=document.getElementById(id); return el?el.value:''; }
  function gb(id){ var el=document.getElementById(id); return !!(el&&el.checked); }
  function gn(id,def){ var v=parseFloat(gv(id)); return isNaN(v)?def:v; }
  var f = {
    vat_enabled:             gb('fsc-vat-enabled'),
    vat_rate:                gn('fsc-vat-rate', 19.25),
    tourist_tax_enabled:     gb('fsc-tt-enabled'),
    tourist_tax_type:        gv('fsc-tt-type') || 'fixed',
    tourist_tax_value:       gn('fsc-tt-value', 0),
    service_charge_enabled:  gb('fsc-sc-enabled'),
    service_charge_rate:     gn('fsc-sc-rate', 0),
    municipal_tax_enabled:   gb('fsc-mt-enabled'),
    municipal_tax_value:     gn('fsc-mt-value', 0),
    early_checkin_enabled:   gb('fsc-eci-enabled'),
    early_checkin_fee:       gn('fsc-eci-fee', 0),
    late_checkout_enabled:   gb('fsc-lco-enabled'),
    late_checkout_fee:       gn('fsc-lco-fee', 0),
    extra_bed_fee:           gn('fsc-eb-fee', 0),
    cancellation_pct:        gn('fsc-canc-pct', 0)
  };
  /* Validation client-side */
  if(f.vat_rate < 0 || f.vat_rate > 100){ toast('❌ Taux TVA invalide (0–100%)', false); return; }
  if(f.service_charge_rate < 0 || f.service_charge_rate > 100){ toast('❌ Charge de service invalide (0–100%)', false); return; }
  if(f.cancellation_pct < 0 || f.cancellation_pct > 100){ toast('❌ % annulation invalide (0–100)', false); return; }
  if(f.tourist_tax_value < 0 || f.early_checkin_fee < 0 || f.late_checkout_fee < 0 || f.extra_bed_fee < 0 || f.municipal_tax_value < 0){
    toast('❌ Montants ne peuvent pas être négatifs', false); return;
  }
  if(f.tourist_tax_type !== 'fixed' && f.tourist_tax_type !== 'pct'){
    toast('❌ Type taxe touristique invalide', false); return;
  }
  saveCanonical('fiscal', f, function(){
    Object.assign(_dbSett.fiscal = _dbSett.fiscal || {}, f);
  });
}

function saveLocalization(){
  var obj = {
    language:           (document.getElementById('loc-language')||{}).value||'fr',
    locale:             (document.getElementById('loc-language')||{}).value==='fr' ? 'fr-CM' : ((document.getElementById('loc-language')||{}).value||'fr'),
    primary_currency:   (document.getElementById('loc-primary-currency')||{}).value||'XAF',
    secondary_currency: (document.getElementById('loc-secondary-currency')||{}).value||'EUR',
    timezone:           (document.getElementById('loc-timezone')||{}).value||'Africa/Douala',
    date_format:        (document.getElementById('loc-date-format')||{}).value||'DD/MM/YYYY',
    time_format:        (document.getElementById('loc-time-format')||{}).value||'24h'
  };
  saveCanonical('localization', obj, function(){
    emit('locale-updated', {
      language:  obj.language,
      currency:  obj.primary_currency,
      currency2: obj.secondary_currency,
      date_fmt:  obj.date_format,
      time_fmt:  obj.time_format,
      timezone:  obj.timezone,
      ts: new Date().toISOString()
    });
    markClean();
  });
}

function loadEmailTemplates(){
  try{
    var raw = localStorage.getItem('vz_email_templates_lib');
    if(raw){ var arr = JSON.parse(raw); if(arr && arr.length) return arr; }
  }catch(e){}
  var defaults = getBuiltinTemplates();
  try{ localStorage.setItem('vz_email_templates_lib', JSON.stringify(defaults)); }catch(e){}
  return defaults;
}

function saveEmailTemplate(tpl){
  var lib = loadEmailTemplates();
  var idx = -1;
  for(var i=0;i<lib.length;i++){ if(lib[i].id===tpl.id){ idx=i; break; } }
  if(idx>=0) lib[idx]=tpl; else lib.push(tpl);
  try{ localStorage.setItem('vz_email_templates_lib', JSON.stringify(lib)); }catch(e){}
}

function copyTemplate(tplId){

  }
}

/* ── Campagnes ── */
var _campagne = {segment: null, tplId: null, subject: '', step: 1};

function getSegments(){
  var rezRaw = null;
  try{ rezRaw = localStorage.getItem('vlz_cache_rez'); }catch(e){}
  var rez = [];
  try{ if(rezRaw) rez = JSON.parse(rezRaw); }catch(e){}
  if(!Array.isArray(rez)) rez = [];

  var now = Date.now();
  var day90 = 90*24*3600*1000;
  var day90ago = now - day90;

  var clientMap = {};
  rez.forEach(function(r){
    var em = r.email || r.client_email || '';
    var nm = r.guest_name || r.nom || r.client_name || '';
    if(!em) return;
    if(!clientMap[em]) clientMap[em] = {email:em, name:nm, stays:0, lastStay:0};
    clientMap[em].stays++;
    var d = r.checkout_date || r.check_out || r.date_depart || '';
    if(d){ var t = new Date(d).getTime(); if(t > clientMap[em].lastStay) clientMap[em].lastStay = t; }
  });
  var clients = Object.values(clientMap);

  var tous       = clients.filter(function(c){ return !!c.email; });
  var vip        = clients.filter(function(c){ return c.stays >= 4; });
  var fideles    = clients.filter(function(c){ return c.stays >= 2 && c.stays <= 3; });
  var nouveaux   = clients.filter(function(c){ return c.lastStay > day90ago; });
  var relance    = clients.filter(function(c){ return c.lastStay && c.lastStay < day90ago; });

  return [
    {id:'tous',    label:'Tous les clients avec email', clients: tous},
    {id:'vip',     label:'VIP (4+ séjours)',       clients: vip},
    {id:'fideles', label:'Fidèles (2-3 séjours)', clients: fideles},
    {id:'nouveaux',label:'Nouveaux (< 90 jours)',      clients: nouveaux},
    {id:'relance', label:'Relance (séjour ≥ 3 mois)', clients: relance}
  ];
}

function renderEmailCampagnes(){
  var segs = getSegments();
  var lib = loadEmailTemplates();

  var step = _campagne.step || 1;

  var out = '<div class="card"><div class="card-title"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22 11 13 2 9l20-7z"/></svg>Nouvelle campagne email</div>';

  /* Step 1 — segment */
  out += '<div style="margin-bottom:16px;"><div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;">1. Choisir un segment</div>'
    +'<div style="display:flex;flex-direction:column;gap:6px;">'
    + segs.map(function(s){
        var active = _campagne.segment === s.id;
        return '<button onclick="selectCampagneSegment(\''+s.id+'\')" style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:8px;border:1px solid '+(active?'var(--acc)':'var(--bg4)')+';background:'+(active?'rgba(34,211,165,.1)':'var(--bg3)')+';color:var(--text);cursor:pointer;font-size:12px;text-align:left;">'
          +'<span>'+(active?'&#10003; ':'')+escH(s.label)+'</span>'
          +'<span style="background:var(--bg4);border-radius:10px;padding:2px 8px;font-size:11px;color:var(--text2);">'+s.clients.length+' contacts</span>'
          +'</button>';
      }).join('')
    +'</div></div>';

  /* Step 2 — template */
  out += '<div style="margin-bottom:16px;"><div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;">2. Choisir un modèle</div>'
    +'<select id="camp-tpl" onchange="selectCampagneTpl(this.value)" style="width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--bg4);border-radius:8px;color:var(--text);font-size:13px;">'
    +'<option value="">-- Sélectionnez un modèle --</option>'
    + lib.map(function(t){
        return '<option value="'+escH(t.id)+'"'+(_campagne.tplId===t.id?' selected':'')+'>'+escH(t.name)+'</option>';
      }).join('')
    +'</select></div>';

  /* Step 3 — sujet */
  var selTpl = null;
  if(_campagne.tplId){ for(var i=0;i<lib.length;i++){ if(lib[i].id===_campagne.tplId){ selTpl=lib[i]; break; } } }
  out += '<div style="margin-bottom:16px;"><div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;">3. Personnaliser le sujet</div>'
    +'<input type="text" id="camp-subject" value="'+escH(_campagne.subject || (selTpl?selTpl.subject:''))+'" placeholder="Sujet de l\'email..." style="width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--bg4);border-radius:8px;color:var(--text);font-size:13px;" oninput="_campagne.subject=this.value">'
    +(selTpl?'<div style="margin-top:10px;padding:10px;background:var(--bg4);border-radius:6px;font-size:11px;color:var(--text2);max-height:80px;overflow:auto;">'+escH(selTpl.subject)+'</div>':'')
    +'</div>';

  /* Step 4 — envoyer */
  var canSend = _campagne.segment && _campagne.tplId;
  var segCount = 0;
  if(canSend){ for(var j=0;j<segs.length;j++){ if(segs[j].id===_campagne.segment){ segCount=segs[j].clients.length; break; } } }

  out += '<div style="margin-bottom:8px;"><div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;">4. Envoyer</div>'
    +'<div id="camp-progress" style="margin-bottom:10px;font-size:12px;color:var(--text2);display:none;"></div>'
    +(canSend
      ? '<button class="btn btn-p" onclick="runCampagne()" style="width:100%;">&#128640; Envoyer à '+segCount+' contact'+(segCount>1?'s':'')+'</button>'
      : '<button class="btn btn-o" disabled style="width:100%;opacity:.5;">Sélectionnez un segment et un modèle</button>')
    +'</div>';

  out += '</div>';
  return out;
}

function selectCampagneSegment(segId){
  _campagne.segment = segId;
  renderSection('email');
}

function selectCampagneTpl(tplId){
  _campagne.tplId = tplId || null;
  var lib = loadEmailTemplates();
  for(var i=0;i<lib.length;i++){
    if(lib[i].id===tplId){ _campagne.subject = lib[i].subject; break; }
  }
  renderSection('email');
}

function runCampagne(){
  var segs = getSegments();
  var lib = loadEmailTemplates();
  var seg = null;
  for(var i=0;i<segs.length;i++){ if(segs[i].id===_campagne.segment){ seg=segs[i]; break; } }
  var tpl = null;
  for(var j=0;j<lib.length;j++){ if(lib[j].id===_campagne.tplId){ tpl=lib[j]; break; } }

  if(!seg || !tpl){ toast('Sélectionnez un segment et un modèle'); return; }
  var clients = seg.clients;
  if(!clients.length){ toast('Aucun contact dans ce segment'); return; }

  var subject = _campagne.subject || tpl.subject;
  var tplId = (S.email && S.email.template_id) || '';
  if(!tplId){ toast('Template ID EmailJS manquant (onglet Configuration)'); return; }

  var progress = document.getElementById('camp-progress');
  if(progress){ progress.style.display='block'; progress.textContent='Préparation...'; }

  var sent = 0; var total = clients.length; var errors = 0;
  var campaign_log = {
    id: 'camp_'+Date.now(), segment: _campagne.segment, tpl_id: tpl.id, tpl_name: tpl.name,
    subject: subject, total: total, sent: 0, errors: 0, started_at: new Date().toISOString()
  };

  function sendNext(idx){
    if(idx >= total){
      campaign_log.sent = sent; campaign_log.errors = errors;
      campaign_log.finished_at = new Date().toISOString();
      try{
        var logs = JSON.parse(localStorage.getItem('vz_email_campaigns_log')||'[]');
        logs.unshift(campaign_log);
        localStorage.setItem('vz_email_campaigns_log', JSON.stringify(logs.slice(0,50)));
      }catch(e){}
      if(progress) progress.textContent = '✓ Campagne terminée : '+sent+'/'+total+' envoyés'+(errors?' ('+errors+' erreurs)':'');
      toast('✓ Campagne : '+sent+'/'+total+' emails envoyés');
      return;
    }
    var c = clients[idx];
    if(progress) progress.textContent = 'Envoi '+( idx+1)+'/'+total+' — '+c.email;

    fetch('https://api.emailjs.com/api/v1.0/email/send',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        service_id:'service_mwiart1', template_id: tplId, user_id:'MqrKcqvO952CD5HOA',
        template_params:{
          to_email: c.email, to_name: c.name || c.email,
          subject: subject, body_html: tpl.body,
          from_name:'Résidence Veraluz', reply_to:'residenceveraluz@gmail.com'
        }
      })
    }).then(function(r){
      if(r.ok){ sent++; logEmailSent(c.email, subject, 'ok'); }
      else { errors++; logEmailSent(c.email, subject, 'error'); }
      setTimeout(function(){ sendNext(idx+1); }, 300);
    }).catch(function(){
      errors++; logEmailSent(c.email, subject, 'error');
      setTimeout(function(){ sendNext(idx+1); }, 300);
    });
  }

  sendNext(0);
}

    log.unshift({to:to, subject:subject, sent_at:new Date().toISOString(), status:status||'ok'});
    localStorage.setItem('vz_email_log', JSON.stringify(log.slice(0,200)));
  }catch(e){}
}

  var gv = function(id){ var el=document.getElementById(id); return el?el.value:''; };
  var gn = function(id,def){ var v=parseFloat(gv(id)); return isNaN(v)?def:v; };
  var unitId = gv('cu-id') || null;
  var name = gv('cu-name').trim();
  if(!name){ toast('❌ Nom requis', false); return; }
  var capacity = gn('cu-capacity', 2);
  var price    = gn('cu-price', 0);
  if(capacity < 1 || capacity > 20){ toast('❌ Capacité 1–20', false); return; }
  if(price < 0){ toast('❌ Prix invalide', false); return; }
  var payload = {
    action: 'upsert_unit',
    unit: {
      id:          unitId || undefined,
      name:        name,
      type:        gv('cu-type') || 'chambre',
      status:      gv('cu-status') || 'available',
      capacity:    capacity,
      price:       price,
      floor:       gn('cu-floor', 0),
      sort_order:  gn('cu-sort', 0),
      amenities:   gv('cu-amenities'),
      description: gv('cu-desc')
    }
  };
  if(!window.parent || typeof window.parent.veraluzSecureRequest !== 'function'){
    toast('❌ Session requise', false); return;
  }
  window.parent.veraluzSecureRequest('catalog-secure', payload)
  .then(function(r){
    var d = r && r.body ? r.body : r;
    if(d && d.ok){
      toast('✓ Unité enregistrée (DB)');
      document.getElementById('catalog-editor-wrap').innerHTML='';
      loadCatalogFromDB();
    } else { toast('❌ '+(d&&d.error||'Erreur'), false); }
  })
  .catch(function(){ toast('❌ Erreur réseau', false); });
}

function deleteCatalogUnit(unitId, name){
  if(!confirm('Supprimer l\'unité "'+name+'" ? Cette action est irréversible.')) return;
  if(!window.parent || typeof window.parent.veraluzSecureRequest !== 'function'){
    toast('❌ Session requise', false); return;
  }
  window.parent.veraluzSecureRequest('catalog-secure', {action:'delete_unit', id:unitId})
  .then(function(r){
    var d = r && r.body ? r.body : r;
    if(d && d.ok){
      toast('✓ Unité supprimée');
      loadCatalogFromDB();
    } else { toast('❌ '+(d&&d.error||'Erreur'), false); }
  })
  .catch(function(){ toast('❌ Erreur réseau', false); });
}
function exportSettings(){
  /* Fix 2 — SETTINGS-SSOT-1A: exporter uniquement les domaines locaux (non-canonical).
     Les domaines canonical DB (branding, localization, restaurant, fiscal, devises, etc.)
     sont exclus pour éviter qu'un ré-import ne les écrase comme vérité locale.              */
  var localOnly = {};
  Object.keys(S).forEach(function(k){
    if(_LS_CANONICAL.indexOf(k) === -1) localOnly[k] = S[k];
  });
  var exportObj = {
    _meta: {
      exported_at: new Date().toISOString(),
      version: 1,
      note: 'canonical_domains_excluded_see_DB',
      excluded: _LS_CANONICAL
    },
    settings: localOnly
  };
  var blob=new Blob([JSON.stringify(exportObj,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='veraluz_settings_local_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}
function importSettings(input){
  /* SETTINGS-FISCAL-1 / CATALOG-SSOT-1: importSettings() ne doit jamais recréer
     les domaines canoniques DB comme vérités localStorage.
     Un ancien JSON exporté peut contenir branding/localization/restaurant/tarifs/chambres :
     ces clés sont acceptées en mémoire (S) pour affichage, mais filtrées avant écriture LS.
     Les domaines canonical DB (hotel, branding, localization, restaurant, tarifs, chambres)
     ne sont PAS écrits dans localStorage — uniquement via saveCanonical() → EF.           */
  var file=input.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var imported=JSON.parse(e.target.result);
      /* Fusionner dans S — les domaines canoniques présents dans le fichier alimentent
         l'objet mémoire mais ne sont pas écrits en localStorage.                         */
      S=imported;
      /* Filtrer les domaines canoniques avant écriture localStorage */
      var _toLS={};
      Object.keys(S).forEach(function(k){
        if(_LS_CANONICAL.indexOf(k)===-1) _toLS[k]=S[k];
      });
      localStorage.setItem(LS_KEY,JSON.stringify(_toLS));
      renderSection(currentSection); toast('✓ Paramètres importés (domaines DB non réécrits en local)'); markClean();
    }
    catch(err){ toast('❌ Fichier JSON invalide',false); }
  }; reader.readAsText(file);
}
function confirmReset(){
  if(confirm('Réinitialiser tous les paramètres aux valeurs par défaut ?')){
    S=JSON.parse(JSON.stringify(DEFAULTS));
    localStorage.removeItem(LS_KEY);
    renderSection(currentSection); markClean();
    toast('✓ Paramètres réinitialisés');
  }
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('show'); }

/* ── Collect form values ── */
function collectForm(){
  var inputs=document.querySelectorAll('#section-wrap [data-field]');
  inputs.forEach(function(el){
    var path=el.getAttribute('data-field').split('.'); var obj=S;
    for(var i=0;i<path.length-1;i++){ if(!obj[path[i]]) obj[path[i]]={};  obj=obj[path[i]]; }
    var last=path[path.length-1];
    if(el.type==='checkbox') obj[last]=el.checked;
    else if(el.type==='number') obj[last]=parseFloat(el.value)||0;
    else obj[last]=el.value;
  });
}

/* ── Auth-context from Core ── */
window.addEventListener('message', function(ev){
  if(!ev.data || ev.data.source !== 'veraluz-core') return;
  var msg=ev.data;
  if(msg.type==='auth-context'){
    var d=msg.data||{};
    var adminRoles=['admin','gerant','manager','super_admin','superadmin'];
    if(d.role && !adminRoles.includes(d.role)){
      document.getElementById('app').innerHTML='<div style="padding:40px;text-align:center;color:var(--red);"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg><br><br><strong>Accès réservé aux administrateurs</strong><br><p style="color:var(--text3);font-size:12px;margin-top:8px;">Contactez votre administrateur pour accéder aux paramètres.</p></div>';
    }
    return;
  }
  if(msg.type==='refresh'){ loadSettings(); renderSection(currentSection); }
  if(msg.type==='email-sent'){ var d=msg.data||{}; logEmailSent(d.to||'', d.subject||'', d.status||'ok'); }
});

/* ── Init ── */
window.addEventListener('load', function(){
  loadSettings();
  /* SETTINGS-FISCAL-1 + CATALOG-SSOT-1: load canonical DB settings then render */
  loadDbCanonical(function(){
    goSection('hotel');
    emit('module-ready', {module:'settings', version:'3.2'});
  });
  loadCatalogFromDB();   /* CATALOG-SSOT-1: async, renders chambres section when ready */
});
</script>

/* ── Veraluz Theme toggle — PROMPT 036F ─────────────────────────────── */
function applyVlTheme(){var dark=localStorage.getItem('vl_theme')==='dark';document.documentElement.classList.toggle('vl-dark',dark);var btn=document.getElementById('vl-tm-btn');if(btn)btn.textContent=dark?'☀️':'🌙';}
function toggleVlTheme(){var dark=localStorage.getItem('vl_theme')==='dark';localStorage.setItem('vl_theme',dark?'light':'dark');applyVlTheme();try{window.parent.postMessage({type:'vl-theme',theme:dark?'light':'dark'},'*');}catch(e){}}
document.addEventListener('DOMContentLoaded',applyVlTheme);
window.addEventListener('message',function(e){if(e.data&&e.data.type==='vl-theme')applyVlTheme();});
</script>
