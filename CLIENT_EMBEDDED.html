<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Clients — Résidence Veraluz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg1:#0f1117;--bg2:#161b27;--bg3:#1e2535;--bg4:#252d40;
  --acc:#22d3a5;--acc2:#f59e0b;--acc3:#ef4444;--regular:#6366f1;
  --text1:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --border:#2a3347;--radius:10px;
  --vip:#f59e0b;--new:#22d3a5;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg1);color:var(--text1);min-height:100vh;overflow-x:hidden;}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* ── Topbar ── */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.topbar-icon{color:var(--acc);}
.topbar-info{flex:1;min-width:0;}
.topbar-title{font-size:15px;font-weight:700;color:var(--text1);}
.topbar-sub{font-size:11px;color:var(--text3);}
.view-btns{display:flex;gap:4px;flex-shrink:0;}
.view-btn{background:var(--bg3);border:1px solid var(--border);border-radius:7px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;color:var(--text3);}
.view-btn:hover{border-color:var(--acc);color:var(--acc);}
.view-btn.active{background:var(--acc);border-color:var(--acc);color:#0f1117;}

/* ── Content ── */
.content-area{flex:1;overflow-y:auto;padding:12px 14px 100px;}

/* ── Stats ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
@media(max-width:600px){.stats-row{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}
.stat-val{font-size:20px;font-weight:800;color:var(--acc);line-height:1;}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:3px;text-transform:uppercase;letter-spacing:.3px;}
.stat-sub{font-size:10px;color:var(--text2);margin-top:2px;}

/* ── Search ── */
.search-bar{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:0 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.search-bar input{background:none;border:none;outline:none;color:var(--text1);font-size:13px;padding:10px 0;flex:1;}
.search-bar input::placeholder{color:var(--text3);}

/* ── Filter chips ── */
.filters-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.flt-btn{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:11px;color:var(--text2);cursor:pointer;transition:.15s;white-space:nowrap;}
.flt-btn:hover{border-color:var(--acc);color:var(--acc);}
.flt-btn.active{background:var(--acc);color:#0f1117;border-color:var(--acc);font-weight:700;}
.adv-toggle-btn{margin-left:auto;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:11px;color:var(--text2);cursor:pointer;white-space:nowrap;transition:.15s;flex-shrink:0;}
.adv-toggle-btn:hover{border-color:var(--acc2);color:var(--acc2);}
.adv-toggle-btn.open{border-color:var(--acc2);color:var(--acc2);}

/* ── Advanced filter panel ── */
.adv-panel{display:none;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.adv-panel.open{display:block;}
.adv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(max-width:500px){.adv-grid{grid-template-columns:1fr;}}
.adv-field label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:4px;}
.adv-field select,.adv-field input[type=number]{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--text1);outline:none;}
.adv-field select:focus,.adv-field input[type=number]:focus{border-color:var(--acc);}
.adv-field select option{background:var(--bg3);}
.adv-reset{margin-top:10px;background:none;border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:11px;color:var(--text3);cursor:pointer;}
.adv-reset:hover{border-color:var(--acc3);color:var(--acc3);}

/* ── Client CARDS view ── */
.cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(max-width:580px){.cards-grid{grid-template-columns:1fr;}}
.client-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:.15s;}
.client-card:hover{border-color:var(--acc);background:var(--bg3);}
.client-card-top{display:flex;align-items:center;gap:12px;}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;}
.avatar.sz-md{width:44px;height:44px;font-size:16px;}
.avatar.sz-sm{width:32px;height:32px;font-size:12px;}
.avatar.sz-lg{width:56px;height:56px;font-size:20px;}
.avatar.vip{background:rgba(245,158,11,.2);color:var(--vip);}
.avatar.loyal{background:rgba(99,102,241,.2);color:var(--regular);}
.avatar.new-c{background:rgba(34,211,165,.15);color:var(--new);}
.client-info{flex:1;min-width:0;}
.client-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.client-contact{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.client-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.bdg{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700;}
.bdg.vip{background:rgba(245,158,11,.2);color:var(--vip);}
.bdg.loyal{background:rgba(99,102,241,.2);color:var(--regular);}
.bdg.new-c{background:rgba(34,211,165,.15);color:var(--new);}
.bdg.inactive{background:rgba(100,116,139,.15);color:var(--text3);}
.client-stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.cs-val{font-size:13px;font-weight:700;color:var(--text1);}
.cs-lbl{font-size:10px;color:var(--text3);}

/* ── LIST view ── */
.list-view .list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:.15s;}
.list-view .list-item:hover{background:var(--bg3);}
.list-view .list-item:nth-child(even){background:var(--bg2);}
.list-view .list-item:nth-child(even):hover{background:var(--bg3);}
.list-info{flex:1;min-width:0;}
.list-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list-email{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list-meta{display:flex;align-items:center;gap:14px;flex-shrink:0;}
.list-meta-cell{text-align:right;}
.list-meta-val{font-size:12px;font-weight:700;}
.list-meta-lbl{font-size:10px;color:var(--text3);}
.list-badges{display:flex;gap:3px;flex-shrink:0;}

/* ── TABLE view ── */
.table-wrap{overflow-x:auto;}
.data-table{width:100%;border-collapse:collapse;font-size:12px;}
.data-table th{background:var(--bg3);color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.3px;padding:8px 10px;text-align:left;position:sticky;top:0;white-space:nowrap;cursor:pointer;user-select:none;}
.data-table th:hover{color:var(--acc);}
.data-table th.sort-asc::after{content:' ↑';}
.data-table th.sort-desc::after{content:' ↓';}
.data-table td{padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
.data-table tr:hover td{background:var(--bg3);cursor:pointer;}
.data-table tr.selected td{background:rgba(34,211,165,.07);}
.data-table .chk-col{width:36px;text-align:center;}
.data-table input[type=checkbox]{accent-color:var(--acc);width:14px;height:14px;cursor:pointer;}

/* ── Bulk action bar ── */
.bulk-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg3);border-top:1px solid var(--acc);padding:12px 16px;z-index:100;align-items:center;gap:10px;flex-wrap:wrap;}
.bulk-bar.visible{display:flex;}
.bulk-count{font-size:13px;font-weight:700;color:var(--acc);flex:1;}

/* ── Buttons ── */
.btn{border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;}
.btn-p{background:var(--acc);color:#0f1117;}
.btn-p:hover{opacity:.85;}
.btn-s{background:var(--bg3);color:var(--text1);border:1px solid var(--border);}
.btn-s:hover{border-color:var(--acc);color:var(--acc);}
.btn-w{background:var(--acc2);color:#0f1117;}
.btn-w:hover{opacity:.85;}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-email{background:rgba(34,211,165,.12);color:var(--acc);border:1px solid rgba(34,211,165,.3);}
.btn-email:hover{background:rgba(34,211,165,.2);}

/* ── Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-sheet{background:var(--bg2);border-radius:16px 16px 0 0;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;padding:20px 16px 32px;}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
.modal-close{float:right;background:var(--bg3);border:none;border-radius:50%;width:28px;height:28px;color:var(--text2);cursor:pointer;font-size:14px;}
.modal-title{font-size:17px;font-weight:800;margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--text3);margin-bottom:14px;}
.section-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;}

/* ── Stay item ── */
.stay-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.stay-item:last-child{border-bottom:none;}
.stay-dot{width:8px;height:8px;border-radius:50%;background:var(--acc);margin-top:5px;flex-shrink:0;}
.stay-body{flex:1;}
.stay-unit{font-size:13px;font-weight:600;}
.stay-dates{font-size:11px;color:var(--text3);margin-top:2px;}
.stay-amount{font-size:13px;font-weight:700;color:var(--acc);white-space:nowrap;}

/* ── Email ── */
.field-lbl{font-size:11px;color:var(--text3);margin-bottom:4px;}
.field-inp{width:100%;background:var(--bg1);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--text1);outline:none;margin-bottom:10px;}
.field-inp:focus{border-color:var(--acc);}
textarea.field-inp{resize:vertical;min-height:80px;}
.note-box{background:var(--bg3);border-radius:8px;padding:12px;}

/* ── Empty / Loading ── */
.empty{text-align:center;padding:48px 16px;color:var(--text3);}
.empty-ico{font-size:36px;margin-bottom:8px;}

/* ── Toast ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--acc);color:var(--acc);padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;display:none;white-space:nowrap;}
.toast.err{border-color:var(--acc3);color:var(--acc3);}
</style>
</head>
<body>
<div class="app">
  <!-- Topbar -->
  <div class="topbar">
    <svg class="topbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="20" height="20"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <div class="topbar-info">
      <div class="topbar-title">Base Clients</div>
      <div class="topbar-sub" id="top-sub">Chargement…</div>
    </div>
    <div class="view-btns">
      <button class="view-btn active" id="vbtn-cards" onclick="setView('cards',this)" title="Cartes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </button>
      <button class="view-btn" id="vbtn-list" onclick="setView('list',this)" title="Liste">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1" fill="currentColor"/><circle cx="3" cy="12" r="1" fill="currentColor"/><circle cx="3" cy="18" r="1" fill="currentColor"/></svg>
      </button>
      <button class="view-btn" id="vbtn-table" onclick="setView('table',this)" title="Tableau">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="9" x2="9" y2="21"/></svg>
      </button>
    </div>
  </div>

  <div class="content-area">
    <!-- Stats row -->
    <div class="stats-row">
      <div class="stat-card"><div class="stat-val" id="s-total">—</div><div class="stat-lbl">Clients total</div></div>
      <div class="stat-card"><div class="stat-val" id="s-loyal" style="color:var(--acc2)">—</div><div class="stat-lbl">Fidèles 2+</div><div class="stat-sub">2 séjours ou plus</div></div>
      <div class="stat-card"><div class="stat-val" id="s-ca" style="color:var(--vip)">—</div><div class="stat-lbl">CA moyen/client</div></div>
      <div class="stat-card"><div class="stat-val" id="s-return" style="color:var(--regular)">—</div><div class="stat-lbl">Taux retour</div></div>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2" width="15" height="15"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-inp" placeholder="Rechercher par nom, email, téléphone…" oninput="renderContent()">
    </div>

    <!-- Filter chips + advanced toggle -->
    <div class="filters-row">
      <button class="flt-btn active" onclick="setFilter('all',this)">Tous</button>
      <button class="flt-btn" onclick="setFilter('vip',this)">⭐ VIP</button>
      <button class="flt-btn" onclick="setFilter('loyal',this)">🔁 Fidèles</button>
      <button class="flt-btn" onclick="setFilter('new',this)">🆕 Nouveaux</button>
      <button class="flt-btn" onclick="setFilter('inactive',this)">💤 Inactifs</button>
      <button class="adv-toggle-btn" id="adv-btn" onclick="toggleAdvanced()">⚙ Filtres avancés</button>
    </div>

    <!-- Advanced filter panel -->
    <div class="adv-panel" id="adv-panel">
      <div class="adv-grid">
        <div class="adv-field">
          <label>Dépenses</label>
          <select id="adv-spend" onchange="renderContent()">
            <option value="">Tous</option>
            <option value="0-50000">0 – 50 000 F</option>
            <option value="50000-200000">50k – 200k F</option>
            <option value="200000+">200k F et plus</option>
          </select>
        </div>
        <div class="adv-field">
          <label>Dernier séjour</label>
          <select id="adv-period" onchange="renderContent()">
            <option value="">Tous</option>
            <option value="month">Ce mois</option>
            <option value="3months">3 derniers mois</option>
            <option value="6months">6 derniers mois</option>
            <option value="year+">Plus d'un an</option>
          </select>
        </div>
        <div class="adv-field">
          <label>Unité préférée</label>
          <select id="adv-unit" onchange="renderContent()">
            <option value="">Toutes</option>
          </select>
        </div>
        <div class="adv-field">
          <label>Nb séjours minimum</label>
          <input type="number" id="adv-minstays" value="1" min="1" oninput="renderContent()">
        </div>
      </div>
      <button class="adv-reset" onclick="resetAdvanced()">↺ Réinitialiser les filtres</button>
    </div>

    <!-- Content -->
    <div id="content-area"></div>
  </div>
</div>

<!-- Bulk action bar -->
<div class="bulk-bar" id="bulk-bar">
  <div class="bulk-count" id="bulk-count">0 client sélectionné</div>
  <button class="btn btn-w btn-sm" onclick="bulkEmail()">✉ Envoyer campagne</button>
  <button class="btn btn-s btn-sm" onclick="exportCSV()">⬇ Exporter CSV</button>
</div>

<!-- Client detail modal -->
<div class="modal-overlay" id="client-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <button class="modal-close" onclick="closeModal('client-modal')">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- Email compose modal -->
<div class="modal-overlay" id="email-modal">
  <div class="modal-sheet" style="max-height:80vh;">
    <div class="modal-handle"></div>
    <button class="modal-close" onclick="closeModal('email-modal')">✕</button>
    <div id="email-modal-content"></div>
  </div>
</div>

<div class="toast" id="toastEl"></div>

<script>
var MODULE_ID = 'veraluz-clients';
var SB  = 'https://dfdmasejsoibxrvubegu.supabase.co';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmZG1hc2Vqc29pYnhydnViZWd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDgzOTMsImV4cCI6MjA5MjI4NDM5M30.dEsafV84HFmFqU6Yi4xKydIbUlkIVE7QMRMpFt8kqXY';

/* ── Utils ── */
function esc(s){ return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtMoney(n){ return Number(n||0).toLocaleString('fr-FR')+' F'; }
function fmtDate(s){
  if(!s)return '—';
  try{ return new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return s; }
}
function diffDays(a,b){
  if(!a||!b)return 0;
  return Math.max(0,Math.round((new Date(b)-new Date(a))/86400000));
}
function initials(name){
  if(!name||name==='—')return '?';
  var parts=name.trim().split(/\s+/);
  return (parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase();
}
function toast(msg,isErr){
  var el=document.getElementById('toastEl');
  if(!el)return;
  el.textContent=msg;
  el.className='toast'+(isErr?' err':'');
  el.style.display='block';
  clearTimeout(el._t);
  el._t=setTimeout(function(){ el.style.display='none'; },3000);
}
function emit(type,data){
  try{ window.parent.postMessage({veraluzEvent:true,source:MODULE_ID,type:type,data:data||{}},'*'); }catch(e){}
}
function sbGet(path){
  return fetch(SB+'/rest/v1/'+path,{
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}
  }).then(function(r){ return r.json(); });
}

/* ── State ── */
var CLIENTS=[];
var REZS=[];
var _filter='all';
var _view='cards';
var _curKey=null;
var _sortCol='';
var _sortDir=1;
var _selected={};
var CLIENT_NOTES={};

/* ── LocalStorage ── */
function loadNotes(){
  try{ CLIENT_NOTES=JSON.parse(localStorage.getItem('vz_client_notes')||'{}'); }catch(e){ CLIENT_NOTES={}; }
}
function saveNotes(){
  try{ localStorage.setItem('vz_client_notes',JSON.stringify(CLIENT_NOTES)); }catch(e){}
}
function loadVIPOverrides(){
  try{
    var vips=JSON.parse(localStorage.getItem('vz_client_vips')||'[]');
    vips.forEach(function(k){
      var c=CLIENTS.find(function(x){ return x.key===k; });
      if(c){ c.isVIP=true; c.isLoyal=false; c.isNew=false; }
    });
  }catch(e){}
}

/* ── Aggregation ── */
function aggregateClients(rezs){
  var map={};
  rezs.forEach(function(r){
    var email=((r.guest_email||r.client_email||'').trim()).toLowerCase();
    var name=(r.guest_name||r.client_name||'').trim();
    var key=email||name.toLowerCase()||('id-'+(r.id||Math.random()));
    if(!key)return;
    if(!map[key]){
      map[key]={
        key:key,name:name,email:email,
        phone:r.guest_phone||r.client_phone||'',
        reservations:[],totalSpent:0,totalNights:0,
        firstVisit:null,lastVisit:null,units:{}
      };
    }
    var c=map[key];
    if(name&&!c.name) c.name=name;
    if(!c.phone&&(r.guest_phone||r.client_phone)) c.phone=r.guest_phone||r.client_phone;
    c.reservations.push(r);
    c.totalSpent+=(r.paid||0);
    var nights=diffDays(r.check_in,r.check_out)||1;
    c.totalNights+=nights;
    var d=r.check_in||r.created_at||'';
    if(d&&(!c.firstVisit||d<c.firstVisit)) c.firstVisit=d;
    if(d&&(!c.lastVisit||d>c.lastVisit)) c.lastVisit=d;
    if(r.unit_name) c.units[r.unit_name]=(c.units[r.unit_name]||0)+1;
  });
  var today=new Date(); today.setHours(0,0,0,0);
  var ninetyAgo=new Date(today); ninetyAgo.setDate(ninetyAgo.getDate()-90);
  var sixMonthsAgo=new Date(today); sixMonthsAgo.setMonth(sixMonthsAgo.getMonth()-6);
  var result=Object.values(map).sort(function(a,b){
    return (b.lastVisit||'')>(a.lastVisit||'')?1:-1;
  });
  result.forEach(function(c){
    var stays=c.reservations.length;
    var last=c.lastVisit?new Date(c.lastVisit+'T12:00:00'):null;
    c.stayCount=stays;
    c.isVIP=stays>=4||c.totalSpent>=500000;
    c.isLoyal=stays>=2&&!c.isVIP;
    c.isNew=stays===1&&last&&last>=ninetyAgo;
    c.isInactive=!!(last&&last<sixMonthsAgo&&stays<2);
    c.prefUnit=Object.keys(c.units).sort(function(a,b){ return c.units[b]-c.units[a]; })[0]||'';
  });
  return result;
}

function avatarClass(c){ return c.isVIP?'vip':c.isLoyal?'loyal':'new-c'; }

function makeBadges(c){
  var b='';
  if(c.isVIP) b+='<span class="bdg vip">⭐ VIP</span>';
  if(c.isLoyal&&!c.isVIP) b+='<span class="bdg loyal">🔁 Fidèle</span>';
  if(c.isNew) b+='<span class="bdg new-c">🆕 Nouveau</span>';

function getFilteredClients(){
  var q=(document.getElementById('search-inp').value||'').toLowerCase().trim();
  var spend=document.getElementById('adv-spend')?document.getElementById('adv-spend').value:'';
  var period=document.getElementById('adv-period')?document.getElementById('adv-period').value:'';
  var unit=document.getElementById('adv-unit')?document.getElementById('adv-unit').value:'';
  var minStays=parseInt((document.getElementById('adv-minstays')||{}).value||'1',10)||1;
  var today=new Date(); today.setHours(0,0,0,0);
  return CLIENTS.filter(function(c){
    if(q&&!(c.name+c.email+c.phone).toLowerCase().includes(q)) return false;
    if(_filter==='vip'&&!c.isVIP) return false;
    if(_filter==='loyal'&&!c.isLoyal) return false;
    if(_filter==='new'&&!c.isNew) return false;
    if(_filter==='inactive'&&!c.isInactive) return false;
    if(spend){
      if(spend==='0-50000'&&(c.totalSpent<0||c.totalSpent>=50000)) return false;
      if(spend==='50000-200000'&&(c.totalSpent<50000||c.totalSpent>=200000)) return false;
      if(spend==='200000+'&&c.totalSpent<200000) return false;
    }
    if(period&&c.lastVisit){
      var last=new Date(c.lastVisit+'T12:00:00');
      var diff=Math.round((today-last)/86400000);
      if(period==='month'&&diff>31) return false;
      if(period==='3months'&&diff>92) return false;
      if(period==='6months'&&diff>183) return false;
      if(period==='year+'&&diff<=365) return false;
    }
    if(unit&&c.prefUnit!==unit) return false;
    if(c.stayCount<minStays) return false;
    return true;
  });
}

/* ── Table view ── */
var _COLS=[
  {id:'name',label:'Nom'},
  {id:'email',label:'Email'},
  {id:'phone',label:'Téléphone'},
  {id:'stayCount',label:'Séjours'},
  {id:'totalNights',label:'Nuits'},
  {id:'totalSpent',label:'Total payé'},
  {id:'lastVisit',label:'Dernière visite'},
  {id:'status',label:'Statut'}
];

function renderTable(list){
  var el=document.getElementById('content-area');
  if(!list.length){
    el.innerHTML='<div class="empty"><div class="empty-ico">👥</div>Aucun client trouvé</div>';
    updateBulkBar();
    return;
  }
  if(_sortCol){
    list=list.slice().sort(function(a,b){
      var av=a[_sortCol]||'';
      var bv=b[_sortCol]||'';
      if(typeof av==='number') return (av-bv)*_sortDir;
      return (String(av).localeCompare(String(bv)))*_sortDir;
    });
  }
  var allSel=list.every(function(c){ return _selected[c.key]; });
  var headerCols=_COLS.map(function(col){
    var cls='';
    if(_sortCol===col.id) cls=_sortDir===1?' sort-asc':' sort-desc';
    return '<th class="'+cls+'" onclick="sortTable(\''+col.id+'\')">'+col.label+'</th>';
  }).join('');
  var rows=list.map(function(c){
    var sel=_selected[c.key]?true:false;
    var ac=avatarClass(c);
    var statusLabel=c.isVIP?'⭐ VIP':c.isLoyal?'🔁 Fidèle':c.isNew?'🆕 Nouveau':c.isInactive?'💤 Inactif':'—';
    return '<tr class="'+(sel?'selected':'')+'" onclick="openClient(\''+esc(c.key)+'\',event)">'
      +'<td class="chk-col" onclick="event.stopPropagation()"><input type="checkbox" '+(sel?'checked':'')+' onchange="toggleSelect(\''+esc(c.key)+'\',this.checked)"></td>'
      +'<td><div style="display:flex;align-items:center;gap:8px;"><div class="avatar sz-sm '+ac+'">'+initials(c.name)+'</div><span>'+esc(c.name||'—')+'</span></div></td>'
      +'<td>'+esc(c.email||'—')+'</td>'
      +'<td>'+esc(c.phone||'—')+'</td>'
      +'<td style="text-align:center;">'+c.stayCount+'</td>'
      +'<td style="text-align:center;">'+c.totalNights+'</td>'
      +'<td style="color:var(--acc);font-weight:700;">'+fmtMoney(c.totalSpent)+'</td>'
      +'<td>'+fmtDate(c.lastVisit)+'</td>'
      +'<td>'+statusLabel+'</td>'
      +'</tr>';
  }).join('');
  el.innerHTML='<div class="table-wrap"><table class="data-table">'
    +'<thead><tr><th class="chk-col"><input type="checkbox" '+(allSel?'checked':'')+' onchange="selectAll(this.checked,'+JSON.stringify(list.map(function(c){ return c.key; }))+')"></th>'+headerCols+'</tr></thead>'
    +'<tbody>'+rows+'</tbody>'
    +'</table></div>';
}

function sortTable(col){
  if(_sortCol===col) _sortDir*=-1;
  else{ _sortCol=col; _sortDir=1; }
  renderContent();
}
function toggleSelect(key,checked){
  if(checked) _selected[key]=true;
  else delete _selected[key];
  updateBulkBar();
}
function selectAll(checked,keys){
  if(checked) keys.forEach(function(k){ _selected[k]=true; });
  else _selected={};
  updateBulkBar();
  renderContent();
}
function updateBulkBar(){
  var bar=document.getElementById('bulk-bar');

  });

function exportCSV(){
  var keys=Object.keys(_selected);
  if(!keys.length)return;
  var rows=['Nom,Email,Téléphone,Séjours,Total payé,Dernière visite'];
  keys.forEach(function(k){
    var c=CLIENTS.find(function(x){ return x.key===k; });
    if(!c)return;
    rows.push([
      '"'+(c.name||'').replace(/"/g,'""')+'"',
      '"'+(c.email||'').replace(/"/g,'""')+'"',
      '"'+(c.phone||'').replace(/"/g,'""')+'"',
      c.stayCount,
      c.totalSpent,
      '"'+fmtDate(c.lastVisit)+'"'
    ].join(','));
  });
  var blob=new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download='clients_veraluz.csv';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('CSV exporté ('+keys.length+' clients)');
}

  };

    welcome:'Bonjour '+firstName+',\n\nNous espérons que votre dernier séjour à la Résidence Veraluz vous a laissé de beaux souvenirs.\n\nNous serions ravis de vous accueillir à nouveau. N\'hésitez pas à nous contacter pour votre prochaine réservation.\n\nÀ bientôt,\nL\'équipe '+hotelName,
    offer:'Bonjour '+firstName+',\n\nEn tant que client fidèle, nous vous réservons une offre exclusive : [DÉCRIVEZ L\'OFFRE ICI]\n\nValable jusqu\'au [DATE]. Réservez dès maintenant en nous contactant directement.\n\nCordialement,\nL\'équipe '+hotelName,

  };

function sendClientEmail(){
  var c=CLIENTS.find(function(x){ return x.key===_emailTarget; });
  if(!c||!c.email){ toast('Email introuvable',true); return; }
  var subj=(document.getElementById('em-subject').value||'').trim();
  var body=(document.getElementById('em-body').value||'').trim();
  if(!subj||!body){ toast('Objet et message requis',true); return; }
  var hotel={};
  try{ hotel=JSON.parse(localStorage.getItem('vz_hotel_info')||'{}'); }catch(e){}
  var hotelName=hotel.name||'Résidence Veraluz';
  var hotelAddr=hotel.city||'Kribi, Cameroun';
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><style>'
    +'body{font-family:Arial,sans-serif;font-size:14px;color:#222;max-width:560px;margin:0 auto;padding:24px;}'
    +'.hdr{background:#0d7a5f;color:#fff;padding:18px 22px;border-radius:8px 8px 0 0;}'
    +'.hdr h2{margin:0;font-size:18px;}.hdr p{margin:4px 0 0;font-size:11px;opacity:.8;}'
    +'.body{background:#f9f9f9;padding:20px 22px;border:1px solid #e0e0e0;border-top:none;white-space:pre-line;line-height:1.7;}'
    +'.ftr{font-size:11px;color:#888;text-align:center;padding:14px;border-top:1px solid #ddd;}'
    +'</style></head><body>'
    +'<div class="hdr"><h2>'+escHtml(hotelName)+'</h2><p>'+escHtml(hotelAddr)+'</p></div>'
    +'<div class="body">'+escHtml(body)+'</div>'
    +'<div class="ftr">'+escHtml(hotelName)+' · '+escHtml(hotelAddr)+'</div>'
    +'</body></html>';
  window.parent.postMessage({veraluzEvent:true,source:MODULE_ID,type:'send-email',data:{
    to_email:c.email,to_name:c.name,subject:subj,body_html:html
  }},'*');
  toast('Email envoyé à '+c.email+' ✉');
  closeModal('email-modal');
}

/* ── Data loading ── */
function norm(r){
  r.guest_name=r.guest_name||r.client_name||'';
  r.guest_email=r.guest_email||r.client_email||'';
  r.guest_phone=r.guest_phone||r.client_phone||'';
  return r;
}
function loadData(){
  try{
    var cache=JSON.parse(localStorage.getItem('vlz_cache_rez')||'[]');
    if(cache.length){
      REZS=cache.map(norm);
      CLIENTS=aggregateClients(REZS);
      loadVIPOverrides();
      populateUnitDropdown();
      renderStats();
      renderContent();
    }
  }catch(e){}
  sbGet('veraluz_reservations?select=*&order=created_at.desc&limit=1000').then(function(data){
    if(!Array.isArray(data)||!data.length)return;
    REZS=data.map(norm);
    CLIENTS=aggregateClients(REZS);
    loadVIPOverrides();
    populateUnitDropdown();
    renderStats();
    renderContent();
    try{ localStorage.setItem('vlz_cache_rez',JSON.stringify(data)); }catch(e){}
  }).catch(function(){});
}

/* ── Init ── */
window.addEventListener('load',function(){
  loadNotes();
  loadData();
  emit('module-ready',{module:'clients',version:'2.0'});

  document.getElementById('client-modal').addEventListener('click',function(e){
    if(e.target===this) closeModal('client-modal');
  });
  document.getElementById('email-modal').addEventListener('click',function(e){
    if(e.target===this) closeModal('email-modal');
  });
});
</script>
