<!DOCTYPE html>

<style>

:root{--bg1:#0e1117;--bg2:#161b22;--bg3:#1c2230;--bg4:#21293a;--bg5:#283245;
--acc1:#22d3a5;--acc2:#1aab87;--text1:#e8eaf0;--text2:#a0aec0;--text3:#64748b;
--danger:#f43f5e;--warn:#f59e0b;--success:#22d3a5;--purple:#a855f7;--blue:#3b82f6;
--orange:#f97316;--border:rgba(255,255,255,0.07);--r:10px;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg1);color:var(--text1);font-size:14px;overflow-x:hidden;}
.app{display:flex;flex-direction:column;height:100%;max-width:900px;margin:0 auto;}
.tab-bar{display:flex;gap:4px;padding:10px 12px 0;overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--border);}
.tab{padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--text2);white-space:nowrap;
  font-size:13px;font-weight:500;transition:all .15s;}
.tab:hover{color:var(--text1);background:var(--bg3);}
.tab.on{color:var(--acc1);background:var(--bg2);border-bottom:2px solid var(--acc1);}
.content{flex:1;overflow-y:auto;padding:16px 12px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;margin-bottom:12px;}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.card-title{font-weight:600;color:var(--text1);}
.fl{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;margin-top:10px;}
.fi{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;
  padding:8px 10px;color:var(--text1);font-size:14px;outline:none;}
.fi:focus{border-color:var(--acc1);}
select.fi option{background:var(--bg3);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:7px;
  border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;}
.btn-primary{background:var(--acc1);color:#000;}
.btn-primary:hover{background:var(--acc2);}
.btn-sec{background:var(--bg4);color:var(--text1);border:1px solid var(--border);}
.btn-sec:hover{background:var(--bg5);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-warn{background:var(--warn);color:#000;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.bdg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.bdg-acc{background:rgba(34,211,165,.15);color:var(--acc1);}
.bdg-green{background:rgba(34,211,165,.15);color:var(--acc1);}
.bdg-yellow{background:rgba(245,158,11,.15);color:var(--warn);}
.bdg-red{background:rgba(244,63,94,.15);color:var(--danger);}
.bdg-gray{background:var(--bg4);color:var(--text3);}
.bdg-purple{background:rgba(168,85,247,.15);color:var(--purple);}
.bdg-blue{background:rgba(59,130,246,.15);color:var(--blue);}
.empty{text-align:center;padding:40px 20px;color:var(--text3);}
.empty-ico{font-size:32px;margin-bottom:8px;}
.entry{background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.entry-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
.entry-body{flex:1;min-width:0;}
.entry-name{font-weight:600;font-size:14px;}
.entry-sub{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entry-actions{display:flex;gap:4px;flex-shrink:0;}
.role-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;}
.role-card:hover{border-color:var(--acc1);}
.role-av{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;}
.perm-module{background:var(--bg3);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;}
.perm-module-hdr{padding:12px;font-weight:600;cursor:pointer;display:flex;
  justify-content:space-between;align-items:center;}
.perm-module-body{padding:0 12px 12px;display:none;}
.perm-module-body.on{display:block;}
.perm-sub{margin-bottom:10px;}
.perm-sub-title{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.5px;}
.perm-actions{display:flex;flex-wrap:wrap;gap:6px;}
.perm-chk{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;
  background:var(--bg4);border:1px solid var(--border);border-radius:5px;padding:4px 8px;}
.perm-chk input{accent-color:var(--acc1);}
.session-entry{background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.audit-entry{background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;}
.fchip{background:var(--bg3);border:1px solid var(--border);border-radius:20px;
  padding:5px 12px;font-size:12px;cursor:pointer;color:var(--text2);}
.fchip.on{background:var(--acc1);color:#000;border-color:var(--acc1);}
.search-row{display:flex;gap:8px;margin-bottom:12px;align-items:center;}
.search-row .fi{margin:0;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
  align-items:flex-end;justify-content:center;}
.overlay.on{display:flex;}
.modal{background:var(--bg2);border-radius:var(--r) var(--r) 0 0;padding:20px;
  width:100%;max-width:600px;max-height:85vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--bg4);color:var(--text1);padding:10px 20px;border-radius:8px;
  font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.err{background:var(--danger);}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat{background:var(--bg3);border-radius:8px;padding:12px;text-align:center;}
.stat-val{font-size:22px;font-weight:700;color:var(--acc1);}
.stat-lbl{font-size:11px;color:var(--text3);margin-top:2px;}
.pol-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;
  border-bottom:1px solid var(--border);}
.pol-row:last-child{border:none;}
.switch{position:relative;width:40px;height:22px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch-sl{position:absolute;inset:0;background:var(--bg4);border-radius:11px;cursor:pointer;transition:.3s;}
.switch-sl:before{content:"";position:absolute;width:16px;height:16px;left:3px;bottom:3px;
  background:#fff;border-radius:50%;transition:.3s;}
input:checked+.switch-sl{background:var(--acc1);}
input:checked+.switch-sl:before{transform:translateX(18px);}
@media(min-width:600px){.tab-bar{padding:12px 16px 0;}.content{padding:20px 16px;}}

</style>
<style id="veraluz-theme">
/* ═══ VERALUZ THEME PROMPT 036F ═══════════════════════════════════════════
   Light : bg #e8ecf0 · surfaces #fff · neumorphic shadows
   Dark  : bg #131722 · surfaces #1e2538
   Toggle: html.vl-dark / localStorage('vl_theme')
═══════════════════════════════════════════════════════════════════════════ */

/* ── Variables universelles (couvre tous les modules) ─────────────────── */
:root{
  --bg:#e8ecf0;--bg1:#e8ecf0;--bg2:#fff;--bg3:#eef1f5;--bg4:#e0e4e8;--bg5:#d8dce0;
  --text:#1e293b;--text2:#475569;--text3:#94a3b8;
  --tx:#1e293b;--tx2:#475569;--tx3:#94a3b8;
  --border:rgba(0,0,0,.07);--border2:rgba(0,0,0,.10);--border3:rgba(0,0,0,.05);
  --vl-sh:4px 4px 12px #c8cdd4,-2px -2px 8px #fff;
  --vl-sh-in:inset 2px 2px 6px #c8cdd4,inset -1px -1px 4px #fff;
  --vl-r:3px;
}
html,body{background:var(--bg)!important;color:var(--text)!important;}

/* ── Dark mode ────────────────────────────────────────────────────────── */
html.vl-dark{
  --bg:#131722;--bg1:#131722;--bg2:#1a1f2e;--bg3:#1e2538;--bg4:#252d42;--bg5:#2d3654;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --tx:#e2e8f0;--tx2:#94a3b8;--tx3:#64748b;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.10);--border3:rgba(255,255,255,.05);
  --vl-sh:4px 4px 12px #0d1118,-2px -2px 8px #242b3e;
  --vl-sh-in:inset 2px 2px 6px #0d1118,inset -1px -1px 4px #242b3e;
}
html.vl-dark body{background:var(--bg)!important;color:var(--text)!important;}

/* ── Topbar / Header ──────────────────────────────────────────────────── */
.topbar,.header,.mod-header,.page-header{background:var(--bg2)!important;border-bottom:1px solid var(--border)!important;box-shadow:0 1px 6px rgba(0,0,0,.05)!important;}
html.vl-dark .topbar,html.vl-dark .header,html.vl-dark .mod-header{background:var(--bg2)!important;border-bottom:1px solid var(--border)!important;}

/* ── Tabs / Tabbar ────────────────────────────────────────────────────── */
.tabbar,.tab-bar,.tabs,.nav-tabs{background:var(--bg3)!important;border-bottom:1px solid var(--border)!important;}
html.vl-dark .tabbar,html.vl-dark .tab-bar,html.vl-dark .tabs,html.vl-dark .nav-tabs{background:var(--bg2)!important;}
.tab-btn.active,.tab.active,.nav-link.active{color:#0891b2!important;border-bottom-color:#0891b2!important;}
html.vl-dark .tab-btn.active,html.vl-dark .tab.active{color:#22d3ee!important;border-bottom-color:#22d3ee!important;}

/* ── Cards / Panels ───────────────────────────────────────────────────── */
.card,.panel,.pane,.item,.contact-item,.msg-item,.doc-item,.audit-item,.appro-item,
.list-item,.entry,.result-card,.ai-card,.agent-card,.chloe-card,.section-card,
.setting-card,.setting-group,.auth-card,.approval-card{
  background:var(--bg2)!important;border:1px solid var(--border)!important;
  box-shadow:var(--vl-sh)!important;}
html.vl-dark .card,html.vl-dark .panel,html.vl-dark .pane,html.vl-dark .item,
html.vl-dark .contact-item,html.vl-dark .msg-item,html.vl-dark .doc-item,
html.vl-dark .audit-item,html.vl-dark .appro-item,html.vl-dark .list-item,
html.vl-dark .entry,html.vl-dark .result-card,html.vl-dark .ai-card,
html.vl-dark .agent-card,html.vl-dark .chloe-card,html.vl-dark .section-card,
html.vl-dark .setting-card,html.vl-dark .setting-group,html.vl-dark .auth-card,
html.vl-dark .approval-card{background:var(--bg3)!important;border:1px solid var(--border)!important;}

/* ── Sidebars / Panels latéraux ───────────────────────────────────────── */
.sidebar,.side-panel,.left-panel,.right-panel,.detail-panel{background:var(--bg2)!important;border-right:1px solid var(--border)!important;}
html.vl-dark .sidebar,html.vl-dark .side-panel,html.vl-dark .left-panel,html.vl-dark .right-panel{background:var(--bg2)!important;}

/* ── Content zones (APPRO/CONTACTS hardcoded bg) ─────────────────────── */
.content,.content-area,.main-content,.list-area,.contact-list,.msg-list,.results,
.search-results,.appro-list,.contacts-body,.body-area{background:var(--bg)!important;}
html.vl-dark .content,html.vl-dark .content-area,html.vl-dark .main-content,
html.vl-dark .list-area,html.vl-dark .contact-list,html.vl-dark .msg-list,
html.vl-dark .results,html.vl-dark .appro-list,html.vl-dark .contacts-body{background:var(--bg)!important;}

/* ── Search boxes ─────────────────────────────────────────────────────── */
.sbox,.search-box,.search-wrap{background:var(--bg3)!important;border-color:var(--border2)!important;}
html.vl-dark .sbox,html.vl-dark .search-box{background:var(--bg3)!important;}

/* ── Inputs ───────────────────────────────────────────────────────────── */
input:not([type=checkbox]):not([type=radio]),select,textarea{
  background:var(--bg3)!important;border:1px solid var(--border2)!important;
  border-radius:var(--vl-r)!important;color:var(--text)!important;}
input:not([type=checkbox]):not([type=radio]):focus,select:focus,textarea:focus{
  border-color:#0891b2!important;box-shadow:0 0 0 2px rgba(8,145,178,.12)!important;outline:none!important;}
html.vl-dark input:not([type=checkbox]):not([type=radio]),html.vl-dark select,html.vl-dark textarea{
  background:var(--bg4)!important;border-color:var(--border2)!important;}

/* ── Icônes monochromes ───────────────────────────────────────────────── */
.icon,.icon-wrap,.action-icon,.stat-icon,.feature-icon,.btn-icon,.tag-icon,
.avatar-placeholder,.initials-avatar{
  background:rgba(8,145,178,.10)!important;color:#0891b2!important;border-radius:var(--vl-r)!important;}
html.vl-dark .icon,html.vl-dark .icon-wrap,html.vl-dark .action-icon,
html.vl-dark .stat-icon,html.vl-dark .feature-icon,html.vl-dark .btn-icon{
  background:rgba(8,145,178,.18)!important;color:#22d3ee!important;}

/* ── Boutons secondaires ──────────────────────────────────────────────── */
.btn-sec,.btn-outline,.btn-ghost{border-radius:var(--vl-r)!important;background:var(--bg3)!important;border:1px solid var(--border2)!important;color:var(--text)!important;}
html.vl-dark .btn-sec,html.vl-dark .btn-outline{background:var(--bg4)!important;}

/* ── Modals ───────────────────────────────────────────────────────────── */
.modal,.modal-content,.modal-box,.dialog{background:var(--bg2)!important;border:1px solid var(--border)!important;box-shadow:0 20px 60px rgba(0,0,0,.15)!important;}
html.vl-dark .modal,html.vl-dark .modal-content,html.vl-dark .modal-box{background:var(--bg3)!important;}

/* ── Scrollbar ────────────────────────────────────────────────────────── */
::-webkit-scrollbar{width:4px!important;height:4px!important;}
::-webkit-scrollbar-track{background:var(--bg)!important;}
::-webkit-scrollbar-thumb{background:#c8cdd4!important;border-radius:2px!important;}
html.vl-dark ::-webkit-scrollbar-thumb{background:#2d3654!important;}

/* ── Toggle FAB ───────────────────────────────────────────────────────── */
#vl-tm-btn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);right:14px;z-index:9990;width:36px;height:36px;border-radius:3px;border:none;background:#fff;color:#475569;cursor:pointer;font-size:15px;box-shadow:4px 4px 12px #c8cdd4,-2px -2px 8px #fff;display:flex;align-items:center;justify-content:center;transition:box-shadow .2s,transform .15s;}
#vl-tm-btn:hover{transform:scale(1.05);}
html.vl-dark #vl-tm-btn{background:#1e2538;color:#94a3b8;box-shadow:4px 4px 12px #0d1118,-2px -2px 8px #242b3e;}
</style>
</head>
<body>
<button id="vl-tm-btn" onclick="toggleVlTheme()" title="Thème">🌙</button>
<div class="app">

<div class="tab-bar">
  <div class="tab on" data-tab="profil" onclick="goTab(this)">&#x1F464; Profil</div>
  <div class="tab" data-tab="users" onclick="goTab(this)">&#x1F465; Utilisateurs</div>
  <div class="tab" data-tab="roles" onclick="goTab(this)">&#x1F6E1; R&ocirc;les</div>
  <div class="tab" data-tab="sessions" onclick="goTab(this)">&#x1F4BB; Sessions</div>
  <div class="tab" data-tab="audit" onclick="goTab(this)">&#x1F4CB; Audit</div>
  <div class="tab" data-tab="security" onclick="goTab(this)">&#x1F512; S&eacute;curit&eacute;</div>
</div>
<div class="content" id="main-content"></div>
<div id="toast"></div>

<!-- Modal: New/Edit User -->
<div class="overlay" id="md-user">
  <div class="modal" id="md-user-body"></div>
</div>

</div>

<script>

/* ═══════════════════════════════════════════════════════════
   VERALUZ OS — AUTH MODULE v2.0
   Gestion utilisateurs · RBAC complet · Sessions · Audit
   ════════════════════════════════════════════════════════ */
'use strict';
var MODULE_VER = '2.0';
var currentTabId = 'profil';

/* ── Supabase config (héritée du parent CORE.html) — clé anon publique safe ── */
var _SB_URL  = (function(){ try{ return window.parent.SUPA_URL || ''; }catch(e){ return ''; } })()
             || 'https://dfdmasejsoibxrvubegu.supabase.co';
var _SB_KEY  = (function(){ try{ return window.parent.SUPA_KEY || ''; }catch(e){ return ''; } })()
             || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmZG1hc2Vqc29pYnhydnViZWd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDgzOTMsImV4cCI6MjA5MjI4NDM5M30.dEsafV84HFmFqU6Yi4xKydIbUlkIVE7QMRMpFt8kqXY';
var _EDGE_RESET_PIN  = _SB_URL + '/functions/v1/reset-employee-pin';

/* ── Cache employés Supabase pour onglet Utilisateurs ──────────────────────── */
var _sbEmp = [];          /* tableau d'objets {id, full_name, role, status, ...} */
var _sbEmpLoaded = false;

function loadSBEmployees(cb) {
  fetch(_SB_URL + '/rest/v1/veraluz_employees_public?select=id,full_name,role,status&order=full_name.asc', {
    headers: { apikey: _SB_KEY, Authorization: 'Bearer ' + _SB_KEY }
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if (Array.isArray(data)) {
      _sbEmp = data;
      _sbEmpLoaded = true;
    }
    if (cb) cb();
  })
  .catch(function(e){
    console.warn('[AUTH] Erreur chargement employés Supabase:', e);
    if (cb) cb();
  });
}

/* ── Réinitialisation PIN employé ─────────────────────────────────────────── */
function openResetPinMd(empId, empName) {
  document.getElementById('md-reset-pin-body').innerHTML
    = '<div class="modal-title">🔑 Réinitialiser le PIN</div>'
    + '<div style="color:var(--text2);font-size:13px;margin-bottom:14px;">'
    + 'Employé : <strong>' + esc(empName) + '</strong><br>'
    + 'Un PIN temporaire à 6 chiffres sera généré et affiché une seule fois.<br>'
    + "L'employé devra le changer à sa prochaine connexion."
    + '</div>'
    + '<div id="rp-result" style="display:none;background:var(--bg3);border:1.5px solid #22d3a5;border-radius:10px;padding:18px 14px;margin-bottom:14px;text-align:center;">'
    + '<div style="font-size:11px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.8px;">PIN provisoire</div>'
    + '<div id="rp-pin" style="font-size:36px;font-weight:900;letter-spacing:10px;color:#22d3a5;font-family:monospace;margin:6px 0 2px;"></div>'
    + '<div id="rp-exp" style="font-size:11px;color:var(--text2);margin-bottom:8px;"></div>'
    + '<div style="font-size:11px;color:#f87171;font-weight:700;background:rgba(239,68,68,.12);border-radius:6px;padding:6px 10px;">⚠️ Ce PIN ne sera affiché qu&#39;une seule fois. Notez-le maintenant.</div>'
    + '</div>'
    + '<div class="btn-row" id="rp-btn-row">'
    + '<button class="btn btn-sec" onclick="closeMd(\'md-reset-pin\')">Annuler</button>'
    + '<button class="btn btn-warn" id="rp-confirm-btn" data-eid="' + esc(empId) + '" data-ename="' + esc(empName) + '" onclick="doResetPin(this)">🔑 Générer PIN temporaire</button>'
    + '</div>';
  openMd('md-reset-pin');
}

function doResetPin(btn) {
  var empId   = btn.dataset.eid;
  var empName = btn.dataset.ename;

  /* PROMPT 009B — CORRECTION SECURITE : cette iframe ne recoit plus jamais
     le session_token brut (retire de sendAuthContext cote CORE). L'appel
     passe desormais par le broker unique window.parent.veraluzSecureRequest,
     qui vit dans CORE : c'est CORE qui ajoute le vrai session_token avant
     d'appeler reset-employee-pin, jamais cette iframe. L'autorite reste
     entierement cote serveur (reset-employee-pin v5 revalide la session et
     le role Direction lui-meme) — ce broker ne fait que proteger le jeton,
     il n'accorde aucun droit. */
  if (!window.parent || typeof window.parent.veraluzSecureRequest !== 'function') {
    toast('Broker de session introuvable — reconnectez-vous depuis Veraluz OS', true);
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ Génération…';

  window.parent.veraluzSecureRequest('reset-employee-pin', { employee_id: empId })
  .then(function(r){ return r.body; })
  .then(function(result){
    if (!result.ok) {
      var _ep=['Erreur : '+(result.error||'Échec reset PIN')];if(result.detail)_ep.push('Détail : '+result.detail);if(result.code)_ep.push('Code : '+result.code);toast(_ep.join(' | '),true);
      btn.disabled = false; btn.textContent = '🔑 Générer PIN temporaire';
      return;
    }
    /* Afficher le PIN une seule fois */
    toast('✅ PIN provisoire généré — copiez-le maintenant !', false);
    document.getElementById('rp-result').style.display = 'block';
    document.getElementById('rp-pin').textContent = result.temporary_pin;
    var exp = result.expires_at ? new Date(result.expires_at).toLocaleString('fr-FR') : '24h';
    document.getElementById('rp-exp').textContent = 'Expire le : ' + exp;
    document.getElementById('rp-btn-row').innerHTML
      = '<button class="btn btn-sec" onclick="copyTempPin()">📋 Copier le PIN</button>'
      + '<button class="btn btn-primary" onclick="closeMd(\'md-reset-pin\')">✅ Fermé — PIN noté</button>';
    audit('reset_pin', { employee_id: empId, employee_name: empName, by: (getCurrentUser()||{}).name || 'Direction' });
  })
  .catch(function(e){
    toast('Erreur réseau : impossible de contacter le serveur', true);
    btn.disabled = false; btn.textContent = '🔑 Générer PIN temporaire';
  });
}

/* ── Copier PIN temporaire (PROMPT 020C — M6) ─────────────────────────────── */
function copyTempPin() {
  var el = document.getElementById('rp-pin');
  if (!el) return;
  var pin = el.textContent || '';
  if (!pin) { toast('Aucun PIN à copier', true); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(pin).then(function() {
      toast('PIN copié dans le presse-papier ✅');
    }).catch(function() {
      _copyTempPinFallback(pin);
    });
  } else {
    _copyTempPinFallback(pin);
  }
}
function _copyTempPinFallback(pin) {
  var ta = document.createElement('textarea');
  ta.value = pin; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('PIN copié ✅'); }
  catch(e) { toast('Copie impossible — notez le PIN manuellement', true); }
  document.body.removeChild(ta);
}

function esc(s){
  if(!s) return '';

}
function fmt_date(d){ if(!d)return '—'; try{return new Date(d).toLocaleDateString('fr-FR');}catch(e){return d;} }
function fmt_ago(d){
  if(!d) return '—';
  try{
    var s=Math.round((Date.now()-new Date(d))/1000);
    if(s<60) return 'À lʾinstant';
    if(s<3600) return Math.floor(s/60)+'min';
    if(s<86400) return Math.floor(s/3600)+'h';
    return Math.floor(s/86400)+'j';
  }catch(e){return d;}
}
function fmt_ts(d){
  if(!d) return '—';
  try{ return new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
  catch(e){return d;}
}

  var colors=['#22d3a5','#818cf8','#f59e0b','#f43f5e','#10b981','#3b82f6','#a855f7','#f97316'];
  var h=0;
  for(var i=0;i<(name||'').length;i++){ h=(h*31+name.charCodeAt(i))%colors.length; }
  return colors[Math.abs(h)%colors.length];
}

  technicien:   ['housekeeping.read','messages.read','employees.directory'],
  agent_securite:['employees.directory','messages.read'],
  staff:        ['messages.read'],
};
var _RBAC_LABELS = {
  gerant:'Gérant / Directeur',manager:'Manager',receptionniste:'Réceptionniste',
  barman:'Barman / Serveur',cuisinier:'Cuisinier / Chef',femme_chambre:'Femme de chambre',
  livreur:'Livreur',comptable:'Comptable',rh:'RH',technicien:'Technicien',
  agent_securite:'Agent Sécurité',staff:'Staff'
};
var _rbacSelectedRole = null;

function selectRbacRole(role){
  _rbacSelectedRole = _rbacSelectedRole===role ? null : role;

  if(wrap) wrap.innerHTML = _renderRbacMatrix();
}

function _renderRbacMatrix(){
  var html = '<div style="background:rgba(245,158,11,0.1);border:1px solid #f59e0b;border-radius:6px;'
    +'padding:8px 12px;font-size:12px;color:var(--text2);margin-bottom:12px;">'
    +'&#128274; Matrice RBAC canonique — source de vérité serveur. Lecture seule dans cette interface.</div>';
  Object.keys(_RBAC_MATRIX).forEach(function(role){
    var caps = _RBAC_MATRIX[role];
    var label = _RBAC_LABELS[role]||role;
    var isOpen = _rbacSelectedRole===role;
    html+='<div class="role-card'+(isOpen?' on':'')+'" data-role="'+role+'" onclick="selectRbacRole(this.dataset.role)" style="cursor:pointer;'+(isOpen?'border-color:var(--acc1);':'')+'margin-bottom:8px;">';
    html+='<div style="display:flex;align-items:center;justify-content:space-between;">'
      +'<div style="font-weight:600;font-size:13px;">'+esc(label)+'</div>'
      +'<div style="display:flex;align-items:center;gap:8px;">'
      +'<span style="font-size:11px;color:var(--text3);">'+caps.length+' capabilities</span>'
      +'<span style="font-size:11px;color:var(--text3);">'+(isOpen?'▴':'▾')+'</span>'
      +'</div></div>';
    if(isOpen){
      html+='<div style="margin-top:10px;border-top:1px solid var(--bg4);padding-top:10px;">';
      // Group by domain
      var domains = {};
      caps.forEach(function(c){
        var parts=c.split('.');
        var dom=parts[0];
        if(!domains[dom]) domains[dom]=[];
        domains[dom].push(parts.slice(1).join('.'));
      });
      Object.keys(domains).sort().forEach(function(dom){
        html+='<div style="margin-bottom:6px;">'
          +'<span style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;">'+esc(dom)+'</span> '
          + domains[dom].map(function(a){
              return '<span style="display:inline-block;margin:1px 3px;padding:2px 7px;border-radius:10px;font-size:11px;background:var(--acc1)20;color:var(--acc1);font-weight:500;">'+esc(a)+'</span>';
            }).join('');
        html+='</div>';
      });
      html+='</div>';
    }
    html+='</div>';
  });
  return html;
}

function renderRoles(){
  setTimeout(function(){
    var wrap=document.getElementById('roles-wrap');
    if(wrap) wrap.innerHTML=_renderRbacMatrix();

function openUserPerms(uid){

      subDef.actions.forEach(function(a){

      });
      html+='</div></div>';
    });
    html+='</div>';
  });

function saveUserPerms(uid){
  var users=getUsers();
  var idx=users.findIndex(function(u){ return u.id===uid; });
  if(idx<0) return;
  var p={};
  Object.keys(PERM_SCHEMA).forEach(function(mod){
    Object.keys(PERM_SCHEMA[mod].sub).forEach(function(sub){
      PERM_SCHEMA[mod].sub[sub].actions.forEach(function(a){
        var chk=document.getElementById('upck-'+mod+'-'+sub+'-'+a);
        if(chk&&chk.checked){
          if(!p[mod]) p[mod]={};
          if(!p[mod][sub]) p[mod][sub]={};
          p[mod][sub][a]=true;
        }
      });
    });
  });
  users[idx].perms_override=p;
  saveUsers(users);
  audit('user-perms',{uid:uid,name:users[idx].name});
  closeMd('md-perms');
  toast('Permissions mises à jour');
}

/* ══════════════════════════════════════════════════════════════
   TAB: SESSIONS — AUTH-R6 (données réelles auth-admin-secure)
═══════════════════════════════════════════════════════════════ */
var _sessLoaded = false;
var _sessData   = null; /* { sessions:[], meta:{} } */
var _sessError  = null;

function loadRealSessions(cb) {
  if (!window.parent || typeof window.parent.veraluzSecureRequest !== 'function') {
    _sessError = 'broker_unavailable';
    _sessLoaded = true;
    if (cb) cb();
    return;
  }
  window.parent.veraluzSecureRequest('auth-admin-secure', { action: 'list_sessions' })
    .then(function(r){ return r.body; })
    .then(function(res){
      if (res && res.ok) {
        _sessData  = res;
        _sessError = null;
      } else {
        _sessError = res && res.error ? res.error : 'server_error';
      }
      _sessLoaded = true;
      if (cb) cb();
    })
    .catch(function(){
      _sessError  = 'network_error';
      _sessLoaded = true;
      if (cb) cb();
    });
}

function reloadSessions() {
  _sessLoaded = false;
  _sessData   = null;
  _sessError  = null;
  renderTab('sessions');
}

function killSession(sid) {
  if (!confirm('Terminer cette session maintenant ?')) return;
  if (!window.parent || typeof window.parent.veraluzSecureRequest !== 'function') {
    toast('Broker indisponible', true); return;
  }
  window.parent.veraluzSecureRequest('auth-admin-secure', { action: 'revoke_session', session_id: sid })
    .then(function(r){ return r.body; })
    .then(function(res){
      if (res && res.ok) {
        toast('Session révoquée');
        reloadSessions();
      } else {
        var msg = res && res.error === 'cannot_revoke_own_session'
          ? 'Impossible de révoquer votre session courante'
          : (res && res.error ? 'Erreur : ' + res.error : 'Révocation échouée');
        toast(msg, true);
      }
    })
    .catch(function(){ toast('Erreur réseau', true); });
}

function revokeAllForEmployee(empId, empName) {
  if (!confirm('Déconnecter TOUTES les sessions de ' + empName + ' ?')) return;
  if (!window.parent || typeof window.parent.veraluzSecureRequest !== 'function') {
    toast('Broker indisponible', true); return;
  }
  window.parent.veraluzSecureRequest('auth-admin-secure', { action: 'revoke_employee_sessions', employee_id: empId })
    .then(function(r){ return r.body; })
    .then(function(res){
      if (res && res.ok) {
        toast('Sessions de ' + esc(empName) + ' révoquées (' + (res.sessions_revoked || 0) + ')');
        reloadSessions();
      } else {
        toast(res && res.error ? 'Erreur : ' + res.error : 'Révocation échouée', true);
      }
    })
    .catch(function(){ toast('Erreur réseau', true); });
}

function renderSessions() {
  if (!_sessLoaded) {
    loadRealSessions(function(){ renderTab('sessions'); });
    return '<div class="empty"><div class="empty-ico">⏳</div>Chargement des sessions…</div>';
  }

  if (_sessError === 'broker_unavailable') {
    return '<div class="card"><div style="color:var(--text2);font-size:13px;">⚠️ Broker de session indisponible — ouvrez AUTH depuis Veraluz OS.</div></div>';
  }
  if (_sessError === 'forbidden' || _sessError === 'invalid_or_expired_session') {
    return '<div class="card"><div style="color:var(--text2);font-size:13px;">🔒 Accès refusé — droits <code>auth.sessions.read</code> requis.</div></div>';
  }
  if (_sessError) {
    return '<div class="card"><div style="color:var(--danger);font-size:13px;">Erreur chargement sessions : ' + esc(_sessError)
      + ' <button class="btn btn-sec btn-sm" onclick="reloadSessions()" style="margin-left:8px;">↻ Réessayer</button></div></div>';
  }

  var sessions = (_sessData && _sessData.sessions) || [];
  var meta     = (_sessData && _sessData.meta)     || { total: 0, active: 0, revoked: 0 };

  var html = '<div class="stat-row">'
    + '<div class="stat"><div class="stat-val">' + meta.total + '</div><div class="stat-lbl">Sessions total</div></div>'
    + '<div class="stat"><div class="stat-val" style="color:var(--success);">' + meta.active + '</div><div class="stat-lbl">Actives</div></div>'
    + '<div class="stat"><div class="stat-val" style="color:var(--text3);">' + meta.revoked + '</div><div class="stat-lbl">Révoquées</div></div>'
    + '</div>'
    + '<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px;">'
    + '<button class="btn btn-sec btn-sm" onclick="reloadSessions()">↻ Actualiser</button>'
    + '</div>';

  if (!sessions.length) {
    html += '<div class="empty"><div class="empty-ico">🔑</div>Aucune session enregistrée</div>';
    return html;
  }

  sessions.forEach(function(s) {
    var isCurrent = s.is_current;
    var isActive  = s.active;
    var empName   = (s.employee && s.employee.name) || '—';
    var empRole   = (s.employee && s.employee.role) || '—';
    var empId     = (s.employee && s.employee.id)   || '';

    html += '<div class="session-entry" style="' + (isCurrent ? 'border:1.5px solid var(--acc);' : '') + '">'
      + '<div style="flex:1;">'
      + '<div style="font-weight:600;">' + esc(empName)
      + (isCurrent ? ' <span class="bdg bdg-acc" style="font-size:10px;">Cette session</span>' : '')
      + '</div>'
      + '<div style="font-size:12px;color:var(--text2);margin-top:2px;">'
      + '<span class="bdg bdg-gray">' + esc(empRole) + '</span>'
      + ' &nbsp;·&nbsp; 🖥 ' + esc(s.device || 'Non disponible')
      + '</div>'
      + '<div style="font-size:11px;color:var(--text3);margin-top:1px;">'
      + '🌐 IP&nbsp;: ' + esc(s.ip || 'Non disponible')
      + '</div>'
      + '<div style="font-size:11px;color:var(--text3);margin-top:2px;">'
      + 'Début : ' + fmt_ts(s.created_at)
      + (s.last_seen_at ? ' &nbsp;·&nbsp; Actif : ' + fmt_ago(s.last_seen_at) : '')
      + (s.revoked_at ? ' &nbsp;·&nbsp; Révoquée : ' + fmt_ts(s.revoked_at) : '')
      + '</div>'
      + '</div>'
      + '<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">';

    if (isActive && !isCurrent) {
      html += '<button class="btn btn-danger btn-sm" data-sid="' + esc(s.session_id) + '" onclick="killSession(this.dataset.sid)" title="Révoquer cette session">✕</button>';
    } else if (isCurrent) {
      html += '<span class="bdg bdg-green">Active</span>';
    } else {
      html += '<span class="bdg bdg-gray">Révoquée</span>';
    }

    if (isActive && empId && !isCurrent) {
      html += '<button class="btn btn-warn btn-sm" style="font-size:10px;" data-eid="' + esc(empId) + '" data-ename="' + esc(empName) + '" onclick="revokeAllForEmployee(this.dataset.eid,this.dataset.ename)" title="Révoquer toutes les sessions de cet employé">Tout</button>';
    }

    html += '</div></div>';
  });

  return html;
}

/* ══════════════════════════════════════════════════════════════
   TAB: AUDIT — AUTH-R6 (données réelles veraluz_auth_events)
═══════════════════════════════════════════════════════════════ */
var _auditLoaded = false;
var _auditData   = null;
var _auditError  = null;
var _auditFilterType = '';

var AUDIT_EVENT_LABELS = {
  login_success:              'Connexion réussie',
  login_failed:               'Échec connexion',
  logout:                     'Déconnexion',
  pin_reset:                  'PIN réinitialisé',
  pin_change:                 'PIN modifié',
  login_must_change_pin:      'PIN provisoire',
  forced_pin_change_completed:'Nouveau PIN défini',
  sessions_revoked:           'Sessions révoquées',
  session_revoked:            'Session révoquée',
  pin_change_token_issued:    'Jeton PIN émis',
  resume_token_issued:        'Jeton reprise émis',
  resume_used:                'Reprise session',
  access_forbidden:           'Accès refusé'
};

var AUDIT_FILTER_OPTIONS = [
  {key:'',               label:'Tous'},
  {key:'login_success',  label:'Connexions'},
  {key:'login_failed',   label:'Échecs'},
  {key:'pin_reset',      label:'Resets PIN'},
  {key:'logout',         label:'Déconnexions'},
  {key:'sessions_revoked',label:'Révocations'},
];

function loadRealAudit(cb) {
  if (!window.parent || typeof window.parent.veraluzSecureRequest !== 'function') {
    _auditError = 'broker_unavailable';
    _auditLoaded = true;
    if (cb) cb();
    return;
  }
  var payload = { action: 'list_audit', limit: 100 };
  if (_auditFilterType) payload.event_type = _auditFilterType;
  window.parent.veraluzSecureRequest('auth-admin-secure', payload)
    .then(function(r){ return r.body; })
    .then(function(res){
      if (res && res.ok) {
        _auditData  = res;
        _auditError = null;
      } else {
        _auditError = (res && res.error) || 'server_error';
      }
      _auditLoaded = true;
      if (cb) cb();
    })
    .catch(function(){
      _auditError  = 'network_error';
      _auditLoaded = true;
      if (cb) cb();
    });
}

function setAuditFilter(f) {
  _auditFilterType = f;
  _auditLoaded     = false;
  _auditData       = null;
  _auditError      = null;
  renderTab('audit');
}

function reloadAudit() {
  _auditLoaded = false;
  _auditData   = null;
  _auditError  = null;
  renderTab('audit');
}

function renderAudit() {
  var html = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">';
  AUDIT_FILTER_OPTIONS.forEach(function(f) {
    html += '<button class="fchip' + (_auditFilterType === f.key ? ' on' : '') + '" data-f="' + esc(f.key) + '" onclick="setAuditFilter(this.dataset.f)">' + f.label + '</button>';
  });
  html += '<button class="btn btn-sec btn-sm" onclick="reloadAudit()" style="margin-left:auto;">↻</button>';
  html += '</div>';

  if (!_auditLoaded) {
    loadRealAudit(function(){ renderTab('audit'); });
    html += '<div class="empty"><div class="empty-ico">⏳</div>Chargement de l\'audit…</div>';
    return html;
  }

  if (_auditError === 'broker_unavailable') {
    html += '<div class="card"><div style="color:var(--text2);font-size:13px;">⚠️ Broker de session indisponible — ouvrez AUTH depuis Veraluz OS.</div></div>';
    return html;
  }
  if (_auditError === 'forbidden' || _auditError === 'invalid_or_expired_session') {
    html += '<div class="card"><div style="color:var(--text2);font-size:13px;">🔒 Accès refusé — droits <code>auth.audit.read</code> requis.</div></div>';
    return html;
  }
  if (_auditError) {
    html += '<div class="card"><div style="color:var(--danger);font-size:13px;">Erreur : ' + esc(_auditError) + '</div></div>';
    return html;
  }

  var events = (_auditData && _auditData.events) || [];
  if (!events.length) {
    html += '<div class="empty"><div class="empty-ico">📋</div>Aucun événement d\'audit</div>';
    return html;
  }

  events.forEach(function(e) {
    var label   = e.event_label || AUDIT_EVENT_LABELS[e.event_type] || e.event_type;
    var success = e.success !== false;
    var badgeCls = success ? 'bdg-green' : 'bdg-red';

    html += '<div class="audit-entry">'
      + '<div style="font-size:11px;color:var(--text3);flex-shrink:0;min-width:90px;">' + fmt_ts(e.created_at) + '</div>'
      + '<div style="flex:1;min-width:0;">'
      + '<span class="bdg ' + badgeCls + '">' + esc(label) + '</span>'
      + (e.performed_by_role ? ' <span class="bdg bdg-gray" style="font-size:10px;">' + esc(e.performed_by_role) + '</span>' : '')
      + (e.employee_id || e.admin_username
          ? '<span style="font-size:12px;color:var(--text2);margin-left:6px;">' + esc(e.admin_username || e.employee_id || '') + '</span>'
          : '')
      + (e.ip ? '<span style="font-size:11px;color:var(--text3);margin-left:6px;">🌐 ' + esc(e.ip) + '</span>' : '')
      + (e.details && e.details.reason
          ? '<div style="font-size:11px;color:var(--text3);margin-top:2px;">Raison : ' + esc(e.details.reason) + '</div>'
          : '')
      + (e.details && e.details.session_count !== undefined
          ? '<div style="font-size:11px;color:var(--text3);margin-top:2px;">Sessions : ' + e.details.session_count + '</div>'
          : '')
      + '</div></div>';
  });

  return html;
}

/* ══════════════════════════════════════════════════════════════
   TAB: SÉCURITÉ — AUTH-R6 (politiques réelles lecture seule)
═══════════════════════════════════════════════════════════════ */
var _secLoaded   = false;
var _secPolicies = null;
var _secError    = null;

function loadSecPolicies(cb) {
  if (!window.parent || typeof window.parent.veraluzSecureRequest !== 'function') {
    _secError  = 'broker_unavailable';
    _secLoaded = true;
    if (cb) cb();
    return;
  }
  window.parent.veraluzSecureRequest('auth-admin-secure', { action: 'get_security_policies' })
    .then(function(r){ return r.body; })
    .then(function(res){
      if (res && res.ok) {
        _secPolicies = res.policies;
        _secError    = null;
      } else {
        _secError = (res && res.error) || 'server_error';
      }
      _secLoaded = true;
      if (cb) cb();
    })
    .catch(function(){
      _secError  = 'network_error';
      _secLoaded = true;
      if (cb) cb();
    });
}

function renderSecurite() {
  if (!_secLoaded) {
    loadSecPolicies(function(){ renderTab('security'); });
    return '<div class="empty"><div class="empty-ico">⏳</div>Chargement des politiques…</div>';
  }

  var amber = 'background:rgba(251,191,36,.12);border:1.5px solid #fbbf24;border-radius:8px;padding:8px 12px;font-size:12px;color:#fbbf24;margin-bottom:14px;';
  var html = '<div style="' + amber + '">🔒 Politiques de sécurité — lecture seule. Toutes les valeurs sont appliquées côté serveur et ne peuvent pas être modifiées depuis l\'interface.</div>';

  if (_secError === 'broker_unavailable') {
    return html + '<div class="card"><div style="color:var(--text2);font-size:13px;">⚠️ Broker indisponible — ouvrez AUTH depuis Veraluz OS.</div></div>';
  }
  if (_secError) {
    return html + '<div class="card"><div style="color:var(--danger);font-size:13px;">Erreur chargement politiques : ' + esc(_secError) + '</div></div>';
  }

  var p = _secPolicies || {};

  function polRow(label, value, note) {
    return '<div class="pol-row">'
      + '<div><div style="font-weight:500;">' + label + '</div>'
      + (note ? '<div style="font-size:11px;color:var(--text3);">' + note + '</div>' : '')
      + '</div>'
      + '<div style="display:flex;align-items:center;gap:8px;">'
      + '<span style="font-weight:700;color:var(--text1);">' + esc(String(value)) + '</span>'
      + '<span style="font-size:10px;background:var(--bg3);color:var(--text3);border-radius:4px;padding:1px 6px;">Serveur</span>'
      + '</div></div>';
  }

  function polBool(label, value, trueLabel, falseLabel, note) {
    var v   = value ? (trueLabel || 'Activé') : (falseLabel || 'Non activé');
    var col = value ? 'var(--success)' : 'var(--text3)';
    return '<div class="pol-row">'
      + '<div><div style="font-weight:500;">' + label + '</div>'
      + (note ? '<div style="font-size:11px;color:var(--text3);">' + note + '</div>' : '')
      + '</div>'
      + '<span style="font-weight:700;color:' + col + ';">' + v + '</span>'
      + '</div>';
  }

  html += '<div class="card"><div class="card-hdr"><div class="card-title">🔑 PIN Employé</div></div>'
    + polRow('Longueur PIN', p.pin_digits + ' chiffres', 'Exigé à la connexion')
    + polRow('Algorithme de hachage', p.pin_hashing || 'bcrypt', 'Jamais stocké en clair')
    + polBool('Changement forcé (provisoire)', p.must_change_pin_enforced, 'Appliqué', 'Non appliqué', 'must_change_pin côté serveur')
    + polRow('Expiration PIN temporaire', p.temp_pin_expiry_hours + ' heures', 'Après reset par Direction')
    + polRow('Jeton changement PIN', p.change_token_minutes + ' minutes', 'Durée jeton one-time')
    + '</div>';

  html += '<div class="card"><div class="card-hdr"><div class="card-title">🕐 Sessions</div></div>'
    + polRow('Durée session active', p.session_lifetime_hours + ' heures', 'Configurable dans Settings → Système → Sécurité')
    + polRow('Durée jeton de reprise', p.resume_token_days + ' jours', 'Configurable dans Settings → Système → Sécurité')
    + polBool('Révocation de session', p.session_revoke_supported, 'Supportée', 'Non supportée', 'Révocation unitaire ou globale')
    + polRow('Stockage token brut', 'Non', 'SHA-256 côté serveur uniquement')
    + polBool('Tracking IP', p.ip_tracking, 'Activé', 'Non activé', 'Configurable dans Settings → Système → Sécurité')
    + polBool('Tracking appareil', p.user_agent_tracking, 'Activé', 'Non activé', 'Configurable dans Settings → Système → Sécurité')
    + '</div>';

  html += '<div class="card"><div class="card-hdr"><div class="card-title">🛡 Accès & Rôles</div></div>'
    + polBool('RBAC capabilities serveur', p.role_capability_enforced, 'Appliqué (R5)', 'Non appliqué', 'employees-secure, room-service, reservation-workflow')
    + polBool('Authentification 2FA', p.two_factor_auth, 'Activée', 'Non disponible actuellement', '')
    + '</div>';

  html += '<div class="card"><div class="card-hdr"><div class="card-title">Fonctionnalités à venir</div></div>'
    + '<div style="color:var(--text2);font-size:13px;line-height:1.8;">'
    + '🔐 MFA / TOTP — planifié<br>'
    + '📊 SSO OAuth2 — planifié'
    + '</div></div>';

  return html;
}
</script>
