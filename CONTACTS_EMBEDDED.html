<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacts — Veraluz OS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* Top bar */
.topbar{background:#1e293b;border-bottom:1px solid #334155;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.topbar-title{font-weight:700;font-size:15px;color:#f1f5f9;white-space:nowrap;}
.search-box{flex:1;display:flex;align-items:center;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:0 10px;gap:8px;}
.search-box input{background:none;border:none;outline:none;color:#e2e8f0;font-size:13px;padding:7px 0;width:100%;}
.search-box input::placeholder{color:#64748b;}
.add-btn{background:#6366f1;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.add-btn:hover{background:#4f46e5;}

/* Tab bar */
.tabbar{background:#1e293b;border-bottom:1px solid #334155;padding:0 14px;display:flex;gap:2px;overflow-x:auto;flex-shrink:0;}
.tabbar::-webkit-scrollbar{height:3px;}
.tabbar::-webkit-scrollbar-thumb{background:#334155;border-radius:3px;}
.tab-btn{background:none;border:none;border-bottom:2px solid transparent;color:#94a3b8;font-size:12px;font-weight:500;padding:9px 12px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:all .15s;}
.tab-btn:hover{color:#e2e8f0;}
.tab-btn.active{color:#818cf8;border-bottom-color:#818cf8;}
.tab-count{background:#1e2940;border-radius:10px;padding:1px 6px;font-size:10px;color:#64748b;}
.tab-btn.active .tab-count{background:#312e81;color:#a5b4fc;}

/* Main split layout */
.main{display:flex;flex:1;overflow:hidden;}

/* Left panel — contact list */
.panel-list{width:320px;min-width:240px;border-right:1px solid #1e293b;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}

/* Bulk action bar */
.bulk-bar{background:#312e81;padding:8px 14px;display:none;align-items:center;gap:8px;font-size:12px;color:#a5b4fc;flex-shrink:0;}
.bulk-btn{background:#4f46e5;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;}
.bulk-btn:hover{background:#4338ca;}
.bulk-btn.secondary{background:#1e1b4b;color:#a5b4fc;}
.bulk-btn.secondary:hover{background:#1e293b;}

/* Contact list */
.contact-list{flex:1;overflow-y:auto;padding:8px;}
.contact-list::-webkit-scrollbar{width:4px;}
.contact-list::-webkit-scrollbar-thumb{background:#334155;border-radius:4px;}
.contact-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;transition:background .12s;border:1px solid transparent;}
.contact-item:hover{background:#1e293b;}
.contact-item.selected{background:#1e293b;border-color:#4f46e5;}
.contact-chk{width:14px;height:14px;accent-color:#6366f1;cursor:pointer;flex-shrink:0;}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0;}
.contact-info{flex:1;min-width:0;}
.contact-name{font-size:13px;font-weight:600;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.contact-sub{font-size:11px;color:#64748b;display:flex;align-items:center;gap:5px;margin-top:2px;overflow:hidden;}
.list-preview{font-size:11px;color:#475569;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.empty-state{text-align:center;color:#475569;padding:40px 20px;font-size:13px;}

/* Type badge */
.type-badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600;color:#fff;white-space:nowrap;}
.type-badge.lg{font-size:12px;padding:2px 10px;}

/* Right panel — detail */
.panel-detail{flex:1;overflow-y:auto;background:#0f172a;}
.panel-detail::-webkit-scrollbar{width:5px;}
.panel-detail::-webkit-scrollbar-thumb{background:#334155;border-radius:5px;}

.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#475569;text-align:center;padding:40px;}
.detail-empty-icon{font-size:48px;margin-bottom:16px;opacity:.5;}
.detail-empty p{font-size:14px;max-width:250px;}

/* Detail sections */
.detail-header{display:flex;align-items:center;gap:16px;padding:20px 20px 16px;}
.detail-avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;flex-shrink:0;}
.detail-meta{flex:1;}
.detail-name{font-size:20px;font-weight:700;color:#f1f5f9;margin-bottom:5px;}
.detail-contact-info{padding:0 20px 12px;display:flex;flex-wrap:wrap;gap:10px;}
.detail-field{font-size:13px;color:#94a3b8;display:flex;align-items:center;gap:6px;}
.detail-field a{color:#818cf8;text-decoration:none;}
.detail-field a:hover{text-decoration:underline;}
.detail-stats{display:flex;flex-wrap:wrap;gap:10px;padding:0 20px 16px;}
.stat-box{background:#1e293b;border-radius:10px;padding:10px 16px;min-width:100px;}
.stat-val{font-size:16px;font-weight:700;color:#f1f5f9;}
.stat-lbl{font-size:11px;color:#64748b;margin-top:2px;}
.detail-actions{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 16px;}
.act-btn{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;font-weight:500;transition:all .12s;}
.act-btn:hover{background:#334155;}
.act-btn.primary{background:#6366f1;border-color:#6366f1;color:#fff;}
.act-btn.primary:hover{background:#4f46e5;}
.act-btn.danger{background:#7f1d1d;border-color:#991b1b;color:#fca5a5;}
.act-btn.danger:hover{background:#991b1b;}
.sep{border-top:1px solid #1e293b;margin:0 20px 16px;}

/* Thread */
.thread-section{padding:0 20px 20px;}
.thread-title{font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}
.thread-empty{color:#475569;font-size:13px;font-style:italic;}
.thread-entry{background:#1e293b;border-radius:10px;padding:12px 14px;margin-bottom:10px;border-left:3px solid #334155;}
.thread-entry.type-sent{border-left-color:#6366f1;}
.thread-entry.type-received{border-left-color:#059669;}
.thread-entry.type-note{border-left-color:#d97706;}
.thread-entry.type-call{border-left-color:#0891b2;}
.thread-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.thread-header span:first-child{font-size:12px;font-weight:600;color:#94a3b8;}
.thread-date{font-size:11px;color:#475569;}
.thread-subject{font-size:13px;font-weight:600;color:#f1f5f9;margin-bottom:4px;}
.thread-content{font-size:13px;color:#94a3b8;white-space:pre-wrap;word-break:break-word;}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center;padding:20px;}
.modal{background:#1e293b;border-radius:14px;padding:24px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border:1px solid #334155;}
.modal-title{font-size:17px;font-weight:700;color:#f1f5f9;margin-bottom:18px;}
.modal-body{margin-bottom:18px;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;}
.modal-cancel{background:#0f172a;color:#94a3b8;border:1px solid #334155;border-radius:8px;padding:8px 20px;font-size:13px;cursor:pointer;}
.modal-cancel:hover{background:#334155;}
.modal-confirm{background:#6366f1;color:#fff;border:none;border-radius:8px;padding:8px 20px;font-size:13px;font-weight:600;cursor:pointer;}
.modal-confirm:hover{background:#4f46e5;}
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:5px;}
.form-row input,.form-row select,.form-row textarea{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:9px 12px;color:#e2e8f0;font-size:13px;outline:none;font-family:inherit;}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:#6366f1;}
.form-row textarea{resize:vertical;}
.form-row select option{background:#1e293b;}
.compose-dest{font-size:12px;color:#94a3b8;background:#0f172a;border-radius:8px;padding:10px 12px;margin-bottom:14px;word-break:break-all;}
.compose-type{display:flex;gap:20px;margin-bottom:14px;}
.radio-lbl{display:flex;align-items:center;gap:7px;font-size:13px;color:#94a3b8;cursor:pointer;}
.radio-lbl input{accent-color:#6366f1;}
.warn-box{background:#7c2d12;border:1px solid #9a3412;color:#fdba74;border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:10px;}
.info-box{background:#0c2340;border:1px solid #1e4d80;color:#93c5fd;border-radius:8px;padding:10px 12px;font-size:12px;}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#f1f5f9;border:1px solid #334155;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:500;z-index:9999;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.ok{border-color:#059669;color:#6ee7b7;}
.toast.warn{border-color:#d97706;color:#fcd34d;}
.toast.err{border-color:#dc2626;color:#fca5a5;}

/* Loading spinner */
.loading{display:flex;align-items:center;justify-content:center;height:100%;color:#475569;gap:10px;font-size:13px;}
.spinner{width:18px;height:18px;border:2px solid #334155;border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Responsive: narrow screens stack vertically */
@media(max-width:600px){
  .panel-list{width:100%;border-right:none;border-bottom:1px solid #1e293b;max-height:40vh;}
  .main{flex-direction:column;}
}
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-title">👥 Contacts</div>
  <div class="search-box">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" placeholder="Rechercher..." oninput="setSearch(this.value)" id="search-input">
  </div>
  <button class="add-btn" onclick="showAddMenu()">+ Ajouter</button>
</div>

<!-- Tab bar -->
<div class="tabbar" id="tabs"></div>

<!-- Main -->
<div class="main">

  <!-- Left: contact list -->
  <div class="panel-list">
    <div class="bulk-bar" id="bulk-bar"></div>
    <div class="contact-list" id="list">
      <div class="loading"><div class="spinner"></div> Chargement...</div>
    </div>
  </div>

  <!-- Right: contact detail -->
  <div class="panel-detail" id="detail">
    <div class="detail-empty">
      <div class="detail-empty-icon">👥</div>
      <p>Sélectionnez un contact pour voir son profil et ses échanges</p>
    </div>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="closeModal()">Annuler</button>
      <button class="modal-confirm" id="modal-confirm-btn" onclick="confirmModal()">Confirmer</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
var MODULE_ID = 'contacts';
var SB = 'https://dfdmasejsoibxrvubegu.supabase.co';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmZG1hc2Vqc29pYnhydnViZWd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDgzOTMsImV4cCI6MjA5MjI4NDM5M30.dEsafV84HFmFqU6Yi4xKydIbUlkIVE7QMRMpFt8kqXY';

var contacts = [];
var currentId = null;
var selectedIds = new Set();
var activeTab = 'tous';
var searchQ = '';

var TABS = [
  {id:'tous', label:'Tous'},
  {id:'client', label:'Clients'},
  {id:'employee', label:'Employés'},
  {id:'prestataire', label:'Prestataires'},
  {id:'fournisseur', label:'Fournisseurs'},
  {id:'autre', label:'Autres'}
];

/* ─── Thread storage ─── */
function threadKey(cid){ return 'vz_thread_' + cid; }

function getThread(cid){
  try{ return JSON.parse(localStorage.getItem(threadKey(cid))||'[]'); }
  catch(e){ return []; }
}

function saveThread(cid, entries){
  localStorage.setItem(threadKey(cid), JSON.stringify(entries));
}

function addThreadEntry(cid, entry){
  var t = getThread(cid);
  entry.id = 't' + Date.now() + Math.random().toString(36).slice(2,6);
  entry.date = entry.date || new Date().toISOString();
  t.push(entry);
  saveThread(cid, t);
}

/* ─── Data loading ─── */
async function loadAll(){
  contacts = [];

  // 1. Clients from localStorage cache
  try{
    var cache = JSON.parse(localStorage.getItem('vlz_cache_rez')||'[]');
    var byEmail = {};
    cache.forEach(function(r){
      var email = (r.guest_email||'').toLowerCase().trim();
      if(!email) return;
      if(!byEmail[email]){
        byEmail[email]={
          id:'client_'+email.replace(/[^a-z0-9]/g,'_'),
          type:'client', name:r.guest_name||email,
          email:email, phone:r.guest_phone||'',
          count:0, total:0, lastDate:''
        };
      }
      var c=byEmail[email]; c.count++;
      c.total+=(parseFloat(r.total_price)||0);
      var d=r.check_in||r.created_at||'';
      if(d>c.lastDate){ c.lastDate=d; if(r.guest_name) c.name=r.guest_name; }
    });
    contacts=contacts.concat(Object.values(byEmail));
  }catch(e){}

  // 2. Clients from Supabase (merge by email)
  try{
    var resp=await fetch(SB+'/rest/v1/veraluz_reservations?select=guest_name,guest_email,guest_phone,total_price,check_in&order=check_in.desc&limit=1000',
      {headers:{apikey:KEY,'Authorization':'Bearer '+KEY}});
    if(resp.ok){
      var rows=await resp.json();
      var idx={};
      contacts.filter(function(c){return c.type==='client';}).forEach(function(c){ idx[c.email]=c; });
      rows.forEach(function(r){
        var email=(r.guest_email||'').toLowerCase().trim();
        if(!email) return;
        if(!idx[email]){
          var nc={id:'client_'+email.replace(/[^a-z0-9]/g,'_'),type:'client',
            name:r.guest_name||email,email:email,phone:r.guest_phone||'',
            count:1,total:parseFloat(r.total_price)||0,lastDate:r.check_in||''};
          idx[email]=nc; contacts.push(nc);
        } else {
          var ex=idx[email];
          if(!ex._sbMerged){ ex.count=0; ex.total=0; ex._sbMerged=true; }
          ex.count++; ex.total+=(parseFloat(r.total_price)||0);
          var d=r.check_in||'';
          if(d>ex.lastDate){ ex.lastDate=d; if(r.guest_name) ex.name=r.guest_name; }
        }
      });
    }
  }catch(e){}

  // 3. Employees from Supabase
  try{
    var resp2=await fetch(SB+'/rest/v1/veraluz_employees?select=id,full_name,email,phone,role,department&order=full_name.asc',
      {headers:{apikey:KEY,'Authorization':'Bearer '+KEY}});
    if(resp2.ok){
      var emps=await resp2.json();
      emps.forEach(function(e){
        contacts.push({
          id:'emp_'+e.id, type:'employee',
          name:e.full_name||'Employé', email:e.email||'',
          phone:e.phone||'', role:e.role||'', department:e.department||''
        });
      });
    }
  }catch(e){}

  // 4. Manual contacts (prestataires, fournisseurs, autres)
  try{
    var manual=JSON.parse(localStorage.getItem('vz_contacts_manual')||'[]');
    contacts=contacts.concat(manual);
  }catch(e){}

  // 5. Also pull email log to seed threads for sent emails
  try{
    var log=JSON.parse(localStorage.getItem('vz_email_log')||'[]');
    log.forEach(function(entry){
      if(!entry.to_email) return;
      var email=entry.to_email.toLowerCase().trim();
      var contact=contacts.find(function(c){ return (c.email||'').toLowerCase()===email; });
      if(!contact) return;
      var thread=getThread(contact.id);
      var alreadyExists=thread.some(function(te){ return te._logId===entry.id; });
      if(!alreadyExists){
        addThreadEntry(contact.id,{
          type:'sent', subject:entry.subject||'Email',
          content:entry.preview||entry.subject||'', _logId:entry.id,
          date:entry.date||entry.sent_at||new Date().toISOString()
        });
      }
    });
  }catch(e){}

  render();
}

/* ─── Filtering ─── */
function filteredContacts(){
  var list=contacts.slice();
  if(activeTab!=='tous') list=list.filter(function(c){ return c.type===activeTab; });
  if(searchQ){
    var q=searchQ.toLowerCase();
    list=list.filter(function(c){
      return (c.name||'').toLowerCase().includes(q)||
             (c.email||'').toLowerCase().includes(q)||
             (c.phone||'').includes(q)||
             (c.role||'').toLowerCase().includes(q);
    });
  }
  list.sort(function(a,b){ return (a.name||'').localeCompare(b.name||'','fr'); });
  return list;
}

/* ─── Helpers ─── */
function avatarColor(name){
  var colors=['#6366f1','#0891b2','#059669','#d97706','#dc2626','#7c3aed','#db2777','#ea580c'];
  var i=0; for(var j=0;j<(name||'').length;j++) i+=(name||'').charCodeAt(j);
  return colors[i%colors.length];
}
function avatarInitials(name){
  var p=(name||'?').trim().split(/\s+/);
  return ((p[0][0]||'')+(p[1]?p[1][0]:'')).toUpperCase()||'?';
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatDate(iso){
  if(!iso) return '';
  try{
    return new Date(iso).toLocaleDateString('fr-CA',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  }catch(e){ return iso.slice(0,16).replace('T',' '); }
}
function typeLabel(t){ return {client:'Client',employee:'Employe',prestataire:'Prestataire',fournisseur:'Fournisseur',autre:'Autre'}[t]||t; }
function typeBadgeColor(t){ return {client:'#6366f1',employee:'#059669',prestataire:'#d97706',fournisseur:'#0891b2',autre:'#6b7280'}[t]||'#6b7280'; }

/* ─── Render ─── */
function render(){
  renderTabs();
  renderList();
  if(currentId){
    var c=contacts.find(function(x){return x.id===currentId;});
    if(c) renderDetail(c); else{ currentId=null; renderDetailEmpty(); }
  } else {
    renderDetailEmpty();
  }
}

function renderTabs(){
  var counts={tous:contacts.length};
  TABS.slice(1).forEach(function(t){ counts[t.id]=0; });
  contacts.forEach(function(c){ if(counts[c.type]!==undefined) counts[c.type]++; else counts[c.type]=1; });
  document.getElementById('tabs').innerHTML=TABS.map(function(t){
    var active=activeTab===t.id?' active':'';
    return '<button class="tab-btn'+active+'" onclick="setTab(\''+t.id+'\')">'+t.label
      +'<span class="tab-count">'+(counts[t.id]||0)+'</span></button>';
  }).join('');
}

function renderList(){
  var list=filteredContacts();
  var el=document.getElementById('list');
  if(!list.length){
    el.innerHTML='<div class="empty-state">Aucun contact</div>';
    renderBulkBar(); return;
  }
  el.innerHTML=list.map(function(c){
    var active=currentId===c.id?' selected':'';
    var checked=selectedIds.has(c.id)?' checked':'';
    var color=avatarColor(c.name);
    var ini=avatarInitials(c.name);
    var thread=getThread(c.id);
    var last=thread.length?thread[thread.length-1]:null;
    var badge='<span class="type-badge" style="background:'+typeBadgeColor(c.type)+'">'+typeLabel(c.type)+'</span>';
    var preview=last?'<div class="list-preview">'+esc((last.content||last.subject||'').slice(0,55))+'</div>':'';
    return '<div class="contact-item'+active+'" onclick="selectContact(\''+esc(c.id)+'\')">'
      +'<input type="checkbox" class="contact-chk"'+checked+' onclick="event.stopPropagation();toggleSelect(\''+esc(c.id)+'\')">'
      +'<div class="avatar" style="background:'+color+'">'+esc(ini)+'</div>'
      +'<div class="contact-info">'
        +'<div class="contact-name">'+esc(c.name)+'</div>'
        +'<div class="contact-sub">'+badge+(c.email?' '+esc(c.email):'')+'</div>'
        +preview
      +'</div></div>';
  }).join('');
  renderBulkBar();
}

function renderBulkBar(){
  var bar=document.getElementById('bulk-bar');
  if(!selectedIds.size){ bar.style.display='none'; return; }
  bar.style.display='flex';
  bar.innerHTML='<span>'+selectedIds.size+' sélectionné(s)</span>'
    +'<button class="bulk-btn" onclick="openCompose(Array.from(selectedIds))">✉ Envoyer</button>'
    +'<button class="bulk-btn secondary" onclick="clearSelection()">✕ Tout déselectionner</button>';
}

function clearSelection(){ selectedIds.clear(); renderList(); }

function renderDetailEmpty(){
  document.getElementById('detail').innerHTML=
    '<div class="detail-empty"><div class="detail-empty-icon">👥</div>'
    +'<p>Sélectionnez un contact pour voir son profil et ses échanges</p></div>';
}

function renderDetail(c){
  var color=avatarColor(c.name);
  var ini=avatarInitials(c.name);
  var thread=getThread(c.id);

  // Stats block
  var statsHtml='';
  if(c.type==='client'){
    var fmt=function(v){ try{return parseFloat(v).toLocaleString('fr-CA',{style:'currency',currency:'XAF',maximumFractionDigits:0});}catch(e){return v+'F';} };
    statsHtml='<div class="detail-stats">'
      +'<div class="stat-box"><div class="stat-val">'+(c.count||0)+'</div><div class="stat-lbl">Séjours</div></div>'
      +'<div class="stat-box"><div class="stat-val">'+fmt(c.total||0)+'</div><div class="stat-lbl">Total dépensé</div></div>'
      +(c.lastDate?'<div class="stat-box"><div class="stat-val">'+(c.lastDate||'').slice(0,7)+'</div><div class="stat-lbl">Dernier séjour</div></div>':'')
      +'</div>';
  } else if(c.type==='employee'){
    statsHtml='<div class="detail-stats">'
      +(c.role?'<div class="stat-box"><div class="stat-val">'+esc(c.role)+'</div><div class="stat-lbl">Poste</div></div>':'')
      +(c.department?'<div class="stat-box"><div class="stat-val">'+esc(c.department)+'</div><div class="stat-lbl">Département</div></div>':'')
      +'</div>';
  }

  // Thread
  var threadHtml='';
  if(!thread.length){
    threadHtml='<div class="thread-empty">Aucun échange enregistré pour ce contact.</div>';
  } else {
    var icons={sent:'📤',received:'📥',note:'📝',call:'📞'};
    var labels={sent:'Envoyé',received:'Reçu',note:'Note interne',call:'Appel'};
    threadHtml=thread.slice().reverse().map(function(e){
      var icon=icons[e.type]||'💬';
      var lbl=labels[e.type]||e.type;
      return '<div class="thread-entry type-'+esc(e.type)+'">'
        +'<div class="thread-header"><span>'+icon+' '+lbl+'</span><span class="thread-date">'+formatDate(e.date)+'</span></div>'
        +(e.subject?'<div class="thread-subject">'+esc(e.subject)+'</div>':'')
        +'<div class="thread-content">'+esc(e.content||'')+'</div>'
        +'</div>';
    }).join('');
  }

  var canDelete=c.type==='prestataire'||c.type==='fournisseur'||c.type==='autre';

  document.getElementById('detail').innerHTML=
    '<div class="detail-header">'
      +'<div class="detail-avatar" style="background:'+color+'">'+esc(ini)+'</div>'
      +'<div class="detail-meta">'
        +'<div class="detail-name">'+esc(c.name)+'</div>'
        +'<span class="type-badge lg" style="background:'+typeBadgeColor(c.type)+'">'+typeLabel(c.type)+'</span>'
      +'</div>'
    +'</div>'

    +'<div class="detail-contact-info">'
      +(c.email?'<div class="detail-field">✉ <a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a></div>':'')
      +(c.phone?'<div class="detail-field">📞 '+esc(c.phone)+'</div>':'')
      +(c.notes?'<div class="detail-field">📝 '+esc(c.notes)+'</div>':'')
    +'</div>'

    +statsHtml

    +'<div class="detail-actions">'
      +(c.email?'<button class="act-btn primary" onclick="openCompose([\''+esc(c.id)+'\'])">✉ Envoyer</button>':'')
      +'<button class="act-btn" onclick="openNote(\''+esc(c.id)+'\')">📝 Note</button>'
      +'<button class="act-btn" onclick="openCall(\''+esc(c.id)+'\')">📞 Appel</button>'
      +'<button class="act-btn" onclick="openReceived(\''+esc(c.id)+'\')">📥 Réponse reçue</button>'
      +(canDelete?'<button class="act-btn danger" onclick="deleteManual(\''+esc(c.id)+'\')">🗑</button>':'')
    +'</div>'

    +'<div class="sep"></div>'

    +'<div class="thread-section">'
      +'<div class="thread-title">Historique des échanges ('+thread.length+')</div>'
      +'<div id="thread-list">'+threadHtml+'</div>'
    +'</div>';
}

/* ─── Navigation ─── */
function setTab(tab){ activeTab=tab; selectedIds.clear(); render(); }
function setSearch(q){ searchQ=q; renderList(); }
function selectContact(id){
  currentId=id;
  renderList();
  var c=contacts.find(function(x){return x.id===id;});
  if(c) renderDetail(c);
}
function toggleSelect(id){
  if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
  renderList();
}

/* ─── Add contact menu ─── */
function showAddMenu(){
  showModal('Ajouter un contact',
    '<div class="form-row"><label>Type de contact</label>'
    +'<select id="add-type">'
    +'<option value="prestataire">Prestataire de service</option>'
    +'<option value="fournisseur">Fournisseur</option>'
    +'<option value="autre">Autre</option>'
    +'</select></div>'
    +'<div class="form-row"><label>Nom complet *</label><input id="mc-name" type="text" placeholder="Ex: Ahmed Bello"></div>'
    +'<div class="form-row"><label>Email</label><input id="mc-email" type="email" placeholder="email@exemple.com"></div>'
    +'<div class="form-row"><label>Téléphone</label><input id="mc-phone" type="tel" placeholder="+237 6XX XXX XXX"></div>'
    +'<div class="form-row"><label>Notes</label><textarea id="mc-notes" rows="2" placeholder="Domaine, services, remarques..."></textarea></div>',
    function(){
      var name=document.getElementById('mc-name').value.trim();
      if(!name){ alert('Le nom est requis'); return; }
      var mc={
        id:'manual_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
        type:document.getElementById('add-type').value,
        name:name, email:document.getElementById('mc-email').value.trim(),
        phone:document.getElementById('mc-phone').value.trim(),
        notes:document.getElementById('mc-notes').value.trim()
      };
      var list=JSON.parse(localStorage.getItem('vz_contacts_manual')||'[]');
      list.push(mc); localStorage.setItem('vz_contacts_manual',JSON.stringify(list));
      contacts.push(mc);
      closeModal(); render(); selectContact(mc.id);
      toast(mc.name+' ajouté ✓','ok');
    }
  );
  document.getElementById('modal-confirm-btn').textContent='Ajouter';
}

function deleteManual(id){
  var c=contacts.find(function(x){return x.id===id;});
  if(!c||!confirm('Supprimer '+c.name+' ?')) return;
  var list=JSON.parse(localStorage.getItem('vz_contacts_manual')||'[]');
  list=list.filter(function(x){return x.id!==id;});
  localStorage.setItem('vz_contacts_manual',JSON.stringify(list));
  contacts=contacts.filter(function(x){return x.id!==id;});
  currentId=null; render(); toast('Contact supprimé','ok');
}

/* ─── Thread actions ─── */
function openNote(cid){
  showModal('Ajouter une note interne',
    '<div class="form-row"><label>Note</label><textarea id="note-text" rows="5" placeholder="Note interne, observation..."></textarea></div>',
    function(){
      var text=document.getElementById('note-text').value.trim();
      if(!text) return;
      addThreadEntry(cid,{type:'note',content:text});
      closeModal(); refreshThread(cid); toast('Note ajoutée ✓','ok');
    }
  );
  document.getElementById('modal-confirm-btn').textContent='Enregistrer';
}

function openCall(cid){
  var now=new Date(); var local=new Date(now-now.getTimezoneOffset()*60000).toISOString().slice(0,16);
  showModal('Logger un appel',
    '<div class="form-row"><label>Date et heure</label><input id="call-date" type="datetime-local" value="'+local+'"></div>'
    +'<div class="form-row"><label>Résumé de l\'appel</label><textarea id="call-notes" rows="4" placeholder="Sujet abordé, décisions prises..."></textarea></div>',
    function(){
      var notes=document.getElementById('call-notes').value.trim();
      var dateVal=document.getElementById('call-date').value;
      var date=dateVal?new Date(dateVal).toISOString():new Date().toISOString();
      addThreadEntry(cid,{type:'call',content:notes||'Appel enregistré',date:date});
      closeModal(); refreshThread(cid); toast('Appel enregistré ✓','ok');
    }
  );
  document.getElementById('modal-confirm-btn').textContent='Enregistrer';
}

function openReceived(cid){
  showModal('Enregistrer une réponse reçue',
    '<div class="info-box" style="margin-bottom:12px">Collez ici le contenu du message reçu dans votre Gmail pour garder un historique complet.</div>'
    +'<div class="form-row"><label>Sujet</label><input id="recv-subj" type="text" placeholder="Re: Confirmation de réservation..."></div>'
    +'<div class="form-row"><label>Contenu du message</label><textarea id="recv-content" rows="6" placeholder="Copier-coller le message reçu..."></textarea></div>',
    function(){
      var subj=document.getElementById('recv-subj').value.trim();
      var content=document.getElementById('recv-content').value.trim();
      if(!content){ alert('Le contenu est requis'); return; }
      addThreadEntry(cid,{type:'received',subject:subj,content:content});
      closeModal(); refreshThread(cid); toast('Réponse enregistrée ✓','ok');
    }
  );
  document.getElementById('modal-confirm-btn').textContent='Enregistrer';
}

function refreshThread(cid){
  var c=contacts.find(function(x){return x.id===cid;});
  if(c && currentId===cid) renderDetail(c);
}

/* ─── Compose modal ─── */
function openCompose(ids){
  var targets=Array.isArray(ids)?ids:Array.from(ids);
  var ctacts=contacts.filter(function(c){ return targets.includes(c.id)&&c.email; });
  if(!ctacts.length){ toast('Aucun contact sélectionné n\'a d\'adresse email','warn'); return; }

  var templates=[];
  var campaigns=[];
  try{ templates=JSON.parse(localStorage.getItem('vz_email_templates_lib')||'[]'); }catch(e){}
  try{
    var rawCamp=localStorage.getItem('vz_email_campaigns');
    if(rawCamp) campaigns=JSON.parse(rawCamp);
  }catch(e){}

  var tplOpts=templates.map(function(t,i){
    return '<option value="'+i+'">'+esc(t.name||t.subject||'Modèle '+(i+1))+'</option>';
  }).join('');

  var campOpts=campaigns.map(function(c,i){
    return '<option value="'+i+'">'+esc(c.name||'Campagne '+(i+1))+'</option>';
  }).join('');

  var destNames=ctacts.slice(0,4).map(function(c){return esc(c.name);}).join(', ')
    +(ctacts.length>4?' et '+(ctacts.length-4)+' autre(s)':'');

  showModal('Composer un message',
    '<div class="compose-dest">📨 '+ctacts.length+' destinataire(s) : <strong>'+destNames+'</strong></div>'
    +'<div class="compose-type">'
      +'<label class="radio-lbl"><input type="radio" name="ctype" value="simple" checked onchange="toggleCType()"> Simple — avec modèle</label>'
      +'<label class="radio-lbl"><input type="radio" name="ctype" value="campagne" onchange="toggleCType()"> Campagne configurée</label>'
    +'</div>'

    +'<div id="compose-simple">'
      +(templates.length
        ?'<div class="form-row"><label>Modèle</label><select id="tpl-sel" onchange="fillTpl()">'+tplOpts+'</select></div>'
        :'<div class="warn-box">Aucun modèle — allez dans Paramètres → Email → Modèles pour en créer.</div>')
      +'<div class="form-row"><label>Sujet *</label><input id="compose-subj" type="text" placeholder="Sujet du message..."></div>'
      +'<div class="form-row"><label>Message *</label><textarea id="compose-body" rows="7" placeholder="Corps du message (le saut de ligne sera conservé)..."></textarea></div>'
    +'</div>'

    +'<div id="compose-campagne" style="display:none">'
      +(campaigns.length
        ?'<div class="form-row"><label>Campagne</label><select id="camp-sel">'+campOpts+'</select></div>'
          +'<div class="info-box">La campagne sera envoyée à '+ctacts.length+' contact(s) sélectionné(s), avec 300ms entre chaque envoi.</div>'
        :'<div class="warn-box">Aucune campagne — allez dans Paramètres → Email → Campagnes pour en créer.</div>')
    +'</div>',

    function(){
      var ctype=document.querySelector('input[name="ctype"]:checked').value;
      if(ctype==='simple'){
        var subj=(document.getElementById('compose-subj')||{}).value||'';
        var body=(document.getElementById('compose-body')||{}).value||'';
        subj=subj.trim(); body=body.trim();
        if(!subj||!body){ alert('Le sujet et le corps sont obligatoires'); return; }
        var bodyHtml=body.replace(/\n/g,'<br>');
        ctacts.forEach(function(c){
          window.parent.postMessage({
            veraluzEvent:true,source:MODULE_ID,type:'send-email',
            data:{to_email:c.email,to_name:c.name,subject:subj,body_html:bodyHtml}
          },'*');
          addThreadEntry(c.id,{type:'sent',subject:subj,content:body});
        });
        closeModal();
        toast('Envoyé à '+ctacts.length+' contact(s) ✉','ok');
        if(currentId){ var cc=contacts.find(function(x){return x.id===currentId;}); if(cc) renderDetail(cc); }
      } else {
        var selEl=document.getElementById('camp-sel');
        if(!selEl){ toast('Aucune campagne disponible','warn'); return; }
        var camp=campaigns[parseInt(selEl.value)];
        if(!camp){ alert('Campagne invalide'); return; }
        var delay=0;
        ctacts.forEach(function(c){
          setTimeout(function(){
            window.parent.postMessage({
              veraluzEvent:true,source:MODULE_ID,type:'send-email',
              data:{to_email:c.email,to_name:c.name,subject:camp.subject||camp.name||'',body_html:camp.body||camp.content||camp.body_html||''}
            },'*');
            addThreadEntry(c.id,{type:'sent',subject:'[Campagne] '+(camp.name||''),content:camp.subject||''});
          },delay);
          delay+=300;
        });
        closeModal();
        toast('Campagne "'+esc(camp.name)+'" envoyée à '+ctacts.length+' contact(s) 🚀','ok');
        if(currentId){ var cc2=contacts.find(function(x){return x.id===currentId;}); if(cc2) setTimeout(function(){ renderDetail(cc2); },200); }
      }
    }
  );
  document.getElementById('modal-confirm-btn').textContent='Envoyer';
  if(templates.length) setTimeout(fillTpl,80);
}

function toggleCType(){
  var v=document.querySelector('input[name="ctype"]:checked').value;
  document.getElementById('compose-simple').style.display=v==='simple'?'':'none';
  document.getElementById('compose-campagne').style.display=v==='campagne'?'':'none';
}

function fillTpl(){
  var templates=[];
  try{ templates=JSON.parse(localStorage.getItem('vz_email_templates_lib')||'[]'); }catch(e){}
  var sel=document.getElementById('tpl-sel');
  if(!sel||!templates.length) return;
  var tpl=templates[parseInt(sel.value)];
  if(!tpl) return;
  var subjEl=document.getElementById('compose-subj');
  var bodyEl=document.getElementById('compose-body');
  if(subjEl) subjEl.value=tpl.subject||tpl.name||'';
  if(bodyEl) bodyEl.value=(tpl.body||tpl.content||'').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'');
}

/* ─── Modal system ─── */
var modalConfirmFn=null;
function showModal(title,content,onConfirm){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=content;
  document.getElementById('modal-confirm-btn').textContent='Confirmer';
  modalConfirmFn=onConfirm;
  document.getElementById('modal-overlay').style.display='flex';
}
function closeModal(){ document.getElementById('modal-overlay').style.display='none'; }
function confirmModal(){ if(modalConfirmFn) modalConfirmFn(); }

/* ─── Toast ─── */
function toast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show '+(type||'');
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){ t.className='toast'; },3500);
}

/* ─── EventBus ─── */
window.addEventListener('message',function(e){
  if(!e.data||!e.data.veraluzEvent) return;
  if(e.data.type==='email-sent'){
    // Core confirmed send — thread already added optimistically
  }
});

/* ─── Init ─── */
window.addEventListener('load',function(){ loadAll(); });
</script>
