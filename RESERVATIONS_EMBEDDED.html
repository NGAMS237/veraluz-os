<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Réservations — Veraluz OS</title>
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Statuts réservation */
  --sp:#f59e0b; --sc:#3b82f6; --si:#10b981; --so:#6b7280; --sx:#ef4444; --sn:#991b1b;
  /* Statuts chambre */
  --ra:#10b981; --rr:#3b82f6; --ro:#f59e0b; --rcl:#8b5cf6; --rd:#f97316; --rm:#6366f1; --ros:#64748b;
  /* UI */
  --bg:#0f172a; --bg2:#1e293b; --bg3:#293548; --bg4:#334155;
  --text:#f1f5f9; --text2:#94a3b8; --text3:#64748b;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.13);
  --accent:#06b6d4; --accent2:#22d3ee; --gold:#f59e0b;
  --success:#10b981; --warning:#f59e0b; --danger:#ef4444;
  --radius:12px; --radius-sm:8px;
  --shadow:0 4px 20px rgba(0,0,0,.4);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{cursor:pointer;border:none;font-family:inherit;font-size:14px}
input,select,textarea{font-family:inherit;font-size:14px}
a{text-decoration:none;color:inherit}

/* ── MODULE LAYOUT ── */
.mod-wrap{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── HEADER ── */
.mod-hdr{flex-shrink:0;background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 16px 0}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hdr-title{font-size:16px;font-weight:800;color:var(--text);letter-spacing:.01em;flex:1}
.hdr-title span{color:var(--accent);font-size:11px;font-weight:600;display:block;letter-spacing:.05em;text-transform:uppercase}
.hdr-sync-badge{font-size:11px;background:rgba(245,158,11,.15);color:var(--gold);border:1px solid rgba(245,158,11,.3);
  padding:3px 10px;border-radius:20px;cursor:pointer;transition:.2s}
.hdr-sync-badge:hover{background:rgba(245,158,11,.25)}
.btn-new{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;
  padding:8px 16px;border-radius:var(--radius-sm);font-size:12px;display:flex;align-items:center;gap:6px;flex-shrink:0}
.btn-new svg{width:14px;height:14px;stroke:currentColor;fill:none}

/* ── TABS ── */
.tabs-bar{display:flex;gap:2px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;background:none;color:var(--text2);padding:8px 14px;font-size:12px;font-weight:600;
  border-bottom:2px solid transparent;border-radius:0;transition:.2s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.tab-btn:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tab-btn.active{color:var(--accent2);border-bottom-color:var(--accent)}
.tbadge{background:var(--accent);color:#fff;border-radius:20px;font-size:10px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center}
.tbadge.warn{background:var(--warning);color:#000}
.tbadge.danger{background:var(--danger)}

/* ── PANES ── */
.tab-pane{display:none;flex:1;overflow-y:auto;overflow-x:hidden}
.tab-pane.active{display:flex;flex-direction:column}

/* ── DASHBOARD STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px}
@media(min-width:600px){.stats-row{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;
  display:flex;flex-direction:column;gap:4px}
.stat-num{font-size:28px;font-weight:800;line-height:1}
.stat-lbl{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.stat-sub{font-size:10px;color:var(--text3)}
.stat-card.arrivals .stat-num{color:var(--accent)}
.stat-card.departures .stat-num{color:var(--gold)}
.stat-card.occupied .stat-num{color:var(--success)}
.stat-card.pending .stat-num{color:var(--warning)}

/* ── ACTIVITY FEED ── */
.activity-wrap{padding:0 14px 14px}
.activity-hdr{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.act-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.act-item:last-child{border-bottom:none}
.act-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.act-text{font-size:13px;color:var(--text2)}
.act-text strong{color:var(--text)}
.act-time{font-size:11px;color:var(--text3);margin-top:2px}

/* ── PLANNING GANTT ── */
.plan-wrap{flex:1;overflow:auto;padding:0}
.plan-ctrl{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg2);
  border-bottom:1px solid var(--border);flex-wrap:wrap;gap:6px}
.plan-nav-btn{background:var(--bg3);color:var(--text);padding:6px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:600}
.plan-nav-btn:hover{background:var(--bg4)}
.plan-period{font-size:13px;font-weight:700;color:var(--text);flex:1;text-align:center}
.plan-legend{display:flex;gap:10px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.leg-dot{width:10px;height:10px;border-radius:3px}
.gantt-container{overflow:auto;position:relative}
.gantt-table{border-collapse:collapse;width:max-content;min-width:100%}
.gantt-table th,.gantt-table td{border:1px solid var(--border);padding:0}
.gantt-th-room{background:var(--bg2);position:sticky;left:0;z-index:10;width:130px;min-width:130px;
  padding:8px 10px;font-size:12px;font-weight:700;color:var(--text2);text-align:left;white-space:nowrap}
.gantt-th-day{background:var(--bg2);min-width:52px;text-align:center;padding:4px 2px;font-size:11px;color:var(--text2)}
.gantt-th-day.today{background:rgba(6,182,212,.15);color:var(--accent2);font-weight:700}
.gantt-th-date{font-size:9px;display:block;color:var(--text3)}
.gantt-room-label{background:var(--bg2);position:sticky;left:0;z-index:5;padding:6px 10px;
  font-size:12px;white-space:nowrap;vertical-align:middle}
.gantt-room-name{font-weight:700;color:var(--text);font-size:12px}
.gantt-room-type{font-size:10px;color:var(--text3)}
.gantt-cell{min-width:52px;height:40px;position:relative;vertical-align:middle;cursor:default}
.gantt-cell.today-col{background:rgba(6,182,212,.06)}
.gantt-bar{position:absolute;top:6px;bottom:6px;left:2px;right:2px;border-radius:4px;
  display:flex;align-items:center;padding:0 6px;font-size:10px;font-weight:700;
  color:#fff;overflow:hidden;white-space:nowrap;cursor:pointer;z-index:2;
  box-shadow:0 2px 6px rgba(0,0,0,.3)}
.gantt-bar:hover{filter:brightness(1.15);z-index:3}
.gantt-bar.bar-pending{background:var(--sp)}
.gantt-bar.bar-confirmed{background:var(--sc)}
.gantt-bar.bar-checked_in{background:var(--si)}
.gantt-bar.bar-checked_out{background:var(--so)}
.gantt-bar.bar-cancelled{background:var(--sx);opacity:.6}
.gantt-bar.bar-no_show{background:var(--sn)}
.gantt-cell-blocked{background:rgba(100,116,139,.08)}

/* ── ROOM CARDS ── */
.rooms-ctrl{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
.rooms-filter-select{background:var(--bg3);color:var(--text);border:1px solid var(--border2);
  border-radius:var(--radius-sm);padding:6px 10px;font-size:12px}
.rooms-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px}
@media(min-width:600px){.rooms-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.rooms-grid{grid-template-columns:repeat(4,1fr)}}
.room-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:.2s}
.room-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--shadow)}
.room-img{width:100%;height:110px;object-fit:cover;display:block;background:var(--bg3)}
.room-img-placeholder{width:100%;height:110px;background:linear-gradient(135deg,var(--bg3),var(--bg4));
  display:flex;align-items:center;justify-content:center;font-size:32px}
.room-body{padding:10px}
.room-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px}
.room-meta{font-size:11px;color:var(--text3);margin-bottom:8px}
.room-status-bar{display:flex;align-items:center;gap:6px}
.room-sbadge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;color:#fff;flex-shrink:0}
.rs-available{background:var(--ra)} .rs-reserved{background:var(--rr)} .rs-occupied{background:var(--ro)}
.rs-cleaning{background:var(--rcl)} .rs-dirty{background:var(--rd)} .rs-maintenance{background:var(--rm)} .rs-out_of_service{background:var(--ros)}
.room-quick-btns{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.rq-btn{font-size:10px;font-weight:600;padding:4px 8px;border-radius:6px;color:var(--text);
  background:var(--bg3);border:1px solid var(--border2);transition:.15s}
.rq-btn:hover{background:var(--bg4);color:var(--accent2)}
.rq-btn.danger{border-color:rgba(239,68,68,.3);color:var(--danger)}

/* ── RESERVATION LIST ── */
.rez-ctrl{display:flex;flex-direction:column;gap:8px;padding:10px 14px;
  background:var(--bg2);border-bottom:1px solid var(--border)}
.rez-search{background:var(--bg3);color:var(--text);border:1px solid var(--border2);
  border-radius:var(--radius-sm);padding:8px 12px;width:100%;outline:none}
.rez-search:focus{border-color:var(--accent)}
.rez-filters{display:flex;gap:6px;flex-wrap:wrap}
.rez-filter-btn{font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;
  background:var(--bg3);color:var(--text2);border:1px solid var(--border2);transition:.2s}
.rez-filter-btn.active{color:#fff;border-color:transparent}
.rez-filter-btn.f-all.active{background:var(--accent)}
.rez-filter-btn.f-pending.active{background:var(--sp)}
.rez-filter-btn.f-confirmed.active{background:var(--sc)}
.rez-filter-btn.f-checked_in.active{background:var(--si)}
.rez-filter-btn.f-checked_out.active{background:var(--so)}
.rez-filter-btn.f-cancelled.active{background:var(--sx)}
.rez-list{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.rez-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;transition:.2s;cursor:pointer}
.rez-card:hover{border-color:var(--border2);background:var(--bg3)}
.rez-card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.rez-status-stripe{width:4px;border-radius:2px;align-self:stretch;flex-shrink:0}
.rez-main{flex:1;min-width:0}
.rez-ref{font-size:11px;color:var(--text3);font-family:monospace;margin-bottom:2px}
.rez-guest{font-size:15px;font-weight:800;color:var(--text);margin-bottom:2px}
.rez-room-info{font-size:12px;color:var(--text2)}
.rez-badge{font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;color:#fff;flex-shrink:0;white-space:nowrap}
.rb-pending{background:var(--sp)} .rb-confirmed{background:var(--sc)} .rb-checked_in{background:var(--si)}
.rb-checked_out{background:var(--so)} .rb-cancelled{background:var(--sx)} .rb-no_show{background:var(--sn)}
.rez-dates{display:flex;gap:16px;font-size:12px;color:var(--text2);margin-bottom:8px}
.rez-dates span{display:flex;align-items:center;gap:4px}
.rez-dates svg{width:12px;height:12px;stroke:currentColor;fill:none;flex-shrink:0}
.rez-footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rez-amount{font-size:14px;font-weight:800;color:var(--accent2)}
.rez-nights{font-size:11px;color:var(--text3)}
.rez-actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.act-btn{font-size:11px;font-weight:700;padding:6px 12px;border-radius:var(--radius-sm);transition:.15s;display:flex;align-items:center;gap:4px}
.act-btn svg{width:12px;height:12px;stroke:currentColor;fill:none}
.btn-checkin{background:rgba(16,185,129,.15);color:var(--success);border:1px solid rgba(16,185,129,.3)}
.btn-checkin:hover{background:rgba(16,185,129,.25)}
.btn-checkout{background:rgba(245,158,11,.15);color:var(--gold);border:1px solid rgba(245,158,11,.3)}
.btn-checkout:hover{background:rgba(245,158,11,.25)}
.btn-view{background:var(--bg3);color:var(--text2);border:1px solid var(--border2)}
.btn-view:hover{background:var(--bg4);color:var(--text)}
.btn-confirm{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
.btn-confirm:hover{background:rgba(59,130,246,.25)}
.btn-cancel{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.btn-cancel:hover{background:rgba(239,68,68,.2)}
.rez-source-chip{font-size:10px;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.07);color:var(--text3)}

/* ── NEW RESERVATION FORM ── */
.nform-wrap{padding:16px;max-width:680px;margin:0 auto;width:100%}
.step-indicator{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:24px}
.step-dot{width:28px;height:28px;border-radius:50%;background:var(--bg3);border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text3);
  transition:.3s;flex-shrink:0}
.step-dot.done{background:var(--accent);border-color:var(--accent);color:#fff}
.step-dot.active{background:var(--bg4);border-color:var(--accent2);color:var(--accent2)}
.step-line{flex:1;height:2px;background:var(--border2);max-width:48px}
.step-line.done{background:var(--accent)}
.form-step{display:none;flex-direction:column;gap:14px}
.form-step.active{display:flex}
.form-step-title{font-size:16px;font-weight:800;color:var(--text);margin-bottom:4px}
.form-step-sub{font-size:13px;color:var(--text2);margin-bottom:4px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.form-input,.form-select,.form-textarea{background:var(--bg3);color:var(--text);border:1px solid var(--border2);
  border-radius:var(--radius-sm);padding:10px 12px;outline:none;transition:.2s;width:100%}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);background:var(--bg4)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.room-picker-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:500px){.room-picker-grid{grid-template-columns:repeat(3,1fr)}}
.rp-card{border:2px solid var(--border2);border-radius:var(--radius);padding:10px;cursor:pointer;
  background:var(--bg3);transition:.2s;text-align:center}
.rp-card:hover{border-color:var(--accent);background:var(--bg4)}
.rp-card.selected{border-color:var(--accent);background:rgba(6,182,212,.1)}
.rp-card.unavailable{opacity:.4;cursor:not-allowed;border-color:var(--border)}
.rp-img{width:100%;height:60px;object-fit:cover;border-radius:6px;margin-bottom:6px;background:var(--bg4)}
.rp-name{font-size:12px;font-weight:700;color:var(--text)}
.rp-price{font-size:11px;color:var(--accent2);font-weight:600}
.rp-status{font-size:10px;color:var(--text3);margin-top:2px}
.form-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.btn-back{background:var(--bg3);color:var(--text2);border:1px solid var(--border2);padding:10px 20px;border-radius:var(--radius-sm);font-weight:600}
.btn-next{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:10px 24px;border-radius:var(--radius-sm);font-weight:700}
.btn-submit{background:linear-gradient(135deg,var(--success),#059669);color:#fff;padding:10px 24px;border-radius:var(--radius-sm);font-weight:700}
.form-summary-box{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:14px}
.summary-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.summary-row:last-child{border-bottom:none;font-weight:700;color:var(--accent2)}

/* ── BOOKING ENGINE SYNC BADGE ── */
.sync-alert{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);
  border-radius:var(--radius);padding:12px 14px;margin:14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.sync-alert-text{flex:1;font-size:13px;color:var(--gold)}
.sync-alert-count{background:var(--gold);color:#000;border-radius:20px;padding:2px 8px;font-size:12px;font-weight:700}

/* ── MODALS ── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:flex-end;justify-content:center}
@media(min-width:600px){.modal-ov{align-items:center}}
.modal-ov.open{display:flex}
.modal-box{background:var(--bg2);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  padding:20px;position:relative;box-shadow:0 -8px 40px rgba(0,0,0,.5)}
@media(min-width:600px){.modal-box{border-radius:var(--radius);max-height:88vh}}
.modal-close{position:absolute;top:14px;right:14px;background:var(--bg3);border:none;color:var(--text2);
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.modal-close:hover{background:var(--bg4);color:var(--text)}
.modal-title{font-size:17px;font-weight:800;color:var(--text);margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--text2);margin-bottom:16px}
.modal-section{margin-bottom:16px}
.modal-section-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.modal-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-info-item{background:var(--bg3);border-radius:var(--radius-sm);padding:10px 12px}
.modal-info-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.modal-info-value{font-size:14px;font-weight:700;color:var(--text)}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.modal-action-btn{flex:1;padding:10px 16px;border-radius:var(--radius-sm);font-weight:700;font-size:13px;
  min-width:100px;display:flex;align-items:center;justify-content:center;gap:6px;transition:.2s}
.modal-action-btn svg{width:14px;height:14px;stroke:currentColor;fill:none}
/* Status timeline */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:12px;align-items:flex-start}
.tl-dot-wrap{display:flex;flex-direction:column;align-items:center;width:16px}
.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--border2);flex-shrink:0;margin-top:2px}
.tl-dot.done{background:var(--success)}
.tl-dot.current{background:var(--accent);box-shadow:0 0 0 3px rgba(6,182,212,.2)}
.tl-line{flex:1;width:2px;background:var(--border2);min-height:20px}
.tl-line.done{background:var(--success)}
.tl-content{padding-bottom:16px;flex:1}
.tl-label{font-size:13px;font-weight:600;color:var(--text2)}
.tl-label.done{color:var(--text)}
.tl-label.current{color:var(--accent2);font-weight:700}
.tl-time{font-size:11px;color:var(--text3)}
/* Image manager */
.img-manager{display:flex;flex-direction:column;gap:8px}
.img-list{display:flex;flex-wrap:wrap;gap:8px}
.img-thumb{position:relative;width:80px;height:60px;border-radius:8px;overflow:hidden;flex-shrink:0}
.img-thumb img{width:100%;height:100%;object-fit:cover}
.img-thumb-del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;
  background:rgba(0,0,0,.7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;border:none;line-height:1}
.img-add-row{display:flex;gap:8px}
.img-url-input{flex:1;background:var(--bg3);color:var(--text);border:1px solid var(--border2);
  border-radius:var(--radius-sm);padding:8px 10px;font-size:12px;outline:none}
.img-url-input:focus{border-color:var(--accent)}
.img-add-btn{background:var(--accent);color:#fff;padding:8px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;flex-shrink:0}
/* Empty state */

<script>

var SB_URL = (window.__SUPABASE_URL__||'https://dfdmasejsoibxrvubegu.supabase.co');
var SB_KEY = (window.__SUPABASE_KEY__||'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmZG1hc2Vqc29pYnhydnViZWd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDgzOTMsImV4cCI6MjA5MjI4NDM5M30.dEsafV84HFmFqU6Yi4xKydIbUlkIVE7QMRMpFt8kqXY');
/* ── SUPABASE FIELD MAPPING ── */
// Normalize Supabase row → internal format
function normalizeRes(r) {
  if(r._normalized) return r;
  r.guest_name     = r.guest_name     || r.client_name  || '';
  r.guest_email    = r.guest_email    || r.client_email  || '';
  r.guest_phone    = r.guest_phone    || r.client_phone  || '';
  r.guest_count    = r.guest_count    || r.guests        || 1;
  r.total_amount   = r.total_amount   || r.total         || 0;
  r.amount_paid    = r.amount_paid    || r.paid          || 0;
  r.special_requests = r.special_requests || r.notes     || '';
  r.unit_name      = r.unit_name      || '';
  var smap = {checkedin:'checked_in', checkedout:'checked_out', confirmed:'confirmed', pending:'pending', cancelled:'cancelled', no_show:'no_show'};
  r.status = smap[r.status] || r.status || 'pending';
  r._normalized = true;
  return r;
}
// Map internal format → Supabase columns for POST/PATCH
function toSbRes(r) {
  var statusOut = {checked_in:'checkedin', checked_out:'checkedout'}[r.status] || r.status || 'pending';
  var notes = [r.special_requests, r.payment_method?'Pmt:'+r.payment_method:''].filter(Boolean).join(' | ');
  return {
    unit_id:      r.unit_id,
    client_name:  r.guest_name,
    client_email: r.guest_email,
    client_phone: r.guest_phone,
    guests:       r.guest_count || 1,
    check_in:     r.check_in,
    check_out:    r.check_out,
    nights:       r.nights,
    total:        r.total_amount || 0,
    paid:         r.amount_paid  || 0,
    status:       statusOut,
    source:       r.source || 'reception',
    notes:        notes || null
  };
}


/* ── CONSTANTS ── */
var RES_STATUS = {
  pending:    {label:'En attente',   color:'var(--sp)', badge:'rb-pending'},
  confirmed:  {label:'Confirmée',    color:'var(--sc)', badge:'rb-confirmed'},
  checked_in: {label:'En cours',     color:'var(--si)', badge:'rb-checked_in'},
  checked_out:{label:'Terminée',     color:'var(--so)', badge:'rb-checked_out'},
  cancelled:  {label:'Annulée',      color:'var(--sx)', badge:'rb-cancelled'},
  no_show:    {label:'No-show',      color:'var(--sn)', badge:'rb-no_show'}
};
var ROOM_STATUS = {
  available:    {label:'Disponible',  css:'rs-available'},
  reserved:     {label:'Réservée',    css:'rs-reserved'},
  occupied:     {label:'Occupée',     css:'rs-occupied'},
  cleaning:     {label:'Nettoyage',   css:'rs-cleaning'},
  dirty:        {label:'Sale',        css:'rs-dirty'},
  maintenance:  {label:'Maintenance', css:'rs-maintenance'},
  out_of_service:{label:'Hors service',css:'rs-out_of_service'}
};
var SOURCES = {
  direct_website:'Site web',reception:'Réception',
  whatsapp:'WhatsApp',booking_future:'Booking.com',airbnb_future:'Airbnb'
};
var ROOM_ICONS = {
  std:'🛏', sea:'🌊', apt:'🏠', suite:'👑', villa:'🌴', studio:'🏡'
};

/* ── STATE ── */
var _rooms = [];
var _reservations = [];
var _currentFilter = 'all';
var _planOffset = 0;   // days from today
var _planDays = 14;
var _formData = {step:1,room:null,dates:{},guest:{},payment:{}};
var _roomImages = {};  // {roomId: [url,url,...]}
var _activity = [];

/* ── SUPABASE HELPER ── */
function sbFetch(path, opts) {
  var url = SB_URL + '/rest/v1/' + path;
  var headers = {
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };
  if (opts && opts.headers) Object.assign(headers, opts.headers);
  return fetch(url, Object.assign({headers:headers}, opts||{}));
}

/* ── UNIT IMAGE PRELOADING ── */
var UNIT_IMG_BASE = 'https://ngams237.github.io/veraluz-os/assets/unites/';
// Keyword → images mapping (ordre : du plus spécifique au plus générique)
var UNIT_IMG_MAP = [
  {kw:'studio',      imgs:['studio_salon.jpg','studio_alt.jpg']},
  {kw:'villa',       imgs:['villa_piscine.jpg','villa_loft.jpg']},
  {kw:'suite',       imgs:['suite_salon.jpg','suite_art.jpg','suite_royal.jpg','suite_luxe.jpg']},
  {kw:'appartement', imgs:['apt_salon.jpg','apt_mezzanine.jpg']},
  {kw:'familial',    imgs:['apt_salon.jpg','apt_mezzanine.jpg']},
  {kw:'vue mer',     imgs:['mer_salon.jpg','mer_entree.jpg']},
  {kw:'mer',         imgs:['mer_salon.jpg','mer_entree.jpg']},
  {kw:'standard',    imgs:['std_salon.jpg','std_duplex.jpg']},
  {kw:'deluxe',      imgs:['studio_salon.jpg','studio_alt.jpg']},
  {kw:'chambre',     imgs:['std_salon.jpg','std_duplex.jpg']},  // Chambre 101, 102...
  {kw:'décor',       imgs:['decor_sofa.jpg','decor_buffet.jpg']}
];
function preloadRoomImages() {
  _rooms.forEach(function(r) {
    // Derive ikey from name if missing
    if(!r.ikey) {
      var n = (r.name||'').toLowerCase();
      r.ikey = n.indexOf('studio')>=0?'studio'
              :n.indexOf('villa')>=0?'villa'
              :n.indexOf('suite')>=0?'suite'
              :n.indexOf('appartement')>=0||n.indexOf('familial')>=0?'apt'
              :n.indexOf('mer')>=0?'sea'
              :'std';
    }
    // Only seed if room has no images yet
    if(r._images && r._images.length) return;
    var n2 = (r.name||' ').toLowerCase() + ' ' + (r.type||'').toLowerCase();
    for(var i=0;i<UNIT_IMG_MAP.length;i++){
      if(n2.indexOf(UNIT_IMG_MAP[i].kw)>=0){
        r._images = UNIT_IMG_MAP[i].imgs.map(function(f){return UNIT_IMG_BASE+f;});
        localStorage.setItem('vlz_room_images_'+r.id, JSON.stringify(r._images));
        break;
      }
    }
    // Fallback absolu : images de chambre standard
    if(!r._images || !r._images.length) {
      r._images = [UNIT_IMG_BASE+'std_salon.jpg', UNIT_IMG_BASE+'std_duplex.jpg'];
      localStorage.setItem('vlz_room_images_'+r.id, JSON.stringify(r._images));
    }
  });
}

/* ── DATA LOADING ── */
function loadAll(cb) {
  var pending = 2;
  function done() { if(--pending===0 && cb) cb(); }
  sbFetch('veraluz_units?select=*&order=name.asc')
    .then(function(r){return r.json()})
    .then(function(data){
      _rooms = Array.isArray(data) ? data : [];
      // Load saved images from localStorage
      _rooms.forEach(function(r){
        var saved = localStorage.getItem('vlz_room_images_'+r.id);
        if(saved) try{ r._images = JSON.parse(saved); }catch(e){}
        if(!r._images) r._images = [];
        // Use existing image if available
        if(!r._images.length && r.image_url) r._images = [r.image_url];
      });
      preloadRoomImages(); // seed default unit photos if room has no images yet
      try{localStorage.setItem('vlz_cache_rooms', JSON.stringify(_rooms.map(function(r){return {id:r.id,name:r.name,status:r.status,price:r.price,capacity:r.capacity,type:r.type,description:r.description,amenities:r.amenities,image_url:r.image_url};})));}catch(e){}
      done();
    })
    .catch(function(){
      try{var c=localStorage.getItem('vlz_cache_rooms');if(c){_rooms=JSON.parse(c);_rooms.forEach(function(r){var saved=localStorage.getItem('vlz_room_images_'+r.id);if(saved)try{r._images=JSON.parse(saved);}catch(e){}if(!r._images)r._images=[];});preloadRoomImages();}}catch(e){_rooms=[];}
      if(!_rooms.length)_rooms=[];
      done();
    });
  sbFetch('veraluz_reservations?select=*&order=created_at.desc&limit=200')
    .then(function(r){return r.json()})
    .then(function(data){
      var rawRes = Array.isArray(data) ? data : [];
      _reservations = rawRes.map(normalizeRes);
      // Cache pour persistance offline
      try{localStorage.setItem('vlz_cache_res', JSON.stringify(_reservations));}catch(e){}
      done();
    })
    .catch(function(){
      // Fallback cache localStorage
      try{var c=localStorage.getItem('vlz_cache_res');if(c)_reservations=JSON.parse(c).map(normalizeRes);}catch(e){_reservations=[];}
      if(!_reservations.length)_reservations=[];
      done();
    });
}

function enrichRoomStatuses() {
  var today = todayStr();
  _rooms.forEach(function(room) {
    var activeRes = _reservations.find(function(r){
      return r.unit_id===room.id &&
             (r.status==='checked_in' || (r.status==='confirmed' && r.check_in===today));
    });
    if(activeRes) {
      room._dynStatus = activeRes.status==='checked_in' ? 'occupied' : 'reserved';
    } else if(!room.status || room.status==='active') {
      room._dynStatus = 'available';
    } else {
      room._dynStatus = room.status;
    }
  });
}

/* ── DATE HELPERS ── */
function todayStr() {
  return new Date().toISOString().split('T')[0];
}
function addDays(dateStr, n) {
  var d = new Date(dateStr+'T12:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().split('T')[0];
}
function diffDays(a, b) {
  return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/(86400000));
}
function fmtDate(dateStr) {
  if(!dateStr) return '—';
  var d = new Date(dateStr+'T12:00:00');
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
}
function fmtDayName(dateStr) {
  var d = new Date(dateStr+'T12:00:00');
  return d.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','');
}
function fmtDayNum(dateStr) {
  return new Date(dateStr+'T12:00:00').getDate();
}

/* ── TOAST ── */
var _toastTimer = null;
function showToast(msg, type) {
  var el = document.getElementById('toastEl');
  el.textContent = msg;
  el.className = 'toast'+(type?' '+type:'');
  el.style.display = 'block';
  if(_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ el.style.opacity='0'; setTimeout(function(){el.style.display='none';el.style.opacity='1';},300); }, 2800);
}

/* ── TABS ── */
function goTab(name) {
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
  document.querySelectorAll('.tab-pane').forEach(function(p){p.classList.remove('active')});
  var btn = document.getElementById('tab-'+name);
  var pane = document.getElementById('pane-'+name);
  if(btn) btn.classList.add('active');
  if(pane) pane.classList.add('active');
  if(name==='planning') renderPlanning();
  if(name==='chambres') renderRooms();
  if(name==='liste') renderRezList();
  if(name==='dash') renderDashboard();
  if(name==='nouvelle') renderNewForm();
}

/* ── MODALS ── */
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

/* ── EVENT BUS ── */
function publishEvent(type, data) {
  try {
    var log = JSON.parse(localStorage.getItem('veraluz_event_log')||'[]');
    log.unshift({id:'evt-'+Date.now(),type:type,from:'reservations-module',data:data,ts:new Date().toISOString()});
    if(log.length>100) log = log.slice(0,100);
    localStorage.setItem('veraluz_event_log', JSON.stringify(log));
    // Also dispatch for same-page listeners
    window.dispatchEvent(new CustomEvent('vlz:event', {detail:{type:type,data:data}}));
  } catch(e){}
}

function listenEvents() {
  window.addEventListener('vlz:event', function(e) {
    var ev = e.detail;
    if(ev && ev.type === 'housekeeping-done' && ev.data && ev.data.room_id) {
      updateRoomStatusLocal(ev.data.room_id, 'available');
      showToast('Chambre nettoyée — disponible', 'success');
      renderRooms();
    }
    if(ev && ev.type === 'payment-validated' && ev.data && ev.data.reservation_id) {
      var res = _reservations.find(function(r){return r.id===ev.data.reservation_id});
      if(res && res.status==='pending') doConfirm(res.id);
    }
  });
}

/* ── WORKFLOW ENGINE ── */
function doConfirm(resId) {
  var res = _reservations.find(function(r){return r.id===resId});
  if(!res) return;
  sbFetch('veraluz_reservations?id=eq.'+resId, {
    method:'PATCH',
    body:JSON.stringify({status:'confirmed'})
  }).then(function(){
    res.status='confirmed';
    updateRoomStatusLocal(res.unit_id, 'reserved');
    addActivity('Réservation confirmée', res.guest_name, res.id, 'confirmed');
    publishEvent('reservation-confirmed', {reservation_id:resId, unit_id:res.unit_id, guest:res.guest_name});
    showToast('Réservation confirmée', 'success');
    refresh();
  }).catch(function(){
    // Fallback: update locally
    res.status='confirmed';
    updateRoomStatusLocal(res.unit_id, 'reserved');
    showToast('Confirmée (hors ligne)', 'success');
    refresh();
  });
}

  if(!confirm('Check-in pour '+res.guest_name+' ?')) return;
  sbFetch('veraluz_reservations?id=eq.'+resId, {
    method:'PATCH',
    body:JSON.stringify({status:'checkedin'})
  }).then(function(){
    res.status='checked_in';
    updateRoomStatusLocal(res.unit_id, 'occupied');
    addActivity('Check-in effectué', res.guest_name, res.id, 'checked_in');
    publishEvent('checkin-done', {reservation_id:resId, unit_id:res.unit_id, guest:res.guest_name, room:res.unit_name});
    showToast('Check-in — '+res.guest_name, 'success');
    refresh();
  }).catch(function(){
    res.status='checked_in';
    updateRoomStatusLocal(res.unit_id, 'occupied');
    showToast('Check-in enregistré (hors ligne)', 'success');
    refresh();
  });
}

function doCheckOut(resId) {

function doCancel(resId) {

function doMarkNoShow(resId) {

function updateRoomStatusLocal(roomId, newStatus) {
  var room = _rooms.find(function(r){return r.id===roomId});
  if(room) {
    room._dynStatus = newStatus;
    room.status = newStatus;
    // Persist to Supabase
    sbFetch('veraluz_units?id=eq.'+roomId, {method:'PATCH', body:JSON.stringify({status:newStatus})})
      .catch(function(){});
    publishEvent('room-status-changed', {room_id:roomId, status:newStatus});
  }
}

function setRoomStatus(roomId, status) {
  updateRoomStatusLocal(roomId, status);
  showToast('Statut mis à jour: '+(ROOM_STATUS[status]||{label:status}).label, 'success');
  refresh();
  closeModal('roomModal');
}

function addActivity(action, name, id, status) {
  _activity.unshift({action:action, name:name, id:id, status:status, time:new Date()});
  if(_activity.length>20) _activity.pop();
}

function refresh() {
  enrichRoomStatuses();
  var active = document.querySelector('.tab-btn.active');
  if(active) {
    var id = active.id.replace('tab-','');
    if(id==='planning') renderPlanning();
    else if(id==='chambres') renderRooms();
    else if(id==='liste') renderRezList();
    else if(id==='dash') renderDashboard();
  }
  updateBadges();
}

function updateBadges() {
  var avail = _rooms.filter(function(r){return r._dynStatus==='available'}).length;
  var pending = _reservations.filter(function(r){return r.status==='pending'}).length;
  var el = document.getElementById('avail-badge');
  if(el) { el.textContent=avail; el.className='tbadge'+(avail>0?' ok':''); }
  var rb = document.getElementById('rez-badge');
  if(rb) { rb.textContent=pending; rb.style.display=pending>0?'':'none'; }
}

/* ── DASHBOARD ── */
function renderDashboard() {
  var today = todayStr();
  var arrivals = _reservations.filter(function(r){return r.check_in===today && (r.status==='confirmed'||r.status==='pending')}).length;
  var departures = _reservations.filter(function(r){return r.check_out===today && r.status==='checked_in'}).length;
  var occupied = _rooms.filter(function(r){return r._dynStatus==='occupied'}).length;
  var total = _rooms.length || 1;
  var pending = _reservations.filter(function(r){return r.status==='pending'}).length;
  var el = function(id){return document.getElementById(id)};
  if(el('st-arrivals')) el('st-arrivals').textContent = arrivals;
  if(el('st-departures')) el('st-departures').textContent = departures;
  if(el('st-occ')) el('st-occ').textContent = Math.round(occupied/total*100)+'%';
  if(el('st-pending')) el('st-pending').textContent = pending;
  // Activity feed
  var feed = document.getElementById('activityFeed');
  if(!feed) return;
  if(!_activity.length) {
    // Show recent reservations as activity
    var recent = _reservations.slice(0,6);
    feed.innerHTML = recent.map(function(r){
      var s = RES_STATUS[r.status]||{label:r.status,color:'var(--text3)'};
      return '<div class="act-item"><div class="act-dot" style="background:'+s.color+'"></div>'+
        '<div><div class="act-text"><strong>'+escHtml(r.guest_name||'Inconnu')+'</strong> — '+(r.unit_name||'')+'</div>'+
        '<div class="act-time">'+fmtDate(r.check_in)+' → '+fmtDate(r.check_out)+' · <span style="color:'+s.color+'">'+s.label+'</span></div></div></div>';
    }).join('') || '<div class="empty-state"><p>Aucune réservation récente</p></div>';
    return;
  }
  feed.innerHTML = _activity.map(function(a){
    var s = RES_STATUS[a.status]||{label:a.status,color:'var(--text3)'};
    return '<div class="act-item"><div class="act-dot" style="background:'+s.color+'"></div>'+
      '<div><div class="act-text"><strong>'+escHtml(a.name)+'</strong> — '+a.action+'</div>'+
      '<div class="act-time">'+timeAgo(a.time)+'</div></div></div>';
  }).join('');
}

function timeAgo(date) {
  var diff = Math.floor((Date.now()-date)/1000);
  if(diff<60) return 'à l\'instant';
  if(diff<3600) return 'il y a '+Math.floor(diff/60)+'min';
  return 'il y a '+Math.floor(diff/3600)+'h';
}

/* ── PLANNING GANTT ── */
function renderPlanning() {
  var start = addDays(todayStr(), _planOffset);
  var days = [];
  for(var i=0;i<_planDays;i++) days.push(addDays(start,i));
  var today = todayStr();
  var label = fmtDate(days[0])+' → '+fmtDate(days[days.length-1]);
  var pl = document.getElementById('planPeriodLabel');
  if(pl) pl.textContent = label;

  // Build lookup: {roomId: {date: [res,...]}}
  var lookup = {};
  _rooms.forEach(function(room){ lookup[room.id]={}; });
  _reservations.forEach(function(res) {
    if(!res.unit_id || !res.check_in || !res.check_out) return;
    if(res.status==='cancelled') return;
    var cur = res.check_in;
    while(cur < res.check_out) {
      if(lookup[res.unit_id]) {
        if(!lookup[res.unit_id][cur]) lookup[res.unit_id][cur]=[];
        lookup[res.unit_id][cur].push(res);
      }
      cur = addDays(cur,1);
    }
  });

  var html = '<table class="gantt-table"><thead><tr>';
  html += '<th class="gantt-th-room">Chambre</th>';
  days.forEach(function(d){
    var isToday = d===today;
    html += '<th class="gantt-th-day'+(isToday?' today':'')+'">'+
      '<span>'+fmtDayName(d)+'</span><span class="gantt-th-date">'+fmtDayNum(d)+'</span></th>';
  });
  html += '</tr></thead><tbody>';

  _rooms.forEach(function(room) {
    html += '<tr>';
    html += '<td class="gantt-room-label"><div class="gantt-room-name">'+escHtml(room.name||'—')+'</div>'+
      '<div class="gantt-room-type">'+(room.type||'Chambre')+'</div></td>';
    days.forEach(function(d) {
      var isToday = d===today;
      var cellRez = lookup[room.id] && lookup[room.id][d] ? lookup[room.id][d][0] : null;
      html += '<td class="gantt-cell'+(isToday?' today-col':'')+(cellRez?' gantt-cell-blocked':'')+'">';
      if(cellRez) {
        // Only show name on check_in day
        var showName = cellRez.check_in===d;
        html += '<div class="gantt-bar bar-'+cellRez.status+'" onclick="openRezModal(\''+cellRez.id+'\')" title="'+escHtml(cellRez.guest_name||'')+'">'+
          (showName ? escHtml((cellRez.guest_name||'').split(' ')[0]) : '')+'</div>';
      }
      html += '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  var wrap = document.getElementById('ganttWrap');
  if(wrap) wrap.innerHTML = html;
}

function shiftPlan(n) {
  _planOffset += n;
  renderPlanning();
}

/* ── ROOMS GRID ── */
function renderRooms() {
  var filter = document.getElementById('roomFilter');
  var fval = filter ? filter.value : 'all';
  var filtered = fval==='all' ? _rooms : _rooms.filter(function(r){return (r._dynStatus||'available')===fval});
  var cnt = document.getElementById('roomCount');
  if(cnt) cnt.textContent = filtered.length+' chambre'+(filtered.length!==1?'s':'');
  var grid = document.getElementById('roomsGrid');
  if(!grid) return;
  if(!filtered.length) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><p>Aucune chambre pour ce filtre</p></div>';
    return;
  }
  grid.innerHTML = filtered.map(function(room) {
    var st = room._dynStatus || 'available';
    var stInfo = ROOM_STATUS[st] || {label:st, css:'rs-available'};
    var imgs = room._images || [];
    var imgHtml = imgs.length > 0
      ? '<img class="room-img" src="'+escHtml(imgs[0])+'" alt="" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">'
        +'<div class="room-img-placeholder" style="display:none">'+(ROOM_ICONS[room.ikey||'std']||'🏠')+'</div>'
      : '<div class="room-img-placeholder">'+(ROOM_ICONS[room.ikey||'std']||'🏠')+'</div>';
    var price = room.price ? (room.price).toLocaleString('fr-FR')+' FCFA/nuit' : '';
    // Quick actions based on current status
    var qbtns = '';
    if(st==='available') qbtns += '<button class="rq-btn" onclick="event.stopPropagation();setRoomStatus(\''+room.id+'\',\'maintenance\')">🔧 Maintenance</button>';
    if(st==='cleaning'||st==='dirty') qbtns += '<button class="rq-btn" onclick="event.stopPropagation();setRoomStatus(\''+room.id+'\',\'available\')">✓ Propre</button>';
    if(st==='maintenance') qbtns += '<button class="rq-btn" onclick="event.stopPropagation();setRoomStatus(\''+room.id+'\',\'available\')">✓ Disponible</button>';
    return '<div class="room-card" onclick="openRoomModal(\''+room.id+'\')">'+
      imgHtml+
      '<div class="room-body">'+
        '<div class="room-name">'+escHtml(room.name||'Chambre')+'</div>'+
        '<div class="room-meta">'+(room.type||'Chambre')+' · '+(room.capacity||2)+' pers. · '+price+'</div>'+
        '<div class="room-status-bar">'+
          '<span class="room-sbadge '+stInfo.css+'">'+stInfo.label+'</span>'+
        '</div>'+
        (qbtns?'<div class="room-quick-btns">'+qbtns+'</div>':'')+
      '</div>'+
    '</div>';
  }).join('');
}

/* ── ROOM MODAL ── */
function openRoomModal(roomId) {
  var room = _rooms.find(function(r){return r.id===roomId});
  if(!room) return;
  var st = room._dynStatus||'available';
  var stInfo = ROOM_STATUS[st]||{label:st,css:'rs-available'};
  var imgs = room._images||[];
  var statusOptions = Object.keys(ROOM_STATUS).map(function(k){
    return '<option value="'+k+'"'+(k===st?' selected':'')+'>'+ROOM_STATUS[k].label+'</option>';
  }).join('');
  var thumbs = imgs.map(function(url,i){
    return '<div class="img-thumb"><img src="'+escHtml(url)+'" onerror="this.src=\'\'"><button class="img-thumb-del" onclick="removeRoomImg(\''+roomId+'\','+i+')">&#x2715;</button></div>';
  }).join('');

    '<p class="modal-sub">'+(room.type||'Chambre')+' · '+(room.capacity||2)+' personnes · '+((room.price||0).toLocaleString('fr-FR'))+' FCFA/nuit</p>'+
    '<div class="modal-section">'+
      '<div class="modal-section-title">Statut</div>'+
      '<select class="form-select" id="roomStatusSelect" onchange="setRoomStatus(\''+roomId+'\',this.value)">'+statusOptions+'</select>'+
    '</div>'+
    '<div class="modal-section">'+
      '<div class="modal-section-title">Photos</div>'+
      '<div class="img-manager">'+
        '<div class="img-list" id="imgList-'+roomId+'">'+(thumbs||'<span style="color:var(--text3);font-size:12px">Aucune photo</span>')+'</div>'+
        '<div class="img-add-row">'+
          '<input class="img-url-input" id="imgUrlInput-'+roomId+'" placeholder="URL de la photo (https://...)">'+
          '<button class="img-add-btn" onclick="addRoomImg(\''+roomId+'\')">Ajouter</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="modal-section">'+
      '<div class="modal-section-title">Réservations actives</div>'+
      (function(){
        var roomRez = _reservations.filter(function(r){return r.unit_id===roomId && ['pending','confirmed','checked_in'].includes(r.status)});
        if(!roomRez.length) return '<p style="color:var(--text3);font-size:12px">Aucune réservation active</p>';
        return roomRez.map(function(r){
          var s = RES_STATUS[r.status]||{label:r.status,color:'var(--text3)'};
          return '<div style="background:var(--bg3);border-radius:8px;padding:10px;margin-bottom:6px">'+
            '<div style="font-weight:700;color:var(--text)">'+escHtml(r.guest_name||'—')+'</div>'+

            '<div style="font-size:11px;color:'+s.color+'">'+s.label+'</div></div>';
        }).join('');
      })()+
    '</div>';
  openModal('roomModal');
}

function addRoomImg(roomId) {
  var input = document.getElementById('imgUrlInput-'+roomId);
  if(!input || !input.value.trim()) return;
  var url = input.value.trim();
  var room = _rooms.find(function(r){return r.id===roomId});
  if(!room) return;
  if(!room._images) room._images=[];
  room._images.push(url);
  localStorage.setItem('vlz_room_images_'+roomId, JSON.stringify(room._images));
  // Also update Supabase image_url
  sbFetch('veraluz_units?id=eq.'+roomId, {method:'PATCH', body:JSON.stringify({image_url:room._images[0]})}).catch(function(){});
  input.value='';
  showToast('Photo ajoutée', 'success');
  openRoomModal(roomId); // refresh modal
}

function removeRoomImg(roomId, idx) {
  var room = _rooms.find(function(r){return r.id===roomId});
  if(!room||!room._images) return;
  room._images.splice(idx,1);
  localStorage.setItem('vlz_room_images_'+roomId, JSON.stringify(room._images));
  if(room._images.length>0) {
    sbFetch('veraluz_units?id=eq.'+roomId, {method:'PATCH', body:JSON.stringify({image_url:room._images[0]})}).catch(function(){});
  }
  showToast('Photo retirée', '');
  openRoomModal(roomId);
}

/* ── RESERVATION LIST ── */

           (r.reference||'').toLowerCase().includes(q) ||
           (r.unit_name||'').toLowerCase().includes(q) ||
           (r.guest_email||'').toLowerCase().includes(q);
  });

      actions += '<button class="act-btn btn-cancel" onclick="event.stopPropagation();doMarkNoShow(\''+res.id+'\')">No-show</button>';
    }
    if(res.status==='checked_in') actions += '<button class="act-btn btn-checkout" onclick="event.stopPropagation();doCheckOut(\''+res.id+'\')"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Check-out</button>';

function buildTimeline(status) {
  var steps = [
    {key:'pending',    label:'En attente'},
    {key:'confirmed',  label:'Confirmée'},
    {key:'checked_in', label:'Check-in effectué'},
    {key:'checked_out',label:'Check-out / Terminée'}
  ];
  var order = {pending:0,confirmed:1,checked_in:2,checked_out:3,cancelled:-1,no_show:-1};
  var cur = order[status]||0;
  var html = '<div class="timeline">';
  steps.forEach(function(step, i) {
    var stepOrder = order[step.key];
    var isDone = cur > stepOrder;
    var isCurrent = cur === stepOrder;
    var isLast = i===steps.length-1;
    html += '<div class="tl-item">'+
      '<div class="tl-dot-wrap">'+
        '<div class="tl-dot'+(isDone?' done':'')+(isCurrent?' current':'')+'"></div>'+
        (!isLast?'<div class="tl-line'+(isDone?' done':'')+'"></div>':'')+
      '</div>'+
      '<div class="tl-content">'+
        '<div class="tl-label'+(isDone?' done':'')+(isCurrent?' current':'')+'">'+step.label+'</div>'+
        (isCurrent?'<div class="tl-time">Statut actuel</div>':'')+
      '</div>'+
    '</div>';
  });
  if(status==='cancelled') html += '<div style="color:var(--danger);font-size:13px;padding:8px 0">✗ Réservation annulée</div>';
  if(status==='no_show') html += '<div style="color:var(--sn);font-size:13px;padding:8px 0">✗ No-show enregistré</div>';
  html += '</div>';
  return html;
}

function buildModalActions(res) {
  var btns = '';
  if(res.status==='pending') {
    btns += '<button class="modal-action-btn btn-confirm" onclick="doConfirm(\''+res.id+'\');closeModal(\'rezModal\')"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Confirmer</button>';
    btns += '<button class="modal-action-btn btn-cancel" onclick="doCancel(\''+res.id+'\');closeModal(\'rezModal\')">Annuler</button>';
  }
  if(res.status==='confirmed') {
    btns += '<button class="modal-action-btn btn-checkin" onclick="doCheckIn(\''+res.id+'\');closeModal(\'rezModal\')"><svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Check-in</button>';
    btns += '<button class="modal-action-btn btn-cancel" onclick="doMarkNoShow(\''+res.id+'\');closeModal(\'rezModal\')">No-show</button>';
    btns += '<button class="modal-action-btn btn-cancel" onclick="doCancel(\''+res.id+'\');closeModal(\'rezModal\')">Annuler</button>';
  }
  if(res.status==='checked_in') {
    btns += '<button class="modal-action-btn btn-checkout" onclick="doCheckOut(\''+res.id+'\');closeModal(\'rezModal\')"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Check-out</button>';
  }
  if(res.status==='checked_out') {
    btns += '<button class="modal-action-btn btn-view" style="background:var(--bg3);color:var(--text2);border:1px solid var(--border2)">Séjour terminé</button>';
  }
  return btns;
}

function nfStep1() {
  var ci = document.getElementById('nf-ci');
  var co = document.getElementById('nf-co');
  var g = document.getElementById('nf-guests');
  var src = document.getElementById('nf-source');
  if(!ci||!co||!ci.value||!co.value) { showToast('Sélectionnez les dates','error'); return; }
  if(ci.value>=co.value) { showToast('La date de départ doit être après l\'arrivée','error'); return; }
  _nfData.check_in = ci.value;
  _nfData.check_out = co.value;
  _nfData.guests = parseInt(g?g.value:2)||2;
  _nfData.source = src?src.value:'reception';
  _nfStep=2; renderNewForm();
}

function nfSelectRoom(roomId) {
  var room = _rooms.find(function(r){return r.id===roomId});
  if(!room) return;
  _nfData.room_id = roomId;
  _nfData.room = room;
  // Highlight selection
  document.querySelectorAll('.rp-card').forEach(function(c){c.classList.remove('selected')});
  var card = document.querySelector('[data-rid="'+roomId+'"]');
  if(card) card.classList.add('selected');
  setTimeout(function(){ _nfStep=3; renderNewForm(); }, 250);
}

function nfStep3() {
  var name = document.getElementById('nf-name');
  if(!name||!name.value.trim()) { showToast('Le nom du client est requis','error'); return; }
  _nfData.guest_name = name.value.trim();
  var email = document.getElementById('nf-email');
  var phone = document.getElementById('nf-phone');
  var pm = document.getElementById('nf-pm');
  var dep = document.getElementById('nf-deposit');
  var notes = document.getElementById('nf-notes');
  if(email) _nfData.guest_email = email.value.trim();
  if(phone) _nfData.guest_phone = phone.value.trim();
  if(pm) _nfData.payment_method = pm.value;
  if(dep) _nfData.deposit = parseFloat(dep.value)||0;
  if(notes) _nfData.notes = notes.value.trim();
  _nfStep=4; renderNewForm();
}

function nfSubmit() {
  var nights = diffDays(_nfData.check_in, _nfData.check_out);
  var total = (_nfData.room?(_nfData.room.price||0):0)*nights;
  var ref = 'VLZ-'+Date.now().toString(36).toUpperCase().slice(-6);
  var newRes = {
    reference: ref,
    unit_id: _nfData.room_id,
    unit_name: _nfData.room ? _nfData.room.name : '',
    guest_name: _nfData.guest_name,
    guest_email: _nfData.guest_email,
    guest_phone: _nfData.guest_phone,
    guest_count: _nfData.guests,
    check_in: _nfData.check_in,
    check_out: _nfData.check_out,
    nights: nights,
    total_amount: total,
    deposit_amount: _nfData.deposit,
    amount_paid: _nfData.deposit,
    payment_method: _nfData.payment_method,
    status: 'pending',
    source: _nfData.source,
    special_requests: _nfData.notes,
    created_at: new Date().toISOString()
  };
  sbFetch('veraluz_reservations', {method:'POST', body:JSON.stringify(toSbRes(newRes))})
    .then(function(r){return r.json()})
    .then(function(data){
      var saved = Array.isArray(data)?data[0]:data;
      if(saved && saved.id) newRes.id = saved.id;
      else newRes.id = 'local-'+Date.now();
      _reservations.unshift(newRes);
      updateRoomStatusLocal(_nfData.room_id, 'reserved');
      addActivity('Nouvelle réservation', newRes.guest_name, newRes.id, 'pending');
      publishEvent('reservation-created', {reservation_id:newRes.id, guest:newRes.guest_name, room:newRes.unit_name, check_in:newRes.check_in, check_out:newRes.check_out});
      showToast('Réservation créée — '+ref, 'success');
      resetNewForm();
      refresh();
      goTab('liste');
    })
    .catch(function(){
      // Save locally anyway
      newRes.id = 'local-'+Date.now();
      _reservations.unshift(newRes);
      addActivity('Nouvelle réservation (hors ligne)', newRes.guest_name, newRes.id, 'pending');
      publishEvent('reservation-created', {reservation_id:newRes.id, guest:newRes.guest_name, room:newRes.unit_name});
      showToast('Réservation enregistrée localement', 'success');
      resetNewForm();
      refresh();
      goTab('liste');
    });
}
