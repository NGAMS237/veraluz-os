<!--
  VERALUZ — frontend/AI_CENTER_FUNCTIONAL_EMBEDDED.html — AI_CENTER_FUNCTIONAL_007

  Câblage fonctionnel complet de l'interface livrée par AI_CENTER_UI_006
  (voir inventory/ui-placeholders-before-wiring.md pour la liste exacte
  des alert() et états statiques supprimés dans ce lot). Même principe
  de fichier unique auto-porté (aucun bundler).

  CHANGEMENTS MAJEURS vs AI_CENTER_NEXT_EMBEDDED.html (006) :
    - AUCUN alert() ne simule plus une action métier (§2) — chaque
      bouton est réellement câblé (agent-run / agent-control /
      agent-approval) ou explicitement disabled avec explication ;
    - permissions par agent reçues du SERVEUR (agent-foundation-read,
      row.permissions) — ROLE_CAPABILITIES local ne sert plus que de
      filet de sécurité en mode STANDALONE (§4) ;
    - exécution d'un agent passe TOUJOURS par le endpoint générique
      agent-run — zéro if(agent_key===...) dans ce fichier (§5) ;
    - workspace, alertes, recommandations, historique, approbations
      chargent des données réelles via le broker (§8-§12) ;
    - pause/reprise réellement câblés sur agent-control, jamais
      d'activation possible (§13) ;
    - navigation mobile en drawer vertical, plus de débordement
      horizontal (§16) ;
    - mode STANDALONE clairement marqué et désactive tout bouton qui
      n'a pas de sens sans backend réel (§17).

  Sécurité (inchangée depuis 006) : ce fichier n'accorde jamais un
  droit. Toute permission affichée ici vient du serveur — le serveur
  revérifie systématiquement à l'exécution (agent-run, agent-control,
  agent-approval). Aucune URL/clé Supabase, aucun accès direct table —
  uniquement window.parent.veraluzSecureRequest(endpoint, payload).
-->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0f1115; --bg2:#161920; --bg3:#1c2029; --border:#262b35;
  --text:#e8eaed; --text2:#9aa0a6; --text3:#6b7280;
  --accent:#22d3a5; --accent2:#0891b2; --warn:#f59e0b; --crit:#ef4444; --good:#22c55e;
  --radius:14px; --radius-sm:9px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
.vlx-header{padding:20px 28px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.vlx-header h1{font-size:22px;margin:0;letter-spacing:.2px;}
.vlx-header .vlx-sub{color:var(--text2);font-size:13px;margin-top:4px;}
.vlx-burger{display:none;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 14px;font-size:14px;cursor:pointer;}
.vlx-nav{display:flex;gap:6px;padding:0 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5;}
.vlx-nav-item{padding:10px 16px;border-radius:10px 10px 0 0;cursor:pointer;font-size:14px;color:var(--text2);}
.vlx-nav-item.active{color:var(--accent);border-bottom:2px solid var(--accent);background:var(--bg2);}
.vlx-main{padding:20px 28px 60px;max-width:1080px;margin:0 auto;}
.vlx-section{display:none;}
.vlx-section.active{display:block;}
.vlx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.vlx-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.vlx-agent-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:transform .15s, border-color .15s;}
.vlx-agent-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.vlx-agent-card-icon{font-size:28px;}
.vlx-agent-card-name{font-size:16px;font-weight:600;margin-top:8px;}
.vlx-agent-card-domain{color:var(--text2);font-size:13px;margin-top:2px;}
.vlx-agent-card-status{font-size:12px;color:var(--text2);margin-top:10px;display:flex;align-items:center;gap:6px;}
.vlx-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--text3);}
.vlx-dot-observation{background:var(--accent2);}
.vlx-dot-active{background:var(--good);}
.vlx-dot-paused{background:var(--warn);}
.vlx-dot-disabled{background:var(--text3);}
.vlx-warn{color:var(--warn);}
.vlx-empty{color:var(--text2);text-align:center;padding:48px 20px;font-size:14px;}
.vlx-btn{border:none;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;background:var(--bg3);color:var(--text);}
.vlx-btn-primary{background:var(--accent);color:#04231b;}
.vlx-btn-danger{background:rgba(239,68,68,.15);color:var(--crit);}
.vlx-btn-good{background:rgba(34,197,94,.15);color:var(--good);}
.vlx-btn[disabled]{opacity:.5;cursor:not-allowed;}
.vlx-disclaimer{font-size:12px;color:var(--text2);background:var(--bg3);border-radius:8px;padding:10px 12px;margin-top:10px;}
.vlx-hero{background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;}
.vlx-hero h2{margin:0 0 4px;font-size:20px;}
.vlx-hero .vlx-sit{display:flex;gap:20px;margin-top:14px;flex-wrap:wrap;}
.vlx-sit-item{font-size:13px;color:var(--text2);}
.vlx-sit-item b{color:var(--text);font-size:16px;display:block;}
.vlx-alert-row{display:flex;justify-content:space-between;align-items:flex-start;padding:14px;border-bottom:1px solid var(--border);gap:12px;}
.vlx-alert-row:last-child{border-bottom:none;}
.vlx-sev{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;text-transform:uppercase;white-space:nowrap;}
.vlx-sev-critical,.vlx-sev-urgent{background:rgba(239,68,68,.15);color:var(--crit);}
.vlx-sev-high{background:rgba(245,158,11,.15);color:var(--warn);}
.vlx-sev-medium,.vlx-sev-low{background:rgba(148,163,184,.15);color:var(--text2);}
.vlx-sev-info{background:rgba(34,211,165,.12);color:var(--accent);}
.vlx-filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.vlx-filter{padding:6px 14px;border-radius:16px;background:var(--bg3);color:var(--text2);font-size:13px;cursor:pointer;border:1px solid transparent;}
.vlx-filter.active{color:var(--accent);border-color:var(--accent);}
.vlx-standalone-banner{background:linear-gradient(90deg,#1a1a2e,#22223a);border-bottom:2px solid rgba(34,211,165,.4);padding:8px 16px;font-size:11px;color:var(--accent);display:flex;gap:12px;align-items:center;}
.vlx-workspace-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
.vlx-conv-quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.vlx-toast{position:fixed;bottom:18px;right:18px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:13px;max-width:320px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.vlx-toast.err{border-color:var(--crit);color:#ffb4b4;}
.vlx-toast.ok{border-color:var(--good);color:#b7f7c9;}
.vlx-drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;}
.vlx-drawer-overlay.open{display:block;}
.vlx-drawer{position:fixed;top:0;left:0;bottom:0;width:78vw;max-width:320px;background:var(--bg2);border-right:1px solid var(--border);padding:18px;transform:translateX(-100%);transition:transform .2s;z-index:21;}
.vlx-drawer.open{transform:translateX(0);}
.vlx-drawer-item{padding:12px 10px;border-radius:9px;font-size:15px;color:var(--text2);cursor:pointer;}
.vlx-drawer-item.active{color:var(--accent);background:var(--bg3);}
.vlx-spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top-color:var(--accent);border-radius:50%;animation:vlxspin .7s linear infinite;margin-right:6px;vertical-align:-2px;}
@keyframes vlxspin{to{transform:rotate(360deg);}}
@media(max-width:820px){ .vlx-main{padding:16px;} }
@media(max-width:600px){
  .vlx-header{padding:14px 16px 8px;}
  .vlx-grid{grid-template-columns:1fr;}
  .vlx-nav{display:none;}
  .vlx-burger{display:inline-block;}
}
</style>
</head>
<body>

<div id="vlx-standalone-banner" style="display:none" class="vlx-standalone-banner">
  <span>🧪</span><span style="font-weight:700;">MODE APERÇU — DONNÉES DE DÉMONSTRATION</span>
  <span>—</span><span>Aucune connexion au backend réel dans cette vue</span>
</div>

<div class="vlx-header">
  <div>
    <h1>🧠 INTELLIGENCE IA</h1>
    <div class="vlx-sub">Assistant VERALUZ — Vos assistants opérationnels au service de la résidence.</div>
  </div>
  <button class="vlx-burger" id="vlx-burger" onclick="openDrawer()">☰ Intelligence IA</button>
</div>

<div class="vlx-nav" id="vlx-nav"></div>

<div class="vlx-drawer-overlay" id="vlx-drawer-overlay" onclick="closeDrawer()"></div>
<div class="vlx-drawer" id="vlx-drawer"></div>

<div class="vlx-main">
  <div class="vlx-section" id="sec-accueil"></div>
  <div class="vlx-section" id="sec-assistants"></div>
  <div class="vlx-section" id="sec-workspace"></div>
  <div class="vlx-section" id="sec-alertes"></div>
  <div class="vlx-section" id="sec-approbations"></div>
  <div class="vlx-section" id="sec-historique"></div>
  <div class="vlx-section" id="sec-parametres"></div>
</div>

<div id="vlx-toast-host"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   Sécurité : aucune clé/URL Supabase dans ce fichier. Seule porte
   vers le backend : window.parent.veraluzSecureRequest(endpoint,body).
   ══════════════════════════════════════════════════════════════ */

var STANDALONE = false;
try { STANDALONE = (window.parent === window); } catch (e) { STANDALONE = true; }

var SECTIONS = [
  { id:'accueil',      label:'Accueil' },
  { id:'assistants',   label:'Assistants' },
  { id:'alertes',      label:'Alertes & recommandations' },
  { id:'approbations', label:'Approbations' },
  { id:'historique',   label:'Historique' },
  { id:'parametres',   label:'Paramètres', directionOnly:true },
];

var _currentUser = { name:'', role:'', firstName:'' };
var _platformAgents = [];      // { row, manifest }
var _agentRowsRaw = [];
var _activeSection = 'accueil';
var _activeWorkspaceAgentKey = null;
var _workspaceCache = {};      // agent_key -> { lastRun, recentRuns, recommendations }
var _busy = {};                // guards anti double-submit : key -> true
var _alertFilter = 'all';

var STATUS_LABELS = { draft:'Brouillon', observation:'Observation', active:'Actif', paused:'En pause', disabled:'Désactivé' };
var ENGINE_LABELS_PRIMARY = { deterministic_rules:'Analyse automatisée', llm_assisted:'Assistant IA', hybrid:'Assistant IA (analyse hybride)' };
var DISPLAY_NAME_SEPARATOR_PATTERN = /\s(—|-)\s/;
var DIRECTION_ROLES = ['gerant','admin','superadmin'];

function statusLabel(s){ return STATUS_LABELS[s] || 'Statut inconnu'; }
function engineLabel(e){ return ENGINE_LABELS_PRIMARY[e] || 'Analyse automatisée'; }
function isFullDisplayName(n){ return typeof n === 'string' && DISPLAY_NAME_SEPARATOR_PATTERN.test(n); }
function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(s){ if(!s) return '—'; try{ return new Date(s).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return s; } }
function fmtDateOnly(s){ if(!s) return '—'; try{ return new Date(s).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); }catch(e){ return s; } }

/* §4 — ROLE_CAPABILITIES : UNIQUEMENT filet de sécurité en mode
   STANDALONE (aucun backend). Dès qu'un backend réel répond, les
   permissions viennent de row.permissions (agent-foundation-read),
   jamais de cette copie locale. */
var STANDALONE_ROLE_CAPABILITIES = {
  gerant:['agent.maya.read','agent.maya.run','agent.nora.read','agent.nora.run','agent.techops.read','agent.techops.run','direction.approve'],
  barman:['agent.maya.read','agent.maya.run'],
  receptionniste:['agent.nora.read','agent.nora.run'],
  technicien:['agent.techops.read','agent.techops.run'],
};
function standaloneCapabilities(role){ return STANDALONE_ROLE_CAPABILITIES[String(role||'')] || []; }
function standaloneCanAccess(role, manifest){
  if (!manifest || !Array.isArray(manifest.capabilities)) return false;
  var caps = standaloneCapabilities(role);
  var read = manifest.capabilities.filter(function(c){ return typeof c==='string' && c.slice(-5)==='.read'; });
  return read.some(function(c){ return caps.indexOf(c)!==-1; });
}
function standaloneCanRun(role, manifest){
  if (!manifest || !Array.isArray(manifest.capabilities)) return false;
  var caps = standaloneCapabilities(role);
  var run = manifest.capabilities.filter(function(c){ return typeof c==='string' && c.slice(-4)==='.run'; });
  return run.some(function(c){ return caps.indexOf(c)!==-1; });
}

/* Permissions d'un agent : SERVEUR en priorité (row.permissions),
   fallback local UNIQUEMENT en STANDALONE (§4). Ne jamais traiter ce
   fallback comme une autorisation dans un contexte réel. */
function permissionsFor(row, manifest){
  if (row && row.permissions) return row.permissions;
  if (STANDALONE) {
    return {
      can_read: standaloneCanAccess(_currentUser.role, manifest),
      can_run: standaloneCanRun(_currentUser.role, manifest),
      can_pause: false, can_resume: false, can_disable: false, can_approve: false,
    };
  }
  return { can_read:false, can_run:false, can_pause:false, can_resume:false, can_disable:false, can_approve:false };
}

function manifestFromRow(row){
  if (!row || !row.manifest_version) return null;
  return {
    manifest_version: row.manifest_version, agent_key: row.agent_key, display_name: row.name,
    category: row.category, engine_type: row.engine_type || 'deterministic_rules', status: row.status,
    capabilities: Array.isArray(row.capabilities_json) ? row.capabilities_json : [],
    routing_intents: Array.isArray(row.routing_intents_json) ? row.routing_intents_json : [],
    ui: row.ui_metadata_json || { icon: row.icon || '🤖', order: 99, visible: true },
  };
}
function listPlatformAgents(rows){
  var out = [];
  (rows||[]).forEach(function(row){
    var m = manifestFromRow(row);
    if (!m) return; // legacy — jamais visible automatiquement (§13 PLATFORM_005)
    out.push({ row: row, manifest: m });
  });
  return out;
}

/* §9 — libellés d'intents connus, fallback lisible sinon. Un futur
   agent peut apporter ses propres quick_actions via ui_metadata_json
   sans modification de ce fichier (voir buildQuickActionsForAgent). */
var INTENT_LABELS = {
  'restaurant.orders.status':'État des commandes','restaurant.deliveries.issues':'Livraisons en attente',
  'restaurant.stock.low':'Stocks faibles','reservations.arrivals':'Arrivées du jour',
  'reservations.departures':'Départs du jour','reservations.units.prepare':'Unités à préparer',
  'system.health':'État du système','system.alerts':'Alertes techniques','demo.test':'Test de la plateforme (démo)',
};
function intentLabel(k){ if (INTENT_LABELS[k]) return INTENT_LABELS[k]; var last=String(k||'').split('.').pop(); return last.charAt(0).toUpperCase()+last.slice(1).replace(/_/g,' '); }

function buildQuickActionsForAgent(row, manifest){
  // §9 — priorité à quick_actions déclarées dans ui_metadata_json,
  // sinon dérivées des routing_intents (fallback lisible).
  var ui = row.ui_metadata_json || {};
  if (Array.isArray(ui.quick_actions) && ui.quick_actions.length) {
    return ui.quick_actions.map(function(qa){ return { intent_key: qa.intent_key, label: qa.label || intentLabel(qa.intent_key), icon: qa.icon || '' }; });
  }
  return (manifest.routing_intents || []).map(function(ik){ return { intent_key: ik, label: intentLabel(ik), icon:'' }; });
}
function buildQuickActionsForRole(){
  var out = [];
  _platformAgents.forEach(function(a){
    var perm = permissionsFor(a.row, a.manifest);
    if (!perm.can_read) return;
    buildQuickActionsForAgent(a.row, a.manifest).forEach(function(qa){
      out.push({ intent_key: qa.intent_key, label: qa.label, agent_key: a.row.agent_key });
    });
  });
  return out.sort(function(a,b){ return a.label.localeCompare(b.label); });
}

/* ══════════════════════════════════════════════════════════════
   §3 — Broker sécurisé. UNIQUE porte vers le backend.
   ══════════════════════════════════════════════════════════════ */
function secureCall(endpoint, body){
  try {
    if (window.parent && window.parent !== window && typeof window.parent.veraluzSecureRequest === 'function') {
      return window.parent.veraluzSecureRequest(endpoint, body || {});
    }
  } catch (e) { /* cross-origin ou parent absent */ }
  return Promise.resolve({ status: 0, body: { ok:false, error:'no_broker_available' } });
}

window.addEventListener('message', function(e){
  if (e.data && e.data.source === 'veraluz-core' && e.data.type === 'auth-context') {
    var d = e.data.data || {};
    _currentUser = { name: d.name || d.username || '', role: d.role || '', firstName: firstNameOf(d.name || d.username) };
    boot();
  }
});
function firstNameOf(full){ if(!full) return ''; return String(full).trim().split(/\s+/)[0]; }

/* Données de démonstration — STANDALONE UNIQUEMENT, jamais de vraie donnée. */
var DEMO_AGENT_ROWS = [
  { agent_key:'maya_restaurant_v1', name:'Maya — Restaurant & Livraison', category:'restaurant', status:'observation', engine_type:'deterministic_rules', icon:'🍽️', description:'Suivi des commandes, livraisons et stocks.', manifest_version:'1.0', capabilities_json:['agent.maya.read','agent.maya.run'], routing_intents_json:['restaurant.orders.status'], ui_metadata_json:{icon:'🍽️',order:1,visible:true} },
  { agent_key:'nora_reservations_v1', name:'Nora — Réservations & Séjours', category:'reservations', status:'observation', engine_type:'deterministic_rules', icon:'🛎️', description:'Arrivées, départs et suivi des séjours.', manifest_version:'1.0', capabilities_json:['agent.nora.read','agent.nora.run'], routing_intents_json:['reservations.arrivals'], ui_metadata_json:{icon:'🛎️',order:2,visible:true} },
  { agent_key:'techops_v1', name:'TechOps — Technique & Système', category:'techops', status:'observation', engine_type:'deterministic_rules', icon:'🛠️', description:'État du système et alertes techniques.', manifest_version:'1.0', capabilities_json:['agent.techops.read','agent.techops.run'], routing_intents_json:['system.health'], ui_metadata_json:{icon:'🛠️',order:3,visible:true} },
];

/* ══════════════════════════════════════════════════════════════
   Toast — retour utilisateur non bloquant (jamais d'alert()).
   ══════════════════════════════════════════════════════════════ */
function toast(msg, kind){
  var host = document.getElementById('vlx-toast-host');
  var el = document.createElement('div');
  el.className = 'vlx-toast ' + (kind||'');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(function(){ el.remove(); }, 4200);
}

/* ══════════════════════════════════════════════════════════════
   Chargement des agents — TOUJOURS via agent-foundation-read.
   ══════════════════════════════════════════════════════════════ */
function loadAgents(){
  if (STANDALONE) {
    _agentRowsRaw = DEMO_AGENT_ROWS;
    _platformAgents = listPlatformAgents(_agentRowsRaw);
    return Promise.resolve();
  }
  return secureCall('agent-foundation-read', { op:'list_agents' }).then(function(r){
    if (r && r.body && r.body.ok) {
      _agentRowsRaw = r.body.rows || [];
    } else {
      _agentRowsRaw = [];
      if (r && r.status === 401) toast('Votre session a expiré. Reconnectez-vous.', 'err');
    }
    _platformAgents = listPlatformAgents(_agentRowsRaw);
  });
}
function refreshAgents(){ return loadAgents().then(function(){ renderNav(); render(_activeSection); }); }

/* ══════════════════════════════════════════════════════════════
   Navigation (desktop = onglets, mobile = drawer, §16)
   ══════════════════════════════════════════════════════════════ */
function visibleSections(){
  var isDirection = DIRECTION_ROLES.indexOf(_currentUser.role) !== -1;
  return SECTIONS.filter(function(s){ return !s.directionOnly || isDirection; });
}
function renderNav(){
  var nav = document.getElementById('vlx-nav');
  nav.innerHTML = visibleSections().map(function(s){
    return '<div class="vlx-nav-item'+(s.id===_activeSection?' active':'')+'" data-sec="'+s.id+'" onclick="showSection(\''+s.id+'\')">'+esc(s.label)+'</div>';
  }).join('');
  renderDrawer();
}
function renderDrawer(){
  var d = document.getElementById('vlx-drawer');
  d.innerHTML = '<div style="font-weight:700;padding:8px 10px 14px;">🧠 Intelligence IA</div>' +
    visibleSections().map(function(s){
      return '<div class="vlx-drawer-item'+(s.id===_activeSection?' active':'')+'" onclick="showSection(\''+s.id+'\');closeDrawer();">'+esc(s.label)+'</div>';
    }).join('');
}
function openDrawer(){ document.getElementById('vlx-drawer').classList.add('open'); document.getElementById('vlx-drawer-overlay').classList.add('open'); }
function closeDrawer(){ document.getElementById('vlx-drawer').classList.remove('open'); document.getElementById('vlx-drawer-overlay').classList.remove('open'); }

function showSection(id){
  _activeSection = id;
  document.querySelectorAll('.vlx-nav-item').forEach(function(n){ n.classList.toggle('active', n.getAttribute('data-sec')===id); });
  document.querySelectorAll('.vlx-drawer-item').forEach(function(n,i){ n.classList.toggle('active', visibleSections()[i] && visibleSections()[i].id===id); });
  document.querySelectorAll('.vlx-section').forEach(function(s){ s.classList.remove('active'); });
  var target = id === 'workspace' ? 'sec-workspace' : 'sec-'+id;
  var el = document.getElementById(target);
  if (el) el.classList.add('active');
  render(id);
  // §15 — chaque section de données se rafraîchit à l'ouverture (pas
  // seulement après une mutation), sans recharger toute la page.
  if (!STANDALONE) {
    if (id === 'alertes') refreshAlerts();
    else if (id === 'approbations') refreshApprovals();
    else if (id === 'historique') refreshHistory();
    else if (id === 'accueil' || id === 'assistants') refreshAgents();
  }
}

function render(id){
  if (id === 'accueil') renderAccueil();
  else if (id === 'assistants') renderAssistants();
  else if (id === 'workspace') renderWorkspace(_activeWorkspaceAgentKey);
  else if (id === 'alertes') renderAlertes();
  else if (id === 'approbations') renderApprobations();
  else if (id === 'historique') renderHistorique();
  else if (id === 'parametres') renderParametres();
}

/* ── Accueil ── */
function renderAccueil(){
  var el = document.getElementById('sec-accueil');
  var visible = _platformAgents.filter(function(a){ return permissionsFor(a.row, a.manifest).can_read; });
  var actions = buildQuickActionsForRole();
  var greeting = _currentUser.firstName ? ('Bonjour '+esc(_currentUser.firstName)) : 'Bonjour';

  var html = '<div class="vlx-hero"><h2>'+greeting+'</h2><div style="color:var(--text2);font-size:14px;">Voici la situation actuelle.</div>';
  html += '<div class="vlx-sit"><div class="vlx-sit-item"><b>'+visible.length+'</b>assistant'+(visible.length>1?'s':'')+' disponible'+(visible.length>1?'s':'')+'</div></div></div>';

    html += '<div class="vlx-empty">Aucun assistant disponible pour votre rôle actuellement.</div>';
  } else {
    html += '<h3 style="font-size:15px;color:var(--text2);">Vos assistants</h3><div class="vlx-grid">';

function agentCardHTML(row){
  var displayName = row.name;

}

/* §9 — une action rapide ouvre l'espace agent ET lance réellement
   l'analyse (pas seulement une navigation). */
function runQuickAction(intentKey, agentKey){
  openWorkspace(agentKey);
  setTimeout(function(){ runAnalysis(agentKey); }, 50);
}

/* ── Assistants (galerie) ── */
function renderAssistants(){

/* ══════════════════════════════════════════════════════════════
   §8 — Espace d'un agent (générique, zéro page dédiée, zéro
   connaissance de la structure interne Maya/Nora/TechOps — le
   composant ne lit que report.summary/metrics/findings/
   recommendations/limits, normalisés par agent-run côté serveur).
   ══════════════════════════════════════════════════════════════ */
function openWorkspace(agentKey){
  _activeWorkspaceAgentKey = agentKey;
  showSection('workspace');
  refreshWorkspace(agentKey);
}

function refreshWorkspace(agentKey){
  if (!agentKey || STANDALONE) { render('workspace'); return Promise.resolve(); }
  var found = _platformAgents.filter(function(a){ return a.manifest.agent_key === agentKey; })[0];
  if (!found) { render('workspace'); return Promise.resolve(); }
  return Promise.all([
    secureCall('agent-foundation-read', { op:'get_last_run', agent_key: agentKey }),
    secureCall('agent-foundation-read', { op:'list_recent_runs', agent_key: agentKey, page_size: 10 }),
    secureCall('agent-foundation-read', { op:'list_recommendations', agent_key: agentKey }),
  ]).then(function(results){
    var lastRun = (results[0].body && results[0].body.ok) ? results[0].body.row : null;
    var recentRuns = (results[1].body && results[1].body.ok) ? results[1].body.rows : [];
    var recs = (results[2].body && results[2].body.ok) ? results[2].body.rows : [];
    _workspaceCache[agentKey] = { lastRun: lastRun, recentRuns: recentRuns, recommendations: recs };
    if (_activeWorkspaceAgentKey === agentKey) render('workspace');
  });
}

function renderWorkspace(agentKey){
  var el = document.getElementById('sec-workspace');
  var found = _platformAgents.filter(function(a){ return a.manifest.agent_key === agentKey; })[0];
  if (!found) { el.innerHTML = '<div class="vlx-empty">Sélectionnez un assistant depuis Accueil ou Assistants.</div>'; return; }
  var perm = permissionsFor(found.row, found.manifest);
  if (!perm.can_read) { el.innerHTML = '<div class="vlx-empty">Accès refusé pour votre rôle.</div>'; return; }

  var row = found.row, manifest = found.manifest;
  var cache = _workspaceCache[agentKey] || {};
  var busyRun = !!_busy['run:'+agentKey];
  var busyControl = !!_busy['control:'+agentKey];

  var html = '<div class="vlx-workspace-header"><div>'+
    '<h2 style="margin:0;">'+esc(row.name)+'</h2>'+
    '<div style="color:var(--text2);font-size:13px;margin-top:4px;">'+esc(manifest.category)+(row.description?' • '+esc(row.description):'')+'</div>'+
    '<div class="vlx-agent-card-status" style="margin-top:8px;"><span class="vlx-dot vlx-dot-'+esc(row.status)+'"></span>'+esc(statusLabel(row.status))+' · '+esc(engineLabel(manifest.engine_type))+'</div>'+
    '</div><div>';

  if (STANDALONE) {
    html += '<button class="vlx-btn vlx-btn-primary" disabled title="Aucun backend en mode aperçu">Analyser maintenant</button>';
  } else if (busyRun) {
    html += '<button class="vlx-btn vlx-btn-primary" disabled><span class="vlx-spin"></span>Analyse en cours…</button>';
  } else if (perm.can_run) {
    html += '<button class="vlx-btn vlx-btn-primary" onclick="runAnalysis(\''+esc(agentKey)+'\')">Analyser maintenant</button>';
  } else {
    html += '<button class="vlx-btn vlx-btn-primary" disabled title="Votre rôle ne permet pas de lancer une analyse pour cet assistant">Analyser maintenant</button>';
  }

  if (!STANDALONE) {
    if (busyControl) {
      html += ' <button class="vlx-btn" disabled><span class="vlx-spin"></span>…</button>';
    } else if (perm.can_pause) {
      html += ' <button class="vlx-btn" onclick="controlAgent(\''+esc(agentKey)+'\',\'pause_agent\')">Mettre en pause</button>';
    } else if (perm.can_resume) {
      html += ' <button class="vlx-btn vlx-btn-good" onclick="controlAgent(\''+esc(agentKey)+'\',\'resume_observation\')">Reprendre (Observation)</button>';
    }
    if (perm.can_disable && row.status !== 'disabled') {
      html += ' <button class="vlx-btn vlx-btn-danger" onclick="controlAgent(\''+esc(agentKey)+'\',\'disable_agent\')">Désactiver</button>';
    }
  }
  html += '</div></div>';

  var lastRun = cache.lastRun;
  var report = lastRun && lastRun.output_json ? lastRun.output_json : null;

  html += '<div class="vlx-card"><h3 style="margin-top:0;font-size:14px;color:var(--text2);">Résumé</h3>';
  if (STANDALONE) html += '<div>Aucune analyse pour le moment (mode aperçu).</div>';
  else if (report && report.summary) html += '<div>'+esc(report.summary)+'</div><div style="color:var(--text3);font-size:12px;margin-top:8px;">Dernière analyse : '+fmtDate(lastRun.created_at)+'</div>';
  else html += '<div class="vlx-empty" style="padding:12px 0;">Aucune analyse pour le moment. Cliquez sur « Analyser maintenant » pour obtenir un premier rapport.</div>';
  html += '</div>';

  html += '<div class="vlx-card" style="margin-top:14px;"><h3 style="margin-top:0;font-size:14px;color:var(--text2);">Indicateurs</h3>';
  if (report && report.metrics && Object.keys(report.metrics).length) {
    html += '<div class="vlx-grid">' + Object.keys(report.metrics).filter(function(k){ return typeof report.metrics[k] !== 'object'; }).map(function(k){
      return '<div class="vlx-sit-item"><b>'+esc(String(report.metrics[k]))+'</b>'+esc(k.replace(/_/g,' '))+'</div>';
    }).join('') + '</div>';
  } else {
    html += '<div class="vlx-empty" style="padding:12px 0;">Aucun indicateur disponible.</div>';
  }
  html += '</div>';

  html += '<div class="vlx-card" style="margin-top:14px;"><h3 style="margin-top:0;font-size:14px;color:var(--text2);">Alertes</h3>';
  if (report && Array.isArray(report.findings) && report.findings.length) {
    report.findings.forEach(function(f){
      html += '<div class="vlx-alert-row"><div><b>'+esc(f.title||f.code)+'</b>'+(f.description?'<div style="color:var(--text2);font-size:12px;margin-top:4px;">'+esc(f.description)+'</div>':'')+'</div><span class="vlx-sev vlx-sev-'+esc(f.severity||'info')+'">'+esc(f.severity||'info')+'</span></div>';
    });
  } else {
    html += '<div class="vlx-empty" style="padding:20px;">Aucune alerte actuellement. Tout semble normal.</div>';
  }
  html += '</div>';

  var recs = (cache.recommendations || []);
  html += '<div class="vlx-card" style="margin-top:14px;"><h3 style="margin-top:0;font-size:14px;color:var(--text2);">Recommandations</h3>';
  if (recs.length) {
    recs.forEach(function(r){ html += recommendationRowHTML(r, perm, false); });
  } else {
    html += '<div class="vlx-empty" style="padding:20px;">Aucune décision en attente actuellement.</div>';
  }
  html += '</div>';

  html += '<div class="vlx-card" style="margin-top:14px;"><h3 style="margin-top:0;font-size:14px;color:var(--text2);">Historique récent</h3>';
  var runs = cache.recentRuns || [];
  if (runs.length) {
    html += runs.map(function(r){ return '<div class="vlx-alert-row"><div>'+esc(r.run_type||'manual')+' · '+esc(r.status)+'</div><div style="color:var(--text3);font-size:12px;">'+fmtDate(r.created_at)+'</div></div>'; }).join('');
  } else {
    html += '<div class="vlx-empty" style="padding:20px;">Aucun historique disponible pour le moment.</div>';
  }
  html += '</div>';

  // Conversation shell — JAMAIS de faux chat génératif (§19).
  var scoped = buildQuickActionsForAgent(row, manifest);
  html += '<div class="vlx-card" style="margin-top:14px;"><h3 style="margin-top:0;font-size:14px;color:var(--text2);">💬 Conversation</h3>'+
    '<div style="color:var(--text2);font-size:13px;">Posez prochainement vos questions directement à '+esc(row.name)+'.</div>'+
    '<div style="margin-top:10px;"><input type="text" placeholder="Conversation libre bientôt disponible" disabled style="width:70%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text3);">'+
    ' <span title="Commande vocale bientôt disponible" style="opacity:.5;cursor:not-allowed;">🎙️</span></div>';
  if (scoped.length) {
    html += '<div style="color:var(--text2);font-size:12px;margin-top:10px;">Pour l\'instant, utilisez :</div><div class="vlx-conv-quick">';
    scoped.forEach(function(a){ html += '<button class="vlx-btn" onclick="runAnalysis(\''+esc(agentKey)+'\')">'+esc(a.label)+'</button>'; });
    html += '</div>';
  }
  html += '</div>';

  el.innerHTML = html;
}

/* §7 — bouton "Analyser maintenant" réellement câblé, endpoint
   générique agent-run, zéro if(agent_key===...). */
function runAnalysis(agentKey){
  if (STANDALONE) { toast('Aucun backend disponible en mode aperçu.', 'err'); return; }
  var key = 'run:'+agentKey;
  if (_busy[key]) return; // anti double-clic
  _busy[key] = true;
  render('workspace');
  secureCall('agent-run', { agent_key: agentKey, run_type: 'manual' }).then(function(r){
    _busy[key] = false;
    if (r && r.body && r.body.ok) {
      toast('Analyse terminée.', 'ok');
    } else {
      var code = (r && r.body && r.body.error) || 'erreur inconnue';
      console.error('[AI Center] runAnalysis failed', agentKey, code, r && r.status);
      toast("L'analyse n'a pas pu être terminée. Réessayez dans quelques instants.", 'err');
    }
    return Promise.all([ refreshWorkspace(agentKey), refreshAgents() ]);
  }).catch(function(e){
    _busy[key] = false;
    console.error('[AI Center] runAnalysis exception', e);
    toast("L'analyse n'a pas pu être terminée. Réessayez dans quelques instants.", 'err');
    render('workspace');
  });
}

/* §13 — pause/reprise/désactivation réellement câblés sur
   agent-control. Jamais de transition vers "active" possible ici. */
function controlAgent(agentKey, action){
  if (STANDALONE) return;
  var key = 'control:'+agentKey;
  if (_busy[key]) return;
  _busy[key] = true;
  render('workspace');
  secureCall('agent-control', { agent_key: agentKey, action: action, reason: 'ui_functional_007' }).then(function(r){
    _busy[key] = false;
    var found = _platformAgents.filter(function(a){ return a.manifest.agent_key === agentKey; })[0];
    var name = found ? found.row.name : agentKey;
    if (r && r.body && r.body.ok) {
      if (action === 'pause_agent') toast(name + ' est en pause.', 'ok');
      else if (action === 'resume_observation') toast(name + ' est de nouveau en mode Observation.', 'ok');
      else toast(name + ' a été désactivé.', 'ok');
    } else {
      toast("L'action n'a pas pu être effectuée. Réessayez dans quelques instants.", 'err');
    }
    return refreshAgents().then(function(){ return refreshWorkspace(agentKey); });
  }).catch(function(){
    _busy[key] = false;
    toast("L'action n'a pas pu être effectuée. Réessayez dans quelques instants.", 'err');
    render('workspace');
  });
}

/* ══════════════════════════════════════════════════════════════
   §10 — Alertes & recommandations réelles
   ══════════════════════════════════════════════════════════════ */
var _alertesData = [];
function refreshAlerts(){
  if (STANDALONE) { _alertesData = []; render('alertes'); return Promise.resolve(); }
  return secureCall('agent-foundation-read', { op:'list_recommendations' }).then(function(r){
    _alertesData = (r && r.body && r.body.ok) ? r.body.rows : [];
    if (_activeSection === 'alertes') render('alertes');
  });
}
function setAlertFilter(f){ _alertFilter = f; render('alertes'); }
function renderAlertes(){
  var el = document.getElementById('sec-alertes');
  var visibleKeys = _platformAgents.filter(function(a){ return permissionsFor(a.row,a.manifest).can_read; }).map(function(a){ return a.manifest.agent_key; });
  var domainFilters = _platformAgents.filter(function(a){ return visibleKeys.indexOf(a.manifest.agent_key)!==-1; }).map(function(a){ return { key:a.manifest.agent_key, label:a.row.name }; });

  var filtered = _alertesData.filter(function(r){ return visibleKeys.indexOf(r.agent_key) !== -1; });
  if (_alertFilter === 'critical') filtered = filtered.filter(function(r){ return r.priority === 'critical' || r.priority === 'high'; });
  else if (_alertFilter === 'pending') filtered = filtered.filter(function(r){ return r.status === 'pending'; });
  else if (domainFilters.some(function(d){ return d.key === _alertFilter; })) filtered = filtered.filter(function(r){ return r.agent_key === _alertFilter; });

  var filters = [{key:'all',label:'Toutes'},{key:'critical',label:'Critiques'},{key:'pending',label:'À valider'}].concat(domainFilters);
  var html = '<div class="vlx-filter-bar">' + filters.map(function(f){
    return '<div class="vlx-filter'+(f.key===_alertFilter?' active':'')+'" onclick="setAlertFilter(\''+esc(f.key)+'\')">'+esc(f.label)+'</div>';
  }).join('') + '</div>';

  html += '<div class="vlx-card">';
  if (!filtered.length) {
    html += '<div class="vlx-empty">Aucune alerte actuellement. Tout semble normal.</div>';
  } else {
    var byAgent = {}; _platformAgents.forEach(function(a){ byAgent[a.manifest.agent_key]=a.row.name; });
    filtered.forEach(function(r){
      var perm = { can_approve: DIRECTION_ROLES.indexOf(_currentUser.role)!==-1 };
      html += '<div class="vlx-alert-row"><div>'+
        '<div style="font-size:12px;color:var(--text2);">'+esc(byAgent[r.agent_key]||r.agent_key)+'</div>'+
        '<b>'+esc(r.title)+'</b>'+
        '<div style="color:var(--text2);font-size:12px;margin-top:4px;">'+esc(r.description||'')+'</div>'+
        '<div style="color:var(--text3);font-size:11px;margin-top:4px;">'+fmtDate(r.created_at)+' · '+esc(r.status)+'</div>'+
        '</div><div style="text-align:right;"><span class="vlx-sev vlx-sev-'+esc(r.priority||'medium')+'">'+esc(r.priority||'medium')+'</span>'+
        (r.status === 'pending' && perm.can_approve ? '<div style="margin-top:8px;"><button class="vlx-btn" onclick="showSection(\'approbations\')">Soumettre à validation</button></div>' : (r.status !== 'pending' ? '<div style="margin-top:8px;color:var(--text3);font-size:11px;">Décision : '+esc(r.status)+'</div>' : ''))+
        '</div></div>';
    });
  }
  html += '</div>';
  el.innerHTML = html;
}

/* ══════════════════════════════════════════════════════════════
   §11 — Approbations réelles
   ══════════════════════════════════════════════════════════════ */
var _approvalsData = [];
function refreshApprovals(){
  if (STANDALONE) { _approvalsData = []; render('approbations'); return Promise.resolve(); }
  return secureCall('agent-foundation-read', { op:'list_recommendations', status:'pending' }).then(function(r){
    _approvalsData = (r && r.body && r.body.ok) ? r.body.rows : [];
    if (_activeSection === 'approbations') render('approbations');
  });
}
function recommendationRowHTML(r, perm, showAgent){
  var byAgent = {}; _platformAgents.forEach(function(a){ byAgent[a.manifest.agent_key]=a.row.name; });
  var busy = !!_busy['approval:'+r.id];
  var html = '<div class="vlx-alert-row"><div>'+
    (showAgent ? '<div style="font-size:12px;color:var(--text2);">'+esc(byAgent[r.agent_key]||r.agent_key)+'</div>' : '')+
    '<b>'+esc(r.title)+'</b>'+
    '<div style="color:var(--text2);font-size:12px;margin-top:4px;">'+esc(r.description||'')+'</div>'+
    '<div style="color:var(--text3);font-size:11px;margin-top:4px;">'+fmtDate(r.created_at)+'</div>';
  if (r.status === 'pending' && perm && perm.can_approve && !STANDALONE) {
    if (busy) {
      html += '<div style="margin-top:8px;"><span class="vlx-spin"></span>Traitement…</div>';
    } else {
      html += '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">'+
        '<button class="vlx-btn vlx-btn-good" onclick="decideRecommendation(\''+esc(r.id)+'\',\'approve\')">Approuver</button>'+
        '<button class="vlx-btn vlx-btn-danger" onclick="decideRecommendation(\''+esc(r.id)+'\',\'reject\')">Rejeter</button>'+
        '</div>';
    }
    html += '<div class="vlx-disclaimer">Cette validation n\'effectue aucun paiement, n\'envoie aucune commande et ne modifie aucune réservation automatiquement.</div>';
  } else if (r.status !== 'pending') {
    html += '<div style="color:var(--text3);font-size:12px;margin-top:6px;">Décision : '+esc(r.status)+(r.reviewed_by?' par '+esc(r.reviewed_by):'')+'</div>';
  }
  html += '</div><span class="vlx-sev vlx-sev-'+esc(r.priority||'medium')+'">'+esc(r.priority||'medium')+'</span></div>';
  return html;
}
function renderApprobations(){
  var el = document.getElementById('sec-approbations');
  var isDirection = DIRECTION_ROLES.indexOf(_currentUser.role) !== -1;
  var perm = { can_approve: isDirection };
  var html = '<div class="vlx-card">';
  if (!isDirection) {
    html += '<div class="vlx-empty">Accès réservé à la direction pour les décisions d\'approbation.</div>';
  } else if (!_approvalsData.length) {
    html += '<div class="vlx-empty">Aucune décision en attente actuellement.</div>'+
      '<div class="vlx-disclaimer">Une approbation ici valide une recommandation — elle n\'exécute jamais automatiquement une action métier (paiement, commande, message).</div>';
  } else {
    _approvalsData.forEach(function(r){ html += recommendationRowHTML(r, perm, true); });
  }
  html += '</div>';
  el.innerHTML = html;
}
function decideRecommendation(id, decision){
  if (STANDALONE) return;
  var key = 'approval:'+id;
  if (_busy[key]) return;
  _busy[key] = true;
  render(_activeSection);
  secureCall('agent-approval', { recommendation_id: id, decision: decision }).then(function(r){
    _busy[key] = false;
    if (r && r.body && r.body.ok) toast(decision === 'approve' ? 'Recommandation approuvée.' : 'Recommandation rejetée.', 'ok');
    else toast("La décision n'a pas pu être enregistrée. Réessayez dans quelques instants.", 'err');
    return Promise.all([ refreshApprovals(), refreshAlerts(), refreshHistory() ]);
  }).catch(function(){
    _busy[key] = false;
    toast("La décision n'a pas pu être enregistrée. Réessayez dans quelques instants.", 'err');
    render(_activeSection);
  });
}

/* ══════════════════════════════════════════════════════════════
   §12 — Historique réel
   ══════════════════════════════════════════════════════════════ */
var _historyData = [];
function refreshHistory(){
  if (STANDALONE) { _historyData = []; render('historique'); return Promise.resolve(); }
  var visible = _platformAgents.filter(function(a){ return permissionsFor(a.row,a.manifest).can_read; });
  return Promise.all(visible.map(function(a){
    return secureCall('agent-foundation-read', { op:'list_recent_runs', agent_key: a.manifest.agent_key, page_size: 20 });
  })).then(function(results){
    var all = [];
    results.forEach(function(r, i){
      if (r && r.body && r.body.ok) {
        (r.body.rows||[]).forEach(function(run){ all.push({ type:'run', agent_key: visible[i].manifest.agent_key, agent_name: visible[i].row.name, at: run.created_at, status: run.status, run_type: run.run_type }); });
      }
    });
    all.sort(function(a,b){ return new Date(b.at) - new Date(a.at); });
    _historyData = all;
    if (_activeSection === 'historique') render('historique');
  });
}
function renderHistorique(){
  var el = document.getElementById('sec-historique');
  var html = '<div class="vlx-card">';
  if (!_historyData.length) {
    html += '<div class="vlx-empty">Aucun historique disponible pour le moment.</div>';
  } else {
    _historyData.forEach(function(h){
      html += '<div class="vlx-alert-row"><div><div style="font-size:12px;color:var(--text2);">'+esc(h.agent_name)+'</div>'+
        '<b>Analyse ('+esc(h.run_type||'manual')+')</b></div>'+
        '<div style="text-align:right;"><span class="vlx-sev vlx-sev-'+(h.status==='failed'?'critical':'info')+'">'+esc(h.status)+'</span>'+
        '<div style="color:var(--text3);font-size:11px;margin-top:4px;">'+fmtDate(h.at)+'</div></div></div>';
    });
  }
  html += '</div>';
  el.innerHTML = html;
}

/* ── Paramètres (direction uniquement) ── */
function renderParametres(){
  var el = document.getElementById('sec-parametres');
  var isDirection = DIRECTION_ROLES.indexOf(_currentUser.role) !== -1;
  if (!isDirection) { el.innerHTML = '<div class="vlx-empty">Accès réservé à la direction.</div>'; return; }
  var html = '<div class="vlx-card"><h3 style="margin-top:0;">Configuration simple</h3>';
  _platformAgents.forEach(function(a){
    html += '<div style="padding:10px 0;border-bottom:1px solid var(--border);">'+
      '<b>'+esc(a.row.name)+'</b> — '+esc(statusLabel(a.row.status))+'<br>'+
      '<span style="color:var(--text2);font-size:12px;">'+esc(a.manifest.category)+' · '+(a.manifest.capabilities||[]).map(esc).join(', ')+'</span>'+
      '</div>';
  });
  html += '</div><div class="vlx-card" style="margin-top:14px;"><h3 style="margin-top:0;">Configuration avancée</h3>'+
    '<div class="vlx-disclaimer">Modification sécurisée du comportement non disponible dans cette version.</div></div>';
  el.innerHTML = html;
}

/* ── Boot ── */
function boot(){
  if (STANDALONE) {
    document.getElementById('vlx-standalone-banner').style.display = 'flex';
    _currentUser = { name:'Aperçu', role:'gerant', firstName:'Aperçu' };
  }
  loadAgents().then(function(){
    renderNav();
    showSection('accueil');
    if (!STANDALONE) { refreshAlerts(); refreshApprovals(); refreshHistory(); }
  });
}

window.addEventListener('DOMContentLoaded', function(){
  if (STANDALONE) boot();
  // sinon on attend le message 'auth-context' du parent avant de démarrer.
});
</script>
</body>
</html>
