<title>Veraluz OS — Housekeeping &amp; Maintenance</title>
<style>
:root{
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#242836;--bg4:#2e3347;--border:#3a3f55;--border2:#4a5068;
  --accent:#6c63ff;--accent2:#8b7fff;--glow:rgba(108,99,255,.15);
  --green:#10b981;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6;--cyan:#06b6d4;
  --orange:#f97316;--purple:#8b5cf6;--pink:#ec4899;--teal:#14b8a6;
  --text:#e8eaf6;--text2:#9ca3af;--text3:#6b7280;
  /* Status colors */
  --s-available:#10b981;--s-occupied:#3b82f6;--s-checkout:#f97316;
  --s-dirty:#ef4444;--s-cleaning:#f59e0b;--s-inspecting:#8b5cf6;
  --s-maintenance:#6b7280;--s-out_of_order:#1f2937;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Inter','Segoe UI',sans-serif;font-size:14px;}
.app{display:flex;height:100vh;overflow:hidden;}
/* Sidebar */
.sidebar{width:210px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.logo{padding:14px 16px;border-bottom:1px solid var(--border);}
.logo-t{font-size:15px;font-weight:700;color:var(--accent2);}
.logo-s{font-size:10px;color:var(--text3);}
.nav{padding:6px;flex:1;overflow-y:auto;}
.nv{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--text2);font-size:12.5px;margin-bottom:1px;transition:.15s;}
.nv:hover{background:var(--bg3);color:var(--text);}
.nv.active{background:var(--glow);color:var(--accent2);border:1px solid var(--border);}
.nv-icon{font-size:15px;width:18px;text-align:center;}
.nv-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 5px;border-radius:8px;font-weight:600;}
.nav-user{padding:10px;border-top:1px solid var(--border);}
.u-wrap{display:flex;align-items:center;gap:8px;}
.u-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.u-nm{font-size:12px;font-weight:600;}.u-rl{font-size:10px;color:var(--text3);}
/* Role switcher */
.role-sw{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap;}
.role-btn{padding:2px 7px;border-radius:10px;font-size:9px;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:var(--bg3);transition:.15s;}
.role-btn.active{color:#fff;border-color:transparent;}
/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:10px;}
.pg-title{font-size:17px;font-weight:700;flex:1;}
/* Tabs */
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 14px;overflow-x:auto;flex-shrink:0;}
.tab{padding:10px 13px;font-size:12.5px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.15s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent);}
.tab-badge{background:var(--red);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:3px;font-weight:700;}
.content{flex:1;overflow-y:auto;padding:14px;}
/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin-bottom:14px;}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;}
.kpi-lbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.kpi-val{font-size:22px;font-weight:700;}
.kpi-sub{font-size:11px;color:var(--text3);}
/* Cards */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:13px;margin-bottom:10px;}
.card-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr;}.sidebar{display:none;}}
/* Room status grid */
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:12px;}
.room-card{border-radius:10px;padding:11px;cursor:pointer;transition:.15s;border:2px solid transparent;position:relative;}
.room-card:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.3);}
.room-floor{font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;opacity:.7;margin-bottom:3px;}
.room-num{font-size:18px;font-weight:800;margin-bottom:2px;}
.room-type{font-size:10px;opacity:.75;margin-bottom:6px;}
.room-status-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.room-priority{position:absolute;top:8px;right:8px;font-size:12px;}
/* Status colors */
.s-available{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.4);color:var(--green);}
.s-occupied{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.4);color:var(--blue);}
.s-checkout{background:rgba(249,115,22,.15);border-color:rgba(249,115,22,.4);color:var(--orange);}
.s-dirty{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5);color:var(--red);animation:pulseBorder 2.5s infinite;}
.s-cleaning{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.4);color:var(--yellow);}
.s-inspecting{background:rgba(139,92,246,.15);border-color:rgba(139,92,246,.4);color:var(--purple);}
.s-maintenance{background:rgba(107,114,128,.15);border-color:rgba(107,114,128,.4);color:var(--text2);}
.s-out_of_order{background:#111;border-color:#333;color:var(--text3);}
@keyframes pulseBorder{0%,100%{border-color:rgba(239,68,68,.5);}50%{border-color:rgba(239,68,68,1);}}
/* Task cards */
.task-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;border-left:4px solid transparent;cursor:pointer;transition:.15s;}
.task-card:hover{border-color:var(--border2);}
.task-card.priority-vip{border-left-color:var(--pink);}
.task-card.priority-urgent{border-left-color:var(--red);}
.task-card.priority-normal{border-left-color:var(--yellow);}
.task-card.priority-low{border-left-color:var(--green);}
/* Badges */
.bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:600;}
.bg{background:rgba(16,185,129,.1);color:var(--green);border:1px solid rgba(16,185,129,.2);}
.br{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.by{background:rgba(245,158,11,.1);color:var(--yellow);border:1px solid rgba(245,158,11,.2);}
.bb{background:rgba(59,130,246,.1);color:var(--blue);border:1px solid rgba(59,130,246,.2);}
.bp{background:rgba(108,99,255,.1);color:var(--accent2);border:1px solid rgba(108,99,255,.2);}
.bgr{background:var(--bg3);color:var(--text2);border:1px solid var(--border);}
.bo{background:rgba(249,115,22,.1);color:var(--orange);border:1px solid rgba(249,115,22,.2);}
.bpk{background:rgba(236,72,153,.1);color:var(--pink);border:1px solid rgba(236,72,153,.2);}
.bpu{background:rgba(139,92,246,.1);color:var(--purple);border:1px solid rgba(139,92,246,.2);}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:.15s;}
.bp_{background:var(--accent);color:#fff;}.bp_:hover{background:var(--accent2);}
.bg_{background:var(--green);color:#fff;}.bg_:hover{opacity:.85;}
.br_{background:var(--red);color:#fff;}.br_:hover{opacity:.85;}
.by_{background:var(--yellow);color:#000;}.by_:hover{opacity:.85;}
.bo_{background:var(--bg3);border:1px solid var(--border);color:var(--text2);}.bo_:hover{color:var(--text);background:var(--bg4);}
.btn-sm{padding:4px 9px;font-size:11px;}
/* Modals */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;align-items:center;justify-content:center;padding:12px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;}
.mh{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg2);z-index:1;}
.mt{font-size:14px;font-weight:600;}
.mc{background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:14px;}
.mb{padding:16px;}
.mf{padding:11px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
/* Form */
.fg{margin-bottom:10px;}
label{display:block;font-size:11px;color:var(--text2);margin-bottom:3px;font-weight:500;}
input,select,textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-size:13px;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
/* Checklist */
.chk-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;background:var(--bg3);margin-bottom:5px;}
.chk-box{width:20px;height:20px;border-radius:5px;border:2px solid var(--border2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;}
.chk-box.checked{background:var(--green);border-color:var(--green);color:#fff;font-size:12px;}
.chk-label{font-size:13px;flex:1;}
.chk-zone{font-size:10px;color:var(--text3);background:var(--bg4);padding:1px 5px;border-radius:4px;}
/* Photo grid */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.photo-slot{aspect-ratio:1;border-radius:8px;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:24px;transition:.15s;background:var(--bg3);}
.photo-slot:hover{border-color:var(--accent);background:var(--glow);}
.photo-slot.filled{border-style:solid;border-color:var(--green);background:var(--bg4);}
/* Progress */
.prog-bar{background:var(--bg3);border-radius:8px;height:8px;overflow:hidden;}
.prog-fill{height:100%;border-radius:8px;transition:.5s;}
/* Timeline */
.tl{position:relative;padding-left:18px;}
.tl::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--border);}
.tl-item{position:relative;margin-bottom:10px;}
.tl-dot{position:absolute;left:-16px;top:3px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg2);}
.tl-time{font-size:10px;color:var(--text3);}
.tl-txt{font-size:12.5px;margin-top:1px;}
/* Alert */
.alert{padding:9px 13px;border-radius:8px;font-size:12.5px;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.al-warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);color:var(--yellow);}
.al-info{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2);color:var(--blue);}
.al-crit{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:var(--red);}
.al-ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);color:var(--green);}
/* Table */
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:6px 10px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);}
td{padding:8px 10px;border-bottom:1px solid var(--bg4);font-size:12.5px;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg3);}
/* Toast */
.toast{position:fixed;bottom:16px;right:16px;background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:10px 14px;font-size:12.5px;z-index:9999;display:none;box-shadow:0 4px 20px rgba(0,0,0,.5);max-width:320px;}
.toast.show{display:flex;align-items:center;gap:7px;}
/* Mobile view switcher */
.view-sw{display:flex;background:var(--bg3);border-radius:8px;padding:3px;margin-bottom:12px;gap:2px;}
.view-btn{flex:1;text-align:center;padding:6px 8px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--text2);transition:.15s;}
.view-btn.active{background:var(--accent);color:#fff;}
::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px;}
</style>
<style data-injected="embedded-mode">
/* ═══════════════════════════════════════
   EMBEDDED MODE — injecté par create_embedded.py
   Supprime toute interface interne et force le module
   à occuper 100% du cadre iframe du Core
═══════════════════════════════════════ */
html, body {
  margin: 0 !important;
  padding: 0 !important;
  height: 100% !important;
  overflow: hidden !important;
  background: var(--bg-main, #0f172a) !important;
}

/* Supprimer les wrappers inutiles */
.app {
  display: block !important;
  height: 100vh !important;
  overflow: hidden !important;
}

/* .main occupe tout l'espace */
.main {
  display: flex !important;
  flex-direction: column !important;
  height: 100vh !important;
  width: 100% !important;
  overflow: hidden !important;
  margin: 0 !important;
  padding: 0 !important;
  background: var(--bg-main, #0f172a) !important;
}

/* Tabs collés en haut */
.tabs {
  flex-shrink: 0 !important;
}

/* Content scrollable prend le reste */
.content {
  flex: 1 !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;
  padding: 20px !important;
  box-sizing: border-box !important;
}

/* RESTAURANT: les .view occupent tout le .main */
.main > .view {
  display: none;
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  height: 100%;
  box-sizing: border-box;
}
.main > .view.active {
  display: flex;
  flex-direction: column;
}

/* Masquer sidebar, topbar, toast internes */
.sidebar,
aside.sidebar,
.topbar,
#toast,
.toast,
.bottom-nav,
nav.bottom-nav {
  display: none !important;
}
</style></head>
<body><script data-injected="embedded-bridge">
/* ═══════════════════════════════════════
   EMBEDDED BRIDGE — Communication avec Veraluz OS Core
   Injecté par create_embedded.py
═══════════════════════════════════════ */
(function() {
  'use strict';

  /* 1. Toast → déléguer au parent */
  window.toast = function(msg, type) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.showToast(msg, type || 'info');
      }
    } catch(e) {
      console.log('[Embedded toast]', msg, type);
    }
  };

  /* Aussi patcher showToast si défini localement */
  window.showToast = window.toast;

  /* 2. Émettre un événement vers le Core via postMessage */
  window.emitToCore = function(type, data) {
    try {
      window.parent.postMessage({
        veraluzEvent: true,
        type: type,
        data: data,
        source: window.__MODULE_NAME__ || 'embedded-module'
      }, '*');
    } catch(e) {}
  };

  /* 3. Recevoir des événements du Core */
  window.addEventListener('message', function(e) {
    if (!e.data || !e.data.veraluzEvent) return;
    var evt = new CustomEvent('veraluz:' + e.data.type, { detail: e.data.data });
    window.dispatchEvent(evt);
  });

  /* 4. Signaler au Core que le module est chargé */
  window.addEventListener('DOMContentLoaded', function() {
    window.emitToCore('module:ready', { module: window.__MODULE_NAME__ });
  });
})();
</script>

function statusBadge(s){const c=STATUS_CONFIG[s]||{icon:'?',label:s};return `<span style="font-size:12px;">${c.icon}</span> <span>${c.label}</span>`;}

function maintStatusBadge(s){const c=MAINT_STATUS[s]||{icon:'?',label:s,cls:'bgr'};return `<span class="bdg ${c.cls}">${c.icon} ${c.label}</span>`;}
function checklistPct(task){
  if(!task.checklist||task.checklist.length===0)return 0;
  return Math.round(task.checklist.filter(i=>i.done).length/task.checklist.length*100);
}
function updateBadges(){
  const dirty=rooms.filter(r=>['dirty','checkout'].includes(r.status)).length;
  const taskPending=tasks.filter(t=>['pending','assigned','in_progress','done'].includes(t.status)).length;
  const maintOpen=maintenances.filter(m=>!['resolved','closed','cancelled'].includes(m.status)).length;
  const el=document.getElementById('dirty-badge');if(el)el.textContent=`🧹 ${dirty} à nettoyer`;
  const tb=document.getElementById('tab-rooms-badge');if(tb)tb.textContent=dirty;
  const tt=document.getElementById('tab-tasks-badge');if(tt)tt.textContent=taskPending;
  const tm=document.getElementById('tab-maint-badge');if(tm)tm.textContent=maintOpen;
  const sb=document.getElementById('sidebar-badge');if(sb)sb.textContent=dirty;
}
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const el=document.getElementById('tab-'+tab);if(el)el.classList.add('active');
  render();
}
function switchRole(role){
  currentRole=role;

  event.target.style.background=role==='owner'?'var(--accent)':role==='supervisor'?'var(--blue)':role==='housekeeping'?'var(--green)':role==='maintenance'?'var(--orange)':'var(--purple)';

  const initials={owner:'S',supervisor:'R',housekeeping:'J',maintenance:'T',reception:'JB'};
  document.getElementById('u-av').style.background=roleColors[role];
  document.getElementById('u-nm').textContent=roleNames[role];
  document.getElementById('u-rl').textContent=roleLabels[role];
  document.getElementById('u-av').textContent=initials[role];

}
