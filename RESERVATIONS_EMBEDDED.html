<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réservations — Veraluz OS</title>
<script>window.__MODULE_NAME__ = 'reservations';</script>
<style>
/* ════════════════════════════════════════════════════════════
   EMBEDDED MODE — Module Réservations Veraluz OS
   Embedded · Mobile-first · Pas de sidebar · Pas de topbar
   13 unités : Ch.101-106, App.105, Studio 201-204, Suite Présidentielle
   ================================================================ */

/* ── DESIGN TOKENS (cohérents avec le Core) ───────────────── */
:root {
  --bg:      #0d0d1a;
  --bg2:     #11112a;
  --bg3:     #17173a;
  --bg4:     #1e1e48;
  --bgh:     #252560;
  --border:  rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --accent:  #6c63ff;
  --accent2: #8b7fff;
  --success: #22d3a5;
  --warning: #f59e0b;
  --danger:  #f43f5e;
  --info:    #38bdf8;
  --text:    #e8e6ff;
  --text2:   #9990cc;
  --text3:   #5a5580;
  --r:       10px;
}

/* ── RESET EMBEDDED ───────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}

/* ── LAYOUT EMBEDDED ──────────────────────────────────────── */
.module-wrap {
  display: flex; flex-direction: column;
  height: 100vh; overflow: hidden;
}

/* ── TABS ─────────────────────────────────────────────────── */
.tabs-bar {
  display: flex; flex-shrink: 0;
  background: var(--bg2);
  border-bottom: 1px solid var(--border2);
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabs-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 0 16px; height: 48px;
  white-space: nowrap; flex-shrink: 0;
  background: none; border: none;
  color: var(--text3); font-size: 13px; font-weight: 600;
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: all .18s; position: relative;
}
.tab-btn:hover { color: var(--text2); background: rgba(255,255,255,.03); }
.tab-btn.active { color: var(--accent2); border-bottom-color: var(--accent); }
.tab-btn .tbadge {
  background: var(--danger); color: #fff;
  border-radius: 10px; font-size: 10px; font-weight: 700;
  padding: 1px 6px; min-width: 18px; text-align: center;
}
.tab-btn .tbadge.warn { background: var(--warning); color: #000; }
.tab-btn .tbadge.ok   { background: var(--success); }

/* ── CONTENT PANE ─────────────────────────────────────────── */
.tab-pane { display: none; flex: 1; overflow: hidden; }
.tab-pane.active { display: flex; flex-direction: column; }

.pane-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 16px;
  -webkit-overflow-scrolling: touch;
}
@media (min-width: 640px) { .pane-scroll { padding: 20px; } }

/* ── TOOLBAR ─────────────────────────────────────────────────── */
.toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap; gap: 8px;
}
.toolbar-title { font-size: 15px; font-weight: 700; flex: 1; min-width: 120px; }
.toolbar-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.btn {
  padding: 7px 12px; border-radius: 8px;
  font-size: 12px; font-weight: 600; cursor: pointer;
  border: none; transition: all .15s;
  display: flex; align-items: center; gap: 5px;
}
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 3px 10px rgba(108,99,255,.3); }
.btn-primary:hover { opacity: .88; transform: translateY(-1px); }
.btn-outline { background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); }
.btn-outline:hover { background: var(--bgh); color: var(--text); }
.btn-success { background: rgba(34,211,165,.15); border: 1px solid rgba(34,211,165,.3); color: var(--success); }
.btn-success:hover { background: rgba(34,211,165,.25); }
.btn-danger  { background: rgba(244,63,94,.12); border: 1px solid rgba(244,63,94,.25); color: var(--danger); }
.btn-danger:hover { background: rgba(244,63,94,.22); }
.btn-warning { background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.25); color: var(--warning); }
.btn-sm { padding: 5px 10px; font-size: 11px; }

/* ── STATUS BADGES ────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 700;
}
.badge-available { background: rgba(34,211,165,.12); color: var(--success); border: 1px solid rgba(34,211,165,.25); }
.badge-occupied  { background: rgba(108,99,255,.15); color: var(--accent2); border: 1px solid rgba(108,99,255,.3); }
.badge-reserved  { background: rgba(56,189,248,.12); color: var(--info);    border: 1px solid rgba(56,189,248,.25); }
.badge-dirty     { background: rgba(245,158,11,.12); color: var(--warning); border: 1px solid rgba(245,158,11,.25); }
.badge-oos       { background: rgba(244,63,94,.1);   color: var(--danger);  border: 1px solid rgba(244,63,94,.2); }
.badge-checkin   { background: rgba(34,211,165,.15); color: var(--success); border: 1px solid rgba(34,211,165,.3); }
.badge-checkout  { background: rgba(245,158,11,.15); color: var(--warning); border: 1px solid rgba(245,158,11,.3); }

/* ── CARDS ────────────────────────────────────────────────── */
.card {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--r);
  overflow: hidden;
}
.card-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.card-title { font-size: 13px; font-weight: 700; flex: 1; }

/* ── SEARCH / FILTER BAR ──────────────────────────────────── */
.filter-bar {
  display: flex; gap: 8px; padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.search-input {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 8px; padding: 7px 12px; flex: 1; min-width: 140px;
}
.search-input:focus-within { border-color: var(--accent); }
.search-input input {
  background: none; border: none; outline: none;
  color: var(--text); font-size: 13px; width: 100%;
}
.search-input input::placeholder { color: var(--text3); }
.filter-select {
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 8px; padding: 7px 10px;
  color: var(--text2); font-size: 12px; outline: none; cursor: pointer;
  -webkit-appearance: none;
}
.filter-select:focus { border-color: var(--accent); }

/* ── PLANNING CALENDRIER ─────────────────────────────────── */
.planning-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.nav-month-btn {
  width: 32px; height: 32px; border-radius: 7px;
  border: 1px solid var(--border2); background: var(--bg3);
  color: var(--text2); cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.nav-month-btn:hover { background: var(--bgh); color: var(--text); }
.month-label { font-size: 15px; font-weight: 700; flex: 1; text-align: center; }

.planning-grid-wrap { flex: 1; overflow: auto; }
.planning-grid {
  min-width: 600px;
  display: grid;
}
.pg-header-row {
  display: grid; position: sticky; top: 0; z-index: 5;
  background: var(--bg2); border-bottom: 1px solid var(--border2);
}
.pg-day-header {
  padding: 6px 4px; text-align: center;
  font-size: 10px; font-weight: 700; color: var(--text3);
  border-right: 1px solid var(--border);
}
.pg-day-header.today { color: var(--accent2); background: rgba(108,99,255,.08); }
.pg-day-header.first-col { text-align: left; padding-left: 8px; font-size: 11px; color: var(--text2); }

.pg-room-row {
  display: grid; border-bottom: 1px solid var(--border);
  min-height: 40px;
}
.pg-room-row:hover { background: rgba(255,255,255,.02); }
.pg-room-label {
  padding: 0 8px; display: flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; color: var(--text2);
  border-right: 1px solid var(--border2);
  position: sticky; left: 0; background: var(--bg2); z-index: 2;
}
.pg-room-label .r-type { font-size: 10px; color: var(--text3); }
.pg-cell {
  border-right: 1px solid var(--border);
  position: relative; cursor: pointer;
  transition: background .12s;
}
.pg-cell:hover { background: rgba(108,99,255,.06); }
.pg-cell.today-col { background: rgba(108,99,255,.04); }
.pg-block {
  position: absolute; top: 3px; bottom: 3px;
  border-radius: 4px; left: 2px; right: 2px;
  display: flex; align-items: center; padding: 0 6px;
  font-size: 10px; font-weight: 600; color: #fff;
  overflow: hidden; white-space: nowrap;
  cursor: pointer; z-index: 3;
  transition: opacity .15s;
}
.pg-block:hover { opacity: .85; }

/* ── ROOM CARDS GRID ─────────────────────────────────────── */
.rooms-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
@media (min-width: 480px)  { .rooms-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 768px)  { .rooms-grid { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1024px) { .rooms-grid { grid-template-columns: repeat(5, 1fr); } }

.room-card {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: var(--r); padding: 14px 12px;
  cursor: pointer; transition: all .18s;
  display: flex; flex-direction: column; gap: 8px;
}
.room-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108,99,255,.15); }
.room-card.occupied  { border-color: rgba(108,99,255,.4); }
.room-card.dirty     { border-color: rgba(245,158,11,.35); }
.room-card.oos       { border-color: rgba(244,63,94,.3); opacity: .7; }
.room-card.reserved  { border-color: rgba(56,189,248,.35); }

.rc-top { display: flex; align-items: flex-start; justify-content: space-between; }
.rc-icon { font-size: 24px; }
.rc-num  { font-size: 13px; font-weight: 800; color: var(--text); }
.rc-type { font-size: 10px; color: var(--text3); }
.rc-guest { font-size: 11px; color: var(--text2); min-height: 16px; }
.rc-nights { font-size: 10px; color: var(--text3); }
.rc-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

/* ── RESERVATION LIST ─────────────────────────────────────── */
.rez-list { display: flex; flex-direction: column; gap: 8px; }
.rez-item {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: var(--r); padding: 14px 16px;
  cursor: pointer; transition: all .15s;
}
.rez-item:hover { border-color: var(--accent); background: rgba(108,99,255,.04); }
.rez-item-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
.rez-ref { font-size: 11px; color: var(--text3); font-weight: 600; letter-spacing: .04em; }
.rez-guest-name { font-size: 14px; font-weight: 700; color: var(--text); }
.rez-room { font-size: 12px; color: var(--text2); }
.rez-dates {
  display: flex; gap: 8px; font-size: 12px; color: var(--text3);
  flex-wrap: wrap; align-items: center;
}
.rez-dates .sep { color: var(--text3); }
.rez-nights { font-size: 11px; color: var(--accent2); font-weight: 600; }
.rez-amount { font-size: 14px; font-weight: 800; color: var(--text); }
.rez-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

/* ── MODAL ────────────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
  display: none; align-items: flex-end; justify-content: center;
}
.modal-backdrop.show { display: flex; }
@media (min-width: 640px) { .modal-backdrop { align-items: center; } }

.modal {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 20px 20px 0 0; width: 100%; max-height: 90vh;
  display: flex; flex-direction: column;
  animation: modalIn .3s cubic-bezier(.2,.8,.3,1);
  overflow: hidden;
}
@media (min-width: 640px) {
  .modal { border-radius: 20px; max-width: 520px; max-height: 85vh; }
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(20px) scale(.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-header {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 20px; border-bottom: 1px solid var(--border2);
  flex-shrink: 0;
}
.modal-title { font-size: 16px; font-weight: 800; flex: 1; }
.modal-close {
  width: 30px; height: 30px; border-radius: 8px;
  border: 1px solid var(--border2); background: var(--bg3);
  color: var(--text2); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.modal-close:hover { background: var(--bgh); color: var(--text); }
.modal-body { flex: 1; overflow-y: auto; padding: 20px; }
.modal-footer {
  display: flex; gap: 8px; padding: 14px 20px;
  border-top: 1px solid var(--border2); flex-shrink: 0;
  flex-wrap: wrap;
}
.modal-footer .btn { flex: 1; justify-content: center; }

/* ── FORM ELEMENTS ────────────────────────────────────────── */
.form-group { margin-bottom: 14px; }
.form-label {
  display: block; font-size: 11px; font-weight: 700;
  color: var(--text2); text-transform: uppercase; letter-spacing: .07em;
  margin-bottom: 6px;
}
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 10px 12px;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 9px; color: var(--text);
  font-size: 13px; outline: none;
  transition: border-color .2s, box-shadow .2s;
  -webkit-appearance: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(108,99,255,.12);
}
.form-input::placeholder, .form-textarea::placeholder { color: var(--text3); }
.form-textarea { resize: vertical; min-height: 80px; font-family: inherit; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 479px) { .form-row { grid-template-columns: 1fr; } }
.form-hint { font-size: 11px; color: var(--text3); margin-top: 4px; }

/* ── DETAIL VIEW dans modal ────────────────────────────────── */
.detail-row {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 10px 0; border-bottom: 1px solid var(--border);
  gap: 12px;
}
.detail-row:last-child { border-bottom: none; }
.detail-label { font-size: 12px; color: var(--text3); flex-shrink: 0; }
.detail-value { font-size: 13px; font-weight: 600; color: var(--text); text-align: right; }

/* ── STAT STRIP ───────────────────────────────────────────── */
.stat-strip {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 10px; margin-bottom: 14px;
}
@media (min-width: 640px) { .stat-strip { grid-template-columns: repeat(4, 1fr); } }
.stat-item {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 9px; padding: 12px 14px; text-align: center;
}
.stat-val { font-size: 24px; font-weight: 800; line-height: 1; }
.stat-lbl { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; }

/* ── EMPTY STATE ──────────────────────────────────────────── */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 12px; padding: 48px 24px;
  color: var(--text3); text-align: center;
}
.empty-icon { font-size: 48px; opacity: .5; }
.empty-text { font-size: 14px; font-weight: 600; }
.empty-sub  { font-size: 12px; }

/* ── TOAST LOCAL (fallback si pas de Core) ─────────────────── */
#local-toast {
  position: fixed; bottom: 20px; right: 16px; z-index: 9999;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}

/* ── SCROLLBAR ────────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<!-- ═══ EMBEDDED BRIDGE (injecté automatiquement) ═══ -->
<script data-injected="embedded-bridge">
(function() {
  'use strict';
  window.__MODULE_NAME__ = 'reservations';
  window.toast = function(msg, type) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.showToast(msg, '', type || 'info');
      } else { showLocalToast(msg, type); }
    } catch(e) { showLocalToast(msg, type); }
  };
  window.showToast = window.toast;
  window.emitToCore = function(type, data) {
    try {
      window.parent.postMessage({ veraluzEvent: true, type: type, data: data, source: 'reservations' }, '*');
    } catch(e) {}
  };
  window.addEventListener('message', function(e) {
    if (!e.data || !e.data.veraluzEvent) return;
    if (e.data.type === 'auth.context') { window.__AUTH__ = e.data.data; }
    window.dispatchEvent(new CustomEvent('veraluz:' + e.data.type, { detail: e.data.data }));
  });
  window.addEventListener('DOMContentLoaded', function() {
    window.emitToCore('module:ready', { module: 'reservations' });
  });
})();
</script>

<!-- ═══ MODULE WRAP ═══ -->
<div class="module-wrap">

  <!-- TABS BAR -->
  <div class="tabs-bar" role="tablist">
    <button class="tab-btn active" onclick="switchTab('planning')" id="tab-planning" role="tab">
      📅 Planning
    </button>
    <button class="tab-btn" onclick="switchTab('chambres')" id="tab-chambres" role="tab">
      🛏️ Chambres
      <span class="tbadge" id="tbadge-dispo">10 libres</span>
    </button>
    <button class="tab-btn" onclick="switchTab('liste')" id="tab-liste" role="tab">
      📋 Réservations
      <span class="tbadge warn" id="tbadge-checkin">3 auj.</span>
    </button>
    <button class="tab-btn" onclick="switchTab('nouvelle')" id="tab-nouvelle" role="tab">
      ➕ Nouvelle
    </button>
  </div>

  <!-- ════════════════════════════════════════════════════════
       ONGLET 1 — PLANNING (Calendrier)
  ════════════════════════════════════════════════════════ -->
  <div class="tab-pane active" id="pane-planning" role="tabpanel">

    <div class="planning-header">
      <button class="nav-month-btn" onclick="changeMonth(-1)">‹</button>
      <div class="month-label" id="planning-month-label">Mai 2026</div>
      <button class="nav-month-btn" onclick="changeMonth(1)">›</button>
      <div style="margin-left:8px;display:flex;gap:6px">
        <button class="btn btn-outline btn-sm" onclick="goToday()">Auj.</button>
        <button class="btn btn-primary btn-sm" onclick="openCreateModal()">+ Réservation</button>
      </div>
    </div>

    <!-- Légende -->
    <div style="display:flex;gap:12px;padding:8px 16px;flex-wrap:wrap;border-bottom:1px solid var(--border);font-size:11px;flex-shrink:0">
      <span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:12px;border-radius:3px;background:#6c63ff;display:inline-block"></span>Occupée</span>
      <span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:12px;border-radius:3px;background:#38bdf8;display:inline-block"></span>Réservée</span>
      <span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:12px;border-radius:3px;background:#22d3a5;display:inline-block"></span>Check-in auj.</span>
      <span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:12px;border-radius:3px;background:#f59e0b;display:inline-block"></span>Check-out auj.</span>
    </div>

    <div class="planning-grid-wrap">
      <div class="planning-grid" id="planning-grid"></div>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════
       ONGLET 2 — CHAMBRES
  ════════════════════════════════════════════════════════ -->
  <div class="tab-pane" id="pane-chambres" role="tabpanel">
    <div class="toolbar">
      <div class="toolbar-title">État des unités</div>
      <div class="toolbar-actions">
        <select class="filter-select" onchange="filterRooms(this.value)" id="filter-room-status">
          <option value="all">Toutes</option>
          <option value="available">Libres</option>
          <option value="occupied">Occupées</option>
          <option value="reserved">Réservées</option>
          <option value="dirty">À nettoyer</option>
          <option value="oos">Hors service</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="openCreateModal()">+ Réservation</button>
      </div>
    </div>
    <!-- Stat strip -->
    <div style="padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0">
      <div class="stat-strip" id="rooms-stat-strip"></div>
    </div>
    <div class="pane-scroll">
      <div class="rooms-grid" id="rooms-grid"></div>
    </div>
  </div>

// ── DONNÉES RÉSERVATIONS (Supabase) ─────────────────────────────
/* ── Supabase helper ──────────────────────────────────────── */
var _sbUrl = (typeof window !== 'undefined' && window.__SUPABASE_URL__) ? window.__SUPABASE_URL__ : '';
var _sbKey = (typeof window !== 'undefined' && window.__SUPABASE_KEY__) ? window.__SUPABASE_KEY__ : '';

function sbGet(path) {
  return fetch(_sbUrl + path, {
    headers: { 'apikey': _sbKey, 'Authorization': 'Bearer ' + _sbKey, 'Accept': 'application/json' }
  }).then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}

function sbPost(table, data) {
  return fetch(_sbUrl + '/rest/v1/' + table, {
    method: 'POST',
    headers: { 'apikey': _sbKey, 'Authorization': 'Bearer ' + _sbKey,
      'Content-Type': 'application/json', 'Prefer': 'return=representation' },
    body: JSON.stringify(data)
  }).then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}

function sbPatchRez(id, data) {
  return fetch(_sbUrl + '/rest/v1/veraluz_reservations?id=eq.' + id, {
    method: 'PATCH',
    headers: { 'apikey': _sbKey, 'Authorization': 'Bearer ' + _sbKey,
      'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify(data)
  });
}

function mapRezRow(row) {
  var statusMap = { checkedin:'occupied', checkedout:'checkout', confirmed:'confirmed',
                    cancelled:'cancelled', pending:'checkin', completed:'completed' };
  return {
    id:        row.id,
    ref:       row.id.toUpperCase().slice(0, 12),
    client:    row.client_name || '—',
    email:     row.client_email || '',
    tel:       row.client_phone || '',
    unitId:    row.unit_id || '',
    arrival:   row.check_in  || '',
    departure: row.check_out || '',
    adults:    row.guests    || 1,
    children:  0,
    status:    statusMap[row.status] || row.status || 'confirmed',
    payment:   'orange_money',
    notes:     row.notes || '',
    total:     row.total || 0,
    paid:      row.paid  || 0
  };
}

function loadReservationsFromSupabase(callback) {
  if (!_sbUrl || !_sbKey) {
    console.warn('[Réservations] Supabase non disponible — données vides');
    callback && callback();
    return;
  }

  // Charger réservations + unités en parallèle
  Promise.all([
    sbGet('/rest/v1/veraluz_reservations?select=*&order=created_at.desc'),
    sbGet('/rest/v1/veraluz_units?select=id,name,type,price,capacity,emoji,status&order=sort_order.asc')
  ]).then(function(results) {
    var rezRows   = results[0] || [];
    var unitRows  = results[1] || [];

    // Construire UNITS_MAP
    UNITS_MAP = {};
    unitRows.forEach(function(u) { UNITS_MAP[u.id] = u; });

    // Mapper les réservations
    RESERVATIONS = rezRows.map(mapRezRow);

    console.log('[Réservations] ' + RESERVATIONS.length + ' réservations chargées depuis Supabase');
    callback && callback();
  }).catch(function(err) {
    console.warn('[Réservations] Erreur Supabase:', err);
    emitToCore('module.error', { module:'reservations', error: err.message });
    callback && callback();
  });
}

var today = new Date(); today.setHours(0,0,0,0);
function daysFromToday(n) {
  var d = new Date(today); d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}

var RESERVATIONS = [];  // rempli depuis Supabase
var UNITS_MAP   = {};   // id → {name, type, price, capacity, emoji}

// Calculer les statuts dynamiques des chambres
function getRoomStatus(unitId) {
  var todayStr = today.toISOString().slice(0,10);
  var rez = RESERVATIONS.find(function(r) {
    return r.unitId === unitId &&
           r.arrival <= todayStr && r.departure > todayStr &&
           r.status !== 'cancelled' && r.status !== 'completed';
  });
  if (!rez) {
    var future = RESERVATIONS.find(function(r) {
      return r.unitId === unitId && r.arrival > todayStr && r.status === 'confirmed';
    });
    if (future) return 'reserved';
    // Vérifier le statut réel de l'unité dans UNITS_MAP
    var unit = UNITS_MAP[unitId];
    if (unit) {
      if (unit.status === 'dirty')        return 'dirty';
      if (unit.status === 'maintenance')  return 'oos';
      if (unit.status === 'occupied')     return 'occupied';
    }
    return 'available';
  }
  if (rez.status === 'checkout') return 'dirty';
  return 'occupied';
}

function getRoomRez(unitId) {
  var todayStr = today.toISOString().slice(0,10);
  return RESERVATIONS.find(function(r) {
    return r.unitId === unitId &&
           r.arrival <= todayStr && r.departure >= todayStr &&
           r.status !== 'cancelled' && r.status !== 'completed';
  }) || null;
}

// ── NAVIGATION ONGLETS ─────────────────────────────────────────
var currentTab = 'planning';

function switchTab(tab) {

}

// ── PLANNING CALENDRIER ────────────────────────────────────────
var planningMonth = new Date(today.getFullYear(), today.getMonth(), 1);
var DAYS_VISIBLE  = 21; // jours affichés

function changeMonth(dir) {
  planningMonth = new Date(planningMonth.getFullYear(), planningMonth.getMonth() + dir, 1);
  renderPlanning();
}
function goToday() {
  planningMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  renderPlanning();
}

function renderPlanning() {
  var grid = document.getElementById('planning-grid');
  if (!grid) return;
  var label = document.getElementById('planning-month-label');

  // Calculer les jours à afficher (à partir du 1er du mois, 21 jours)
  var startDate = new Date(planningMonth);
  var days = [];
  for (var i = 0; i < DAYS_VISIBLE; i++) {
    var d = new Date(startDate);
    d.setDate(startDate.getDate() + i);
    days.push(d);
  }

  if (label) {
    label.textContent = planningMonth.toLocaleDateString('fr-FR', { month:'long', year:'numeric' });
    label.textContent = label.textContent.charAt(0).toUpperCase() + label.textContent.slice(1);
  }

  // Largeur colonne unité + jours
  var colTemplate = '120px repeat(' + DAYS_VISIBLE + ', minmax(28px, 1fr))';

  var html = '';

  // Header ligne de jours
  html += '<div class="pg-header-row" style="grid-template-columns:' + colTemplate + '">';
  html += '<div class="pg-day-header first-col">Unité</div>';
  days.forEach(function(d) {
    var isToday = d.toISOString().slice(0,10) === today.toISOString().slice(0,10);
    var cls = isToday ? ' today' : '';
    html += '<div class="pg-day-header' + cls + '">' +
      '<div>' + d.toLocaleDateString('fr-FR', { weekday:'narrow' }) + '</div>' +
      '<div style="font-size:12px;font-weight:800;' + (isToday ? 'color:var(--accent)' : '') + '">' + d.getDate() + '</div>' +
    '</div>';
  });
  html += '</div>';

  // Lignes par unité
  UNITS.forEach(function(unit) {
    html += '<div class="pg-room-row" style="grid-template-columns:' + colTemplate + '">';
    html += '<div class="pg-room-label">' +
      '<div>' +
        '<div>' + unit.label + '</div>' +
        '<div class="r-type">' + unit.type + '</div>' +
      '</div>' +
    '</div>';

    days.forEach(function(d) {
      var ds = d.toISOString().slice(0,10);
      var todayCol = ds === today.toISOString().slice(0,10) ? ' today-col' : '';

      // Trouver réservation sur ce jour
      var rez = RESERVATIONS.find(function(r) {
        return r.unitId === unit.id && r.arrival <= ds && r.departure > ds && r.status !== 'cancelled' && r.status !== 'completed';
      });

      var blockHtml = '';
      if (rez && rez.arrival === ds) {
        // Calculer la durée en jours visibles
        var arrIdx = days.findIndex(function(x) { return x.toISOString().slice(0,10) === rez.arrival; });
        var depDate = new Date(rez.departure);
        var dur = 0;
        for (var k = arrIdx; k < days.length; k++) {
          if (days[k] < depDate) dur++;
          else break;
        }

        var colors = { occupied:'#6c63ff', checkin:'#22d3a5', checkout:'#f59e0b', confirmed:'#38bdf8', reserved:'#38bdf8' };
        var color = colors[rez.status] || '#6c63ff';
        var guestFirst = rez.client.split(' ')[0];

        // Le bloc sera positionné en absolute et s'étend sur plusieurs colonnes — on le met dans la 1ère cellule
        blockHtml = '<div class="pg-block" style="background:' + color + ';width:calc(' + dur + '00% + ' + (dur-1) + 'px);cursor:pointer" onclick="showRezDetail(\'' + rez.id + '\')" title="' + rez.client + '">' +
          guestFirst +
        '</div>';
      }

      html += '<div class="pg-cell' + todayCol + '" onclick="openCreateModal(\'' + unit.id + '\',\'' + ds + '\')">' + blockHtml + '</div>';
    });

    html += '</div>';
  });

  grid.style.gridTemplateColumns = '1fr';
  grid.innerHTML = html;
}

// ── CHAMBRES ──────────────────────────────────────────────────
function renderChambreStats() {
  var strip = document.getElementById('rooms-stat-strip');
  if (!strip) return;
  var counts = { available:0, occupied:0, reserved:0, dirty:0, oos:0 };
  UNITS.forEach(function(u) { var s = getRoomStatus(u.id); if (counts[s] !== undefined) counts[s]++; });
  strip.innerHTML = [
    { val: counts.available, lbl: 'Libres',     cls: 'color:var(--success)' },
    { val: counts.occupied,  lbl: 'Occupées',   cls: 'color:var(--accent2)' },
    { val: counts.reserved,  lbl: 'Réservées',  cls: 'color:var(--info)' },
    { val: counts.dirty,     lbl: 'À nettoyer', cls: 'color:var(--warning)' },
  ].map(function(s) {
    return '<div class="stat-item"><div class="stat-val" style="' + s.cls + '">' + s.val + '</div><div class="stat-lbl">' + s.lbl + '</div></div>';
  }).join('');

  var tbadge = document.getElementById('tbadge-dispo');
  if (tbadge) tbadge.textContent = counts.available + ' libres';
}

var roomFilter = 'all';
function filterRooms(val) { roomFilter = val; renderRoomsGrid(); }

function renderRoomsGrid() {
  var grid = document.getElementById('rooms-grid');
  if (!grid) return;
  renderChambreStats();

  var filtered = UNITS.filter(function(u) {
    if (roomFilter === 'all') return true;
    return getRoomStatus(u.id) === roomFilter;
  });

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🔍</div><div class="empty-text">Aucune unité dans ce statut</div></div>';
    return;
  }

  var STATUS_LABELS = { available:'Disponible', occupied:'Occupée', reserved:'Réservée', dirty:'À nettoyer', oos:'Hors service' };
  var STATUS_BADGE  = { available:'badge-available', occupied:'badge-occupied', reserved:'badge-reserved', dirty:'badge-dirty', oos:'badge-oos' };

  grid.innerHTML = filtered.map(function(u) {
    var status = getRoomStatus(u.id);
    var rez    = getRoomRez(u.id);
    var nights = rez ? Math.round((new Date(rez.departure) - new Date(rez.arrival)) / 86400000) : 0;
    var checkoutToday = rez && rez.departure === today.toISOString().slice(0,10);
    var checkinToday  = rez && rez.arrival  === today.toISOString().slice(0,10);

    var actions = '';
    if (status === 'occupied' || checkinToday) {
      if (checkinToday) {
        actions += '<button class="btn btn-success btn-sm" onclick="doCheckin(\'' + u.id + '\',event)">✅ Check-in</button>';
      }
      if (checkoutToday || status === 'occupied') {
        actions += '<button class="btn btn-warning btn-sm" onclick="doCheckout(\'' + u.id + '\',event)">🚪 Check-out</button>';
      }
    } else if (status === 'available') {
      actions += '<button class="btn btn-primary btn-sm" onclick="openCreateModal(\'' + u.id + '\',null,event)">+ Réserver</button>';
    } else if (status === 'dirty') {
      actions += '<button class="btn btn-outline btn-sm" onclick="markClean(\'' + u.id + '\',event)">🧹 Marquer propre</button>';
    } else if (status === 'reserved') {
      actions += '<button class="btn btn-success btn-sm" onclick="doCheckinByUnit(\'' + u.id + '\',event)">✅ Check-in</button>';
    }

    return '<div class="room-card ' + status + '" onclick="showUnitDetail(\'' + u.id + '\')">' +
      '<div class="rc-top">' +
        '<div class="rc-icon">' + u.icon + '</div>' +
        '<span class="badge ' + STATUS_BADGE[status] + '">' + STATUS_LABELS[status] + '</span>' +
      '</div>' +
      '<div><div class="rc-num">' + u.label + '</div><div class="rc-type">' + u.type + '</div></div>' +
      '<div class="rc-guest">' + (rez ? rez.client : '') + '</div>' +
      '<div class="rc-nights">' + (rez ? nights + ' nuits · Dép. ' + fmtDateShort(rez.departure) : fmt(u.priceHT) + '/nuit') + '</div>' +
      '<div class="rc-actions" onclick="event.stopPropagation()">' + actions + '</div>' +
    '</div>';
  }).join('');
}

// ── LISTE RÉSERVATIONS ─────────────────────────────────────────
var rezFilter = 'all';
var rezSearch = '';

function filterRezList(q) { rezSearch = q.toLowerCase(); renderRezList(); }
function filterRezStatus(v) { rezFilter = v; renderRezList(); }

function renderRezList() {
  var list = document.getElementById('rez-list');
  if (!list) return;

  var todayStr = today.toISOString().slice(0,10);
  var checkinCount = RESERVATIONS.filter(function(r) {
    return r.arrival === todayStr && r.status !== 'cancelled' && r.status !== 'completed';
  }).length;
  var tb = document.getElementById('tbadge-checkin');
  if (tb) tb.textContent = checkinCount + ' auj.';

  var filtered = RESERVATIONS.filter(function(r) {
    // Filtre statut
    if (rezFilter !== 'all') {
      if (rezFilter === 'checkin'  && r.arrival !== todayStr) return false;
      if (rezFilter === 'checkout' && r.departure !== todayStr) return false;
      if (rezFilter !== 'checkin' && rezFilter !== 'checkout' && r.status !== rezFilter) return false;
    }
    // Filtre recherche
    if (rezSearch) {
      var unit = UNITS.find(function(u) { return u.id === r.unitId; });
      var hay  = (r.client + ' ' + r.ref + ' ' + (unit ? unit.label : '')).toLowerCase();
      if (!hay.includes(rezSearch)) return false;
    }
    return true;
  }).sort(function(a, b) { return a.arrival < b.arrival ? 1 : -1; });

  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">Aucune réservation</div><div class="empty-sub">Modifiez les filtres ou créez une nouvelle réservation</div></div>';
    return;
  }

  var STATUS_LABELS = { confirmed:'Confirmée', checkin:'Check-in auj.', checkout:'Check-out auj.', occupied:'En cours', completed:'Terminée', cancelled:'Annulée' };
  var STATUS_BADGE  = { confirmed:'badge-reserved', checkin:'badge-checkin', checkout:'badge-checkout', occupied:'badge-occupied', completed:'badge-available', cancelled:'badge-oos' };

  list.innerHTML = filtered.map(function(r) {
    var unit    = UNITS.find(function(u) { return u.id === r.unitId; });
    var nights  = Math.round((new Date(r.departure) - new Date(r.arrival)) / 86400000);
    var priceHT = (unit ? unit.priceHT : 25000) * nights;
    var priceTTC = priceHT * (1 + TVA);

    var actions = '';
    if (r.status === 'checkin' || r.status === 'confirmed') {
      actions += '<button class="btn btn-success btn-sm" onclick="doCheckinRez(\'' + r.id + '\',event)">✅ Check-in</button>';
    }
    if (r.status === 'occupied' || r.status === 'checkout') {
      actions += '<button class="btn btn-warning btn-sm" onclick="doCheckoutRez(\'' + r.id + '\',event)">🚪 Check-out</button>';
    }
    if (r.status !== 'cancelled' && r.status !== 'completed') {
      actions += '<button class="btn btn-outline btn-sm" onclick="showRezDetail(\'' + r.id + '\',event)">👁 Détails</button>';
      actions += '<button class="btn btn-danger btn-sm" onclick="cancelRez(\'' + r.id + '\',event)">✕ Annuler</button>';
    }

    return '<div class="rez-item" onclick="showRezDetail(\'' + r.id + '\')">' +
      '<div class="rez-item-top">' +
        '<div style="flex:1">' +
          '<div class="rez-ref">' + r.ref + '</div>' +
          '<div class="rez-guest-name">' + r.client + '</div>' +
          '<div class="rez-room">' + (unit ? unit.label + ' — ' + unit.type : r.unitId) + '</div>' +
        '</div>' +
        '<div style="text-align:right">' +
          '<span class="badge ' + STATUS_BADGE[r.status] + '">' + STATUS_LABELS[r.status] + '</span>' +
          '<div class="rez-amount" style="margin-top:6px">' + fmt(priceTTC) + '</div>' +
          '<div style="font-size:10px;color:var(--text3)">TTC · ' + nights + ' nuits</div>' +
        '</div>' +
      '</div>' +
      '<div class="rez-dates">' +
        '<span>' + fmtDate(r.arrival) + '</span>' +
        '<span class="sep">→</span>' +
        '<span>' + fmtDate(r.departure) + '</span>' +
        '<span class="rez-nights">' + nights + ' nuits</span>' +
      '</div>' +
      '<div class="rez-actions" onclick="event.stopPropagation()">' + actions + '</div>' +
    '</div>';
  }).join('');
}

// ── DÉTAIL RÉSERVATION ─────────────────────────────────────────
function showRezDetail(rezId, evt) {
  if (evt) evt.stopPropagation();
  var r = RESERVATIONS.find(function(x) { return x.id === rezId; });
  if (!r) return;
  var unit   = UNITS.find(function(u) { return u.id === r.unitId; });
  var nights = Math.round((new Date(r.departure) - new Date(r.arrival)) / 86400000);
  var priceHT  = (unit ? unit.priceHT : 25000) * nights;
  var priceTVA = priceHT * TVA;
  var priceTTC = priceHT + priceTVA;
  var PAYMENT_LABELS = { orange_money:'Orange Money', mtn_momo:'MTN MoMo', cash:'Espèces', virement:'Virement', cinetpay:'CinetPay' };
  var STATUS_LABELS  = { confirmed:'Confirmée', checkin:'Check-in auj.', checkout:'Check-out auj.', occupied:'En cours', completed:'Terminée', cancelled:'Annulée' };

  document.getElementById('modal-detail-title').textContent = r.ref + ' — ' + r.client;
  document.getElementById('modal-detail-body').innerHTML =
    '<div class="detail-row"><span class="detail-label">Client</span><span class="detail-value">' + r.client + '</span></div>' +
    '<div class="detail-row"><span class="detail-label">Email</span><span class="detail-value">' + r.email + '</span></div>' +
    '<div class="detail-row"><span class="detail-label">Téléphone</span><span class="detail-value">' + r.tel + '</span></div>' +
    '<div class="detail-row"><span class="detail-label">Unité</span><span class="detail-value">' + (unit ? unit.label + ' (' + unit.type + ')' : r.unitId) + '</span></div>' +
    '<div class="detail-row"><span class="detail-label">Arrivée</span><span class="detail-value">' + fmtDate(r.arrival) + '</span></div>' +
    '<div class="detail-row"><span class="detail-label">Départ</span><span class="detail-value">' + fmtDate(r.departure) + '</span></div>' +
    '<div class="detail-row"><span class="detail-label">Durée</span><span class="detail-value">' + nights + ' nuits</span></div>' +
    '<div class="detail-row"><span class="detail-label">Voyageurs</span><span class="detail-value">' + r.adults + ' adultes' + (r.children ? ', ' + r.children + ' enfants' : '') + '</span></div>' +
    '<div class="detail-row"><span class="detail-label">Paiement</span><span class="detail-value">' + (PAYMENT_LABELS[r.payment] || r.payment) + '</span></div>' +
    '<div class="detail-row"><span class="detail-label">Statut</span><span class="detail-value">' + (STATUS_LABELS[r.status] || r.status) + '</span></div>' +
    '<div class="detail-row"><span class="detail-label">Montant HT</span><span class="detail-value">' + fmt(priceHT) + '</span></div>' +
    '<div class="detail-row"><span class="detail-label">TVA 19.25%</span><span class="detail-value">' + fmt(priceTVA) + '</span></div>' +
    '<div class="detail-row" style="background:rgba(108,99,255,.06);border-radius:8px;padding:10px;"><span class="detail-label" style="font-weight:700;color:var(--text)">Total TTC</span><span class="detail-value" style="color:var(--accent2);font-size:16px">' + fmt(priceTTC) + '</span></div>' +
    (r.notes ? '<div class="detail-row"><span class="detail-label">Notes</span><span class="detail-value">' + r.notes + '</span></div>' : '');

  var footer = '';
  if (r.status === 'checkin' || r.status === 'confirmed') {
    footer += '<button class="btn btn-success" onclick="doCheckinRez(\'' + r.id + '\');closeModal(\'modal-detail\')">✅ Check-in</button>';
  }
  if (r.status === 'occupied' || r.status === 'checkout') {
    footer += '<button class="btn btn-warning" onclick="doCheckoutRez(\'' + r.id + '\');closeModal(\'modal-detail\')">🚪 Check-out</button>';
  }
  if (r.status !== 'cancelled' && r.status !== 'completed') {
    footer += '<button class="btn btn-danger" onclick="cancelRez(\'' + r.id + '\');closeModal(\'modal-detail\')">✕ Annuler</button>';
  }
  footer += '<button class="btn btn-outline" onclick="closeModal(\'modal-detail\')">Fermer</button>';
  document.getElementById('modal-detail-footer').innerHTML = footer;

  document.getElementById('modal-detail').classList.add('show');
}

function showUnitDetail(unitId) {
  var rez = getRoomRez(unitId);
  if (rez) { showRezDetail(rez.id); return; }
  var unit = UNITS.find(function(u) { return u.id === unitId; });
  if (!unit) return;
  var status = getRoomStatus(unitId);
  document.getElementById('modal-detail-title').textContent = unit.label + ' — ' + unit.type;
  document.getElementById('modal-detail-body').innerHTML =
    '<div class="detail-row"><span class="detail-label">Type</span><span class="detail-value">' + unit.type + '</span></div>' +
    '<div class="detail-row"><span class="detail-label">Capacité</span><span class="detail-value">' + unit.capacity + ' personnes</span></div>' +
    '<div class="detail-row"><span class="detail-label">Tarif / nuit HT</span><span class="detail-value">' + fmt(unit.priceHT) + '</span></div>' +
    '<div class="detail-row"><span class="detail-label">Tarif / nuit TTC</span><span class="detail-value">' + fmt(unit.priceHT * (1 + TVA)) + '</span></div>' +
    '<div class="detail-row"><span class="detail-label">Statut</span><span class="detail-value">' + status + '</span></div>';
  document.getElementById('modal-detail-footer').innerHTML =
    '<button class="btn btn-primary" onclick="openCreateModal(\'' + unit.id + '\',null);closeModal(\'modal-detail\')">+ Réserver</button>' +
    '<button class="btn btn-outline" onclick="closeModal(\'modal-detail\')">Fermer</button>';
  document.getElementById('modal-detail').classList.add('show');
}

// ── ACTIONS CHECK-IN / CHECK-OUT ─────────────────────────────
function doCheckin(unitId, evt) {
  if (evt) evt.stopPropagation();
  var rez = getRoomRez(unitId);
  if (!rez) { toast('Aucune réservation active sur cette unité', 'warning'); return; }
  doCheckinRez(rez.id);
}

function doCheckinByUnit(unitId, evt) {
  if (evt) evt.stopPropagation();
  var unit = UNITS.find(function(u) { return u.id === unitId; });
  var todayStr = today.toISOString().slice(0,10);
  var rez = RESERVATIONS.find(function(r) { return r.unitId === unitId && r.status === 'confirmed'; });
  if (!rez) { toast('Aucune réservation confirmée sur ' + (unit ? unit.label : unitId), 'warning'); return; }
  doCheckinRez(rez.id);
}

function doCheckinRez(rezId, evt) {
  if (evt) evt.stopPropagation();
  var r = RESERVATIONS.find(function(x) { return x.id === rezId; });
  if (!r) return;
  r.status = 'occupied';
  toast('Check-in effectué pour ' + r.client, 'success');
  emitToCore('room.checkin', { rezId: rezId, client: r.client, unitId: r.unitId });
  emitToCore('badge.update', { module: 'reservations', count: getActiveCount() });
  refreshCurrentTab();
}

function doCheckout(unitId, evt) {
  if (evt) evt.stopPropagation();
  var rez = getRoomRez(unitId);
  if (!rez) { toast('Aucune réservation active', 'warning'); return; }
  doCheckoutRez(rez.id);
}

function doCheckoutRez(rezId, evt) {
  if (evt) evt.stopPropagation();
  var r = RESERVATIONS.find(function(x) { return x.id === rezId; });
  if (!r) return;
  r.status = 'completed';
  toast('Check-out effectué pour ' + r.client + '. Chambre à nettoyer.', 'success');
  emitToCore('room.checkout', { rezId: rezId, client: r.client, unitId: r.unitId });
  emitToCore('room.status_changed', { chambre: r.unitId, from: 'occupied', to: 'dirty' });
  emitToCore('badge.update', { module: 'housekeeping', count: 1 });
  refreshCurrentTab();
}

function cancelRez(rezId, evt) {
  if (evt) evt.stopPropagation();
  var r = RESERVATIONS.find(function(x) { return x.id === rezId; });
  if (!r) return;
  if (!confirm('Annuler la réservation de ' + r.client + ' ?')) return;
  r.status = 'cancelled';
  toast('Réservation annulée — ' + r.client, 'warning');
  emitToCore('rez.cancelled', { rezId: rezId, client: r.client });
  refreshCurrentTab();
}

function markClean(unitId, evt) {
  if (evt) evt.stopPropagation();
  toast('Unité marquée propre', 'success');
  emitToCore('room.status_changed', { chambre: unitId, from: 'dirty', to: 'available' });
  renderRoomsGrid();
}

function getActiveCount() {
  var todayStr = today.toISOString().slice(0,10);
  return RESERVATIONS.filter(function(r) {
    return r.status !== 'cancelled' && r.status !== 'completed' && r.departure >= todayStr;
  }).length;
}

// ── CRÉER RÉSERVATION (modal rapide) ──────────────────────────
function openCreateModal(unitId, dateStr, evt) {
  if (evt) evt.stopPropagation();
  var select = document.getElementById('quick-unit');
  if (select) {
    select.innerHTML = UNITS.map(function(u) {
      return '<option value="' + u.id + '"' + (u.id === unitId ? ' selected' : '') + '>' + u.label + ' — ' + u.type + ' (' + fmt(u.priceHT) + '/nuit HT)</option>';
    }).join('');
  }
  var arr = document.getElementById('quick-arrival');
  var dep = document.getElementById('quick-departure');
  var todayStr = today.toISOString().slice(0,10);
  if (arr) arr.value = dateStr || todayStr;
  if (dep) {
    var depDate = new Date(dateStr || todayStr);
    depDate.setDate(depDate.getDate() + 3);
    dep.value = depDate.toISOString().slice(0,10);
  }
  document.getElementById('modal-create').classList.add('show');
}

function quickCreateRez() {
  var client   = (document.getElementById('quick-client').value || '').trim();
  var arrival  = document.getElementById('quick-arrival').value;
  var departure= document.getElementById('quick-departure').value;
  var unitId   = document.getElementById('quick-unit').value;
  if (!client || !arrival || !departure || !unitId) {
    toast('Veuillez remplir tous les champs', 'warning'); return;
  }
  var newRez = {
    id: 'REZ-' + String(RESERVATIONS.length + 1).padStart(3,'0'),
    ref: 'REZ-2026-' + String(RESERVATIONS.length + 14).padStart(3,'0'),
    client: client, email: '', tel: '',
    unitId: unitId, arrival: arrival, departure: departure,
    adults: 2, children: 0, status: 'confirmed',
    payment: 'orange_money', notes: ''
  };
  RESERVATIONS.push(newRez);
  closeModal('modal-create');
  toast('Réservation créée — ' + client, 'success');
  emitToCore('rez.created', { rezId: newRez.id, client: client, unitId: unitId });
  switchTab('liste');
}

// ── NOUVELLE RÉSERVATION (formulaire complet) ────────────────
function initNewForm() {
  var select = document.getElementById('new-unit');
  if (select) {
    select.innerHTML = '<option value="">Sélectionner une unité...</option>' +
      UNITS.map(function(u) {
        var status = getRoomStatus(u.id);
        var disabled = (status === 'occupied' || status === 'oos') ? ' disabled' : '';
        var label = u.label + ' — ' + u.type + ' (' + fmt(u.priceHT) + '/nuit HT)';
        if (status !== 'available') label += ' [' + status + ']';
        return '<option value="' + u.id + '"' + disabled + '>' + label + '</option>';
      }).join('');
  }
  // Dates par défaut
  var arr = document.getElementById('new-arrival');
  var dep = document.getElementById('new-departure');
  var todayStr = today.toISOString().slice(0,10);
  if (arr && !arr.value) arr.value = todayStr;
  if (dep && !dep.value) {
    var d = new Date(today); d.setDate(d.getDate() + 3);
    dep.value = d.toISOString().slice(0,10);
    calcAmount();
  }
}

function calcNights() {
  var arr = document.getElementById('new-arrival');
  var dep = document.getElementById('new-departure');
  if (!arr || !dep || !arr.value || !dep.value) return;
  var n = Math.round((new Date(dep.value) - new Date(arr.value)) / 86400000);
  var el = document.getElementById('nights-display');
  if (n > 0) {
    if (el) { el.textContent = n + ' nuit' + (n>1?'s':''); el.style.display = 'block'; }
  } else {
    if (el) el.style.display = 'none';
  }
  calcAmount();
}

function calcAmount() {
  var arr    = document.getElementById('new-arrival');
  var dep    = document.getElementById('new-departure');
  var unitSel= document.getElementById('new-unit');
  var prev   = document.getElementById('new-amount-preview');
  if (!arr || !dep || !unitSel || !arr.value || !dep.value || !unitSel.value) {
    if (prev) prev.style.display = 'none'; return;
  }
  var nights = Math.round((new Date(dep.value) - new Date(arr.value)) / 86400000);
  if (nights <= 0) { if (prev) prev.style.display = 'none'; return; }
  var unit = UNITS.find(function(u) { return u.id === unitSel.value; });
  if (!unit) { if (prev) prev.style.display = 'none'; return; }
  var ht  = unit.priceHT * nights;
  var tva = ht * TVA;
  var ttc = ht + tva;
  document.getElementById('prev-ht').textContent  = fmt(ht);
  document.getElementById('prev-tva').textContent = fmt(tva);
  document.getElementById('prev-ttc').textContent = fmt(ttc);
  if (prev) prev.style.display = 'block';
}

function submitNewRez() {
  var prenom  = (document.getElementById('new-prenom').value || '').trim();
  var nom     = (document.getElementById('new-nom').value || '').trim();
  var email   = (document.getElementById('new-email').value || '').trim();
  var tel     = (document.getElementById('new-tel').value || '').trim();
  var arrival = document.getElementById('new-arrival').value;
  var departure= document.getElementById('new-departure').value;
  var unitId  = document.getElementById('new-unit').value;
  var adults  = parseInt(document.getElementById('new-adults').value) || 2;
  var children= parseInt(document.getElementById('new-children').value) || 0;
  var payment = document.getElementById('new-payment').value;
  var notes   = (document.getElementById('new-notes').value || '').trim();

  if (!prenom || !nom || !tel || !arrival || !departure || !unitId) {
    toast('Veuillez remplir les champs obligatoires (*)', 'warning'); return;
  }
  var nights = Math.round((new Date(departure) - new Date(arrival)) / 86400000);
  if (nights <= 0) { toast('La date de départ doit être après l\'arrivée', 'warning'); return; }

  var newRez = {
    id: 'REZ-' + String(RESERVATIONS.length + 1).padStart(3,'0'),
    ref: 'REZ-2026-' + String(RESERVATIONS.length + 14).padStart(3,'0'),
    client: prenom + ' ' + nom, email: email, tel: tel,
    unitId: unitId, arrival: arrival, departure: departure,
    adults: adults, children: children,
    status: 'confirmed', payment: payment, notes: notes
  };
  RESERVATIONS.push(newRez);

  toast('Réservation créée — ' + newRez.client + ' (' + newRez.ref + ')', 'success');
  emitToCore('rez.created', { rezId: newRez.id, client: newRez.client, unitId: unitId });
  emitToCore('badge.update', { module: 'reservations', count: getActiveCount() });

  // Reset form
  ['new-prenom','new-nom','new-email','new-tel','new-notes'].forEach(function(id) {
    var el = document.getElementById(id); if (el) el.value = '';
  });
  document.getElementById('new-amount-preview').style.display = 'none';
  document.getElementById('nights-display').style.display = 'none';

  switchTab('liste');
}

// ── MODAL ─────────────────────────────────────────────────────
function closeModal(id) {
  var el = document.getElementById(id);
  if (el) el.classList.remove('show');
}
// Fermer en cliquant le backdrop
document.querySelectorAll('.modal-backdrop').forEach(function(el) {
  el.addEventListener('click', function(e) { if (e.target === el) el.classList.remove('show'); });
});

// ── TOAST LOCAL ────────────────────────────────────────────────
function showLocalToast(msg, type) {
  var icons = { success:'✅', error:'❌', warning:'⚠️', info:'ℹ️' };
  var div = document.createElement('div');
  div.style.cssText = 'background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--text);box-shadow:0 4px 16px rgba(0,0,0,.5);animation:none;pointer-events:all;display:flex;align-items:center;gap:8px';
  div.innerHTML = (icons[type] || 'ℹ️') + ' ' + msg;
  document.getElementById('local-toast').appendChild(div);
  setTimeout(function() { if (div.parentNode) div.parentNode.removeChild(div); }, 3500);
}

// ── REFRESH ────────────────────────────────────────────────────
function refreshCurrentTab() {
  if (currentTab === 'planning') renderPlanning();
  if (currentTab === 'chambres') { renderChambreStats(); renderRoomsGrid(); }
  if (currentTab === 'liste') renderRezList();
}

// ── INIT ──────────────────────────────────────────────────────
(function init() {
  // Charger d'abord depuis Supabase, puis rendre
  loadReservationsFromSupabase(function() {
    renderPlanning();
    renderChambreStats();
    var todayStr = today.toISOString().slice(0,10);
    var count = RESERVATIONS.filter(function(r) {
      return r.arrival === todayStr && r.status !== 'cancelled';
    }).length;
    emitToCore('badge.update', { module: 'reservations', count: count });
  });
  // Touch: fermer modals avec swipe-down (mobile)
  document.querySelectorAll('.modal').forEach(function(modal) {
    var startY = 0;
    modal.addEventListener('touchstart', function(e) { startY = e.touches[0].clientY; }, { passive: true });
    modal.addEventListener('touchend', function(e) {
      if (e.changedTouches[0].clientY - startY > 60) {
        var backdrop = modal.closest('.modal-backdrop');
        if (backdrop) backdrop.classList.remove('show');
      }
    }, { passive: true });
  });
})();
</script>
</body>
</html>
